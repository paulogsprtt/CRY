nos, tecnológicos e financeiros necessários ao cumprimento desta Política, bem como fomentar e fortalecer a cultura de integridade, privacidade, proteção de dados e conformidade regulatória no âmbito da organização."},{"p":"A Área de Compliance é responsável pela implementação, divulgação, comunicação interna e externa, acompanhamento, monitoramento contínuo e atualização desta Política, bem como pela supervisão do cumprimento das normas internas e legais aplicáveis à proteção de dados pessoais. Incumbe ainda à Área de Compliance conduzir apurações e investigações internas relacionadas a eventuais violações desta Política, inclusive no que se refere a incidentes de segurança da informação, uso indevido de dados pessoais, fraude, suborno ou corrupção, recomendar a adoção de medidas corretivas e disciplinares cabíveis, realizar os reportes exigidos às autoridades competentes, inclusive à Autoridade Nacional de Proteção de Dados (ANPD) e demais órgãos reguladores, quando aplicável, e manter o Comitê de Compliance informado por meio de comunicações e relatórios periódicos."},{"p":"Os colaboradores, administradores, executivos e demais representantes da Velaro devem atuar com probidade, diligência, transparência e lealdade, observando rigorosamente as disposições desta Política, da LGPD e das demais normas internas e externas aplicáveis."},{"p":"É dever de todos zelar pela confidencialidade e segurança dos dados pessoais aos quais tenham acesso, comunicar imediatamente à Área de Compliance ou aos canais internos apropriados quaisquer indícios, suspeitas ou ocorrências de violação de dados, fraude, suborno, corrupção ou outras irregularidades, bem como cooperar integralmente com investigações internas e participar das ações de treinamento e capacitação obrigatórias relacionadas à proteção de dados, ética e compliance."},{"p":"Os terceiros, fornecedores, parceiros comerciais e prestadores de serviços que se relacionem com a Velaro também estão obrigados a observar as disposições desta Política e as normas aplicáveis à proteção de dados pessoais, estando sujeitos à realização de procedimentos de diligência prévia (due diligence), à inclusão de cláusulas contratuais específicas sobre privacidade, proteção de dados, confidencialidade e anticorrupção, bem como à fiscalização contínua."},{"p":"O descumprimento dessas obrigações poderá ensejar a adoção de medidas corretivas, sanções contratuais e, conforme o caso, a rescisão imediata da relação comercial, sem prejuízo da apuração de responsabilidades legais."}]},{"t":"7. Tratamento de Dados Pessoais","blocks":[{"p":"A Velaro, como prestadora de serviços, trata diferentes categorias de dados pessoais de acordo com a finalidade e a relação com os titulares. O tratamento ocorre de forma lícita, transparente e proporcional, limitado às finalidades legítimas e previamente informadas."},{"st":"7.1. Dados tratados por categoria de titular:"},{"itens":["Clientes: dados de identificação, documentos para comprovação de capacidade financeira, comprovante de residência e verificação de informações, para cadastro e execução de contratos.","Colaboradores e ex-colaboradores: dados de identificação, verificação, contato, informações exigidas pela legislação trabalhista ou com prestadores de serviços, para cadastro e administração interna.","Candidatos a vagas de trabalho: currículo, dados de identificação e contato, informações sobre experiência profissional e acadêmica, e eventualmente dados de background-check, como histórico de crédito ou outros detalhes do processo seletivo.","Prepostos ou representantes de fornecedores, prestadores de serviço e parceiros: dados de identificação e contato para execução de contratos.","Usuários do site: dados técnicos, de perfil, de uso e de marketing, para melhorar a experiência de navegação e comunicação."]},{"st":"7.2. Tipos de dados pessoais tratados:"},{"itens":["Dados de identificação: nome completo, foto, nacionalidade, identificação fiscal, endereço, cargo, nome de usuário, data de nascimento.","Dados de verificação: cópias de documentos de identidade e comprovantes de residência.","Dados de contato: endereços residencial ou comercial, e-mail, números de telefone.","Dados de operação: informações sobre pagamentos e produtos ou serviços adquiridos.","Dados de empregador: informações sobre a empresa representada pelo titular.","Dados de perfil: nome de usuário, senha, produtos e serviços utilizados, interesses, preferências, comentários e respostas a pesquisas.","Dados de uso: forma como o usuário interage com o site, produtos e serviços.","Dados de marketing e comunicação: preferências de marketing próprio ou de terceiros e canais de comunicação."]},{"st":"7.3. Finalidades do tratamento e bases legais:"},{"p":"A Velaro, atuando predominantemente na qualidade de controladora, trata dados pessoais para as seguintes finalidades e com os respectivos fundamentos legais:"},{"img":"docs/tables/privacidade-e-protecao-de-dados-pt-1.png"},{"st":"Atendimento ao Cliente"},{"p":"Resposta a solicitações, dúvidas e reclamações; gestão do relacionamento."},{"p":"Art. 7º, V (execução de contrato); Art. 7º, IX (legítimo interesse), Lei nº 13.709/2018."},{"st":"Reporte às Autoridades"},{"p":"Atendimento a requisições do BCB, COAF e demais autoridades; reporte de operações suspeitas; cumprimento de ordens judiciais."},{"p":"Art. 7º, II (obrigação legal), Lei nº 13.709/2018. Lei 9.613/1998; Res. BCB 520/2025; Circular BCB 3.978/2020."},{"p":"Nota: Em situações específicas em que a Velaro processa dados pessoais sob instrução de outra instituição, a Velaro poderá atuar na qualidade de operadora, hipótese em que seguirá as instruções do respectivo controlador, desde que compatíveis com a LGPD e com os padrões de segurança da informação adotados pela Companhia."},{"p":"A Velaro assegura que todos os dados pessoais são tratados apenas para finalidades legítimas, específicas e informadas, seguindo os princípios da LGPD e garantindo segurança, transparência e responsabilidade no uso das informações."},{"p":"A Velaro não presta serviços a crianças e adolescentes e não realiza, de forma intencional, qualquer tratamento de dados pessoais de titulares menores de 18 (dezoito) anos."},{"p":"Caso a Velaro identifique, a qualquer tempo, que dados pessoais de menor de idade foram inadvertidamente coletados, tais dados serão imediatamente eliminados"}]},{"t":"8. Governança, Segurança da Informação e Prevenção à Fraude","blocks":[{"p":"A Velaro adota um modelo de governança em privacidade e proteção de dados compatível com a natureza, o porte e a complexidade de suas operações como VASP, implementando medidas técnicas e administrativas destinadas a proteger os dados pessoais contra acessos não autorizados, incidentes de segurança, vazamentos, perdas, alterações ou qualquer forma de tratamento inadequado ou ilícito. Tais medidas incluem controles de acesso, autenticação de usuários, monitoramento contínuo de sistemas próprios ou de servidores, políticas internas de segurança da informação, segregação de funções, aprovação de novos sistemas, ferramentas ou aplicativos a cargo da Alta Administração e procedimentos específicos de prevenção e combate à fraude, em consonância com a LGPD e com as normas do Banco Central do Brasil."}]},{"t":"9. Compartilhamento e Transferência de Dados","blocks":[{"p":"Os dados pessoais poderão ser compartilhados pela Velaro com terceiros estritamente necessários à execução das finalidades descritas nesta Política, tais como prestadores de serviços, parceiros tecnológicos, instituições financeiras, autoridades regulatórias e órgãos públicos, sempre observados os princípios da necessidade, adequação, proporcionalidade e segurança. Eventuais transferências internacionais de dados pessoais serão realizadas apenas quando permitidas pela legislação aplicável, mediante a adoção de salvaguardas adequadas para assegurar nível de proteção compatível com o exigido pela LGPD."}]},{"t":"10. Retenção, Eliminação e Conservação de Registros","blocks":[{"p":"Os dados pessoais serão mantidos pelo período estritamente necessário ao cumprimento das finalidades que fundamentaram o seu tratamento, observando-se, adicionalmente, os prazos legais, regulatórios e de conservação de registros aplicáveis, incluindo aqueles estabelecidos pelas normas do Banco Central do Brasil, pela legislação de prevenção à lavagem de dinheiro e demais disposições normativas pertinentes."},{"p":"Uma vez atingida a finalidade do tratamento e decorrido o respectivo prazo de retenção, os dados pessoais serão eliminados, anonimizados ou bloqueados, conforme o caso, respeitadas as hipóteses legais que autorizem ou determinem a sua conservação por período superior."},{"p":"Para fins de transparência e governança, a Companhia mantém planilha de controle contendo os prazos aplicáveis de retenção e os procedimentos de eliminação de dados pessoais e registros."},{"p":"Categoria de Dados / Processo"},{"p":"Descrição dos Dados"},{"p":"Prazo de Retenção"},{"st":"Marco Inicial"},{"p":"Base Legal / Regulatório"},{"st":"Observações"},{"p":"KYC - Clientes PF e PJ (incluindo UBOs)"},{"p":"Dados cadastrais, documentos, perfil transacional, análise de risco"}]},{"t":"10 anos","blocks":[{"p":"Encerramento da relação com o cliente"},{"p":"Circular BCB nº 3.978/2020; Lei nº 9.613/1998"},{"p":"Pode estendido caso investigação requisição autoridade ser em de ou de"},{"img":"docs/tables/privacidade-e-protecao-de-dados-pt-2.png"},{"img":"docs/tables/privacidade-e-protecao-de-dados-pt-3.png"},{"p":"Nota: A Velaro realiza a coleta, o tratamento e o armazenamento de dados pessoais de forma limitada ao estritamente necessário para o atendimento de suas finalidades legítimas, observando os prazos de retenção definidos pela legislação aplicável e pelas normas regulatórias, especialmente aquelas expedidas pelo Banco Central do Brasil e pela legislação de prevenção à lavagem de dinheiro."}]},{"t":"11. Direitos dos Titulares de Dados","blocks":[{"p":"A Velaro garante aos titulares de dados pessoais os seguintes direitos, conforme previsto na LGPD:"},{"itens":["Confirmação e acesso: verificar se seus dados estão sendo tratados e acessar as informações, incluindo a cópia integral dos dados quando o tratamento tiver origem em consentimento ou contrato.","Correção ou retificação: solicitar a atualização ou correção de dados incompletos, incorretos ou desatualizados.","Anonimização, bloqueio ou eliminação: pedir a anonimização, bloqueio ou exclusão de dados desnecessários, excessivos ou tratados em desconformidade com a lei.","Limitação do tratamento: restringir o uso de dados em casos de contestação da exatidão, tratamento ilícito, fim das finalidades ou oposição justificada","Portabilidade: solicitar a transferência dos dados pessoais para outro controlador, em formato estruturado e interoperável.","Revogação do consentimento: retirar o consentimento dado para tratamento de dados, interrompendo o uso, salvo quando houver obrigação legal ou proteção de direitos da Velaro.","Eliminação de dados tratados com consentimento: solicitar a exclusão de dados tratados com base em consentimento, exceto quando necessário para obrigações legais, interesse público, liberdade de expressão, pesquisa histórica ou científica, ou exercício de direitos em processos judiciais ou administrativos.","Oposição: se opor ao tratamento de dados realizado em descumprimento da lei; a Velaro pode manter o tratamento se houver base legal válida.","Revisão de decisões automatizadas: solicitar revisão de decisões tomadas automaticamente por inteligência artificial, garantindo intervenção humana quando necessário."]}]},{"t":"12. Disposições finais","blocks":[{"p":"Esta Política entra em vigor na data de sua aprovação pelo Comitê de Compliance, podendo ser alterada a qualquer tempo para refletir mudanças legislativas, regulatórias ou operacionais, especialmente aquelas relacionadas à Lei nº 13.709/2018 (LGPD) e às normas aplicáveis às VASPs. A Velaro assegura a disponibilização desta Política em seus canais oficiais, mantendo canais específicos para atendimento aos titulares de dados pessoais. O descumprimento das diretrizes aqui previstas poderá ensejar medidas disciplinares internas, sem prejuízo das responsabilidades legais cabíveis."}]},{"t":"13. Revisão da Política","blocks":[{"p":"Esta Política será revisada, no mínimo, a cada dois anos pela Área de Compliance, a fim de assegurar sua atualização e aderência às melhores práticas. Revisões extraordinárias poderão ser realizadas em prazo inferior sempre que houver mudanças regulatórias relevantes, evolução tecnológica dos sistemas utilizados ou alteração no apetite de risco da companhia. Todas as atualizações devem ser submetidas à apreciação e aprovação do Comitê de Compliance."},{"img":"docs/tables/privacidade-e-protecao-de-dados-pt-4.png"},{"st":"1.3. Endereço de e-mail"},{"st":"1.4. Telefone"},{"st":"1.5. Endereço (opcional, se necessário para verificação de identidade)"}]},{"t":"2. Direito Exercido pelo Titular","blocks":[{"p":"Marque o(s) direito(s) que deseja exercer:"},{"itens":["Confirmação da existência de tratamento de dados pessoais","Acesso aos dados pessoais","Informações sobre o tratamento realizado","Correção de dados incompletos, inexatos ou desatualizados","Portabilidade dos dados pessoais para outro controlador","Limitação do tratamento de dados pessoais","Anonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desconformidade com a LGPD","Revogação do consentimento","Eliminação de dados pessoais tratados com base no consentimento","Revisão e explicação de decisão automatizada","Oposição ao tratamento"]}]},{"t":"3. Detalhes da Requisição","blocks":[{"p":"3.1. Descreva sua solicitação com o máximo de detalhes possível (ex.: período a que se referem os dados, tipo de dado, contexto da solicitação etc.):"},{"p":"3.2. Para nos ajudar a localizar os dados, forneça informações adicionais que possam ser relevantes (ex.: período específico, produto ou serviço utilizado, tipo de transação):"}]},{"t":"4. Destinatário das Informações","blocks":[{"p":"As informações deverão ser enviadas para:"},{"itens":["Ao próprio titular","Ao representante legal do titular *","* Caso as informações sejam enviadas ao representante, preencha as seções 5 e 6 abaixo."]}]},{"t":"5. Identificação do Representante Legal (preencher apenas se aplicável)","blocks":[{"img":"docs/tables/privacidade-e-protecao-de-dados-pt-5.png"}]},{"t":"7. Declaração e Assinatura do Titular","blocks":[{"p":"Declaro que as informações fornecidas neste formulário são verdadeiras, que sou o titular dos dados pessoais indicados acima (ou seu representante legalmente habilitado) e que estou ciente de que a Velaro poderá solicitar documentação adicional para verificação da minha identidade, se necessário para o atendimento da requisição."},{"itens":["Assinatura: ____________________________","Data: _____ / _____ / _________","Nome completo (letra de forma): ____________________________"]},{"p":"AVISO: A Velaro se compromete a responder às solicitações no prazo máximo de 15 (quinze) dias corridos para pedidos de confirmação e acesso simplificado, e de 30 (trinta) dias corridos para as demais requisições, podendo este prazo ser prorrogado por igual período em casos de maior complexidade. A Velaro poderá indeferir total ou parcialmente a requisição nas hipóteses previstas na Lei nº 13.709/2018 (LGPD), comunicando ao titular as razões do indeferimento."}]}],"en":[{"t":"1. Purpose","blocks":[{"p":"This Privacy and Personal Data Protection Policy aims to establish clear, transparent, and secure guidelines regarding the processing of personal data carried out by Velaro Network Sociedade Prestadora de Serviços de Ativos Virtuais Ltda, CNPJ 63.964.774/0001-52 (“Velaro” or the “Company”), in compliance with the Brazilian General Data Protection Law (LGPD - Law No. 13,709/2018), applicable regulatory standards, and good governance practices, taking as a reference the model adopted by Velaro."},{"p":"Velaro, as a Virtual Asset Service Provider (“VASP”), recognizes the risks inherent to its business model and reaffirms its commitment to integrity, transparency, corporate ethics, and full compliance with applicable laws and regulations."},{"p":"Within the scope of its core activities as a VASP, Velaro primarily acts as the controller of the personal data of its clients and employees, making decisions regarding the purposes and means of processing."}]},{"t":"2. Legal and Regulatory Basis","blocks":[{"st":"This Policy is based, in particular, on the following regulations:"},{"itens":["Law No. 13,709/2018 - Brazilian General Data Protection Law (LGPD);","Brazilian Internet Civil Framework (Law No. 12,965/2014);","Brazilian Civil Code;","Regulatory standards applicable to the Company’s sector of activity;","Market best practices and corporate governance standards, including those reflected in the Privacy and Personal Data Protection Notice - Velaro Network;","Information Security Policy - Velaro;","Cookie Policy."]}]},{"t":"3. Scope","blocks":[{"p":"This Policy applies to all employees, officers, directors, shareholders, service providers, consultants, suppliers, intermediaries, agents, business partners, representatives, and any third parties acting on behalf of or for the benefit of Velaro."},{"p":"It also applies to the entities of the BSOS Group involved in operations or business relationships with Velaro, as well as to all contracts, transactions, activities, and institutional relationships of the Company, including those involving domestic or foreign public authorities."}]},{"t":"4. Definitions","blocks":[{"p":"For the purposes of this Privacy and Personal Data Protection Policy, the following definitions apply:"},{"p":"Processing Agents: the controller and the processor. Velaro may act as a controller, joint controller, or processor."},{"p":"Anonymization: the use of reasonable and available technical means at the time of processing through which data loses the possibility of direct or indirect association with an individual."},{"p":"National Data Protection Authority (ANPD): the public authority responsible for overseeing, implementing, and enforcing compliance with the LGPD in Brazil."},{"p":"Database: an organized set of personal data, whether in physical or digital form."},{"p":"Blocking: temporary suspension of processing while retaining the data in storage."},{"p":"Consent: a free, informed, and unambiguous indication by which the data subject agrees to the processing of their personal data for a specific purpose."},{"p":"Controller: a natural or legal person, under public or private law, responsible for decisions regarding the processing of personal data."},{"p":"Personal Data: any information related to an identified or identifiable natural person, directly or indirectly."},{"p":"Sensitive Personal Data: personal data concerning racial or ethnic origin, religious belief, political opinion, membership in a trade union or religious, philosophical, or political organization, data concerning health or sex life, or genetic or biometric data when linked to a natural person."},{"p":"Deletion: the removal of stored data."},{"p":"Data Protection Officer (DPO): a person appointed by the controller and processor to act as a communication channel between the controller, data subjects, and the National Data Protection Authority (ANPD)."},{"p":"Security Incident: any confirmed or suspected adverse event that compromises the confidentiality, integrity, or availability of personal data."},{"p":"Processor: a natural or legal person, under public or private law, who processes personal data on behalf of the controller."},{"p":"Information Security: practices and controls that ensure the confidentiality, integrity, and availability of information."},{"p":"Data Subject: a natural person to whom the personal data being processed relates."},{"p":"International Data Transfer: the transfer of personal data to a foreign country or international organization."},{"p":"Processing: any operation carried out with personal data, such as collection, production, receipt, classification, use, access, reproduction, transmission, distribution, processing, filing, storage, deletion, evaluation or control of information, modification, communication, transfer, dissemination, or extraction."}]},{"t":"5. Principles for the Processing of Personal Data","blocks":[{"p":"Velaro processes personal data in accordance with the principles established by the Brazilian General Data Protection Law (LGPD), ensuring lawfulness, fairness, and good faith in all its operations. Processing is carried out for legitimate, specific purposes that are clearly informed to the data subject, and is compatible with the context while limited to the minimum necessary to achieve its objectives."},{"p":"Velaro ensures that data subjects can access their information through appropriate contact channels, as well as transparency regarding data processing activities and the parties involved. We implement robust technical and administrative measures to protect personal data, prevent harm, and avoid any discriminatory or unlawful use. We also reaffirm our commitment to accountability, continuously demonstrating the effectiveness of the practices adopted in compliance with the LGPD."}]},{"t":"6. Responsibilities","blocks":[{"p":"Velaro’s Compliance Committee is responsible for ensuring compliance with the principles, guidelines, and obligations set forth in this Policy, as well as those arising from the Brazilian General Data Protection Law (Law No. 13,709/2018) and Velaro’s Privacy and Personal Data Protection Notice, ensuring that personal data processing is carried out in a lawful, ethical, secure, and transparent manner across all areas of the Company. The Committee is also responsible for promoting the proper allocation of human, technological, and financial resources necessary to comply with this Policy, as well as fostering and strengthening a culture of integrity, privacy, data protection, and regulatory compliance within the organization."},{"p":"The Compliance Department is responsible for the implementation, dissemination, internal and external communication, ongoing monitoring, and updating of this Policy, as well as for supervising compliance with internal rules and applicable legal requirements related to personal data protection. It is also the responsibility of the"},{"p":"Compliance Department to conduct inquiries and internal investigations related to potential violations of this Policy, including those involving information security incidents, misuse of personal data, fraud, bribery, or corruption; to recommend appropriate corrective and disciplinary measures; to carry out required reporting to competent authorities, including the National Data Protection Authority (ANPD) and other regulatory bodies, when applicable; and to keep the Compliance Committee informed through periodic communications and reports."},{"p":"Employees, officers, executives, and other representatives of Velaro must act with integrity, diligence, transparency, and loyalty, strictly complying with the provisions of this Policy, the LGPD, and other applicable internal and external regulations."},{"p":"All individuals must ensure the confidentiality and security of the personal data to which they have access, immediately report to the Compliance Department or appropriate internal channels any signs, suspicions, or occurrences of data breaches, fraud, bribery, corruption, or other irregularities, and fully cooperate with internal investigations, as well as participate in mandatory training and awareness initiatives related to data protection, ethics, and compliance."},{"p":"Third parties, suppliers, business partners, and service providers engaged with Velaro are also required to comply with the provisions of this Policy and applicable data protection regulations. They are subject to prior due diligence procedures, the inclusion of specific contractual clauses on privacy, data protection, confidentiality, and anti-corruption, as well as ongoing monitoring."},{"p":"Failure to comply with these obligations may result in the adoption of corrective measures, contractual sanctions, and, where applicable, the immediate termination of the business relationship, without prejudice to the assessment of legal liabilities."}]},{"t":"7. Personal Data Processing","blocks":[{"p":"Velaro, as a service provider, processes different categories of personal data according to the purpose and its relationship with data subjects. Processing is carried out in a lawful, transparent, and proportionate manner, limited to legitimate and previously informed purposes."},{"st":"7.1. Data processed by category of data subject:"},{"itens":["Clients: identification data, documents to verify financial capacity, proof of address, and information verification, for registration and contract execution.","Employees and former employees: identification, verification, and contact data, as well as information required by labor legislation or related to service providers, for registration and internal administration.","Job applicants: résumés, identification and contact data, information on professional and academic background, and, where applicable, background-check data such as credit history or other details related to the recruitment process.","Agents or representatives of suppliers, service providers, and partners: identification and contact data for contract execution.","Website users: technical, profile, usage, and marketing data to improve browsing experience and communication."]},{"st":"7.2. Types of personal data processed:"},{"itens":["Identification data: full name, photograph, nationality, tax identification, address, job title, username, date of birth.","Verification data: copies of identification documents and proof of address.","Contact data: residential or business addresses, email, phone numbers.","Operational data: information related to payments and products or services acquired.","Employer data: information about the company represented by the data subject.","Profile data: username, password, products and services used, interests, preferences, comments, and survey responses.","Usage data: how the user interacts with the website, products, and services.","Marketing and communication data: preferences regarding proprietary or third-party marketing and communication channels."]},{"st":"7.3. Purposes of processing and legal bases:"},{"p":"Velaro, acting predominantly as a controller, processes personal data for the following purposes and under the respective legal bases:"},{"img":"docs/tables/privacidade-e-protecao-de-dados-en-1.png"},{"img":"docs/tables/privacidade-e-protecao-de-dados-en-2.png"},{"p":"Note: In specific situations where Velaro processes personal data under the instructions of another institution, Velaro may act as a processor, in which case it will follow the instructions of the respective controller, provided that they are compatible with the LGPD and with the Company’s information security standards."},{"p":"Velaro ensures that all personal data is processed solely for legitimate, specific, and informed purposes, in accordance with the principles of the LGPD, ensuring security, transparency, and accountability in the use of information."},{"p":"Velaro does not provide services to children and adolescents and does not intentionally process personal data of individuals under 18 (eighteen) years of age."},{"p":"If Velaro identifies at any time that personal data of a minor has been inadvertently collected, such data will be promptly deleted."}]},{"t":"8. Governance, Information Security, and Fraud Prevention","blocks":[{"p":"Velaro adopts a governance model for privacy and data protection that is compatible with the nature, size, and complexity of its operations as a VASP, implementing technical and administrative measures designed to protect personal data against unauthorized access, security incidents, breaches, loss, alteration, or any form of improper or unlawful processing."},{"p":"Such measures include access controls, user authentication, continuous monitoring of proprietary systems or servers, internal information security policies, segregation of duties, approval of new systems, tools, or applications by Senior Management, and specific procedures for fraud prevention and detection, in compliance with the LGPD and the regulations of the Central Bank of Brazil."}]},{"t":"9. Data Sharing and Transfer","blocks":[{"p":"Personal data may be shared by Velaro with third parties strictly necessary for the execution of the purposes described in this Policy, such as service providers, technology partners, financial institutions, regulatory authorities, and public bodies, always in compliance with the principles of necessity, adequacy, proportionality, and security. Any international transfers of personal data will be carried out only when permitted by applicable law, with the adoption of appropriate safeguards to ensure a level of protection consistent with that required by the LGPD."}]},{"t":"10. Retention, Deletion, and Record Keeping","blocks":[{"p":"Personal data will be retained for the period strictly necessary to fulfill the purposes that justified its processing, also observing applicable legal, regulatory, and record-keeping requirements, including those established by the regulations of the Central Bank of Brazil, anti-money laundering legislation, and other relevant regulatory provisions."},{"p":"Once the purpose of processing has been achieved and the applicable retention period has elapsed, personal data will be deleted, anonymized, or blocked, as appropriate, subject to legal grounds that authorize or require its retention for a longer period."},{"p":"For transparency and governance purposes, the Company maintains a control register containing the applicable retention periods and procedures for the deletion of personal data and records."},{"img":"docs/tables/privacidade-e-protecao-de-dados-en-3.png"},{"img":"docs/tables/privacidade-e-protecao-de-dados-en-4.png"},{"p":"Note: Velaro collects, processes, and stores personal data strictly to the extent necessary to fulfill its legitimate purposes, in compliance with retention periods established by applicable laws and regulatory requirements, particularly those issued by the Central Bank of Brazil and by anti-money laundering legislation."}]},{"t":"11. Data Subject Rights","blocks":[{"p":"Velaro guarantees data subjects the following rights, as provided under the LGPD:"},{"itens":["Confirmation and Access: to verify whether their data is being processed and to access such information, including a full copy of the data when processing is based on consent or a contract.","Correction or Rectification: to request the update or correction of incomplete, inaccurate, or outdated data.","Anonymization, Blocking, or Deletion: to request the anonymization, blocking, or deletion of unnecessary, excessive data or data processed in non-compliance with the law.","Restriction of Processing: to limit the use of data in cases of contested accuracy, unlawful processing, fulfillment of purposes, or justified objection.","Data Portability: to request the transfer of personal data to another controller in a structured and interoperable format.","Withdrawal of Consent: to withdraw previously given consent for data processing, thereby interrupting its use, except where there is a legal obligation or the need to protect Velaro’s rights.","Deletion of Data Processed Based on Consent: to request the deletion of data processed on the basis of consent, except where retention is required for legal obligations, public interest, freedom of expression, historical or scientific research, or the exercise of rights in judicial or administrative proceedings.","Objection: to object to the processing of data carried out in violation of the law; Velaro may continue processing where a valid legal basis exists.","Review of Automated Decisions: to request the review of decisions made solely through automated processing, including those based on artificial intelligence, ensuring human intervention where necessary."]}]},{"t":"12. Final Provisions","blocks":[{"p":"This Policy shall enter into force on the date of its approval by the Compliance Committee and may be amended at any time to reflect legislative, regulatory, or operational changes, particularly those related to Law No. 13,709/2018 (LGPD) and regulations applicable to VASPs. Velaro ensures that this Policy is made available through its official channels and maintains specific channels for handling requests from data subjects. Failure to comply with the guidelines set forth herein may result in internal disciplinary measures, without prejudice to applicable legal liabilities."}]},{"t":"13. Policy Review","blocks":[{"p":"This Policy shall be reviewed at least every two years by the Compliance Department to ensure it remains up to date and aligned with best practices. Extraordinary reviews may be conducted within a shorter timeframe whenever there are relevant regulatory changes, technological developments in the systems used, or changes in the Company’s risk appetite. All updates must be submitted to the Compliance Committee for review and approval."},{"img":"docs/tables/privacidade-e-protecao-de-dados-en-5.png"},{"st":"1.3. Email Address"},{"st":"1.4. Phone Number"},{"st":"1.5. Address (optional, if required for identity verification)"}]},{"t":"2. Data Subject Right Exercised","blocks":[{"p":"Please select the right(s) you wish to exercise:"},{"itens":["Confirmation of the existence of personal data processing","Access to personal data","Information about the processing carried out","Correction of incomplete, inaccurate, or outdated data","Portability of personal data to another controller","Restriction of personal data processing","Anonymization, blocking, or deletion of unnecessary, excessive, or unlawfully processed data","Withdrawal of consent","Deletion of personal data processed based on consent","Review and explanation of automated decisions","Objection to processing"]}]},{"t":"3. Request Details","blocks":[{"p":"3.1. Please describe your request in as much detail as possible (e.g., period to which the data relates, type of data, context of the request, etc.):"},{"p":"3.2. To help us locate the data, please provide any additional relevant information (e.g., specific period, product or service used, type of transaction):"}]},{"t":"4. Recipient of the Information","blocks":[{"p":"The information should be sent to:"},{"itens":["The data subject","The data subject’s legal representative*","* If the information is to be sent to a representative, please complete sections 5 and 6 below."]}]},{"t":"5. Identification of the Legal Representative (complete only if applicable)","blocks":[{"img":"docs/tables/privacidade-e-protecao-de-dados-en-6.png"}]},{"t":"7. Declaration and Signature of the Data Subject","blocks":[{"p":"I declare that the information provided in this form is true, that I am the data subject of the personal data indicated above (or their legally authorized representative), and that I am aware that Velaro may request additional documentation to verify my identity, if necessary to process this request."},{"itens":["Signature: ____________________________","Date: _____ / _____ / _________","Full Name (printed): ____________________________"]},{"p":"NOTICE: Velaro undertakes to respond to requests within a maximum period of 15 (fifteen) calendar days for confirmation and simplified access requests, and 30 (thirty) calendar days for other requests. This period may be extended for an additional equal period in cases of greater complexity. Velaro may fully or partially deny the request in the cases provided for under Law No. 13,709/2018 (LGPD), informing the data subject of the reasons for such denial."}]}]},"cookies":{"pt":[{"t":"1. Objetivo e Abrangência","blocks":[{"p":"A presente Política de Cookies estabelece as diretrizes para coleta, uso, gestão e armazenamento de cookies e tecnologias similares no website e nas plataformas digitais da Velaro Network Sociedade Prestadora de Serviços de Ativos Virtuais Ltda, CNPJ 63.964.774/0001-52 (“Velaro” ou “Companhia”)."},{"p":"Nos termos das orientações da Autoridade Nacional de Proteção de Dados (ANPD), os cookies podem envolver tratamento de dados pessoais e, portanto, devem observar os princípios da transparência, finalidade, necessidade e segurança previstos na Lei Geral de Proteção de Dados (LGPD)."},{"st":"A utilização de cookies pela Velaro tem como objetivos:"},{"itens":["Garantir o funcionamento adequado e seguro das plataformas digitais;","Proporcionar melhor experiência ao usuário;","Permitir análises estatísticas e melhorias contínuas;","Permitir que o titular de dados exerça seus direitos seguindo os princípios da LGPD."]},{"p":"Esta Política integra o Programa de Compliance, Governança de Dados e Segurança da Informação da Velaro."}]},{"t":"2. Definições","blocks":[{"st":"Para fins desta Política, aplicam-se as seguintes definições:"},{"itens":["Anonimização: utilização de meios técnicos razoáveis e disponíveis no momento do tratamento, por meio dos quais um dado perde a possibilidade de associação, direta ou indireta, a um indivíduo.","Consentimento: manifestação livre, informada e inequívoca pela qual o titular concorda com o tratamento de seus dados pessoais para uma finalidade determinada.","Cookies: arquivos de texto armazenados no dispositivo do usuário durante a navegação em um website, utilizados para reconhecer o usuário, registrar preferências e coletar informações sobre sua interação com a plataforma.","Cookies Essenciais: cookies estritamente necessários para o funcionamento do site e prestação dos serviços, não dependendo de consentimento do usuário.","Cookies Não Essenciais: cookies que não são indispensáveis ao funcionamento da plataforma, incluindo cookies analíticos, funcionais e de marketing, cujo uso depende do consentimento do usuário.","Cookies de Terceiros: cookies definidos por domínios externos à Velaro, utilizados para análise, publicidade ou integração com serviços de terceiros.","Dados Pessoais: qualquer informação relacionada a pessoa natural identificada ou identificável, nos termos da Lei nº 13.709/2018 (LGPD).","Titular: pessoa natural a quem se referem os dados pessoais que são objeto de tratamento.","Tratamento de Dados: toda operação realizada com dados pessoais, como coleta, produção, recepção, classificação, utilização, acesso, reprodução, transmissão, distribuição, armazenamento, eliminação, avaliação ou controle da informação."]}]},{"t":"3. Base Legal e Regulatória","blocks":[{"st":"Esta Política está fundamentada nas seguintes normas e diretrizes:"},{"itens":["Lei nº 13.709/2018 (Lei Geral de Proteção de Dados - LGPD);","Marco Civil da Internet (Lei nº 12.965/2014);","Guia Orientativo “Cookies e Proteção de Dados Pessoais” da ANPD;"]},{"p":"Conforme o Guia da ANPD, o uso de cookies deve estar associado a uma base legal adequada, especialmente:"},{"itens":["Consentimento do titular, quando se tratar de cookies não essenciais;","Legítimo interesse, para cookies estritamente necessários ao funcionamento e segurança;","Cumprimento de obrigação legal ou regulatória, quando aplicável."]},{"p":"A ANPD destaca que o consentimento deve ser livre, informado, inequívoco e granular, permitindo ao usuário escolher quais categorias de cookies deseja aceitar."}]},{"t":"4. Princípios da LGPD e Cookies","blocks":[{"p":"O uso de cookies neste site observa rigorosamente os princípios estabelecidos pela Lei Geral de Proteção de Dados Pessoais e pelo Marco Civil da Internet, assegurando a proteção dos dados pessoais e a privacidade dos titulares. Considerando a natureza potencialmente sensível das informações coletadas por meio de tecnologias de rastreamento, adotamos os seguintes princípios:"},{"p":"Finalidade, Adequação e Necessidade: A coleta de dados por meio de cookies é realizada para finalidades legítimas, específicas e informadas ao titular. Os dados tratados são estritamente necessários, pertinentes e proporcionais para o atendimento dessas finalidades, sendo vedado o uso posterior para objetivos incompatíveis. Não realizamos coleta excessiva ou indiscriminada de dados pessoais."},{"p":"Transparência e Livre Acesso: Garantimos aos titulares informações claras, precisas e facilmente acessíveis sobre o uso de cookies, incluindo suas finalidades, duração, categorias, forma de tratamento e eventual compartilhamento com terceiros. As informações são disponibilizadas por meio de banner de cookies e desta política, permitindo compreensão e controle efetivo pelo usuário."},{"p":"Respeito aos Direitos do Titular: Asseguramos o pleno exercício dos direitos previstos na LGPD, especialmente o direito de acesso, eliminação de dados, revogação do consentimento e oposição ao tratamento. Disponibilizamos mecanismos simples, gratuitos e acessíveis para gerenciamento de preferências de cookies."},{"p":"Limitação do Tratamento e Minimização de Riscos: Reconhecemos que dados coletados por cookies podem revelar aspectos comportamentais e de personalidade. Por isso, evitamos práticas que impliquem rastreamento excessivo ou desproporcional, especialmente diante da vulnerabilidade do titular e da assimetria informacional existente no ambiente digital."},{"p":"Segurança e Proteção de Dados: Adotamos medidas técnicas e organizacionais adequadas para proteger os dados pessoais coletados contra acessos não autorizados, vazamentos ou qualquer forma de tratamento inadequado ou ilícito, em conformidade com a legislação aplicável."},{"p":"Retenção Limitada e Eliminação de Dados: Os dados pessoais coletados por meio de cookies são armazenados apenas pelo período necessário ao cumprimento de suas finalidades. Após o término do tratamento, os dados são eliminados, salvo nas hipóteses legais que autorizem sua conservação."},{"p":"Base Legal para o Tratamento: O uso de cookies está sempre fundamentado em uma base legal adequada, especialmente o consentimento do titular ou o legítimo interesse, quando aplicável. O consentimento, quando utilizado, é livre, informado e inequívoco, sendo possível sua revogação a qualquer momento."},{"p":"Proibição de Práticas Abusivas: Não adotamos práticas de coleta indiscriminada, nem condicionamos o acesso ao site à aceitação obrigatória de cookies não essenciais. Também não utilizamos mecanismos de consentimento tácito ou opções pré-selecionadas."},{"p":"Ao observar esses princípios, buscamos assegurar um tratamento de dados ético, responsável e em conformidade com a legislação vigente, promovendo a confiança e a proteção dos titulares no ambiente digital."}]},{"t":"5. Classificação e Categorias dos Cookies","blocks":[{"p":"Cookies são pequenos arquivos de texto armazenados no dispositivo do usuário durante a navegação em páginas eletrônicas, que permitem a coleta de determinadas informações, inclusive dados pessoais, em algumas situações, com o objetivo de atender a diferentes finalidades."},{"p":"Parte dessas informações é essencial para o funcionamento adequado e seguro dos sites e para a viabilização de serviços no ambiente digital. Por exemplo, os cookies podem identificar o usuário antes da realização de uma transação online ou “lembrar” preferências previamente definidas, como idioma, credenciais de acesso (login e senha) e itens adicionados ao carrinho de compras."},{"p":"Além dessas funções, os cookies também podem ser utilizados para fins como medição de audiência, análise de desempenho e oferta de conteúdos ou anúncios personalizados."},{"p":"Destaca-se, ainda, que os cookies permitem o armazenamento de diversas informações nos dispositivos dos usuários. Esses dados podem se referir diretamente a uma pessoa natural ou possibilitar sua identificação indireta, por meio do cruzamento com outras informações ou da realização de inferências, inclusive para a criação de perfis comportamentais. Nesses casos, tais perfis podem ser considerados dados pessoais, uma vez que estão associados a um indivíduo."},{"p":"Dessa forma, sempre que houver a possibilidade de identificação direta ou indireta do usuário, as informações coletadas por meio de cookies serão consideradas dados pessoais, estando seu tratamento sujeito às disposições da Lei Geral de Proteção de Dados (LGPD)."},{"st":"Categorias de Cookies"},{"p":"Os cookies podem ser classificados a partir de diferentes critérios, considerando sua natureza, finalidade e forma de utilização. A presente Política adota uma classificação não exaustiva, baseada nas categorias mais comumente utilizadas, conforme orientações da Autoridade Nacional de Proteção de Dados (ANPD)."},{"p":"Ressalta-se que um mesmo cookie pode ser enquadrado em mais de uma categoria, a depender de suas características e finalidades."},{"p":"Para fins desta Política, os cookies são classificados de acordo com: (i) a entidade responsável por sua gestão; (ii) sua necessidade; (iii) sua finalidade; e (iv) o período de retenção das informações."},{"st":"5.1. Cookies quanto à entidade responsável pela gestão"},{"p":"a) Cookies próprios (ou primários) São aqueles definidos diretamente pelo website ou aplicação da Velaro. Em geral, são utilizados para viabilizar funcionalidades essenciais, como autenticação de usuários, manutenção de sessões, armazenamento de preferências (ex.: idioma) e gestão de carrinho de compras. Esses cookies, via de regra, não são utilizados para rastrear a navegação em sites de terceiros."},{"p":"b) Cookies de terceiros São aqueles definidos por domínios externos ao da Velaro, geralmente decorrentes da integração com serviços ou funcionalidades de terceiros, como ferramentas analíticas, mídias incorporadas ou publicidade. Esses cookies podem permitir o rastreamento da atividade do usuário em diferentes websites."},{"st":"5.2. Cookies quanto à necessidade"},{"p":"a) Cookies necessários (ou essenciais) São indispensáveis para o funcionamento adequado do website ou aplicação e para a prestação dos serviços solicitados pelo usuário. Sem esses cookies, determinadas funcionalidades essenciais não podem ser executadas. Essa categoria limita-se ao estritamente necessário, não abrangendo finalidades adicionais ou secundárias."},{"p":"b) Cookies não necessários São aqueles que não são essenciais para o funcionamento da plataforma. Sua desativação não impede o uso do site ou dos serviços, embora possa impactar a experiência do usuário. Incluem, por exemplo, cookies utilizados para análise de desempenho, personalização e publicidade."},{"p":"A distinção entre \"cookies\" necessários e não necessários é fundamental para a definição da base legal aplicável ao tratamento de dados pessoais, especialmente no que se refere ao uso de consentimento."},{"st":"5.3. Cookies quanto à finalidade"},{"p":"a) Cookies analíticos ou de desempenho Permitem coletar informações sobre a forma como os usuários utilizam o website, como páginas mais acessadas, tempo de navegação e eventuais erros, contribuindo para a melhoria contínua da performance e usabilidade."},{"p":"b) Cookies de funcionalidade São utilizados para fornecer funcionalidades adicionais e personalizadas, permitindo o armazenamento de preferências do usuário, como idioma, localização ou dados de login."},{"p":"c) Cookies de publicidade Destinam-se à coleta de informações sobre os hábitos de navegação do usuário, possibilitando a criação de perfis e a exibição de anúncios personalizados, alinhados aos seus interesses."},{"st":"5.4. Cookies quanto ao período de retenção"},{"p":"a) Cookies de sessão (ou temporários) São armazenados temporariamente no dispositivo do usuário e excluídos automaticamente ao final da sessão de navegação. São utilizados, em geral, para garantir funcionalidades essenciais e temporárias, como autenticação e manutenção de carrinho de compras."},{"p":"b) Cookies persistentes Permanecem armazenados no dispositivo do usuário por período determinado, mesmo após o encerramento da sessão. Podem ser utilizados para lembrar preferências e configurações do usuário em acessos futuros. Sua utilização deve observar o princípio da necessidade, sendo recomendada a limitação do prazo de retenção ao mínimo necessário para o cumprimento de sua finalidade."}]},{"t":"6. Finalidades do Uso de Cookies","blocks":[{"p":"A Velaro utiliza cookies e tecnologias similares com finalidades específicas, legítimas e devidamente informadas aos usuários, em conformidade com os princípios da finalidade, adequação e necessidade previstos na LGPD."},{"p":"Os cookies empregados no website e nas plataformas digitais da Velaro têm como objetivos principais: (i) assegurar o funcionamento adequado e seguro dos serviços; (ii) viabilizar autenticação e proteção contra acessos indevidos; (iii) prevenir fraudes; (iv) analisar padrões de navegação e desempenho da plataforma; e (v) proporcionar uma experiência personalizada ao usuário."},{"p":"As finalidades são descritas de forma clara, específica e transparente, evitando-se o uso de termos genéricos ou abrangentes."}]},{"t":"7. Transparência e Banner de Cookies","blocks":[{"p":"Em observância às diretrizes da Autoridade Nacional de Proteção de Dados (ANPD), a Velaro disponibiliza, em seu website, mecanismo de transparência por meio de banner de cookies no primeiro acesso do usuário."},{"p":"O banner apresenta, de forma clara e acessível: (i) informações sobre o uso de cookies; (ii) as categorias utilizadas; (iii) a possibilidade de aceitação, recusa ou personalização; e (iv) acesso a esta Política de Cookies."},{"p":"A Velaro assegura que o consentimento, quando necessário, seja obtido de forma livre, informada, inequívoca e granular, vedadas práticas como opções previamente selecionadas, ausência de opção de recusa ou indução do usuário a aceitar o uso de cookies."}]},{"t":"8. Gestão de Preferências","blocks":[{"p":"O usuário poderá, a qualquer momento, gerenciar suas preferências relacionadas ao uso de cookies, por meio das configurações disponibilizadas no website ou em seu navegador."},{"p":"A Velaro garante que a revogação do consentimento seja realizada de forma simples, gratuita e acessível, em conformidade com as orientações da ANPD."},{"p":"A desativação de cookies não essenciais não compromete o acesso ao website, embora possa impactar determinadas funcionalidades ou a experiência do usuário."}]},{"t":"9. Armazenamento e Retenção","blocks":[{"p":"Os cookies serão armazenados pelo período estritamente necessário para o cumprimento de suas finalidades, em observância ao princípio da necessidade."},{"p":"Cookies de sessão serão automaticamente excluídas ao término da navegação. Já os cookies persistentes permanecem armazenados por prazo limitado, definido de acordo com a finalidade do tratamento."},{"p":"A Velaro adota medidas para assegurar que os prazos de retenção sejam proporcionais e adequados, reduzindo riscos à privacidade dos usuários."}]},{"t":"10. Compartilhamento de Dados","blocks":[{"p":"Os dados coletados por meio de cookies poderão ser compartilhados com terceiros, quando necessário para a execução das finalidades descritas nesta Política, incluindo:"},{"itens":["prestadores de serviços tecnológicos e parceiros operacionais;","ferramentas de análise e monitoramento de desempenho;","autoridades públicas e regulatórias, quando exigido por lei ou regulamentação aplicável."]},{"p":"A Velaro assegura que o compartilhamento observe os princípios da LGPD, incluindo a adoção de medidas contratuais e técnicas adequadas para proteção dos dados pessoais."}]},{"t":"11. Direitos do Titular","blocks":[{"p":"Nos termos da LGPD, o titular dos dados pessoais poderá exercer, a qualquer momento, seus direitos, incluindo:"},{"itens":["confirmação da existência de tratamento;","acesso aos dados pessoais;","correção de dados incompletos, inexatos ou desatualizados;","anonimização, bloqueio ou eliminação de dados, quando aplicável;","revogação do consentimento;","informação sobre compartilhamento de dados."]},{"p":"A Velaro disponibiliza canais adequados para o exercício desses direitos, assegurando resposta em prazos razoáveis e conforme a legislação vigente."},{"st":"Contato do DPO"},{"p":"Encarregado de Dados: Silva Prado Advogados - CNPJ nº 40.606.144/0001-00"},{"st":"E-mail: dpo@velaro.network"}]},{"t":"12. Segurança da Informação","blocks":[{"p":"A Velaro adota medidas técnicas e administrativas aptas a proteger os dados pessoais coletados por meio de cookies contra acessos não autorizados, perda, alteração ou qualquer forma de tratamento inadequado ou ilícito."},{"p":"Essas medidas incluem controles de acesso, criptografia, monitoramento de sistemas e políticas internas de segurança da informação, alinhadas às melhores práticas de mercado e às exigências regulatórias."}]},{"t":"13. Disposições Gerais","blocks":[{"p":"A presente Política deve ser interpretada em conjunto com a Política de Privacidade, o Programa de Compliance e Segurança da Informação e demais normativos internos da Velaro."},{"p":"A Companhia poderá atualizar esta Política a qualquer tempo, especialmente para refletir alterações legais, regulatórias ou melhorias em seus processos e tecnologias. Nesses casos, os usuários serão devidamente informados, quando aplicável."},{"p":"Recomenda-se a consulta periódica desta Política para ciência de eventuais atualizações."}]},{"t":"14. Revisão da Política","blocks":[{"p":"Esta política é revisada e atualizada a cada 2 anos, ou sempre que houver mudanças regulatórias significativas, alterações substanciais em infraestrutura ou processos, incidentes graves que evidenciem necessidade de ajustes, ou identificação de boas práticas do mercado não incorporadas."},{"st":"ANEXO I - INFORMAÇÕES SOBRE COOKIES"},{"p":"Este Anexo I tem como objetivo apresentar, de forma clara e transparente, as informações relacionadas ao uso de cookies no site da Velaro Network, em conformidade com as diretrizes da Autoridade Nacional de Proteção de Dados (ANPD) e com a Lei Geral de Proteção de Dados (LGPD)."},{"p":"Cookies são pequenos arquivos armazenados no dispositivo do usuário que permitem o funcionamento adequado do site, a melhoria da experiência de navegação e a coleta de informações para fins estatísticos e de desempenho."},{"p":"Abaixo, apresentamos a tabela com os cookies utilizados em nosso site, suas finalidades e características."},{"img":"docs/tables/cookies-pt-1.png"}]}],"en":[{"t":"1. Purpose and Scope","blocks":[{"p":"This Cookie Policy establishes the guidelines for the collection, use, management, and storage of cookies and similar technologies on the website and digital platforms of Velaro Network Sociedade Prestadora de Serviços de Ativos Virtuais Ltda, CNPJ 63.964.774/0001-52 (“Velaro” or the “Company”)."},{"p":"In accordance with the guidelines of the Brazilian Data Protection Authority (ANPD), cookies may involve the processing of personal data and, therefore, must comply with the principles of transparency, purpose, necessity, and security set forth in the General Data Protection Law (LGPD)."},{"st":"Velaro’s use of cookies aims to:"},{"itens":["Ensure the proper and secure functioning of its digital platforms;","Provide a better user experience;","Enable statistical analysis and continuous improvements;","Allow data subjects to exercise their rights in accordance with the principles of the LGPD."]},{"p":"This Policy is part of Velaro’s Compliance, Data Governance, and Information Security Program."}]},{"t":"2. Definitions","blocks":[{"st":"For the purposes of this Policy, the following definitions apply:"},{"itens":["Anonymization: the use of reasonable and available technical means at the time of processing through which data loses the possibility of direct or indirect association with an individual.","Consent: a free, informed, and unambiguous expression by which the data subject agrees to the processing of their personal data for a specific purpose.","Cookies: text files stored on the user’s device during browsing on a website, used to recognize the user, record preferences, and collect information about their interaction with the platform.","Essential Cookies: cookies strictly necessary for the functioning of the website and the provision of services, not requiring user consent.","Non-Essential Cookies: cookies that are not indispensable for the functioning of the platform, including analytical, functional, and marketing cookies, whose use depends on user consent.","Third-Party Cookies: cookies set by domains external to Velaro, used for analysis, advertising, or integration with third-party services.","Personal Data: any information related to an identified or identifiable natural person, pursuant to Law No. 13,709/2018 (LGPD).","Data Subject: a natural person to whom the personal data being processed refers.","Data Processing: any operation performed on personal data, such as collection, production, reception, classification, use, access, reproduction, transmission, distribution, storage, deletion, evaluation, or control of information."]}]},{"t":"3. Legal and Regulatory Basis","blocks":[{"st":"This Policy is based on the following rules and guidelines:"},{"itens":["Law No. 13,709/2018 (General Data Protection Law - LGPD);","Brazilian Internet Civil Framework (Law No. 12,965/2014);","ANPD Guidelines on “Cookies and Personal Data Protection”;"]},{"p":"According to the ANPD Guidelines, the use of cookies must be associated with an appropriate legal basis, especially:"},{"itens":["Data subject consent, in the case of non-essential cookies;","Legitimate interest, for cookies strictly necessary for functionality and security;","Compliance with a legal or regulatory obligation, when applicable."]},{"p":"The ANPD emphasizes that consent must be free, informed, unambiguous, and granular, allowing users to choose which categories of cookies they wish to accept."}]},{"t":"4. LGPD Principles and Cookies","blocks":[{"p":"The use of cookies on this website strictly complies with the principles established by the General Data Protection Law (LGPD) and the Brazilian Internet Civil Framework, ensuring the protection of personal data and the privacy of data subjects. Considering the potentially sensitive nature of the information collected through tracking technologies, we adopt the following principles:"},{"p":"Purpose, Adequacy, and Necessity: Data collection through cookies is carried out for legitimate, specific, and informed purposes. The data processed is strictly necessary, relevant, and proportionate to achieve these purposes, and its subsequent use for incompatible objectives is prohibited. We do not perform excessive or indiscriminate collection of personal data."},{"p":"Transparency and Free Access: We ensure that data subjects have clear, accurate, and easily accessible information regarding the use of cookies, including their purposes, duration, categories, processing methods, and any sharing with third parties. This information is provided through a cookie banner and this Policy, enabling user understanding and effective control."},{"p":"Respect for Data Subject Rights: We ensure the full exercise of rights provided under the LGPD, especially the right of access, data deletion, withdrawal of consent, and objection to processing. We provide simple, free, and accessible mechanisms for managing cookie preferences."},{"p":"Limitation of Processing and Risk Minimization: We recognize that data collected through cookies may reveal behavioral and personality aspects. Therefore, we avoid practices involving excessive or disproportionate tracking, particularly considering the vulnerability of data subjects and the informational asymmetry present in the digital environment."},{"p":"Security and Data Protection: We adopt appropriate technical and organizational measures to protect personal data collected against unauthorized access, data breaches, or any form of improper or unlawful processing, in accordance with applicable legislation."},{"p":"Limited Retention and Data Deletion: Personal data collected through cookies is stored only for the period necessary to fulfill its purposes. After the end of processing, the data is deleted, except where legal provisions authorize its retention."},{"p":"Legal Basis for Processing: The use of cookies is always based on an appropriate legal basis, particularly the data subject’s consent or legitimate interest, when applicable. Consent, when used, is free, informed, and unambiguous, and may be withdrawn at any time."},{"p":"Prohibition of Abusive Practices: We do not adopt indiscriminate data collection practices, nor do we condition access to the website on the mandatory acceptance of non-essential cookies. We also do not use implicit consent mechanisms or pre-selected options."},{"p":"By observing these principles, we aim to ensure ethical, responsible, and legally compliant data processing, promoting trust and protecting data subjects in the digital environment."}]},{"t":"5. Classification and Categories of Cookies","blocks":[{"p":"Cookies are small text files stored on the user’s device while browsing web pages, allowing the collection of certain information, including personal data in some cases, in order to fulfill different purposes."},{"p":"Part of this information is essential for the proper and secure functioning of websites and for enabling services in the digital environment. For example, cookies may identify the user before completing an online transaction or “remember” previously defined preferences, such as language, login credentials (username and password), and items added to a shopping cart."},{"p":"In addition to these functions, cookies may also be used for purposes such as audience measurement, performance analysis, and the provision of personalized content or advertisements."},{"p":"It is also important to highlight that cookies allow the storage of various types of information on users’ devices. This data may directly relate to a natural person or enable their indirect identification through correlation with other information or through inferences, including for the creation of behavioral profiles. In such cases, these profiles may be considered personal data, as they are associated with an individual."},{"p":"Therefore, whenever there is the possibility of direct or indirect identification of the user, the information collected through cookies will be considered personal data, and its processing will be subject to the provisions of the General Data Protection Law (LGPD)."},{"st":"Cookie Categories"},{"p":"Cookies can be classified according to different criteria, considering their nature, purpose, and method of use. This Policy adopts a non-exhaustive classification based on the most commonly used categories, in line with the guidelines of the Brazilian Data Protection Authority (ANPD)."},{"p":"It should be noted that a single cookie may fall into more than one category, depending on its characteristics and purposes."},{"p":"For the purposes of this Policy, cookies are classified according to: (i) the entity responsible for their management; (ii) their necessity; (iii) their purpose; and (iv) the retention period of the information."},{"st":"5.1. Cookies by the entity responsible for management"},{"p":"a) First-party cookies These are cookies set directly by Velaro’s website or application. They are generally used to enable essential functionalities, such as user authentication, session management, storage of preferences (e.g., language), and shopping cart management. As a rule, these cookies are not used to track browsing across third-party websites."},{"p":"b) Third-party cookies These are cookies set by domains external to Velaro, usually resulting from integration with third-party services or functionalities, such as analytics tools, embedded media, or advertising. These cookies may allow tracking of user activity across different websites."},{"st":"5.2. Cookies by necessity"},{"p":"a) Necessary (or essential) cookies These are indispensable for the proper functioning of the website or application and for the provision of services requested by the user. Without these cookies, certain essential functionalities cannot be performed. This category is limited to what is strictly necessary and does not include additional or secondary purposes."},{"p":"b) Non-necessary cookies These are not essential for the functioning of the platform. Disabling them does not prevent the use of the website or services, although it may impact the user experience. Examples include cookies used for performance analysis, personalization, and advertising."},{"p":"The distinction between necessary and non-necessary cookies is essential for determining the applicable legal basis for the processing of personal data, particularly with regard to the use of consent."},{"st":"5.3. Cookies by purpose"},{"p":"a) Analytical or performance cookies These allow the collection of information on how users interact with the website, such as most visited pages, time spent browsing, and possible errors, contributing to continuous improvement of performance and usability."},{"p":"b) Functionality cookies These are used to provide additional and personalized features, enabling the storage of user preferences, such as language, location, or login details."},{"p":"c) Advertising cookies These are intended to collect information about users’ browsing habits, enabling the creation of profiles and the display of personalized advertisements aligned with their interests."},{"st":"5.4. Cookies by retention period"},{"p":"a) Session (or temporary) cookies These are temporarily stored on the user’s device and are automatically deleted at the end of the browsing session. They are generally used to ensure essential and temporary functionalities, such as authentication and shopping cart management."},{"p":"b) Persistent cookies These remain stored on the user’s device for a defined period, even after the session ends. They may be used to remember user preferences and settings for future visits. Their use must comply with the principle of necessity, and it is recommended that the retention period be limited to the minimum required to fulfill their purpose."}]},{"t":"6. Purposes of Cookie Use","blocks":[{"p":"Velaro uses cookies and similar technologies for specific, legitimate purposes that are properly disclosed to users, in accordance with the principles of purpose limitation, adequacy, and necessity set forth in the Brazilian General Data Protection Law (LGPD)."},{"p":"The cookies used on Velaro’s website and digital platforms are primarily intended to: (i) ensure the proper and secure functioning of services; (ii) enable authentication and protection against unauthorized access; (iii) prevent fraud; (iv) analyze browsing patterns and platform performance; and (v) provide a personalized user experience."},{"p":"These purposes are described in a clear, specific, and transparent manner, avoiding the use of generic or overly broad terms."}]},{"t":"7. Transparency and Cookie Banner","blocks":[{"p":"In compliance with the guidelines of the Brazilian Data Protection Authority (ANPD), Velaro provides a transparency mechanism on its website through a cookie banner upon the user’s first access."},{"p":"The banner clearly and accessibly presents: (i) information about the use of cookies; (ii) the categories used; (iii) the option to accept, reject, or customize preferences; and (iv) access to this Cookie Policy."},{"p":"Velaro ensures that consent, when required, is obtained in a free, informed, unambiguous, and granular manner, prohibiting practices such as pre-selected options, lack of a refusal option, or any form of user manipulation to encourage acceptance of cookies."}]},{"t":"8. Preference Management","blocks":[{"p":"Users may, at any time, manage their preferences regarding the use of cookies through the settings available on the website or in their browser."},{"p":"Velaro ensures that the withdrawal of consent is carried out in a simple, free, and accessible manner, in accordance with the guidelines of the Brazilian Data Protection Authority (ANPD)."},{"p":"Disabling non-essential cookies does not prevent access to the website, although it may impact certain functionalities or the user experience."}]},{"t":"9. Storage and Retention","blocks":[{"p":"Cookies will be stored only for the period strictly necessary to fulfill their purposes, in accordance with the principle of necessity."},{"p":"Session cookies are automatically deleted at the end of the browsing session. Persistent cookies, on the other hand, remain stored for a limited period, defined according to the purpose of the processing."},{"p":"Velaro adopts measures to ensure that retention periods are proportionate and appropriate, reducing risks to users’ privacy."}]},{"t":"10. Data Sharing","blocks":[{"p":"Data collected through cookies may be shared with third parties when necessary to fulfill the purposes described in this Policy, including:"},{"itens":["technology service providers and operational partners;","analytics and performance monitoring tools;","public and regulatory authorities, when required by law or applicable regulation."]},{"p":"Velaro ensures that such sharing complies with the principles of the LGPD, including the adoption of appropriate contractual and technical measures to protect personal data."}]},{"t":"11. Data Subject Rights","blocks":[{"p":"Under the Brazilian General Data Protection Law (LGPD), data subjects may exercise their rights at any time, including:"},{"itens":["confirmation of the existence of data processing;","access to personal data;","correction of incomplete, inaccurate, or outdated data;","anonymization, blocking, or deletion of data, when applicable;","withdrawal of consent;","information regarding data sharing."]},{"p":"Velaro provides appropriate channels for exercising these rights, ensuring responses within reasonable timeframes and in accordance with applicable legislation."},{"st":"DPO Contact"},{"p":"Data Protection Officer: Silva Prado Advogados - CNPJ No. 40.606.144/0001-00"},{"st":"Email: dpo@velaro.network"}]},{"t":"12. Information Security","blocks":[{"p":"Velaro adopts technical and administrative measures designed to protect personal data collected through cookies against unauthorized access, loss, alteration, or any form of improper or unlawful processing."},{"p":"These measures include access controls, encryption, system monitoring, and internal information security policies, aligned with market best practices and regulatory requirements."}]},{"t":"13. General Provisions","blocks":[{"p":"This Policy must be interpreted in conjunction with the Privacy Policy, the Compliance and Information Security Program, and other internal regulations of Velaro."},{"p":"The Company may update this Policy at any time, especially to reflect legal or regulatory changes or improvements in its processes and technologies. In such cases, users will be duly informed, when applicable."},{"p":"Periodic review of this Policy is recommended to stay informed of any updates."}]},{"t":"14. Policy Review","blocks":[{"p":"This Policy is reviewed and updated every two (2) years, or whenever there are significant regulatory changes, substantial modifications to infrastructure or processes, serious incidents indicating the need for adjustments, or the identification of relevant market best practices not yet incorporate."},{"img":"docs/tables/cookies-en-1.png"}]}]},"pld-ftp":{"pt":[{"t":"1. Introdução","blocks":[{"p":"O fenômeno da lavagem de dinheiro e do financiamento do terrorismo representa um dos maiores desafios para a integridade e a estabilidade do sistema financeiro global. Suas consequências ultrapassam fronteiras, minam a credibilidade de instituições financeiras perante reguladores e sociedade, alimentam atividades criminosas como o tráfico de drogas, a corrupção e a evasão fiscal, e geram riscos sistêmicos capazes de desestabilizar mercados. O crescimento e a sofisticação dessas práticas, especialmente em um contexto de inovação tecnológica e de globalização dos fluxos financeiros, exigem padrões cada vez mais rigorosos de prevenção e controle."},{"p":"Nesse cenário, a Velaro Network (“Empresa” ou “Velaro”) adota o compromisso institucional de prevenir e combater a lavagem de dinheiro (LD), o financiamento do terrorismo (FT) e o financiamento da proliferação de armas de destruição em massa (FPADM). Essa responsabilidade é assumida em conformidade com a Lei nº 9.613/1998, a Lei nº 14.478/2022, a Circular Bacen nº 3.978/2020, a Resolução BCB nº 520/2025 e as Recomendações do Grupo de Ação Financeira Internacional (GAFI/FATF), refletindo a determinação da empresa em alinhar-se às melhores práticas globais."},{"p":"O objetivo desta Política é assegurar que a Velaro conduza suas operações em conformidade com a legislação aplicável e com os mais elevados padrões éticos, prevenindo sua utilização para fins ilícitos e fortalecendo a integridade do sistema financeiro."},{"p":"A abrangência da Política é ampla e obrigatória, aplicando-se à Alta Administração, ao Diretor Responsável, à Área de Compliance, a todos os colaboradores e administradores (incluindo consultores e prestadores de serviços), a parceiros comerciais e fornecedores críticos, bem como aos clientes que utilizam os serviços da Velaro. A observância de suas disposições é condição essencial para a manutenção de vínculos contratuais ou laborais com a empresa e será considerada na avaliação de desempenho e na gestão de terceiros."},{"p":"Esta Política integra o Programa de Prevenção à Lavagem de Dinheiro e ao Financiamento do Terrorismo da Velaro e funciona como guia para a gestão de riscos, a implementação de controles internos, a realização de treinamentos e a aplicação de medidas corretivas e disciplinares. Seu propósito é assegurar não apenas o alinhamento da empresa às expectativas regulatórias, mas também a preservação da reputação, da solidez e da integridade da Velaro, de seus clientes e do sistema financeiro como um todo."}]},{"t":"2. Definições","blocks":[{"p":"2.1 Lavagem de Dinheiro: Entende-se por lavagem de dinheiro o ato de ocultar ou dissimular a natureza, origem, localização, disposição, movimentação ou propriedade de bens, direitos ou valores provenientes, direta ou indiretamente, de infração penal."},{"p":"A lavagem de dinheiro ocorre geralmente em três etapas: colocação (inserção do dinheiro ilícito no sistema financeiro), ocultação (movimentações e camadas de transações para dificultar o rastreio da origem) e integração (reintrodução do capital no mercado formal como se fosse legítimo). Cada uma dessas fases pode ser realizada por meio de instrumentos financeiros tradicionais, empresas de fachada, operações internacionais ou ativos virtuais."},{"p":"2.2 Financiamento do Terrorismo: o financiamento do terrorismo consiste em prover, arrecadar, disponibilizar ou utilizar recursos, ativos ou valores de qualquer natureza, por qualquer meio, direta ou indiretamente, com a finalidade de apoiar, planejar, facilitar ou praticar atos terroristas. Ao contrário da lavagem de dinheiro, que busca dar aparência de licitude a recursos ilícitos, o financiamento do terrorismo pode envolver tanto recursos de origem ilícita quanto fundos provenientes de atividades lícitas."},{"p":"2.3 Ativo Virtual: Nos termos do art. 3º, inciso I, da Lei nº 14.478/2022, ativo virtual é a representação digital de valor que pode ser negociada ou transferida por meios eletrônicos e utilizada para realização de pagamentos ou com propósito de investimento, não sendo considerada moeda de curso legal, moeda eletrônica, instrumento de pagamento já regulamentado, ou valor mobiliário."},{"p":"2.4 Cliente: Para fins desta Política, cliente é a pessoa física ou jurídica que contrata os serviços e/ou produtos da Velaro."},{"p":"2.5 Beneficiário Final (UBO): considera-se beneficiário final a pessoa natural que, em última instância, possui, controla ou influencia significativamente pessoa jurídica, ou em nome da qual uma transação é conduzida, podendo ser identificado também como quem detém, direta ou indiretamente, 25% ou mais do capital social ou dos direitos de voto de uma entidade."},{"p":"2.6 Pessoa Exposta Politicamente (PEP): Para fins desta Política, considera-se Pessoa Exposta Politicamente (PEP) todo indivíduo que ocupe ou tenha ocupado cargos ou funções públicas relevantes, conforme definição legal e regulamentar aplicável. A classificação como PEP abrange tanto aqueles que estejam atualmente no exercício de tais funções quanto aqueles que as tenham exercido nos últimos cinco anos, incluindo seus representantes, familiares e pessoas de relacionamento próximo. Nos termos da Resolução COAF nº 40/2021, consideram-se PEPs os ocupantes dos seguintes cargos: a) Ministro de Estado ou equiparado; b) Natureza Especial ou equivalente; c) Presidente, Vice-Presidente e Diretor, ou equivalentes, de entidades da administração pública indireta; e d) Direção e Assessoramento Superior - DAS de nível 6 ou equivalente; os membros do Conselho Nacional de Justiça, do Supremo Tribunal Federal, dos Tribunais Superiores, dos Tribunais Regionais Federais, dos Tribunais Regionais do Trabalho, dos Tribunais Regionais Eleitorais, do Conselho Superior da Justiça do Trabalho e do Conselho da Justiça Federal; os membros do Conselho Nacional do Ministério Público, o Procurador-Geral da República, o Vice-Procurador-Geral da República, o Procurador-Geral do Trabalho, o Procurador-Geral da Justiça Militar, os Subprocuradores-Gerais da República e os Procuradores-Gerais de Justiça dos Estados e do Distrito Federal; os membros do Tribunal de Contas da União, o Procurador-Geral e os Subprocuradores-Gerais do Ministério Público junto ao Tribunal de Contas da União; os Presidentes e Tesoureiros nacionais, ou equivalentes, de partidos políticos; os Governadores e Secretários de Estado e do Distrito Federal, os Deputados Estaduais e Distritais, os Presidentes, ou equivalentes, de entidades da administração pública indireta estadual e distrital e os Presidentes de Tribunais de Justiça, Militares, de Contas ou equivalentes de Estado e do Distrito Federal; os Prefeitos, os Vereadores, os Secretários Municipais, os Presidentes, ou equivalentes, de entidades da administração pública indireta municipal e os Presidentes de Tribunais de Contas de Municípios ou equivalentes. Também são consideradas pessoas expostas politicamente aquelas que, no exterior, sejam: chefes de estado ou de governo; políticos de escalões superiores; ocupantes de cargos governamentais de escalões superiores; oficiais generais e membros de escalões superiores do poder judiciário; executivos de escalões superiores de empresas públicas; dirigentes de partidos políticos. São consideradas ainda pessoas expostas politicamente os dirigentes de escalões superiores de entidades de direito internacional público ou privado."},{"p":"2.7 Colaboradores: Para fins desta Política, colaboradores compreendem empregados, administradores, diretores e prestadores de serviços terceirizados contratados pela Velaro para a realização de serviços essenciais ou diretamente relacionados às atividades principais da companhia."},{"p":"2.8 Terceiros: consideram-se terceiros as pessoas físicas ou jurídicas que não são empregados, colaboradores ou administradores da Velaro, mas que mantêm vínculo contratual ou de negócio com a empresa. Incluem-se nessa definição: prestadores de serviços de apoio, contratados para auxiliar a companhia em atividades não essenciais (como agentes intermediários, advogados externos, auditores, empresas de cobrança, entre outros); e parceiros estratégic
