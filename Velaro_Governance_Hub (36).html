<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Velaro Governance Hub: portal de Compliance, PLD/FTP e Governança da Velaro Network." />
  <title>Velaro Governance Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style id="velaro-style">
/* =========================================================
   VELARO GOVERNANCE HUB - style.css
   Biblioteca normativa corporativa
   ========================================================= */

:root {
  /* Marca */
  --brand: #0A7A6B;
  --brand-700: #075E52;
  --brand-600: #0F8F7E;
  --brand-100: #E2FAF5;
  --brand-50: #F1FBF9;

  /* Neutros */
  --ink: #0B1015;
  --ink-2: #3D4A52;
  --muted: #5E6B73;
  --muted-2: #87939A;
  --line: #DDE5E3;
  --line-2: #EAF0EE;
  --bg: #ffffff;
  --bg-soft: #F3F7F6;
  --bg-sidebar: #F9FCFB;

  /* Status */
  --st-vigente: #1f8a52;
  --st-vigente-bg: #e7f5ec;
  --st-revisao: #b07400;
  --st-revisao-bg: #fbf2dd;
  --st-revogado: #9aa4b1;
  --st-revogado-bg: #eef1f4;
  --st-substituido: #6b5bb5;
  --st-substituido-bg: #efecf9;

  /* Tipografia */
  --sans: "Urbanist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Helvetica Neue", sans-serif;
  --serif: "Urbanist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Helvetica Neue", sans-serif;

  --topbar-h: 66px;
  --sidebar-w: 276px;
  --radius: 10px;
  --radius-sm: 7px;
  --shadow-sm: 0 1px 2px rgba(11,16,21,.05), 0 1px 3px rgba(11,16,21,.04);
  --shadow-md: 0 4px 18px rgba(11,16,21,.08);
  --shadow-lg: 0 18px 50px rgba(11,16,21,.16);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: var(--brand-600); text-decoration: none; }
a:hover { text-decoration: underline; }

::selection { background: var(--brand-100); color: var(--brand-700); }

/* ===================== TOPBAR ===================== */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--topbar-h);
  background: rgba(255,255,255,.92);
  backdrop-filter: saturate(150%) blur(8px);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 22px;
  z-index: 50;
}

.menu-toggle {
  display: none;
  flex-direction: column;
  gap: 4px;
  background: none; border: none; cursor: pointer;
  padding: 6px;
}
.menu-toggle span { width: 20px; height: 2px; background: var(--ink-2); border-radius: 2px; }

.brand { display: flex; align-items: center; gap: 12px; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand-mark {
  font-family: var(--sans);
  font-weight: 700;
  letter-spacing: .5px;
  font-size: 13px;
  color: #fff;
  background: linear-gradient(150deg, var(--brand) 0%, var(--brand-700) 100%);
  padding: 9px 11px;
  border-radius: 8px;
  line-height: 1;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.brand-text small { font-size: 11px; color: var(--muted); letter-spacing: .02em; }

.topbar-search {
  flex: 1;
  max-width: 640px;
  margin: 0 auto;
  position: relative;
  display: flex;
  align-items: center;
}
.topbar-search svg {
  position: absolute; left: 15px;
  width: 18px; height: 18px;
  fill: none; stroke: var(--brand); stroke-width: 2; stroke-linecap: round;
  pointer-events: none;
}
.topbar-search input {
  width: 100%;
  border: 1.5px solid var(--brand-100);
  background: #fff;
  border-radius: 11px;
  padding: 11px 16px 11px 44px;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(16,40,70,.06);
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.topbar-search input::placeholder { color: var(--muted); }
.topbar-search input:hover { border-color: var(--brand-600); }
.topbar-search input:focus {
  outline: none;
  background: #fff;
  border-color: var(--brand-600);
  box-shadow: 0 0 0 4px var(--brand-100);
}
.topbar-search kbd {
  position: absolute; right: 12px;
  font-family: var(--sans); font-size: 11.5px; font-weight: 600; color: var(--brand-700);
  border: 1px solid var(--brand-100); border-radius: 6px;
  padding: 2px 8px; background: var(--brand-50);
}

.topbar-meta { display: flex; align-items: center; }
.env-pill {
  font-size: 11px; font-weight: 500; color: var(--brand-700);
  background: var(--brand-50); border: 1px solid var(--brand-100);
  padding: 5px 11px; border-radius: 20px; white-space: nowrap;
}

/* ===================== LAYOUT ===================== */
.layout { display: flex; padding-top: var(--topbar-h); }

.sidebar {
  position: fixed;
  top: var(--topbar-h);
  bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  z-index: 40;
}
.sidebar-backdrop {
  display: none;
  position: fixed; inset: var(--topbar-h) 0 0 0;
  background: rgba(11,16,21,.35);
  z-index: 35;
}

.nav { padding: 18px 14px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px;
  border-radius: 8px;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 2px;
  transition: background .12s, color .12s;
  border: 1px solid transparent;
}
.nav-item:hover { background: var(--brand-50); color: var(--brand-700); text-decoration: none; }
.nav-item.active {
  background: var(--brand-100);
  color: var(--brand-700);
  font-weight: 600;
  border-color: #d3efe9;
}
.nav-item svg { width: 17px; height: 17px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.nav-item.em-breve { color: var(--muted); }
.nav-item.em-breve:hover { background: var(--bg-soft); color: var(--ink-2); }
.nav-item.em-breve > span:not(.nav-tag) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-tag { margin-left: auto; flex-shrink: 0; align-self: center; font-size: 9px; font-weight: 700; line-height: 1; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; color: var(--brand-700); background: var(--brand-50); border: 1px solid var(--brand-100); border-radius: 20px; padding: 3px 7px; }
.cm-panel-sm { max-width: 460px; }
.dev-text { margin: 4px 0 18px; font-size: 14px; color: var(--ink-2); line-height: 1.6; text-align: justify; text-justify: inter-word; }
.nav-group-label {
  display: flex; align-items: center; gap: 9px;
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted-2);
  padding: 16px 12px 7px;
}
.nav-group-label svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.nav-item.no-ico { padding-left: 40px; }

.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--line);
}
.sidebar-footer p { margin: 0; font-weight: 600; font-size: 13px; color: var(--ink); }
.sidebar-footer small { color: var(--muted); font-size: 12px; }

/* ===================== CONTENT ===================== */
.content {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-width: 0;
  min-height: calc(100vh - var(--topbar-h));
  padding: 38px max(28px, calc((100% - 1600px) / 2)) 90px;
  outline: none;
}

/* Breadcrumb */
.crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 20px; flex-wrap: wrap; }
.crumb a { color: var(--muted); }
.crumb a:hover { color: var(--brand-600); }
.crumb span.sep { color: var(--muted-2); }
.crumb .cur { color: var(--ink-2); font-weight: 500; }

/* Page header */
.page-head { margin-bottom: 30px; }
.page-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-600); margin-bottom: 8px; }
.page-title { font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 4vw, 40px); line-height: 1.12; letter-spacing: -.015em; color: var(--ink); margin: 0 0 12px; }
.page-lead { font-size: 16px; color: var(--ink-2); margin: 0; line-height: 1.65; text-align: justify; text-justify: inter-word; }

h2.sec-title { font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: -.01em; color: var(--ink); margin: 40px 0 16px; }
h3.sub-title { font-size: 15px; font-weight: 600; color: var(--ink); margin: 24px 0 10px; }

.lead-divider { height: 1px; background: var(--line); border: 0; margin: 0 0 30px; }

/* ===================== HERO (home) ===================== */
.hero {
  position: relative;
  background:
    radial-gradient(120% 140% at 88% 8%, rgba(45,227,200,.10), transparent 55%),
    linear-gradient(155deg, #0B1015 0%, #08413A 55%, #0A7A6B 100%);
  color: #fff;
  border-radius: 16px;
  padding: 36px 40px;
  overflow: hidden;
  margin-bottom: 34px;
}
.hero-shield {
  position: absolute; right: 28px; top: 50%; transform: translateY(-50%);
  pointer-events: none; opacity: .07; z-index: 0;
}
.hero-shield svg { width: 210px; height: 210px; fill: none; stroke: #fff; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.hero-inner { position: relative; z-index: 1; }
.hero-rule { width: 42px; height: 3px; background: #C6F034; margin-bottom: 16px; }
.hero h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(26px, 3.6vw, 34px); line-height: 1.1; letter-spacing: -.01em; margin: 0 0 10px; }
.hero p { font-size: 15px; color: rgba(255,255,255,.86); margin: 0 0 26px; line-height: 1.55; max-width: 520px; text-align: justify; text-justify: inter-word; }
.hero-stats { display: flex; gap: 40px; flex-wrap: wrap; margin-bottom: 28px; }
.hero-stat { display: flex; align-items: baseline; gap: 10px; }
.hs-num { font-family: var(--mono, ui-monospace, "SFMono-Regular", Consolas, monospace); font-size: 44px; font-weight: 400; line-height: 1; letter-spacing: -.03em; color: #fff; }
.hs-lbl { font-size: 12px; color: rgba(255,255,255,.72); line-height: 1.2; max-width: 70px; }
.hero-actions { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.hero-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 9px; transition: background .15s, border-color .15s; }
.hero-btn.primary { background: #C6F034; color: var(--brand-700); }
.hero-btn.primary:hover { background: #D7F76A; text-decoration: none; }
.hero-btn.ghost { background: transparent; color: #fff; border: 0.5px solid rgba(255,255,255,.4); }
.hero-btn.ghost:hover { background: rgba(255,255,255,.10); text-decoration: none; }
.hero-btn.ghost svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.hero-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.82); }
.hero-link:hover { color: #fff; text-decoration: none; }
.hero-link svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hero-search { position: relative; max-width: 560px; }
.hero-search input {
  width: 100%; border: none; border-radius: 11px;
  padding: 15px 18px 15px 48px;
  font-family: var(--sans); font-size: 15px; color: var(--ink);
  box-shadow: var(--shadow-md);
}
.hero-search input:focus { outline: none; box-shadow: 0 0 0 4px rgba(255,255,255,.25), var(--shadow-md); }
.hero-search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }

/* Quick links */
.quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.quick-card {
  display: flex; flex-direction: column; gap: 10px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.quick-card:hover { border-color: #cdeee8; box-shadow: var(--shadow-md); transform: translateY(-2px); text-decoration: none; }
.quick-card .qc-ico {
  width: 38px; height: 38px; border-radius: 9px;
  background: var(--brand-50); color: var(--brand);
  display: grid; place-items: center;
}
.quick-card .qc-ico svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.quick-card strong { font-size: 14px; font-weight: 600; color: var(--ink); }
.quick-card span { font-size: 12.5px; color: var(--muted); }

/* Home columns */
.home-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; }

/* List rows */
.doc-list { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: #fff; }
.doc-row {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--line-2);
  cursor: pointer;
  transition: background .12s;
}
.doc-row:last-child { border-bottom: none; }
.doc-row:hover { background: var(--brand-50); text-decoration: none; }
.doc-row .dr-ico {
  width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
  background: var(--bg-soft); color: var(--brand);
  display: grid; place-items: center;
}
.doc-row .dr-ico svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.doc-row .dr-main { flex: 1; min-width: 0; }
.doc-row .dr-title { font-size: 14.5px; font-weight: 600; color: var(--ink); display: block; }
.doc-row .dr-sub { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.doc-row .dr-meta { font-size: 12px; color: var(--muted-2); white-space: nowrap; }
.doc-row .arrow { color: var(--muted-2); }
.doc-row .dr-ext { color: var(--muted-2); flex-shrink: 0; display: grid; place-items: center; }
.doc-row .dr-ext svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
a.doc-row:hover .dr-ext { color: var(--brand); }
.doc-row .arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

/* Code chip */
.code-chip { font-family: var(--sans); font-size: 11.5px; font-weight: 600; color: var(--brand-700); background: var(--brand-50); border: 1px solid var(--brand-100); padding: 1px 7px; border-radius: 5px; letter-spacing: .02em; }

/* Tempo de leitura */
.leitura-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; color: var(--muted, #64748b); white-space: nowrap; }
.leitura-chip svg { width: 13px; height: 13px; }

/* Status badge */
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.vigente { color: var(--st-vigente); background: var(--st-vigente-bg); }
.badge.em-revisao { color: var(--st-revisao); background: var(--st-revisao-bg); }
.badge.revogado { color: var(--st-revogado); background: var(--st-revogado-bg); }
.badge.substituido { color: var(--st-substituido); background: var(--st-substituido-bg); }
.badge.planejado { color: var(--st-revisao); background: var(--st-revisao-bg); }

/* Section cards (landing) */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card-grid-wide { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
.info-card {
  display: flex; flex-direction: column; height: 100%;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: #fff; padding: 22px; transition: border-color .15s, box-shadow .15s;
}
.info-card .doc-actions, .info-card > .muted:last-child { margin-top: auto; }
.info-card:hover { border-color: #cdeee8; box-shadow: var(--shadow-sm); }
.info-card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; color: var(--ink); min-height: 46px; display: flex; align-items: flex-end; line-height: 1.25; }
.info-card p { margin: 0 0 8px; font-size: 13.5px; color: var(--muted); text-align: justify; text-justify: inter-word; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; min-height: 108px; }

.panel {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: #fff; padding: 22px 24px; margin-bottom: 18px;
}
.panel h3 { margin-top: 0; }

/* Filters */
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.filters label { font-size: 12px; color: var(--muted); font-weight: 500; }
.filters select, .filters input[type=search] {
  font-family: var(--sans); font-size: 13.5px; color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: #fff;
}
.filters select:focus, .filters input:focus { outline: none; border-color: var(--brand-600); box-shadow: 0 0 0 3px var(--brand-100); }
.gloss-letra { font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--brand-700); border-bottom: 1px solid var(--line); padding: 18px 2px 6px; margin-bottom: 10px; }
.gloss-item { display: grid; grid-template-columns: 230px 1fr; gap: 18px; padding: 13px 2px; border-bottom: 1px solid var(--bg-soft); }
.gloss-item dt { font-weight: 600; font-size: 14.5px; color: var(--ink); }
.gloss-item dd { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.6; text-align: justify; text-justify: inter-word; }
@media (max-width: 720px) { .gloss-item { grid-template-columns: 1fr; gap: 4px; } }

/* Comunicado card */
.com-list { display: flex; flex-direction: column; gap: 14px; }
.com-card {
  display: block;
  border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: var(--radius);
  background: #fff; padding: 20px 22px; cursor: pointer;
  transition: box-shadow .15s, border-color .15s;
}
.com-card:hover { box-shadow: var(--shadow-md); }
.com-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.com-num { font-weight: 700; font-size: 13px; color: var(--brand-700); }
.com-date { font-size: 12.5px; color: var(--muted); }
.tag { font-size: 11px; font-weight: 600; color: var(--ink-2); background: var(--bg-soft); border: 1px solid var(--line); padding: 2px 9px; border-radius: 20px; }
.com-card h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
.com-card p { margin: 0; font-size: 13.5px; color: var(--muted); }

/* ===================== DOCUMENT PAGE ===================== */
.doc-layout { display: grid; grid-template-columns: 1fr 296px; gap: 40px; align-items: start; }
.doc-main {}
.doc-title-block { border-bottom: 1px solid var(--line); padding-bottom: 22px; margin-bottom: 26px; }
.doc-title-block h1 { font-family: var(--serif); font-weight: 600; font-size: 32px; line-height: 1.15; letter-spacing: -.015em; margin: 10px 0 14px; }
.doc-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

/* Comunicado embutido: conteúdo nativo na mesma página, sem iframe nem janela separada.
   Nenhum override de layout aqui - o .doc mantém exatamente a largura, margem e
   cabeçalho do arquivo original, para ficar pixel a pixel igual à versão standalone. */
.comunicado-body { margin-top: 24px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--sans); font-size: 13.5px; font-weight: 600;
  padding: 10px 16px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line); background: #fff; color: var(--ink-2);
  transition: background .12s, border-color .12s, color .12s;
}
.btn:hover { text-decoration: none; border-color: #cdeee8; background: var(--brand-50); color: var(--brand-700); }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-700); border-color: var(--brand-700); color: #fff; }
.btn.disabled { opacity: .55; cursor: not-allowed; }

.doc-section { margin-bottom: 30px; }
.doc-section h2 { font-family: var(--serif); font-weight: 600; font-size: 20px; margin: 0 0 12px; color: var(--ink); }
.doc-section p { margin: 0 0 12px; color: var(--ink-2); text-align: justify; text-justify: inter-word; }
.doc-section h3 { font-family: var(--sans); font-weight: 600; font-size: 15px; margin: 20px 0 8px; color: var(--ink); }
.doc-section ul.doc-ul { margin: 0 0 14px; padding-left: 20px; }
.doc-section ul.doc-ul li { margin: 0 0 7px; color: var(--ink-2); line-height: 1.6; text-align: justify; }
.doc-title-block p { text-align: justify; text-justify: inter-word; }
.doc-views { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); font-size: 13px; vertical-align: middle; }
.doc-views svg { width: 15px; height: 15px; stroke: currentColor; }
.doc-views .doc-views-n { font-variant-numeric: tabular-nums; font-weight: 600; }
.dr-sub .doc-views { margin-left: 4px; }

/* Metadata sidebar */
.meta-card {
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-sidebar);
  padding: 20px; position: sticky; top: calc(var(--topbar-h) + 24px);
}
.meta-card h4 { margin: 0 0 14px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.meta-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.meta-row:last-child { border-bottom: none; }
.meta-row .ml { color: var(--muted); }
.meta-row .mv { color: var(--ink); font-weight: 500; text-align: right; }

/* Metadados de cards (treinamentos etc.): rotulo com largura fixa, valor sempre alinhado a esquerda, sem justificar */
.meta-grid { display: flex; flex-direction: column; gap: 0; margin-top: 4px; }
.meta-grid-row { display: grid; grid-template-columns: 108px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; min-height: 56px; align-items: start; }
.meta-grid-row:last-child { border-bottom: none; }
.meta-grid-row .ml { color: var(--muted); }
.meta-grid-row .mv { color: var(--ink); font-weight: 500; text-align: left; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }

/* Version history table */
.vtable { width: 100%; border-collapse: collapse; font-size: 13.5px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.vtable th { text-align: left; background: var(--bg-soft); color: var(--muted); font-weight: 600; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.vtable td { padding: 12px 14px; border-bottom: 1px solid var(--line-2); color: var(--ink-2); vertical-align: top; }
.vtable tr:last-child td { border-bottom: none; }
.vtable td.vcode { font-weight: 600; color: var(--brand-700); white-space: nowrap; }

/* Related */
.rel-list { display: flex; flex-direction: column; gap: 8px; }
.rel-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; transition: border-color .12s, background .12s; }
.rel-item:hover { border-color: #cdeee8; background: var(--brand-50); text-decoration: none; }
.rel-item svg { width: 16px; height: 16px; fill: none; stroke: var(--brand); stroke-width: 1.7; }
.rel-item .ri-t { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.rel-item .ri-c { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }

/* Trilha de evidencias */
.trilha { display: flex; flex-direction: column; gap: 0; margin-top: 6px; }
.trilha-node { display: flex; gap: 16px; }
.trilha-rail { display: flex; flex-direction: column; align-items: center; }
.trilha-dot { width: 13px; height: 13px; border-radius: 50%; border: 3px solid var(--brand); background: #fff; flex-shrink: 0; margin-top: 4px; }
.trilha-line { width: 2px; flex: 1; background: var(--line); min-height: 20px; }
.trilha-body { padding-bottom: 20px; flex: 1; }
.trilha-body strong { display: block; font-size: 13.5px; color: var(--ink); }
.trilha-body span { font-size: 12.5px; color: var(--muted); }
.trilha-node:last-child .trilha-line { display: none; }

/* Notice / placeholder */
.notice {
  display: flex; gap: 14px; align-items: flex-start;
  border: 1px dashed #cadcd9; background: var(--brand-50);
  border-radius: var(--radius); padding: 18px 20px; color: var(--brand-700);
}
.notice svg { width: 22px; height: 22px; flex-shrink: 0; fill: none; stroke: var(--brand); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.notice strong { display: block; color: var(--ink); margin-bottom: 3px; }
.notice p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.ciencia { border: 1px solid var(--brand-100); background: var(--brand-50); border-radius: var(--radius); padding: 20px 22px; }
.ciencia-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.ciencia-head svg { width: 19px; height: 19px; fill: none; stroke: var(--brand); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ciencia-head strong { font-size: 15px; color: var(--ink); }
.ciencia p { margin: 0 0 16px; font-size: 13.5px; color: var(--ink-2); text-align: justify; }
.ciencia .btn svg { width: 16px; height: 16px; }
.cm-overlay { position: fixed; inset: 0; background: rgba(13,30,50,.5); display: none; align-items: flex-start; justify-content: center; padding: 9vh 18px 18px; z-index: 80; }
.cm-overlay.open { display: flex; }
.cm-panel { width: 100%; max-width: 520px; background: #fff; border-radius: 14px; box-shadow: var(--shadow-lg); padding: 22px 24px; }
.cm-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.cm-head strong { font-size: 17px; color: var(--ink); }
.cm-docref { margin: 0 0 16px; font-size: 13px; color: var(--brand-700); font-weight: 600; }
.cm-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin: 12px 0 5px; }
.cm-input { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; font-family: var(--sans); font-size: 14px; color: var(--ink); background: #fff; }
.cm-input:focus { outline: none; border-color: var(--brand-600); box-shadow: 0 0 0 3px var(--brand-100); }
.cm-checkline { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: 13px; color: var(--ink-2); line-height: 1.55; cursor: pointer; }
.cm-checkline input { margin-top: 3px; width: 15px; height: 15px; accent-color: var(--brand); flex-shrink: 0; }
.cm-msg { min-height: 20px; margin-top: 12px; font-size: 13px; }
.cm-msg .cm-err { color: #a33; }
.cm-msg .cm-ok { color: #1d7a3e; font-weight: 600; }
.cm-msg .cm-info { color: var(--muted); }
.cm-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
.cm-hint { margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; text-align: justify; text-justify: inter-word; }
.cm-quem { align-items: center; justify-content: space-between; gap: 10px; background: var(--brand-50); border: 1px solid var(--brand-100); border-radius: 9px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); }
.cm-quem strong { color: var(--brand-700); }
.cm-trocar { border: none; background: none; color: var(--brand-600); font-family: var(--sans); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 0; }
.cm-trocar:hover { text-decoration: underline; }
.btn.confirmado { background: #eaf6ee; border: 1px solid #bfe3cc; color: #1d7a3e; font-weight: 600; }
.btn.confirmado:hover { background: #ddefe4; }
.btn.confirmado svg { stroke: #1d7a3e; }
.rc-grid { display: flex; flex-direction: column; gap: 0; margin: 12px 0 6px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.rc-row { display: grid; grid-template-columns: 130px 1fr; gap: 14px; padding: 11px 14px; border-bottom: 1px solid var(--bg-soft); font-size: 13.5px; }
.rc-row:last-child { border-bottom: none; }
.rc-row span { color: var(--muted); }
.rc-row strong { color: var(--ink); font-weight: 600; word-break: break-word; }
.rc-proto { font-family: ui-monospace, Consolas, monospace; letter-spacing: .04em; color: var(--brand-700); }
.mc-box { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; padding: 20px 22px; margin-bottom: 24px; max-width: 640px; }
.mc-linha { display: flex; gap: 10px; align-items: center; }
.mc-linha .cm-input { flex: 1; }
.mc-head-ok { font-size: 14px; color: var(--ink-2); margin-bottom: 14px; }
.mc-table td, .mc-table th { font-size: 13px; }
@media (max-width: 640px) { .mc-linha { flex-direction: column; align-items: stretch; } .rc-row { grid-template-columns: 1fr; gap: 2px; } }

/* Evidence groups */
.ev-group { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
.ev-group-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: var(--bg-sidebar); border-bottom: 1px solid var(--line); }
.ev-group-head h3 { margin: 0; font-size: 16px; }
.ev-group-body { padding: 8px 20px 16px; }
.ev-sub { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line-2); font-size: 13.5px; color: var(--ink-2); }
.ev-sub:last-child { border-bottom: none; }
.ev-sub svg { width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 1.7; }

/* FAQ */
.faq-item { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; background: #fff; }
.faq-q { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 17px 20px; cursor: pointer; font-weight: 600; font-size: 15px; color: var(--ink); }
.faq-q:hover { background: var(--bg-soft); }
.faq-q .chev { transition: transform .2s; color: var(--muted); }
.faq-q .chev svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
.faq-item.open .faq-q .chev { transform: rotate(90deg); }
.faq-a { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
.faq-item.open .faq-a { max-height: 400px; }
.faq-a-inner { padding: 0 20px 18px; color: var(--ink-2); font-size: 14px; }

/* Stats strip */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 6px 0 4px; }
.stat { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; background: #fff; }
.stat .sn { font-family: var(--serif); font-size: 30px; font-weight: 600; color: var(--brand); line-height: 1; }
.stat .sl { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

/* Search overlay */
.search-overlay { position: fixed; inset: 0; background: rgba(11,16,21,.4); backdrop-filter: blur(3px); z-index: 100; display: none; padding-top: 90px; justify-content: center; }
.search-overlay.open { display: flex; }
.search-panel { width: min(640px, 92vw); background: #fff; border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; height: max-content; max-height: 70vh; display: flex; flex-direction: column; }
.search-panel-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.search-panel-head svg { width: 19px; height: 19px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.search-panel-head input { flex: 1; border: none; font-family: var(--sans); font-size: 16px; color: var(--ink); }
.search-panel-head input:focus { outline: none; }
.search-close { border: 1px solid var(--line); background: var(--bg-soft); border-radius: 6px; padding: 4px 9px; font-size: 11.5px; color: var(--muted); cursor: pointer; font-family: var(--sans); }
.search-results { overflow-y: auto; padding: 8px; }
.sr-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px; cursor: pointer; }
.sr-item:hover, .sr-item.sel { background: var(--brand-50); }
.sr-item .sr-ico { width: 30px; height: 30px; border-radius: 7px; background: var(--bg-soft); color: var(--brand); display: grid; place-items: center; flex-shrink: 0; }
.sr-item .sr-ico svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; }
.sr-item > span:not(.sr-ico):not(.sr-cat) { flex: 1; min-width: 0; }
.sr-item .sr-t { display: block; font-size: 14px; font-weight: 600; color: var(--ink); }
.sr-item .sr-c { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.sr-cat { margin-left: auto; font-size: 11px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .04em; }
.sr-empty { padding: 36px 18px; text-align: center; color: var(--muted); font-size: 14px; }
.sr-section-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-2); padding: 12px 14px 6px; }

/* Misc */
.muted { color: var(--muted); }
.spacer-lg { height: 14px; }
ul.clean { padding-left: 20px; margin: 8px 0; }
ul.clean li { margin-bottom: 7px; color: var(--ink-2); }

/* ===================== RESPONSIVE ===================== */
@media (max-width: 1080px) {
  .home-cols { grid-template-columns: 1fr; }
  .doc-layout { grid-template-columns: 1fr; }
  .meta-card { position: static; }
}
@media (max-width: 860px) {
  .menu-toggle { display: flex; }
  .topbar-search { display: none; }
  .topbar-meta { display: none; }
  .sidebar { transform: translateX(-100%); transition: transform .25s; }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
  .sidebar.open + .sidebar-backdrop { display: block; }
  .content { margin-left: 0; }
  .brand-text small { display: none; }
}
@media (max-width: 520px) {
  .content { padding: 24px 18px 70px; }
  .hero { padding: 32px 24px; }
}

  
/* ===== CSS dos comunicados, escopado sob .comunicado-body para nao colidir com o restante do hub ===== */
.comunicado-body @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap');
* {box-sizing:border-box;margin:0;padding:0}
.comunicado-body {--blue:#0a7a6b;
  --blue-light:#e2faf5;
  --blue-mid:#17b79e;
  --blue-dark:#0a5c50;
  --red:#A32D2D;
  --red-light:#FCEBEB;
  --amber:#BA7517;
  --amber-light:#FAEEDA;
  --green:#0F6E56;
  --green-light:#E1F5EE;
  --green-dark:#085041}
.comunicado-body .doc {font-family:"Urbanist",sans-serif;color:var(--color-text-primary);max-width:780px;margin:0 auto;padding:0 0 3rem}
.comunicado-body .hdr {border-bottom:3px solid var(--blue);padding-bottom:1.5rem;margin-bottom:0}
.comunicado-body .hdr-meta {font-family:"Urbanist",sans-serif;font-size:.8rem;font-weight:500;color:var(--color-text-secondary);letter-spacing:.06em;text-transform:uppercase;margin-bottom:1rem;padding-top:1.5rem;text-align:center}
.comunicado-body .hdr-title {font-family:"Urbanist",serif;font-size:2rem;font-weight:700;line-height:1.2;color:var(--color-text-primary);margin-bottom:.5rem}
.comunicado-body .hdr-title em {font-style:italic;color:var(--blue);font-weight:400}
.comunicado-body .hdr-subtitle {font-family:"Urbanist",serif;font-style:italic;font-size:1rem;color:var(--color-text-secondary);line-height:1.6;text-align:justify}
.comunicado-body .uso-badge {display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;background:var(--blue-light);color:var(--blue-dark);border:0.5px solid #bdeee5;padding:3px 10px;border-radius:3px;margin-bottom:1rem}
.comunicado-body .norma-bar {background:var(--color-background-secondary);border-left:3px solid var(--blue);padding:.9rem 1.2rem;margin:1.5rem 0;border-radius:0 8px 8px 0}
.comunicado-body .norma-bar-title {font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:.55rem}
.comunicado-body .norma-list {display:block;line-height:2}
.comunicado-body .norma-tag {font-size:11px;font-family:"Urbanist",monospace;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);padding:3px 8px;border-radius:3px;display:inline-block;margin:2px 4px 2px 0}
.comunicado-body .section {margin:2rem 0}
.comunicado-body .section-header {display:flex;align-items:center;gap:12px;margin-bottom:1.1rem}
.comunicado-body .section-num {font-family:"Urbanist",monospace;font-size:11px;color:var(--blue);font-weight:600;background:var(--blue-light);padding:2px 7px;border-radius:3px;flex-shrink:0}
.comunicado-body .section-title {font-family:"Urbanist",serif;font-size:1.15rem;font-weight:600;color:var(--color-text-primary)}
.comunicado-body .divider {height:1px;background:#c8cdd2;margin:1.8rem 0}
.comunicado-body .body-p {font-size:.93rem;line-height:1.78;color:var(--color-text-primary);margin-bottom:1rem;text-align:justify}
.comunicado-body .body-p strong {font-weight:600}
.comunicado-body .callout-blue {border-left:2px solid var(--blue-mid);padding:.9rem 1.2rem;background:var(--blue-light);border-radius:0 8px 8px 0;margin:1.2rem 0}
.comunicado-body .callout-blue p {font-size:.9rem;line-height:1.72;color:var(--blue-dark);text-align:justify}
.comunicado-body .callout-blue p strong {font-weight:600;color:var(--blue-dark)}
.comunicado-body .callout-amber {border-left:2px solid var(--amber);padding:.9rem 1.2rem;background:var(--amber-light);border-radius:0 8px 8px 0;margin:1.2rem 0}
.comunicado-body .callout-amber p {font-size:.9rem;line-height:1.72;color:#412402;text-align:justify}
.comunicado-body .callout-red {border-left:2px solid var(--red);padding:.9rem 1.2rem;background:var(--red-light);border-radius:0 8px 8px 0;margin:1.2rem 0}
.comunicado-body .callout-red p {font-size:.9rem;line-height:1.72;color:#501313;text-align:justify}
.comunicado-body .fases-grid {display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:1.2rem 0}
.comunicado-body .fase-card {border:0.5px solid var(--color-border-tertiary);border-radius:10px;padding:1rem 1.1rem;background:var(--color-background-primary);border-top:2px solid var(--blue)}
.comunicado-body .fase-label {font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--blue);margin-bottom:.5rem}
.comunicado-body .fase-head {font-size:.9rem;font-weight:600;color:var(--color-text-primary);margin-bottom:.35rem}
.comunicado-body .fase-body {font-size:.82rem;color:var(--color-text-secondary);line-height:1.6}
.comunicado-body .flags-grid {display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:1.2rem 0}
.comunicado-body .flags-col {}
.comunicado-body .flags-col-head {font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--blue);background:var(--blue-light);padding:.4rem .8rem;border-radius:4px 4px 0 0;border:0.5px solid #bdeee5;margin-bottom:0}
.comunicado-body .flags-list {border:0.5px solid var(--color-border-tertiary);border-top:none;border-radius:0 0 8px 8px;overflow:hidden}
.comunicado-body .flag-item {display:flex;align-items:flex-start;gap:.625rem;padding:.55rem .875rem;border-bottom:.5px solid var(--color-border-tertiary);font-size:.85rem;color:var(--color-text-primary);line-height:1.55}
.comunicado-body .flag-item:last-child {border-bottom:none}
.comunicado-body .flag-dot {width:6px;height:6px;background:var(--blue-mid);border-radius:50%;flex-shrink:0;margin-top:.4rem}
.comunicado-body .caso-box {background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:1rem 1.1rem;margin:1.2rem 0}
.comunicado-body .caso-label {font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--color-text-secondary);margin-bottom:.625rem}
.comunicado-body .caso-situacao {font-size:.87rem;color:var(--color-text-primary);line-height:1.65;margin-bottom:.5rem;text-align:justify}
.comunicado-body .caso-resultado {font-size:.87rem;color:var(--red);font-weight:600;line-height:1.6}
.comunicado-body .proto-flow {display:flex;gap:0;margin:1.1rem 0;overflow-x:auto}
.comunicado-body .proto-step {flex:1;min-width:120px;padding:.8rem .9rem;border:0.5px solid var(--color-border-tertiary);border-right:none;background:var(--color-background-primary);position:relative}
.comunicado-body .proto-step:last-child {border-right:0.5px solid var(--color-border-tertiary);border-radius:0 8px 8px 0}
.comunicado-body .proto-step:first-child {border-radius:8px 0 0 8px}
.comunicado-body .proto-num {font-family:"Urbanist",monospace;font-size:11px;color:var(--blue);font-weight:600;margin-bottom:4px}
.comunicado-body .proto-label {font-size:.8rem;font-weight:500;color:var(--color-text-primary);margin-bottom:3px;line-height:1.35}

/* seletor de idioma */
.lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff;flex:none;margin-left:10px}
.lang-switch button{border:0;background:transparent;padding:4px 11px;border-radius:999px;font:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.lang-switch button[aria-pressed="true"]{background:var(--brand-700);color:#fff}
.topbar-right{display:flex;align-items:center;margin-left:auto}
.brand-logo{height:34px;width:auto;display:block}
.faq-q{cursor:pointer}
.trn-bar{display:flex;flex-wrap:wrap;gap:10px 22px;padding:12px 18px;margin-bottom:18px;background:var(--brand-50);border:1px solid var(--brand-100);border-radius:12px;font-size:13.5px;color:var(--brand-700);font-weight:500}
.trn-bar span{display:inline-flex;align-items:center;gap:8px}
.trn-bar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.trn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}
.trn-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;transition:border-color .15s,box-shadow .15s}
.trn-card:hover{border-color:#cdeee8;box-shadow:var(--shadow-sm)}
.trn-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.trn-mes{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--brand-700);letter-spacing:.04em}
.trn-card h3{margin:0 0 12px;font-size:15px;font-weight:600;line-height:1.3;color:var(--ink);min-height:58px}
.trn-lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-bottom:6px}
.trn-list{margin:0 0 14px;padding-left:17px;font-size:13px;color:var(--ink-2);line-height:1.6}
.trn-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.trn-foot b{color:var(--ink);font-weight:600}
.ob-card{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.4}
.ob-n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--brand-100);color:var(--brand-700);font-size:12px;font-weight:700;display:grid;place-items:center}
@media (max-width:1280px){.trn-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.trn-card h3{min-height:0}}
@media (max-width:760px){.trn-grid{grid-template-columns:1fr}}
@media (max-width:520px){.brand-text{display:none}.lang-switch{margin-left:4px}.lang-switch button{padding:4px 8px}.topbar{gap:8px;padding:0 12px}}
.quick-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.quick-card strong{min-height:36px}

/* =========================================================
   CAMADA DE DESIGN VELARO (linguagem visual do site institucional)
   Painéis escuros, rótulos em mono, destaque serifado em itálico,
   lima + turquesa, linhas do tempo e cantos generosos.
   ========================================================= */
:root{
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif-it:"Instrument Serif","Playfair Display",Georgia,"Times New Roman",serif;
  --lime:#C6F034; --teal:#17B79E; --ink-d:#0B1015; --panel:#0B1015; --panel-2:#101A20;
  --radius:16px; --bg:#F4F7F6;
  --shadow-sm:0 1px 2px rgba(11,16,21,.04),0 2px 8px rgba(11,16,21,.04);
  --shadow-md:0 10px 30px rgba(11,16,21,.09);
}
body{background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.content{background:transparent}
::selection{background:var(--lime);color:var(--ink-d)}

/* ---------- animação de entrada ---------- */
@keyframes vRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.content>*{animation:vRise .55s cubic-bezier(.2,.7,.2,1) both}
.content>*:nth-child(2){animation-delay:.05s}.content>*:nth-child(3){animation-delay:.1s}
.content>*:nth-child(4){animation-delay:.15s}.content>*:nth-child(5){animation-delay:.2s}
.content>*:nth-child(n+6){animation-delay:.25s}

/* ---------- topbar ---------- */
.topbar{background:rgba(255,255,255,.78);backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid rgba(11,16,21,.06)}
.brand-text{border-left:1px solid var(--line);padding-left:14px}
.brand-text strong{font-weight:700;letter-spacing:-.02em}
.brand-text small{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.topbar-search input{border-radius:999px;border:1px solid transparent;background:#EEF3F1;padding:11px 18px 11px 46px;box-shadow:none}
.topbar-search input:hover{border-color:var(--line);background:#fff}
.topbar-search input:focus{background:#fff;border-color:var(--teal);box-shadow:0 0 0 4px rgba(23,183,158,.14)}
.topbar-search svg{stroke:var(--muted)}
.topbar-search kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:7px}
.lang-switch{background:#EEF3F1;border:0;padding:3px}
.lang-switch button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;transition:background .2s,color .2s}
.lang-switch button[aria-pressed="true"]{background:var(--ink-d);color:var(--lime)}

/* ---------- sidebar ---------- */
.sidebar{background:#fff;border-right:1px solid rgba(11,16,21,.06)}
.nav{padding:16px 14px}
.nav-group-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted-2);padding:20px 12px 8px}
.nav-item{border-radius:12px;padding:10px 12px;font-weight:500;transition:background .18s,color .18s,transform .18s}
.nav-item:hover{background:#EEF3F1;color:var(--ink-d)}
.nav-item.active{background:var(--ink-d);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(11,16,21,.18)}
.nav-item.active svg{stroke:var(--lime);opacity:1}
.nav-item.no-ico.active{position:relative}
.nav-item.no-ico.active::before{content:"";position:absolute;left:16px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--lime)}
.nav-tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;background:transparent;border:1px solid var(--line);color:var(--muted)}
.sidebar-footer{border-top:1px solid rgba(11,16,21,.06)}
.sidebar-footer p{font-weight:700}
.sidebar-footer small{font-family:var(--mono);font-size:10px;letter-spacing:.04em}

/* ---------- cabeçalhos de página ---------- */
.crumb{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}
.page-head{margin-bottom:34px}
.page-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--teal);display:flex;align-items:center;gap:10px}
.page-eyebrow::before{content:"";width:22px;height:1px;background:var(--teal)}
.page-title{font-weight:700;font-size:clamp(34px,4.6vw,54px);letter-spacing:-.035em;line-height:1.02;margin-bottom:16px}
.page-lead{max-width:760px;text-align:left;color:var(--muted);font-size:16.5px}
h2.sec-title{font-weight:700;font-size:24px;letter-spacing:-.025em;margin:52px 0 18px}

/* ---------- hero ---------- */
.hero{border-radius:30px;padding:56px 56px 52px;margin-bottom:12px;color:#fff;
  background:
   radial-gradient(70% 90% at 92% -10%,rgba(23,183,158,.30),transparent 60%),
   radial-gradient(50% 70% at 0% 110%,rgba(198,240,52,.10),transparent 60%),
   var(--ink-d);
  box-shadow:0 30px 60px -30px rgba(11,16,21,.55)}
.hero-grid{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.2px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(80% 90% at 85% 20%,#000 0%,transparent 70%);mask-image:radial-gradient(80% 90% at 85% 20%,#000 0%,transparent 70%)}
.hero-arc{position:absolute;right:36px;top:46%;width:520px;max-width:46%;transform:translateY(-50%);pointer-events:none;overflow:visible}
.hero-inner{max-width:640px}
.hero-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:12px;margin-bottom:22px}
.hero-eyebrow::before{content:"";width:26px;height:1px;background:var(--teal)}
.hero h1{font-weight:700;font-size:clamp(40px,6vw,76px);line-height:.98;letter-spacing:-.045em;margin:0 0 22px}
.hero h1 em{font-family:var(--serif-it);font-style:italic;font-weight:400;letter-spacing:-.02em;color:#5ED8A8;padding-right:.04em}
.hero p{max-width:540px;text-align:left;font-size:17px;line-height:1.6;color:rgba(255,255,255,.7);margin-bottom:34px}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;max-width:600px;margin-bottom:34px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:20px;overflow:hidden;backdrop-filter:blur(8px)}
.hero-stat{flex-direction:column-reverse;align-items:flex-start;gap:10px;padding:20px 24px;border-right:1px solid rgba(255,255,255,.08)}
.hero-stat:last-child{border-right:0}
.hs-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.46);max-width:none}
.hs-num{font-family:var(--sans);font-weight:700;font-size:44px;letter-spacing:-.04em;color:#fff}
.hero-actions{gap:12px}
.hero-btn{border-radius:999px;padding:13px 24px;font-size:14px;font-weight:700;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s}
.hero-btn.primary{background:var(--lime);color:#14200A}
.hero-btn.primary:hover{background:#D5F65C;transform:translateY(-2px);box-shadow:0 12px 30px -8px rgba(198,240,52,.55)}
.hero-btn.ghost{border:1px solid rgba(255,255,255,.28);color:#fff}
.hero-btn.ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.5);transform:translateY(-2px)}
.hero-link{font-weight:600;padding:0 6px}
.hero-link svg{transition:transform .2s}.hero-link:hover svg{transform:translateX(4px)}

/* ---------- atalhos rápidos ---------- */
.quick-grid{gap:16px}
.quick-card{border-radius:20px;border:1px solid rgba(11,16,21,.07);padding:22px;gap:14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s}
.quick-card::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(198,240,52,.35),transparent);opacity:0;transition:opacity .3s}
.quick-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:rgba(23,183,158,.35)}
.quick-card:hover::after{opacity:1}
.quick-card .qc-ico{width:46px;height:46px;border-radius:14px;background:var(--ink-d);color:var(--lime);transition:background .25s,color .25s}
.quick-card:hover .qc-ico{background:var(--lime);color:var(--ink-d)}
.quick-card strong{font-size:15px;font-weight:700;letter-spacing:-.01em}
.quick-card span:not(.qc-ico){font-size:13px}

/* ---------- colunas da home ---------- */
.home-cols{gap:28px}
.notice{border-radius:20px;background:#fff;border:1px dashed #BFD3CE;padding:20px 22px}
.notice svg{stroke:var(--teal)}
.tl-panel{position:relative;background:var(--ink-d);color:#fff;border-radius:26px;padding:14px 12px;overflow:hidden;box-shadow:0 24px 50px -28px rgba(11,16,21,.6)}
.tl-panel::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(198,240,52,.16),transparent)}
.tl-row{position:relative;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:16px;padding:16px 14px;border-radius:18px;color:#fff;transition:background .2s}
.tl-row:hover{background:rgba(255,255,255,.05);text-decoration:none}
.tl-row:not(:last-child)::after{content:"";position:absolute;left:33px;top:56px;bottom:-12px;width:2px;background:linear-gradient(var(--lime),rgba(23,183,158,.25));opacity:.55}
.tl-n{width:38px;height:38px;border-radius:50%;background:var(--lime);color:#14200A;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;position:relative;z-index:1}
.tl-body strong{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.3;color:#fff}
.tl-body span{display:block;margin-top:4px;font-size:13px;line-height:1.5;color:rgba(255,255,255,.58)}
.tl-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;white-space:nowrap}
.tl-meta b{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--lime);letter-spacing:.04em}
.tl-panel .badge{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.78)}
.tl-panel .badge.vigente{border-color:var(--lime);color:var(--lime)}

/* ---------- comunicados (linha do tempo) ---------- */
#comList{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:36px}
#comList::before{content:"";position:absolute;left:11px;top:22px;bottom:22px;width:2px;background:linear-gradient(var(--teal),rgba(23,183,158,.12));border-radius:2px}
.com-card{position:relative;border-radius:20px;border:1px solid rgba(11,16,21,.07);border-left:1px solid rgba(11,16,21,.07);background:#fff;padding:20px 24px;box-shadow:var(--shadow-sm);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s}
#comList .com-card::before{content:"";position:absolute;left:-33px;top:26px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--teal);box-sizing:border-box}
#comList .com-card.st-publicado::before{background:var(--lime);border-color:var(--lime);box-shadow:0 0 0 5px rgba(198,240,52,.25)}
.com-card:hover{transform:translateX(4px);box-shadow:var(--shadow-md);border-color:rgba(23,183,158,.35);text-decoration:none}
.com-head{gap:10px;margin-bottom:12px}
.com-num{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;background:var(--ink-d);color:var(--lime);padding:5px 10px;border-radius:8px}
.com-date{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}
.com-card h3{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.com-card p{font-size:14px;line-height:1.55}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;border-radius:7px}
.badge{border-radius:999px;font-weight:600}
.filters select,.filters input[type=search]{border-radius:12px;border-color:var(--line);background:#fff}
.filters label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}

/* ---------- treinamentos ---------- */
.trn-grid{gap:16px}
.trn-card{position:relative;overflow:hidden;border-radius:24px;border:1px solid rgba(11,16,21,.07);padding:22px 20px 18px;box-shadow:var(--shadow-sm);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s}
.trn-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--lime),var(--teal))}
.trn-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:rgba(23,183,158,.35)}
.trn-card .tag{background:var(--ink-d);color:var(--lime);border:0;font-weight:700;font-size:11.5px;padding:6px 10px;border-radius:9px}
.trn-mes{font-family:var(--mono);font-size:11px;color:var(--teal)}
.trn-card h3{font-weight:700;font-size:16.5px;letter-spacing:-.02em;line-height:1.28}
.trn-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em}
.trn-list li::marker{color:var(--teal)}
.trn-list{line-height:1.7}
.trn-foot{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}
.trn-foot b{font-family:var(--sans);font-size:13px}
.ob-card{border-radius:18px;border:1px solid rgba(11,16,21,.07);padding:16px 18px;box-shadow:var(--shadow-sm);align-items:center;transition:transform .25s,box-shadow .25s}
.ob-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.ob-n{width:30px;height:30px;background:var(--ink-d);color:var(--lime);font-family:var(--mono);font-weight:700;font-size:12px}

/* ---------- listas (marco regulatório etc.) ---------- */
.doc-list{border-radius:22px;border:1px solid rgba(11,16,21,.07);box-shadow:var(--shadow-sm)}
.doc-row{transition:background .18s,padding-left .18s}
a.doc-row:hover{background:#F3F8F6}
.doc-row .dr-ico{background:var(--ink-d);color:var(--lime);border-radius:12px;width:40px;height:40px}
.doc-row .dr-ico svg{stroke:currentColor}
.dr-title{font-weight:700;letter-spacing:-.01em}

/* ---------- glossário ---------- */
.gloss-letra{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.1em;color:var(--teal);border-bottom:1px solid var(--line);padding:26px 0 8px}
.gloss-item dt{font-weight:700;letter-spacing:-.01em}
.gloss-item dd{text-align:left}

/* ---------- FAQ ---------- */
.faq-item{border-radius:18px;border:1px solid rgba(11,16,21,.07);background:#fff;box-shadow:var(--shadow-sm);transition:border-color .2s,box-shadow .2s}
.faq-item:hover{border-color:rgba(23,183,158,.35)}
.faq-item.open{border-color:var(--teal);box-shadow:var(--shadow-md)}
.faq-q{font-weight:700;letter-spacing:-.01em;padding:20px 24px}
.faq-q .chev{width:30px;height:30px;border-radius:50%;background:#EEF3F1;display:grid;place-items:center;transition:transform .25s,background .25s}
.faq-item.open .faq-q .chev{background:var(--lime);color:var(--ink-d)}
.faq-a-inner{padding:0 24px 22px;line-height:1.7}

/* ---------- overlays ---------- */
.search-panel{border-radius:24px}
.cm-panel{border-radius:26px}
.sr-cat{font-family:var(--mono);font-size:10px;letter-spacing:.08em}

/* ---------- responsivo ---------- */
@media (max-width:1180px){.hero-arc{opacity:.5}}
@media (max-width:980px){.hero-arc{display:none}.hero-inner{max-width:none}}
@media (max-width:720px){
  .hero{border-radius:24px;padding:34px 24px}
  .hero-stat{padding:16px 14px}.hs-num{font-size:34px}.hs-lbl{font-size:9px;letter-spacing:.1em}
  .tl-row{grid-template-columns:34px minmax(0,1fr);gap:12px}
  .tl-meta{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start}
  .tl-row:not(:last-child)::after{left:31px}
  .tl-n{width:34px;height:34px}
  #comList{padding-left:28px}#comList::before{left:7px}#comList .com-card::before{left:-27px}
  .com-card{padding:18px}
}
@media (prefers-reduced-motion:reduce){.content>*{animation:none}.hero-arc .dot{display:none}*{transition:none!important}}
.com-card h3{color:var(--ink-d)}
.com-card:hover h3{color:var(--brand-700)}
.com-card p{color:var(--muted)}

/* ===== fundo do hero inspirado na capa do plano ===== */
.hero{
  background:
    radial-gradient(60% 80% at 100% 0%,rgba(23,183,158,.26),transparent 62%),
    radial-gradient(70% 90% at 90% 110%,rgba(23,183,158,.22),transparent 65%),
    linear-gradient(135deg,#0A171C 0%,#0B2227 48%,#0E3A3B 100%);
}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:44px 44px;

.tl-panel::before{content:"";position:absolute;inset:0;right:auto;top:auto;width:auto;height:auto;border-radius:inherit;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 70%);mask-image:linear-gradient(90deg,transparent 0%,#000 70%)}
.tl-row{z-index:1}
.tl-row:hover{background:rgba(255,255,255,.06)}
.tl-n{background:var(--lime);color:#14200A}
.tl-body strong{font-family:var(--sans);font-weight:700;letter-spacing:-.01em}

/* chips e ícones em verde suave (no lugar do preto) */
:root{--mint:rgba(23,183,158,.13);--mint-ink:#0B6F60}
.quick-card .qc-ico{background:var(--mint);color:var(--mint-ink)}
.quick-card:hover .qc-ico{background:var(--teal);color:#fff}
.com-num,.trn-card .tag,.ob-n{background:var(--mint);color:var(--mint-ink)}
.lang-switch button[aria-pressed="true"]{background:#fff;color:var(--mint-ink);box-shadow:0 1px 4px rgba(11,16,21,.14)}
.faq-item.open .faq-q .chev{background:var(--teal);color:#fff}
.tl-panel .tl-n{background:var(--lime);color:#14200A}

/* números clicáveis */
a.hero-stat{position:relative;color:inherit;text-decoration:none;display:flex;transition:background .2s}
a.hero-stat:hover{background:rgba(255,255,255,.07);text-decoration:none}
.hs-go{position:absolute;right:16px;top:16px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);transition:background .2s,transform .2s}
.hs-go svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
a.hero-stat:hover .hs-go{background:var(--lime);transform:translateX(2px)}
a.hero-stat:hover .hs-go svg{stroke:#14200A}
.hero-btn.primary svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;margin-right:2px}
.hero-btn.primary{display:inline-flex;align-items:center;gap:8px}
.hs-go{top:auto;bottom:16px}

/* números: sem animação, apenas link */
a.hero-stat,a.hero-stat:hover{background:transparent;transition:none}
.hs-go,a.hero-stat:hover .hs-go{transition:none;transform:none;background:rgba(255,255,255,.08)}
a.hero-stat:hover .hs-go svg{stroke:#fff}

/* três botões idênticos em tamanho */
.hero-actions .hero-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;box-sizing:border-box;height:46px;min-width:196px;padding:0 22px;font-size:13.5px;line-height:1;border-radius:999px;white-space:nowrap}
.hero-actions .hero-btn svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin:0}
.hero-actions .hero-btn.ghost{border:1px solid rgba(255,255,255,.28)}
@media (max-width:720px){.hero-actions .hero-btn{min-width:0;flex:1 1 100%}}
.hero-actions .hero-btn{width:226px;min-width:0;padding:0 16px}
@media (max-width:720px){.hero-actions .hero-btn{width:100%;flex:1 1 100%}}

/* botões e números no mesmo quadrante (mesma largura) e visual idêntico */
.hero-stats,.hero-actions{width:min(100%,660px);max-width:660px;box-sizing:border-box}
.hero-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hero-actions .hero-btn,.hero-actions .hero-btn.primary,.hero-actions .hero-btn.ghost{width:100%;min-width:0;height:48px;padding:0 12px;font-size:13px;
  background:rgba(255,255,255,.05);color:#fff;border:1px solid rgba(255,255,255,.26);box-shadow:none;transform:none}
.hero-actions .hero-btn svg{stroke:var(--lime)}
.hero-actions .hero-btn:hover,.hero-actions .hero-btn.primary:hover,.hero-actions .hero-btn.ghost:hover{background:rgba(255,255,255,.12);border-color:rgba(198,240,52,.6);transform:none;box-shadow:none}
@media (max-width:720px){.hero-actions{grid-template-columns:1fr}.hero-actions .hero-btn{flex:none}}
.hero-stats,.hero-actions{width:min(100%,600px);max-width:600px}
.hero-arc{width:370px;max-width:34%;right:36px}
.hero-actions .hero-btn{gap:7px;padding:0 8px;font-size:12.5px}
@media (max-width:1380px){.hero-arc{display:none}}

/* próximos passos (preenche a base da área do corredor) */
.hero-arc{top:44px;transform:none}
.hero-next{position:absolute;right:36px;bottom:40px;width:min(370px,34%);z-index:1;border-radius:18px;background:rgba(8,24,28,.55);border:1px solid rgba(255,255,255,.1);overflow:hidden}
.nx-row{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;text-decoration:none}
.nx-row+.nx-row{border-top:1px solid rgba(255,255,255,.08)}
.nx-row:hover{text-decoration:none}
.nx-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nx-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);display:flex;gap:10px}
.nx-lbl b{font-weight:600;color:var(--lime)}
.nx-title{font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx-go{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.nx-go svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:1380px){.hero-next{display:none}}
.hero-next{width:min(412px,37%)}
.hero-arc{width:412px;max-width:37%}
.nx-title{font-size:12.5px}
.hero-arc{width:380px;max-width:34%;right:52px;top:30px}

/* próximos passos: leve, sem caixa, com bullets */
.hero-next{background:none;border:0;border-radius:0;overflow:visible;padding:0 0 0 6px;width:min(412px,37%)}
.nx-row{position:relative;padding:8px 0 8px 26px;gap:10px}
.nx-row+.nx-row{border-top:0}
.nx-row::before{content:"";position:absolute;left:0;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(198,240,52,.14)}
.nx-row+.nx-row::before{background:var(--teal);box-shadow:0 0 0 4px rgba(23,183,158,.16)}
.nx-row:not(:last-child)::after{content:"";position:absolute;left:4px;top:calc(50% + 10px);bottom:-8px;width:1px;background:rgba(255,255,255,.16)}
.nx-lbl{font-size:9px;color:rgba(255,255,255,.42)}
.nx-lbl b{font-weight:500;color:rgba(198,240,52,.85)}
.nx-row+.nx-row .nx-lbl b{color:rgba(94,216,168,.9)}
.nx-title{font-size:12.5px;font-weight:500;color:rgba(255,255,255,.82)}
.nx-row:hover .nx-title{color:#fff}
.nx-go{background:none;width:16px;height:16px}
.nx-go svg{width:12px;height:12px;stroke:rgba(255,255,255,.45)}

/* biblioteca de políticas (padrão FAQ/Marco) */
.pol-list{background:#fff;border:1px solid rgba(11,16,21,.07);border-radius:20px;box-shadow:var(--shadow-sm);overflow:hidden}
.pol-row{display:flex;align-items:center;gap:24px;padding:20px 24px}
.pol-row+.pol-row{border-top:1px solid rgba(11,16,21,.06)}
.pol-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pol-title{font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink-d)}
.pol-desc{font-size:14px;line-height:1.55;color:var(--muted)}
.pol-meta{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--teal);margin-top:2px}
.pol-actions{display:flex;gap:8px;flex:none}
.pol-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 8px;border-radius:999px;border:1px solid rgba(11,16,21,.1);background:#fff;color:var(--ink-d);font-size:13px;font-weight:600;text-decoration:none;transition:background .18s,border-color .18s}
.pol-btn b{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;background:var(--mint);color:var(--mint-ink);border-radius:999px;padding:5px 8px}
.pol-btn:hover{background:#F3F8F6;border-color:rgba(23,183,158,.45);text-decoration:none}
@media (max-width:720px){.pol-row{flex-direction:column;align-items:flex-start;gap:14px;padding:18px}}

/* Início: duas colunas em grade única, cartões alinhados linha a linha */
@media (min-width:1081px){
  .home-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto repeat(4,1fr);grid-auto-flow:row dense;gap:14px 30px;align-items:stretch}
  .home-cols>div{display:contents}
  .home-cols .com-list{display:contents}
  .home-cols>div:first-child>h2,.home-cols>div:first-child .com-card,.home-cols>div:first-child .notice{grid-column:1}
  .home-cols>div:last-child>h2,.home-cols>div:last-child .com-card,.home-cols>div:last-child .notice{grid-column:2}
  .home-cols>div>h2.sec-title{margin:0 0 2px}
  .home-cols .com-card{display:flex;flex-direction:column;justify-content:center;min-height:0}
  .home-cols .com-card:hover{transform:none}
}

/* página de política (mesmo padrão, identidade Velaro) */
.doc-title-block h1,.doc-section h2{font-family:var(--sans);font-weight:700;letter-spacing:-.025em}
.doc-title-block h1{font-size:clamp(28px,3.4vw,40px);line-height:1.08}
.doc-section h2{font-size:21px;margin-top:6px}
.doc-section h3{font-size:15.5px}
.doc-section ol.doc-ul{margin:0 0 14px;padding-left:22px}
.doc-section ol.doc-ul li{margin:0 0 7px;color:var(--ink-2);line-height:1.6;text-align:justify}
.doc-img{display:block;max-width:100%;height:auto;margin:14px 0 18px;border:1px solid rgba(11,16,21,.1);border-radius:12px}
.meta-card{border-radius:20px;background:#fff;border-color:rgba(11,16,21,.07);box-shadow:var(--shadow-sm)}
.meta-card h4{font-family:var(--mono);letter-spacing:.14em;font-size:10.5px}
.code-chip{font-family:var(--mono);background:var(--mint);color:var(--mint-ink);border:0;border-radius:8px;padding:4px 9px;font-size:11px}
.rel-item{border-radius:14px}
.rel-item:hover{border-color:rgba(23,183,158,.45);background:#F3F8F6}
.rel-item svg{stroke:var(--teal)}
.vtable{border-radius:14px}
.btn{border-radius:999px;height:40px}
.btn:hover{border-color:rgba(23,183,158,.45);background:#F3F8F6;color:var(--mint-ink)}
.pol-meta{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--teal);margin-top:2px}
@media (max-width:1080px){.doc-layout{grid-template-columns:1fr}.meta-card{position:static}}
.rel-item svg{width:16px;height:16px;flex:none;fill:none;stroke-width:2}
.doc-main{min-width:0}
.doc-img,.doc-section table{max-width:100%}
.doc-section .vtable{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:700px){.doc-section .vtable th,.doc-section .vtable td{white-space:normal;padding:10px 10px;font-size:12.5px}.doc-section .vtable{display:table;width:100%;table-layout:fixed}}
a.com-card[href^="#/doc"] h3{display:flex;align-items:center;justify-content:space-between;gap:12px}
.t-go{flex:none;width:28px;height:28px;border-radius:50%;background:var(--mint);display:inline-flex;align-items:center;justify-content:center;transition:background .15s}
.t-go svg{width:14px;height:14px;stroke:var(--mint-ink);fill:none;stroke-width:2.2}
a.com-card[href^="#/doc"]:hover .t-go{background:var(--teal)}
a.com-card[href^="#/doc"]:hover .t-go svg{stroke:#fff}
.rel-item .ri-t{display:block}
.read-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3,#5b6670);margin-left:4px}
.read-chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.plan-row .ref-title{color:var(--ink-2)}
.plan-row{cursor:default}
.ref-main .pol-meta{display:inline-block}
.ref-main .read-chip{margin-left:12px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:#7A858E}
.pol-line{display:flex;align-items:center;flex-wrap:wrap;gap:4px 0;margin-top:2px}
.pol-line .pol-meta{margin-top:0}
.pol-line .read-chip{margin-left:14px;display:inline-flex}
.pol-line .read-chip svg{width:13px;height:13px}
.plan-lead{max-width:none;width:100%;margin:-6px 0 14px;text-align:justify;text-justify:inter-word;line-height:1.65}
.lib-foot{margin:18px 4px 0;font-size:13px;color:#7A858E;line-height:1.6}
.plan-row .ref-title{color:var(--ink)}
.plan-row .badge{flex:none}
.plan-title{margin-top:40px}

const POL_CONTENT = {"codigo-de-conduta":{"pt":[{"t":"Mensagem da Administração","blocks":[{"p":"Na Velaro, acreditamos que ética e integridade não são apenas princípios abstratos, mas fundamentos indispensáveis para a construção e a continuidade de nossa história. Atuamos em um setor dinâmico e em constante transformação, no qual tecnologia, finanças e pessoas se conectam de forma inédita. Esse contexto exige padrões elevados de conduta, responsabilidade e transparência."},{"p":"Este Código de Conduta reflete mais do que regras: traduz os valores que orientam nossas escolhas, moldam nossa cultura e sustentam a confiança depositada em nós por clientes, parceiros, investidores e pela sociedade em geral."},{"p":"Convidamos cada colaborador, fornecedor e parceiro a adotar este Código como referência diária de comportamento. Ao fazê-lo, não apenas protegemos a reputação da Velaro, mas também fortalecemos nossa credibilidade, ampliamos o impacto positivo de nossas ações e asseguramos um crescimento sustentável, sólido e responsável."},{"st":"Alta Administração Velaro"}]},{"t":"1. Introdução e Objetivo","blocks":[{"p":"O presente Código de Conduta define os princípios e padrões de comportamento esperados de todas as pessoas que atuam em nome da Velaro Network (“Empresa” ou “Velaro”), em qualquer nível hierárquico ou função. Seu objetivo é orientar nossas atividades, assegurando que cada decisão esteja alinhada à ética, à integridade e à transparência."},{"st":"A Velaro espera de todos os seus colaboradores e parceiros:"},{"itens":["Atuar com honestidade, diligência e profissionalismo em todas as circunstâncias;","Cumprir as leis, normas e regulamentos aplicáveis, nacionais e internacionais, além das melhores práticas de mercado;","Tratar clientes, fornecedores e demais partes interessadas de forma justa, responsável e respeitosa."]},{"p":"Este Código reflete ainda o compromisso da Velaro em aplicar as melhores práticas internacionais de governança e compliance, adaptadas às especificidades da indústria de ativos digitais e da tecnologia blockchain."}]},{"t":"2. Princípios e Valores da Velaro","blocks":[{"p":"Os valores da empresa definem a forma como conduzimos nossos negócios, orientam nossas decisões estratégicas e moldam a maneira como nos relacionamos com colaboradores, clientes, parceiros e a sociedade.. Esses valores dialogam com os princípios estabelecidos na Lei nº 14.478/2022 e com a regulamentação aplicável ao setor de ativos virtuais, assegurando que nosso crescimento seja sempre responsável, sustentável e em conformidade com os mais altos padrões regulatórios e de governança. A seguir, destacam-se os principais princípios que norteiam nossas atividades:"},{"itens":["Conformidade regulatória: cumprimento das legislações aplicáveis, manutenção de controles internos eficazes e realização de auditorias periódicas.","Governança e responsabilização: decisões transparentes, segregação de funções, clareza de papéis e gestores comprometidos com padrões éticos.","Proteção ao cliente: fornecimento de informações claras sobre serviços, riscos e custos, além da segregação patrimonial e custódia segura de ativos.","Gestão de riscos e segurança: identificação e monitoramento contínuo de riscos operacionais, tecnológicos e legais, com políticas de prevenção a fraudes e crimes financeiros.","Transparência: comunicação acessível e prestação de contas a clientes, parceiros, autoridades e sociedade.","Integridade nas relações: atuação honesta, justa e respeitosa em todas as interações internas e externas.","Inovação responsável: desenvolvimento e adoção de tecnologias seguras, sustentáveis e alinhadas ao impacto social e regulatório."]}]},{"t":"3. Escopo e Destinatários","blocks":[{"p":"Este Código de Conduta aplica-se a todos que representam ou atuam em nome da Velaro: colaboradores, administradores, estagiários, prestadores de serviço, fornecedores, parceiros comerciais e quaisquer terceiros em qualquer jurisdição."},{"p":"Sua observância é obrigatória e constitui condição para a manutenção de vínculos de trabalho ou contratuais. A Velaro espera de cada representante:"},{"itens":["Conduta ética, honesta e diligente em todas as interações;","Cumprimento das normas legais e regulatórias aplicáveis, especialmente as relacionadas a ativos virtuais;","Tratamento justo, transparente e responsável de clientes, fornecedores e parceiros, fortalecendo a confiança mútua."]}]},{"t":"4. Governança e Responsabilidades","blocks":[{"p":"A governança da integridade na Velaro assegura que ética, conformidade e transparência estejam presentes em todas as camadas da organização, com papéis claramente definidos:"},{"p":"Comitê de Compliance - Aprova este Código e suas revisões, avalia exceções, supervisiona o Programa de Compliance e garante que questões de conformidade sejam consideradas nas decisões estratégicas."},{"p":"Área de Compliance - Responsável por orientar colaboradores e parceiros, ministrar treinamentos, monitorar regras internas, investigar violações e manter interlocução com autoridades regulatórias, assegurando alinhamento com a Lei nº 14.478/2022 e normas do Banco Central."},{"p":"Lideranças - Devem dar o exemplo, garantir que suas equipes compreendam e cumpram o Código, promover ambiente de trabalho respeitoso e agir prontamente diante de irregularidades, com rastreabilidade e clareza de responsabilidades."},{"p":"Colaboradores, prestadores de serviços e terceiros - Devem conhecer e cumprir este Código, participar dos treinamentos obrigatórios e reportar imediatamente quaisquer suspeitas de violação."},{"p":"A integridade é um compromisso coletivo: conformidade não é apenas dever da Área de Compliance, mas de todos que fazem parte da Velaro."}]},{"t":"5. Conduta no Ambiente de Trabalho","blocks":[{"p":"A Velaro mantém um ambiente de trabalho saudável, seguro, inclusivo e respeitoso. Não há espaço para discriminação, assédio, intimidação ou retaliação. Divergências devem ser tratadas de forma construti
