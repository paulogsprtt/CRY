derate exposures, such as_ interactions with less robust jurisdictions or unregulated services, requiring additional analysis.","High: Addresses linked to suspicious activity, or patterns inconsistent with the client’s expected profile.","Severe: Critical situations requiring immediate response, such as exposure to sanctioned entities, indications of terrorist financing, or links to child exploitation material."]},{"st":"4.7 Response to Severe Risks and Law No. 13.810/2019"},{"p":"Transactions classified as Severe represent the highest risk level and require immediate action. Any operation in this category is automatically suspended, involved assets are preventively frozen, and the Compliance Department is notified to take appropriate measures, including, if applicable, reporting to competent authorities."},{"p":"In particular, when classification arises from exposure to individuals, entities, or jurisdictions included in sanctions lists issued by the United Nations Security Council, Law No. 13.810/2019 applies automatically. This law mandates the immediate blocking of assets, funds, and rights of such individuals or entities, without the need for additional judicial or administrative decisions, constituting a direct legal obligation of the company."},{"st":"4.8 Continuous Monitoring"},{"p":"All wallets under Velaro’s custody - whether operational or client-owned - are subject to the principle of continuous monitoring. This means they remain under ongoing and retroactive assessment: transactions already recorded may trigger new alerts if addresses previously considered legitimate become associated with illicit activities in the Chainalysis intelligence database."},{"st":"4.9 Types of Automated Alerts"},{"p":"The monitoring system is also capable of generating different types of automated alerts, each corresponding to a specific dimension of risk:"},{"itens":["Transfer Alerts: triggered by individual transactions that activate preconfigured risk rules.","Withdrawal Attempt Alerts: operate preventively, blocking movements that fall outside established parameters, thus reducing the risk of illicit fund outflows.","Behavioral Alerts: result from the analysis of aggregated patterns, such as unusual transaction frequency, operations conducted at atypical times, or cumulative volumes exceeding the client’s historical activity."]},{"p":"The combination of these different alert types provides an integrated and dynamic view of risk, enabling the Compliance Department to adopt proportional, timely, and risk-aligned responses consistent with the company’s risk appetite."},{"st":"4.10 Wallet Whitelisting"},{"p":"Velaro adopts a wallet whitelisting process as an additional security and control measure for digital asset deposits and withdrawals. Before conducting the first transaction from a new wallet, the client must submit it to a verification and approval process, which includes risk analysis via Know Your Wallet (KYW) and on-chain history assessment through Chainalysis. Only after approval by the Compliance Area is the wallet included in the client's authorized address list (whitelist), allowing future transactions."},{"p":"Clients may request the inclusion of new wallets at any time, with each address required to undergo the same verification and approval process. The Compliance Area reserves the right to remove wallets from the whitelist or request reverification whenever it identifies changes in usage patterns, exposure to risky addresses, or incompatibility with the client's declared profile. This process aims to mitigate risks of third-party financing, money laundering, and other illicit activities, reinforcing protection for both clients and the company's operational integrity."}]},{"t":"5. Know Your Wallet (KYW) Process","blocks":[{"p":"In addition to continuous transaction monitoring (KYT), Velaro adopts Know Your Wallet (KYW) procedures to assess the risk associated with specific on-chain addresses, wallets, and services. KYW complements KYT by allowing the company to conduct targeted investigations into entities with which it maintains - or may potentially establish - relationships, thereby reinforcing safeguards against exposure to illicit actors."},{"p":"Through the Chainalysis solution, Velaro can screen individual addresses, liquidity pools, and entire services (such as exchanges or VASPs), either programmatically or manually. Each evaluated address or entity receives a risk rating (Low, Medium, High, or Severe), aligned with the organization’s risk appetite. This outcome guides compliance decisions such as maintaining relationships with counterparties, authorizing specific transactions, or applying preventive blocks."},{"p":"The KYW process enables the identification of risks such as: e exposure to addresses involved in illicit activities; e interactions with services lacking robust AML/CFT policies or regulatory supervision; e atypical movement patterns in specific wallets (e.g., high frequency of small transactions indicative of structuring)."},{"p":"Aligned with the concept of continuous monitoring, previously assessed addresses may be reclassified if new risk information is identified by the tool’s intelligence database. This ensures that diligence over wallets and entities is not a one-time event, but a continuous process of updating and reassessment."},{"p":"KYW, therefore, provides an additional layer of protection, ensuring that Velaro can not only monitor transaction flows but also understand and mitigate risks associated with the addresses and services with which it directly interacts."}]},{"t":"6. Procedures for Suspicious Transactions","blocks":[{"p":"Velaro’s monitoring system screens every transaction in real time, assigning a risk classification according to the parameters described in the previous section of this"},{"p":"Policy. This classification determines the initial treatment of the operation and the need for additional compliance measures."},{"p":"Transactions classified as Severe are automatically treated as suspicious. In such cases, the system immediately alerts the Compliance Department and the Director Responsible for the AML/CFT Program, and the wallets involved remain preventively frozen until the investigation is concluded."},{"p":"Transactions classified as High or Medium Risk are not blocked immediately but undergo mandatory review by the Compliance Department, which validates the tool’s classification and assesses its consistency with the client’s profile and transaction history. Low-Risk transactions remain under continuous monitoring, requiring no immediate action but remaining subject to retroactive reassessment if new risk elements are identified."},{"p":"When a suspicious transaction is identified, the Compliance Department conducts an in-depth internal investigation. This process may include a detailed review of the transaction within the KYT system, analysis of the client’s relationship history and, when applicable, that of the transaction’s beneficiary, requests for additional information or documentation - including from the counterparty - and the export of technical reports to support the investigative file."},{"p":"Additionally, the investigation may involve:"},{"itens":["Queries to external intelligence sources (sanctions lists, PEP databases, corporate registries, adverse media, and public records of ongoing or past investigations and court proceedings);","Formal requests for clarification from the client;","Escalation to the Compliance Committee;","Comparison of findings against recognized AML/CFT typologies."]},{"p":"All transactions classified as suspicious must be formally documented in an opinion prepared by the Compliance Department, containing a detailed description of the operation, the risk criteria that triggered the suspicion, the diligence performed, the conclusions of the analysis, and the final decision. The Compliance Department is the only body authorized to approve the unblocking of previously frozen addresses or transactions. The entire process must be fully documented in a dedicated system, ensuring traceability, consistency, and decision-making support."},{"p":"If, at the end of the analysis, the transaction is deemed legitimate, unblocking is formally authorized by the Compliance Department and communicated to the operations team for execution. Conversely, if suspicion is confirmed, the company prepares a Suspicious Activity Report (SAR), which must be submitted to COAF within 24 hours from the formal decision."},{"st":"6.1 Use of Advanced Tools (Reactor)"},{"p":"When necessary, Velaro may use the Chainalysis Reactor module to deepen investigations. This feature is particularly useful in complex cases involving multiple counterparties, large volumes, or sophisticated typologies. Reactor enables visualization of full asset flows, identification of connections between addresses, generation of relationship graphs, and export of detailed reports in CSV format, supporting both internal decision-making and regulatory reporting."},{"st":"6.2 Reporting to COAF"},{"p":"Velaro reports to the Financial Activities Control Council (COAF) all operations that, after internal investigation, are classified as suspected of money laundering or terrorist financing, among others. Reporting is mandatory even in the absence of definitive proof of wrongdoing. The existence of reasonable suspicion is sufficient."},{"p":"The report submitted must contain comprehensive information about the transaction, including the digital asset involved, transaction volume, identified risk category, date and time, counterparties, and the rationale for the decision."},{"p":"The submission to COAF must occur within 24 hours of the formal classification as suspicious. The entire internal investigation must be completed within 45 days of alert generation."},{"p":"All information related to investigations and reports must be handled with the highest level of confidentiality. Disclosure to any employee not involved in the process or to third parties, including the investigated client, is strictly prohibited, in accordance with the tipping-off prohibition established by law. Confidentiality is essential to the integrity of the process and to maintaining the company’s credibility with competent authorities."}]},{"t":"7. Governance","blocks":[{"p":"Governance of Velaro’s transaction monitoring process is organized across different levels of responsibility and oversight. The Compliance Department is responsible for configuring monitoring rules, analyzing and investigating alerts, and preparing regulatory reports for competent authorities."},{"p":"The Director Responsible for the AML/CFT Program supervises the implementation of this Policy, approves strategic measures, and ensures alignment with current legislation and the company’s risk appetite."},{"p":"The Compliance Committee deliberates on critical cases, oversees the implementation of adopted measures, and periodically reviews the effectiveness of the monitoring system."},{"p":"Senior Management is responsible for ensuring that Velaro has adequate human, financial, and technological resources for the full execution and continuous improvement of this Policy."}]},{"t":"8. Recordkeeping and Retention","blocks":[{"p":"All alerts, investigations, and reports must be fully documented and retained for a minimum period of five years, in accordance with applicable legislation. These records must be kept in a secure environment with controlled access and must be readily available in the event of internal audits, independent reviews, or requests from competent authorities."}]},{"t":"9. Policy Review","blocks":[{"p":"This Policy shall be reviewed at least every two years by the Compliance Department to ensure its ongoing relevance and adherence to best practices. Extraordinary reviews may occur sooner whenever there are material regulatory changes, technological developments in monitoring systems, or adjustments to the company’s risk appetite."},{"p":"All updates must be submitted for review and approval by the Compliance Committee."},{"st":"Velaro Annex A - Risk Categories in KYT (Chainalysis)"},{"p":"Transactions monitored by Velaro through the Fireblocks-Chainalysis integration may involve entities classified into different categories. Each category has its own characteristics and an inherent risk assessment. Below are some of the categories currently monitored by the system:"},{"p":"ATM: ATMs facilitate the conversion of fiat currency into cryptocurrency, or vice versa. Bridge: Protocols that enable interoperability between different blockchains."},{"p":"Child abuse material (CSAM): Forums and websites, typically on the dark web, that promote or sell child sexual abuse material."},{"p":"Darknet market: Illicit markets on the dark web that sell drugs, weapons, forged documents, fraud materials, and other illegal goods and services."},{"p":"Decentralized exchange (DEX): Services that allow peer-to-peer trading of cryptoassets via smart contracts, without centralized intermediaries."},{"p":"Drug vendor: Entities engaged in the sale of illicit drugs or those operating outside regulated channels."},{"p":"Escort service: Services or platforms that facilitate the use of cryptoassets in activities related to sex work, including classified ad sites or paid forums."},{"p":"Exchange: Platforms that enable the purchase, sale, and trading of cryptoassets."},{"p":"Fraud shop: Online stores specialized in selling stolen data, credentials, or personal information."},{"p":"Gambling: Online betting sites that accept cryptocurrencies. Hosted wallet: Wallets custodied by third parties that control clients’ private keys. ICO: Token issuance processes used for fundraising."},{"p":"Illicit actor-org: Individuals or organizations directly involved in illicit activities, including fraud, hacking, terrorism, or illegal trade."},{"p":"Infrastructure as a service (laaS): Digital infrastructure services such as VPNs, VPS hosting, and domain registration."},{"p":"Instant exchange: Platforms that offer quick crypto-to-crypto conversions without formal onboarding, often without KYC collection."},{"p":"Institutional platform: Platforms designed for institutional or high-net-worth clients, such as OTC desks and custody services."},{"p":"Lending: Protocols or platforms that offer cryptoasset loans, either centralized or decentralized."},{"p":"Malware: Malicious software, including ransomware, spyware, and trojans, designed for data theft or financial extortion."},{"p":"Merchant services: Payment services that allow companies to accept cryptoassets."},{"p":"Mining / Mining pool: The process of cryptoasset mining, whether individually or in mining pools."},{"p":"Mixing / Privacy protocol: Services and protocols that promote transaction anonymization, such as mixers, coinjoin, stealth addresses, or shielded pools."},{"p":"NFT platform / NFT collection: Platforms and collections of non-fungible tokens."},{"p":"No KYC exchange / P2P exchange: Centralized or peer-to-peer exchanges that do not collect sufficient customer information."},{"p":"Ransomware: Cyberattacks that encrypt data and demand cryptocurrency payments for its release."},{"p":"Sanctioned entity / Sanctioned jurisdiction: Individuals, entities, or jurisdictions subject to international sanctions, including those imposed by OFAC, the European Union, HMT, and the United Nations."},{"p":"Scam: Fraudulent schemes, generally based on false investment promises."},{"p":"Seized funds: Funds seized by public authorities and subsequently held in publicly disclosed addresses."},{"p":"Smart contract / Token smart contract: Self-executing blockchain contracts that may be used for legitimate or fraudulent purposes."},{"p":"Special measures: Addresses or entities designated by authorities as “primary money laundering concern,” requiring enhanced monitoring measures."},{"p":"Stolen funds: Addresses associated with stolen assets, especially those originating from attacks on exchanges."},{"p":"Terrorist financing: Entities, organizations, or individuals associated with the financing of terrorism."}]}]},"limites":{"pt":[{"t":"1. Objetivo","blocks":[{"p":"A presente Política estabelece a metodologia para concessão, renovação e gestão de limites operacionais de movimentação para clientes da Velaro Network Sociedade Prestadora de Serviços de Ativos Virtuais Ltda, CNPJ 63.964.774/0001-52 (“Velaro” ou “Companhia”), com base em sua capacidade financeira comprovada. Os limites de capacidade financeira são instrumento essencial para assegurar compatibilidade entre o perfil econômico-financeiro do cliente e o volume de suas operações, identificar movimentações atípicas e mitigar riscos de lavagem de dinheiro e financiamento do terrorismo (LD/FT), em conformidade com a Circular BACEN nº 3.978/2020 e a Resolução BCB nº 520/2025."},{"p":"A metodologia aqui definida integra o processo de Know Your Customer (KYC) e está alinhada à abordagem baseada em risco adotada pela Velaro, servindo como ferramenta complementar de monitoramento e gestão de risco operacional e financeiro."}]},{"t":"2. Base Legal e Regulatória","blocks":[{"st":"Esta Política está fundamentada, especialmente, nas seguintes normas:"},{"itens":["Lei nº 9.613/1998 (Lei de Prevenção à Lavagem de Dinheiro);","Circular BACEN nº 3.978/2020;","Resolução BCB nº 520/2025;","Lei nº 12.846/2013 (Lei Anticorrupção);","Demais normas emitidas pelo Banco Central do Brasil e pelas autoridades competentes;","A metodologia de limites integra o Programa de Compliance e PLD/FT da Velaro e deve ser interpretada em conjunto com o Manual de KYC, a Política de Monitoramento de Transações e as diretrizes internas de gestão de riscos."]}]},{"t":"3. Critérios de Classificação e Fórmula de Cálculo do Limite Mensal","blocks":[{"st":"3.1 Para Clientes Pessoas Jurídicas:"},{"p":"A classificação inicial do cliente pessoa jurídica é determinada com base em seu faturamento anual, conforme declarado e comprovado no processo de onboarding. Para fins desta metodologia, consideram-se quatro categorias:"},{"itens":["Microempresa (ME): faturamento anual até R$ 360.000 e limite mensal base entre R$ 50.000 e R$ 150.000;","Empresa de Pequeno Porte (EPP): faturamento anual entre R$ 360.000 e R$ 4.800.000 e limite mensal base entre R$ 150.000 e R$ 500.000;","Média Empresa: faturamento anual entre R$ 4.800.000 e R$ 300.000.000 e limite mensal base entre R$ 500.000 e R$ 3.000.000;","Grande Empresa: faturamento anual acima de R$ 300.000.000 e limite mensal base entre R$ 3.000.000 e R$ 10.000.000 (ou superior, mediante aprovação do Comitê de Compliance)."]},{"p":"O limite mensal operacional corresponde ao volume total permitido de movimentação, abrangendo tanto entradas (inflows) quanto saídas (outflows). Esse limite é calculado a partir do faturamento anual informado, dividido por doze meses (considerando ciclos mensais de calendário), multiplicado por um fator setorial e ajustado conforme critérios positivos ou negativos."},{"p":"Fórmula: Limite Mensal = (Faturamento Anual ÷ 12) × Multiplicador de Setor × Fator de Ajuste."},{"p":"Os multiplicadores refletem o grau de exposição e a natureza do segmento de atuação. Para cada setor, aplica-se um range que permite calibração conforme o perfil específico do cliente:·"},{"itens":["Tech, Fintech, Trading, Exchanges: 1,5× a 2,5×;","Serviços e Comércio Eletrônico: 0,8× a 1,4×;","Indústria e Agronegócio: 0,6× a 1,0×."]},{"p":"O fator de ajuste é aplicado sobre o resultado base do cálculo e reflete características específicas do cliente, podendo aumentar ou reduzir o limite conforme o histórico, estrutura e perfil de risco."},{"st":"Ajustes positivos:"},{"itens":["Tempo de mercado superior a 5 anos: +20%","Histórico positivo na Velaro (relacionamento superior a 6 meses): +30%","Capital social equivalente a, no mínimo, 20% do faturamento: +15%","Receitas em criptoativos comprovadas e recorrentes: +50%"]},{"st":"Ajustes negativos:"},{"itens":["Empresa com menos de 1 ano de operação: -30%","Atuação em setor classificado como de alto risco PLD/FT: -20%","Novo cliente (sem histórico na Velaro): -20%","Estrutura societária complexa ou com beneficiários não identificáveis: análise caso a caso"]},{"p":"A título de exemplo, uma fintech com faturamento de R$ 10 milhões anuais, três anos de mercado e relacionamento novo na Velaro teria limite mensal aproximado de R$ 1.500.000, conforme o método de cálculo previsto."},{"st":"Agregação de Limites por Beneficiário Final ou Grupo Econômico"},{"p":"Para fins de gerenciamento de riscos, quando múltiplas entidades legais compartilham o mesmo Beneficiário Final (UBO) ou pertencem ao mesmo grupo econômico, os limites operacionais são avaliados de forma consolidada."},{"p":"Embora cada entidade receba um limite individual durante o onboarding, a Área de Compliance monitora e agrega os volumes de transação entre todas as entidades relacionadas para determinar o limite efetivo em nível de grupo e gerenciar riscos de concentração."},{"st":"Para esse fim, a análise considera:"},{"itens":["os volumes mensais efetivamente movimentados por cada entidade;","a capacidade financeira consolidada do UBO ou do grupo econômico;","a soma dos limites individuais e a necessidade de estabelecer um teto agregado;","eventual redistribuição interna dos limites entre as entidades relacionadas."]},{"p":"O limite consolidado do grupo não corresponde automaticamente à soma dos limites individuais. A Área de Compliance define um teto agregado proporcional à capacidade financeira real do UBO e ao risco associado. Caso o volume consolidado se aproxime ou exceda esse teto, novas operações poderão ser restringidas, redistribuídas ou submetidas à aprovação prévia do Comitê de Compliance."},{"p":"Exemplo prático: Um mesmo UBO controla três empresas com os seguintes limites individuais:"},{"itens":["Empresa A: R$ 200.000/mês","Empresa B: R$ 300.000/mês","Empresa C: R$ 500.000/mês"]},{"p":"Após análise da capacidade financeira do UBO, a Área de Compliance define um limite consolidado de R$ 700.000/mês para o grupo (e não R$ 1.000.000, que seria a soma simples)."},{"st":"Nesse cenário:"},{"itens":["cada empresa mantém seu limite individual para fins operacionais;","o monitoramento agregado impede que o grupo ultrapasse R$ 700.000/mês;","se as Empresas A e B já consumiram R$ 500.000 no mês, a Empresa C ficará limitada a R$ 200.000, mesmo que seu limite individual seja R$ 500.000."]},{"st":"3.2 Para Clientes Pessoas Físicas"},{"p":"A classificação inicial do cliente pessoa física é determinada com base em sua renda mensal comprovada, conforme declarado e comprovado no processo de onboarding. Para fins desta metodologia, consideram-se quatro categorias:"},{"itens":["Faixa 1 (Básica): renda mensal até R$ 10.000 → limite mensal base entre R$ 10.000 e R$ 50.000;","Faixa 2 (Intermediária): renda mensal entre R$ 10.000 e R$ 30.000 → limite mensal base entre R$ 50.000 e R$ 150.000;","Faixa 3 (Avançada): renda mensal entre R$ 30.000 e R$ 100.000 → limite mensal base entre R$ 150.000 e R$ 500.000;","Faixa 4 (Premium): renda mensal acima de R$ 100.000 → limite mensal base acima de R$ 500.000 (mediante Enhanced Due Diligence e aprovação do Comitê de Compliance)."]},{"p":"O limite mensal operacional para pessoas físicas é calculado com base na renda mensal comprovada, multiplicada por um fator de capacidade e ajustada conforme critérios positivos ou negativos que refletem o perfil de risco, o histórico de relacionamento e a finalidade das operações."},{"st":"Fórmula:"},{"p":"Limite Mensal = Renda Mensal Comprovada × Multiplicador de Capacidade × Fator de Ajuste"},{"st":"Multiplicador de Capacidade"},{"p":"O multiplicador reflete a relação entre a renda comprovada e a capacidade de movimentação em criptoativos, considerando o perfil de uso declarado:"},{"itens":["Uso pessoal/investimento ocasional: 3.0x","Investidor ativo/trader pessoa física: 5.0x","Profissional liberal com receitas em cripto (freelancers, consultores): 8.0x"]},{"st":"Teto de Risco para Pessoas Físicas"},{"p":"Como medida adicional de controle de risco, o limite mensal final para pessoas físicas, após aplicação de todos os ajustes positivos e negativos, não poderá exceder 10× (dez vezes) a renda mensal comprovada, salvo aprovação expressa do Comitê de Compliance."},{"st":"Esse teto tem por objetivo:"},{"itens":["Estabelecer limite superior claro e objetivo para exposição individual;","Prevenir que a combinação de multiplicadores altos e ajustes positivos resulte em limites desproporcionais à capacidade financeira do cliente;","Assegurar alinhamento com a abordagem baseada em risco e com os princípios de prevenção à lavagem de dinheiro."]},{"st":"Exemplo:"},{"itens":["Cliente com renda mensal de R$ 20.000","Multiplicador aplicado: 8,0× (profissional liberal com receitas em cripto) = R$ 160.000","Ajustes positivos acumulados: +90% (patrimônio + histórico + IR + cripto)","Limite calculado antes do teto: R$ 160.000 × 1,90 = R$ 304.000","Teto de 10×: R$ 20.000 × 10 = R$ 200.000","Limite final aplicado: R$ 200.000 (limitado pelo teto)"]},{"p":"Para limites superiores ao teto de 10×, o cliente pode solicitar análise excepcional, que será conduzida pela Área de Compliance e submetida ao Comitê de Compliance, com aplicação obrigatória de Enhanced Due Diligence (EDD) e documentação robusta sobre origem dos recursos e finalidade das operações."},{"st":"Fator de Ajuste"},{"p":"O fator de ajuste é aplicado sobre o resultado base do cálculo e reflete características específicas do cliente, podendo aumentar ou reduzir o limite conforme o histórico, patrimônio, transparência e perfil de risco."},{"st":"Ajustes positivos:"},{"itens":["Patrimônio líquido comprovado superior a 12x a renda mensal: +30%","Histórico positivo na Velaro (relacionamento superior a 6 meses sem alertas): +30%","Declaração de Imposto de Renda completa e compatível com movimentação: +20%","Operações recorrentes em criptoativos comprovadas (extratos de exchanges reguladas): +40%","Ajustes negativos:","Cliente novo (sem histórico na Velaro): -20%","Renda não comprovada documentalmente ou baseada apenas em declaração: - 40%","Incompatibilidade aparente entre renda declarada e patrimônio/movimentação pretendida: análise caso a caso","Finalidade das operações não claramente justificada: -30%","Cliente classificado como PEP sem Enhanced Due Diligence aprovada: análise caso a caso"]},{"st":"Exemplo Prático:"},{"p":"Um investidor ativo pessoa física, com renda mensal comprovada de R$ 20.000, patrimônio líquido de R$ 500.000 (superior a 12x a renda), declaração de IR completa e sem histórico na Velaro, teria:"},{"itens":["Base: R$ 20.000 × 5.0 (multiplicador) = R$ 100.000","Ajustes: +30% (patrimônio) +20% (IR completo) -20% (novo cliente) = +30% líquido","Limite mensal aprovado: R$ 100.000 × 1.30 = R$ 130.000"]},{"st":"Observações Importantes:"},{"itens":["Para clientes com patrimônio significativo (acima de R$ 1 milhão comprovado), mas renda mensal modesta, o limite pode ser calculado alternativamente com base em um percentual do patrimônio líquido (por exemplo, 5% a 10% ao mês), mediante análise e aprovação da Área de Compliance.","Clientes que declarem rendimentos em criptoativos como fonte principal de renda devem apresentar extratos de plataformas reguladas e, quando aplicável, declaração de IR que evidencie essa atividade.","Limites para pessoas físicas acima de R$ 500.000/mês exigem obrigatoriamente Enhanced Due Diligence (EDD) e aprovação do Comitê de Compliance."]}]},{"t":"4. Processo de Concessão e Revisão de Limites","blocks":[{"p":"Os limites operacionais são definidos após a assinatura do contrato e antes do início das operações, com base nas informações e documentos coletados durante o processo de KYC."},{"p":"A Área de Compliance é responsável por validar a documentação, aplicar a metodologia de cálculo e aprovar os limites conforme as seguintes alçadas internas:"},{"itens":["Até R$ 1 milhão/mês: aprovação direta pela Área de Compliance;","Entre R$ 1 e R$ 5 milhões/mês: análise detalhada pela Área de Compliance;","Acima de R$ 5 milhões/mês: aprovação obrigatória pelo Comitê de Compliance."]},{"p":"Clientes classificados como de baixo risco e com documentação completa e consistente podem ter o limite aprovado de forma simplificada."},{"p":"Os limites são revisados periodicamente, de acordo com o nível de risco do cliente, ou sempre que o cadastro do cliente for revisto no âmbito do processo de KYC, bem como em qualquer outra situação que justifique reavaliação, incluindo aquelas elencadas abaixo."},{"p":"Revisões extraordinárias podem ocorrer a qualquer momento em situações como:"},{"itens":["Alterações significativas no perfil cadastral ou societário;","Aumento relevante no volume de operações;","Identificação de operações atípicas;","Solicitação de aumento de limite pelo cliente."]},{"st":"4.1 Limites por Moeda e Conversão Cambial"},{"p":"Considerando a volatilidade da taxa de câmbio BRL/USDT, a Velaro adota limites fixos por moeda para simplificar a operação, proporcionar clareza ao cliente e reduzir ajustes frequentes."},{"st":"4.1.1 Definição de Caps por Moeda"},{"p":"O limite mensal aprovado é desdobrado em caps fixos por moeda, calculados com base em uma taxa de referência BRL/USDT definida no momento da concessão."},{"st":"Exemplo:"},{"itens":["Limite mensal: R$ 5.000.000","Taxa de referência: 5,30"]},{"st":"Desdobramento:"},{"itens":["Cap em BRL: R$ 2.000.000","Cap em USDT: 560.000 USDT"]},{"p":"O cliente pode utilizar qualquer combinação de BRL e USDT, respeitando ambos os caps simultaneamente."},{"st":"4.1.2 Taxa de Referência"},{"p":"A taxa BRL/USDT é extraída do CoinMarketCap e fixada no momento da concessão ou revisão do limite. Permanece válida até a próxima revisão, salvo variação superior a 100% (ex: de ~5,30 para ~10,60), quando a Área de Operações pode recalcular os caps."},{"st":"4.1.3 Controle Operacional"},{"st":"Durante a fase via WhatsApp, a Área de Operações mantém:"},{"itens":["Tabela de conversão atualizada semanalmente;","Planilha de monitoramento rastreando consumo contra ambos os caps simultaneamente;","Procedimento Operacional Padrão (SOP) formalizando responsabilidades e alertas aos 80% de consumo."]}]},{"t":"5. Processo de Aumento de Limite","blocks":[{"p":"O cliente pode solicitar aumento de limite a qualquer momento. A solicitação é analisada pela Área de Compliance, que verifica:"},{"itens":["Atualização e consistência da documentação (válida por até seis meses);","Histórico de relacionamento e ausência de alertas PLD/FT;","Compatibilidade entre o volume solicitado e a capacidade financeira demonstrada."]},{"p":"A decisão é tomada em até cinco dias úteis. O aumento pode ser aprovado de forma simplificada quando:"},{"itens":["O acréscimo solicitado for de até 30% do limite vigente;","O cliente tiver mais de seis meses de histórico sem alertas recentes;","O limite final não ultrapassar R$ 3 milhões por mês."]},{"p":"Solicitações acima desses parâmetros, clientes de alto risco ou casos com red flags exigem aprovação do Comitê de Compliance."}]},{"t":"6. Procedimentos ao Atingir ou Ultrapassar Limites","blocks":[{"p":"Quando o cliente atingir 80% do limite mensal aprovado, é notificado e orientado sobre a possibilidade de solicitar aumento pelo time de Operações. Caso atinja 100% do limite, novas operações que excedam o valor autorizado são bloqueadas até o início do próximo ciclo ou até a aprovação de aumento pela Área de Compliance."},{"p":"O cliente é comunicado das alternativas disponíveis, podendo optar por aguardar o novo período, solicitar revisão do limite ou ajustar suas operações ao saldo disponível."},{"p":"Operações que, embora dentro do limite, apresentem incompatibilidade com o perfil do cliente devem ser encaminhadas, pelo time de Operações, à Área de Compliance para análise, com prazo de até cinco dias úteis. Essa análise pode incluir solicitação de documentação adicional e resulta na elaboração de um dossiê específico, independentemente do resultado."}]},{"t":"7. Tratamento de Exceções","blocks":[{"p":"Excepcionalmente, a Velaro poderá aprovar limites que não se enquadrem integralmente na metodologia padrão, em situações devidamente justificadas, como:"},{"itens":["Clientes com estrutura diferenciada (holdings, fundos de investimento, family offices);","Operações pontuais de valor expressivo e comprovada justificativa econômica;","Clientes estratégicos com perfil de risco controlado;","Casos específicos aprovados pelo Comitê de Compliance."]},{"st":"A aprovação de exceções requer:"},{"itens":["Justificativa formal elaborada pela Área de Compliance;","Aplicação de due diligence reforçada (EDD);","Definição de controles compensatórios;","Aprovação documentada pelo Comitê de Compliance."]},{"p":"As exceções são acompanhadas de forma reforçada e possuem prazo determinado, não superior a doze meses, sendo reavaliadas periodicamente."}]},{"t":"8. Redução de Limites","blocks":[{"p":"A Velaro pode reduzir limites operacionais sempre que houver elevação no perfil de risco do cliente ou identificação de situações que comprometam a adequação do limite previamente concedido."},{"st":"8.1 Situações que Podem Ensejar Redução de Limite"},{"st":"A redução de limite pode ocorrer nas seguintes hipóteses:"},{"itens":["Deterioração da situação financeira do cliente;","Reclassificação do cliente para categoria de risco mais elevado;","Identificação de operações atípicas ou suspeitas;","Alterações na estrutura societária (PJ) ou situação patrimonial (PF) que reduzam a transparência;","Descumprimento reiterado de políticas internas ou resistência em prestar esclarecimentos;","Mudança de jurisdição para países de alto risco ou sujeitos a sanções;","Surgimento de informações negativas em mídia ou bases públicas;","Identificação de vínculos com PEPs não declarados ou com pessoas/entidades sancionadas;","Utilização do limite de forma incompatível com o perfil declarado."]},{"st":"8.2 Processo de Redução"},{"itens":["Identificação: Área de Compliance ou Operações identifica situação prevista na Seção 6.1;","Análise: Área de Compliance realiza análise técnica documentada;","Comunicação prévia: Cliente é notificado com prazo de 5 dias úteis para apresentar justificativas, salvo em situações de risco iminente;","Decisão: ○ Área de Compliance aprova reduções de até 50% do limite vigente; ○ Comitê de Compliance delibera sobre reduções superiores a 50%;","Formalização: Decisão registrada em dossiê e limite atualizado nos sistemas;","Notificação final: Cliente é comunicado sobre o novo limite e data de vigência."],"ol":true},{"st":"8.3 Suspensão Temporária ou Bloqueio"},{"p":"Em situações de risco iminente (operações incompatíveis com o perfil, indícios de ilícitos, recusa em cooperar, ou aparecimento em listas de sanções), a Área de Compliance pode determinar a suspensão imediata do limite, sem notificação prévia, comunicando à Alta Administração em até 24 horas."},{"p":"Após 6 meses, os clientes podem solicitar uma revisão de limite, desde que demonstrem a regularização da situação, apresentem documentação atualizada e mantenham um histórico sem alertas."}]},{"t":"9. Disposições Finais","blocks":[{"p":"Esta Política é de observância obrigatória por todas as áreas envolvidas na gestão de clientes, operações e controles internos. Seu descumprimento poderá ensejar medidas disciplinares internas e demais providências cabíveis."},{"p":"A metodologia aqui estabelecida constitui ferramenta essencial de prevenção, monitoramento e mitigação de riscos, reforçando o compromisso da Velaro com a integridade, a conformidade regulatória e a gestão responsável de suas operações."}]},{"t":"10. Revisão da Política","blocks":[{"p":"Esta Política será revisada, no mínimo, a cada dois anos pela Área de Compliance, a fim de assegurar sua atualização e aderência às melhores práticas. Revisões extraordinárias poderão ser realizadas em prazo inferior sempre que houver mudanças regulatórias relevantes, evolução tecnológica dos sistemas utilizados ou alteração no apetite de risco da companhia. Todas as atualizações devem ser submetidas à apreciação e aprovação do Comitê de Compliance."}]}],"en":[{"t":"1. Purpose","blocks":[{"p":"This Policy establishes the methodology for granting, renewing, and managing operational transaction limits for clients of Velaro Network Sociedade Prestadora de Serviços de Ativos Virtuais Ltda, CNPJ 63.964.774/0001-52 (“Velaro” or “Company”), based on their proven financial capacity. Financial capacity limits are an essential instrument to ensure compatibility between the client’s economic-financial profile and the volume of their operations, to identify atypical transactions, and to mitigate risks of money laundering and terrorist financing (ML/TF), in accordance with BACEN Circular No. 3,978/2020 and BCB Resolution No. 520/2025."},{"p":"The methodology defined herein is part of the Know Your Customer (KYC) process and is aligned with the risk-based approach adopted by Velaro, serving as a complementary tool for monitoring and managing operational and financial risk."}]},{"t":"2. Legal and Regulatory Basis","blocks":[{"st":"This Policy is based, in particular, on the following regulations:"},{"itens":["Law No. 9,613/1998 (Anti-Money Laundering Law);","BACEN Circular No. 3,978/2020;","BCB Resolution No. 520/2025;","Law No. 12,846/2013 (Anti-Corruption Law);","Other regulations issued by the Central Bank of Brazil and competent authorities."]},{"p":"The limits methodology is part of Velaro’s Compliance and AML/CTF Program and must be interpreted in conjunction with the KYC Manual, the Transaction Monitoring Policy, and internal risk management guidelines."}]},{"t":"3. Classification Criteria and Monthly Limit Calculation Formula","blocks":[{"st":"3.1 Corporate Clients (Legal Entities)"},{"p":"The initial classification of corporate clients is determined based on their annual revenue, as declared and evidenced during the onboarding process. For the purposes of this methodology, four categories are considered:"},{"itens":["Microenterprise (ME): annual revenue up to BRL 360,000 and base monthly limit between BRL 50,000 and BRL 150,000;","Small Business (EPP): annual revenue between BRL 360,000 and BRL 4,800,000 and base monthly limit between BRL 150,000 and BRL 500,000;","Mid-sized Company: annual revenue between BRL 4,800,000 and BRL 300,000,000 and base monthly limit between BRL 500,000 and BRL 3,000,000;","Large Company: annual revenue above BRL 300,000,000 and base monthly limit between BRL 3,000,000 and BRL 10,000,000 (or higher, subject to approval by the Compliance Committee)."]},{"p":"The operational monthly limit corresponds to the total allowed transaction volume, encompassing both inflows and outflows. This limit is calculated based on the reported annual revenue, divided by twelve months (considering calendar monthly cycles), multiplied by a sector factor, and adjusted according to positive or negative criteria."},{"p":"Formula: Monthly Limit = (Annual Revenue ÷ 12) × Sector Multiplier × Adjustment Factor"},{"p":"Sector multipliers reflect the level of exposure and the nature of the business segment. For each sector, a range is applied to allow calibration according to the client’s specific profile:"},{"itens":["Tech, Fintech, Trading, Exchanges: 1.5× to 2.5×","Services and E-commerce: 0.8× to 1.4×","Industry and Agribusiness: 0.6× to 1.0×"]},{"p":"The adjustment factor is applied to the base calculation result and reflects specific client characteristics, which may increase or decrease the limit depending on history, structure, and risk profile."},{"st":"Positive adjustments:"},{"itens":["More than 5 years in operation: +20%","Positive history with Velaro (relationship longer than 6 months): +30%","Share capital equivalent to at least 20% of revenue: +15%","Proven and recurring cryptoasset revenues: +50%"]},{"st":"Negative adjustments:"},{"itens":["Company with less than 1 year of operation: -30%","Activity in a sector classified as high ML/TF risk: -20%","New client (no history with Velaro): -20%","Complex ownership structure or unidentified beneficial owners: case-by-case analysis"]},{"p":"By way of example, a fintech with annual revenue of BRL 10 million, three years in operation, and a new relationship with Velaro would have an approximate monthly limit of BRL 1,500,000, according to the defined calculation method."},{"p":"Aggregation of Limits by Ultimate Beneficial Owner (UBO) or Economic Group"},{"p":"For risk management purposes, when multiple legal entities share the same Ultimate Beneficial Owner (UBO) or belong to the same economic group, operational limits are assessed on a consolidated basis."},{"p":"Although each entity receives an individual limit during onboarding, the Compliance Area monitors and aggregates transaction volumes across all related entities to determine the effective group-level limit and manage concentration risks."},{"st":"For this purpose, the analysis considers:"},{"itens":["the actual monthly volumes transacted by each entity;","the consolidated financial capacity of the UBO or economic group;","the sum of individual limits and the need to establish an aggregate cap;","any internal redistribution of limits among related entities."]},{"p":"The consolidated group limit does not automatically correspond to the sum of individual limits. The Compliance Area defines an aggregate cap proportional to the UBO’s actual financial capacity and associated risk. If the consolidated volume approaches or exceeds this cap, new transactions may be restricted, redistributed, or subject to prior approval by the Compliance Committee."},{"p":"Practical example: The same UBO controls three companies with the following individual limits:"},{"itens":["Company A: BRL 200,000/month","Company B: BRL 300,000/month","Company C: BRL 500,000/month"]},{"p":"After assessing the UBO’s financial capacity, the Compliance Area defines a consolidated group limit of BRL 700,000/month (rather than BRL 1,000,000, which would be the simple sum)."},{"st":"In this scenario:"},{"itens":["each company retains its individual limit for operational purposes;","aggregated monitoring prevents the group from exceeding BRL 700,000/month;","if Companies A and B have already used BRL 500,000 in the month, Company C will be limited to BRL 200,000, even though its individual limit is BRL 500,000."]},{"st":"3.2 Individual Clients (Natural Persons)"},{"p":"The initial classification of individual clients is determined based on their proven monthly income, as declared and evidenced during onboarding. Four categories are considered:"},{"itens":["Tier 1 (Basic): monthly income up to BRL 10,000 → base monthly limit between BRL 10,000 and BRL 50,000;","Tier 2 (Intermediate): monthly income between BRL 10,000 and BRL 30,000 → base monthly limit between BRL 50,000 and BRL 150,000;","Tier 3 (Advanced): monthly income between BRL 30,000 and BRL 100,000 → base monthly limit between BRL 150,000 and BRL 500,000;","Tier 4 (Premium): monthly income above BRL 100,000 → base monthly limit above BRL 500,000 (subject to Enhanced Due Diligence and Compliance Committee approval)."]},{"p":"The operational monthly limit for individuals is calculated based on proven monthly income, multiplied by a capacity factor and adjusted according to positive or negative criteria reflecting risk profile, relationship history, and purpose of transactions."},{"p":"Formula: Monthly Limit = Proven Monthly Income × Capacity Multiplier × Adjustment Factor"},{"p":"Capacity Multiplier The multiplier reflects the relationship between proven income and the ability to transact in cryptoassets, considering the declared usage profile:"},{"itens":["Personal use/occasional investment: 3.0×","Active individual investor/trader: 5.0×","Independent professional with crypto income (freelancers, consultants): 8.0×"]},{"st":"Risk Cap for Individuals"},{"p":"As an additional risk control measure, the final monthly limit for individuals, after applying all adjustments, may not exceed 10× (ten times) the proven monthly income, unless expressly approved by the Compliance Committee."},{"st":"This cap aims to:"},{"itens":["establish a clear and objective upper limit for individual exposure;","prevent disproportionate limits resulting from high multipliers and positive adjustments;","ensure alignment with the risk-based approach and AML principles."]},{"st":"Example:"},{"itens":["Client with monthly income of BRL 20,000","Applied multiplier: 8.0× = BRL 160,000","Positive adjustments: +90%","Calculated limit: BRL 304,000","10× cap: BRL 200,000","Final limit: BRL 200,000"]},{"p":"For limits above the 10× cap, the client may request an exceptional review, subject to Compliance analysis and Committee approval, with mandatory Enhanced Due Diligence (EDD) and robust documentation on source of funds and purpose of transactions."},{"st":"Adjustment Factor"},{"p":"The adjustment factor reflects specific client characteristics and may increase or decrease the limit."},{"st":"Positive adjustments:"},{"itens":["Net worth exceeding 12× monthly income: +30%","Positive history with Velaro (over 6 months without alerts): +30%","Complete tax return consistent with activity: +20%","Proven recurring crypto transactions: +40%"]},{"st":"Negative adjustments:"},{"itens":["New client: -20%","Income not documented or self-declared only: -40%","Apparent inconsistency between income and intended activity: case-by-case","Unclear transaction purpose: -30%","PEP without approved EDD: case-by-case"]},{"st":"Practical Example"},{"st":"An active individual investor with:"},{"itens":["Monthly income: BRL 20,000","Net worth: BRL 500,000","Complete tax return","No history with Velaro"]},{"st":"Calculation:"},{"itens":["Base: BRL 20,000 × 5.0 = BRL 100,000","Adjustments: +30% +20% -20% = +30%","Final limit: BRL 130,000"]},{"st":"Important Notes"},{"itens":["High-net-worth clients (above BRL 1 million) with modest income may have limits based on a percentage of net worth (e.g., 5%-10% per month), subject to Compliance approval.","Clients declaring crypto as their main income must provide statements from regulated platforms and, where applicable, tax returns.","Limits above BRL 500,000/month require Enhanced Due Diligence (EDD) and Compliance Committee approval."]}]},{"t":"4. Limit Granting and Review Process","blocks":[{"p":"Operational limits are defined after the execution of the contract and prior to the commencement of operations, based on the information and documents collected during the KYC process."},{"p":"The Compliance Area is responsible for validating documentation, applying the calculation methodology, and approving limits in accordance with the following internal approval levels:"},{"itens":["Up to BRL 1 million/month: direct approval by the Compliance Area;","Between BRL 1 million and BRL 5 million/month: detailed analysis by the Compliance Area;","Above BRL 5 million/month: mandatory approval by the Compliance Committee."]},{"p":"Clients classified as low risk and with complete and consistent documentation may have their limits approved through a simplified process."},{"p":"Limits are reviewed periodically, in accordance with the client’s risk level, or whenever the client’s records are updated as part of the KYC process, as well as in any other situation that justifies reassessment, including those listed below."},{"st":"Extraordinary reviews may occur at any time in situations such as:"},{"itens":["Significant changes in the client’s registration or corporate profile;","Material increase in transaction volume;","Identification of atypical transactions;","Client request for a limit increase."]},{"st":"4.1 Currency Limits and FX Conversion"},{"p":"Considering the volatility of the BRL/USDT exchange rate, Velaro adopts fixed limits per currency to simplify operations, provide clarity to clients, and reduce the need for frequent adjustments."},{"st":"4.1.1 Definition of Currency Caps"},{"p":"The approved monthly limit is broken down into fixed caps per currency, calculated based on a BRL/USDT reference rate defined at the time of limit approval."},{"st":"Example:"},{"itens":["Monthly limit: BRL 5,000,000","Reference rate: 5.30"]},{"st":"Breakdown:"},{"itens":["BRL cap: BRL 2,000,000","USDT cap: 560,000 USDT"]},{"p":"The client may use any combination of BRL and USDT, provided that both caps are respected simultaneously."},{"st":"4.1.2 Reference Rate"},{"p":"The BRL/USDT exchange rate is sourced from CoinMarketCap and fixed at the time of limit approval or review. It remains valid until the next review, unless a variation greater than 100% occurs (e.g., from ~5.30 to ~10.60), in which case the Operations Area may recalculate the caps."},{"st":"4.1.3 Operational Control"},{"st":"During the WhatsApp-based phase, the Operations Area maintains:"},{"itens":["A conversion table updated weekly;","A monitoring spreadsheet tracking usage against both caps simultaneously;","A Standard Operating Procedure (SOP) formalizing responsibilities and triggering alerts at 80% utilization."]}]},{"t":"5. Limit Increase Process","blocks":[{"p":"Clients may request a limit increase at any time. The request is reviewed by the Compliance Area, which verifies:"},{"itens":["The timeliness and consistency of documentation (valid for up to six months);","The relationship history and absence of AML/CTF alerts;","The compatibility between the requested volume and the demonstrated financial capacity."]},{"p":"A decision is issued within up to five business days. The increase may be approved through a simplified process when:"},{"itens":["The requested increase is up to 30% of the current limit;","The client has more than six months of history without recent alerts;","The final limit does not exceed BRL 3 million per month."]},{"p":"Requests exceeding these parameters, high-risk clients, or cases involving red flags require approval by the Compliance Committee."}]},{"t":"6. Procedures Upon Reaching or Exceeding Limits","blocks":[{"p":"When a client reaches 80% of the approved monthly limit, they are notified and informed by the Operations team about the possibility of requesting a limit increase. If the client reaches 100% of the limit, any new transactions exceeding the authorized amount are blocked until the beginning of the next cycle or until a limit increase is approved by the Compliance Area."},{"p":"The client is informed of the available alternatives and may choose to wait for the next period, request a limit review, or adjust their transactions to the remaining available balance."},{"p":"Transactions that, although within the limit, appear inconsistent with the client’s profile must be escalated by the Operations team to the Compliance Area for review, within a period of up to five business days. This review may include requests for additional documentation and will result in the preparation of a specific case file, regardless of the outcome."}]},{"t":"7. Exception Handling","blocks":[{"p":"On an exceptional basis, Velaro may approve limits that do not fully comply with the standard methodology, in duly justified situations, such as:"},{"itens":["Clients with differentiated structures (e.g., holdings, investment funds, family offices);","One-off transactions of significant value with a substantiated economic rationale;","Strategic clients with a controlled risk profile;","Specific cases approved by the Compliance Committee."]},{"st":"Approval of exceptions requires:"},{"itens":["A formal justification prepared by the Compliance Area;","Application of Enhanced Due Diligence (EDD);","Definition of compensating controls;","Documented approval by the Compliance Committee."]},{"p":"Exceptions are subject to enhanced monitoring and are granted for a defined period, not exceeding twelve months, and are periodically reassessed."}]},{"t":"8. Limit Reduction","blocks":[{"p":"Velaro may reduce operational limits whenever there is an increase in the client’s risk profile or when situations are identified that compromise the adequacy of the previously granted limit."},{"st":"8.1 Situations That May Lead to Limit Reduction"},{"st":"Limit reduction may occur in the following situations:"},{"itens":["Deterioration of the client’s financial condition;","Reclassification of the client to a higher risk category;","Identification of atypical or suspicious transactions;","Changes in the corporate structure (legal entities) or financial condition (individuals) that reduce transparency;","Repeated non-compliance with internal policies or resistance to providing clarifications;","Change of jurisdiction to high-risk or sanctioned countries;","Emergence of negative information in media or public databases;","Identification of links to undeclared PEPs or sanctioned persons/entities;","Use of limits in a manner inconsistent with the declared profile."]},{"st":"8.2 Reduction Process"},{"itens":["1. Identification: The Compliance or Operations Area identifies a situation as described in Section 8.1; 2. Analysis: The Compliance Area performs a documented technical analysis; 3. Prior notification: The client is notified and granted five business days to provide justification, except in cases of imminent risk; 4. Decision:","The Compliance Area may approve reductions of up to 50% of the current limit;","The Compliance Committee deliberates on reductions exceeding 50%; 5. Formalization: The decision is recorded in a case file and the limit is updated in the systems; 6. Final notification: The client is informed of the new limit and its effective date."]},{"st":"8.3 Temporary Suspension or Blocking"},{"p":"In situations of imminent risk (e.g., transactions inconsistent with the client profile, indications of illicit activity, refusal to cooperate, or inclusion on sanctions lists), the Compliance Area may determine the immediate suspension of the limit without prior notice, informing Senior Management within 24 hours."},{"p":"After six months, clients may request a limit review, provided they demonstrate that the situation has been regularized, submit updated documentation, and maintain a history free of alerts."}]},{"t":"9. Final Provisions","blocks":[{"p":"This Policy is mandatory for all areas involved in client management, operations, and internal controls. Failure to comply may result in internal disciplinary measures and any other applicable actions."},{"p":"The methodology established herein constitutes an essential tool for risk prevention, monitoring, and mitigation, reinforcing Velaro’s commitment to integrity, regulatory compliance, and responsible management of its operations.."}]},{"t":"10. Policy Review","blocks":[{"p":"This Policy shall be reviewed at least every two years by the Compliance Area to ensure it remains up to date and aligned with best practices. Extraordinary reviews may be conducted within a shorter timeframe whenever there are relevant regulatory changes, technological developments in the systems used, or changes in the company’s risk appetite. All updates must be submitted for review and approval by the Compliance Committee."}]}]}};

/* ----------------- HELPERS ----------------- */
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const safeUrl = (s) => (/^(https?:\/\/\S+|docs\/[a-z0-9\/_-]+\.pdf)$/i.test(s || "") ? s : "");
function norm(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
const stBadgeCom = (s) => s === "publicado" ? `<span class="badge vigente">${esc(u("published"))}</span>` : `<span class="badge em-revisao">${esc(u("planned"))}</span>`;
const stBadgeTrn = (s) => s === "realizado" ? `<span class="badge vigente">${esc(u("held"))}</span>` : s === "adiado" ? `<span class="badge em-revisao">${esc(u("postponed"))}</span>` : s === "cancelado" ? `<span class="badge revogado">${esc(u("cancelled"))}</span>` : `<span class="badge em-revisao">${esc(u("planned"))}</span>`;

function crumb(items) {
  return `<nav class="crumb" aria-label="${esc(u("crumb"))}">${items.map((it, i) => {
    const sep = i < items.length - 1 ? '<span class="sep">/</span>' : "";
    return it.href ? `<a href="${it.href}">${esc(it.label)}</a>${sep}` : `<span class="cur">${esc(it.label)}</span>${sep}`;
  }).join("")}</nav>`;
}
const crumbHome = () => ({ label: u("home"), href: "#/inicio" });
const notice = (title, body) => `<div class="notice">${svg("info")}<div><strong>${esc(title)}</strong><p>${esc(body)}</p></div></div>`;
const pageHead = (eyebrow, title, lead) => `<div class="page-head"><div class="page-eyebrow">${esc(eyebrow)}</div><h1 class="page-title">${esc(title)}</h1><p class="page-lead">${esc(lead)}</p></div>`;

function comCard(c) {
  const url = safeUrl(c.link);
  const dateTxt = c.data ? fmtData(c.data) : u("tbd");
  const inner = `<div class="com-head"><span class="com-num">${esc(mesLabel(c.m))}</span><span class="com-date">${esc(dateTxt)}</span>${stBadgeCom(c.status)}${c.inv ? `<span class="tag">${esc(uf("invite", c.inv))}</span>` : ""}</div>
    <h3>${esc(T(c.tema))}</h3>
    <p>${esc(T(c.desc))}</p>`;
  return url && c.status === "publicado"
    ? `<a class="com-card st-${c.status}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
    : `<a class="com-card st-${c.status}" href="#/comunicados">${inner}</a>`;
}

  pt: "Dúvidas sobre Compliance (inserir assunto aqui)",
  en: "Compliance questions (insert your subject here)"
};
function contactHref() {
  return "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(CONTACT_EMAIL) + "&su=" + encodeURIComponent(MAIL_SUBJECT[MAILLANG()]);
}
function renderNav(active) {
  const nav = document.getElementById("mainNav");
  nav.innerHTML = NAV.map(item => {
    if (item.group) return `<div class="nav-group-label">${item.icon ? svg(item.icon) : ""}<span>${esc(u(item.group))}</span></div>`;
    const keepIcon = item.route === "inicio";
    const ico = keepIcon ? svg(item.icon) : "";
    const noico = keepIcon ? "" : " no-ico";
    const label = u(item.key);
    if (item.contact) {
      return `<a class="nav-item nav-contact${noico}" href="${esc(contactHref())}" target="_blank" rel="noopener noreferrer">${ico}<span>${esc(label)}</span></a>`;
    }
    if (EM_DESENVOLVIMENTO.includes(item.route)) {
      return `<a class="nav-item em-breve${noico}" href="#/inicio" data-dev="${esc(label)}">${ico}<span>${esc(label)}</span><span class="nav-tag">${esc(u("soon"))}</span></a>`;
    }
    const cls = item.route === active ? "nav-item active" : "nav-item";
    return `<a class="${cls}${noico}" href="#/${item.route}">${ico}<span>${esc(label)}</span></a>`;
  }).join("");
}

const readMin = (id) => {
  const secs = (POL_CONTENT[id] || {})[LANG === "pt" ? "pt" : "en"] || [];
  let w = 0;
  secs.forEach(sc => { w += (sc.t || "").split(/\s+/).length; sc.blocks.forEach(b => { if (b.st) w += b.st.split(/\s+/).length; if (b.p) w += b.p.split(/\s+/).length; (b.itens || []).forEach(i => { w += i.split(/\s+/).length; }); }); });
  return Math.max(1, Math.round(w / 200));
};
const readTxt = (id) => uf("readMin", readMin(id));

    <span class="chev-pill">${svg("arrow")}</span></a>`;
}
function pageBiblioteca(area) {
  const lst = D.politicas.filter(p => p.area === area);
  const title = u(area === "compliance" ? "n_compliance" : "n_pldftp");
  return `
  ${crumb([crumbHome(), { label: title }])}
  ${pageHead(u("eyeLib"), title, u(area === "compliance" ? "libComplianceLead" : "libPldLead"))}
  <div class="ref-list">${lst.map(polRow).join("")}</div>
  <h2 class="sec-title plan-title">${esc(u("planHead"))}</h2>
  <p class="muted plan-lead">${esc(u("planLeadC"))}</p>
  <div class="ref-list">${PLANEJADAS.filter(x => x.area === area).map(x => `<div class="ref-row plan-row"><span class="ref-main"><span class="ref-title">${esc(T(x.titulo))}</span><span class="ref-desc">${esc(T(x.resumo))}</span></span><span class="badge em-revisao">${esc(u("planned"))}</span></div>`).join("")}</div>
  <p class="lib-foot">* ${esc(u("polNoteT"))}: ${esc(u("docLimited"))}</p>`;
}

const polById = (id) => D.politicas.find(p => p.id === id);
const docLang = () => (LANG === "pt" ? "pt" : "en");
const safeImg = (s) => (/^docs\/tables\/[a-z0-9_-]+\.png$/i.test(s || "") ? s : "");
function renderSecoes(secs) {
  return secs.map(s => {
    let h = s.t ? `<h2>${esc(s.t)}</h2>` : "";
    s.blocks.forEach(b => {
      if (b.st) h += `<h3>${esc(b.st)}</h3>`;
      if (b.p) h += `<p>${esc(b.p)}</p>`;
      if (b.itens) h += `<${b.ol ? "ol" : "ul"} class="doc-ul">${b.itens.map(i => `<li>${esc(i)}</li>`).join("")}</${b.ol ? "ol" : "ul"}>`;
      if (b.img && safeImg(b.img)) h += `<img class="doc-img" src="${esc(b.img)}" alt="" loading="lazy">`;
    });
    return `<div class="doc-section">${h}</div>`;
  }).join("");
}
function pageDoc(id) {
  const p = polById(id);
  if (!p) return pageNotFound();
  const areaKey = p.area === "compliance" ? "n_compliance" : "n_pldftp";
  const secs = (POL_CONTENT[p.id] || {})[docLang()] || [];
  const rel = (p.rel || []).map(polById).filter(Boolean);
  return `
  ${crumb([crumbHome(), { label: u(areaKey), href: "#/" + p.area }, { label: T(p.titulo) }])}
  <div class="doc-layout">
    <div class="doc-main">
      <div class="doc-title-block">
        <div class="dr-sub" style="font-size:13px"><span class="code-chip">${esc(u(areaKey))}</span> <span class="badge vigente">${esc(u("docVigente"))}</span> <span class="read-chip">${svg("clock")} ${esc(readTxt(p.id))}</span></div>
        <h1>${esc(T(p.titulo))}</h1>
        <p class="muted">${esc(T(p.resumo))}</p>
        <div class="doc-actions">
          <a class="btn" href="${esc(polUrl(p, "pt"))}" target="_blank" rel="noopener noreferrer">${svg("download")} ${esc(u("docDownload"))} (PT)</a>
          <a class="btn" href="${esc(polUrl(p, "en"))}" target="_blank" rel="noopener noreferrer">${svg("download")} ${esc(u("docDownload"))} (EN)</a>
        </div>
        ${LANG === "zh" ? `<p class="muted" style="margin-top:14px">${esc(u("docNoZh"))}</p>` : ""}
      </div>
      ${renderSecoes(secs)}
      <div class="doc-section">
        <h2>${esc(u("docHistory"))}</h2>
        <table class="vtable">
          <thead><tr><th>${esc(u("docHcol1"))}</th><th>${esc(u("docHcol2"))}</th><th>${esc(u("docHcol3"))}</th><th>${esc(u("docHcol4"))}</th></tr></thead>
          <tbody><tr><td class="vcode">${esc(p.versao)}</td><td>${esc(T(p.data))}</td><td>${esc(u("docApproverV"))}</td><td>${esc(u("docHdesc"))}</td></tr></tbody>
        </table>
      </div>
    </div>
    <div>
      <div class="meta-card">
        <h4>${esc(u("docControl"))}</h4>
        <div class="meta-row"><span class="ml">${esc(u("docVersion"))}</span><span class="mv">v${esc(p.versao)}</span></div>
        <div class="meta-row"><span class="ml">${esc(u("docStatus"))}</span><span class="mv">${esc(u("docVigente"))}</span></div>
        <div class="meta-row"><span class="ml">${esc(u("docApproval"))}</span><span class="mv">${esc(T(p.data))}</span></div>
        <div class="meta-row"><span class="ml">${esc(u("docApprover"))}</span><span class="mv">${esc(u("docApproverV"))}</span></div>
        <div class="meta-row"><span class="ml">${esc(u("docLang"))}</span><span class="mv">PT . EN</span></div>
      </div>
      ${rel.length ? `<div class="meta-card" style="margin-top:16px"><h4>${esc(u("docRelated"))}</h4><div class="rel-list">${rel.map(r => `<a class="rel-item" href="#/doc/${esc(r.id)}">${svg("link")}<span><span class="ri-t">${esc(T(r.titulo))}</span><span class="ri-c">${esc(u(r.area === "compliance" ? "n_compliance" : "n_pldftp"))}</span></span></a>`).join("")}</div></div>` : ""}
    </div>
  </div>`;
}

function pageMarco() {
  const m = D.marco;
  const block = (title, arr) => `<h2 class="sec-title">${esc(title)}</h2><div class="ref-list">${arr.map(x => {
    const url = safeUrl(x.url);
    const ym = String(T(x.ref)).match(/(\d{4})\s*$/);
    const body = `<span class="ref-main"><span class="ref-title">${esc(T(x.ref))}</span><span class="ref-desc">${esc(T(x.desc))}</span></span>`;
    return url
      ? `<a class="ref-row" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${body}<span class="chev-pill">${svg("arrow")}</span></a>`
      : `<div class="ref-row ref-static">${body}</div>`;
  }).join("")}</div>`;
  return `
  ${crumb([crumbHome(), { label: u("n_marco") }])}
  ${pageHead(u("eyeMarco"), u("n_marco"), u("marcoLead"))}
  ${block(u("marcoLeg"), m.legislacao)}
  ${block(u("marcoBcb"), m.bcb)}
  ${block(u("marcoObr"), m.obrigacoes)}
  <div style="margin-top:22px">${notice(u("marcoNoteT"), u("marcoNote"))}</div>`;
}

function pageGlossario() {
  return `
  ${crumb([crumbHome(), { label: u("glossTitle") }])}
  ${pageHead(u("eyeKnow"), u("glossTitle"), u("glossLead"))}
  <div class="filters">
    <label for="gFiltro">${esc(u("glossSearch"))}</label>
    <input type="search" id="gFiltro" placeholder="${esc(u("glossPh"))}" autocomplete="off" />
  </div>
  <div id="gLista"></div>`;
}
function renderGlossario() {
  const wrap = document.getElementById("gLista");
  if (!wrap) return;
  const q = norm(((document.getElementById("gFiltro") || {}).value || "").trim());
  const list = D.glossario
    .filter(g => !q || norm(T(g.t)).includes(q) || norm(T(g.d)).includes(q))
    .sort((a, b) => T(a.t).localeCompare(T(b.t), LOCALE[LANG]));
  if (!list.length) { wrap.innerHTML = notice(u("noTerm"), u("noTermP")); return; }
  const groups = [];
  list.forEach(g => {
    const l = LANG === "zh" ? "" : T(g.t).charAt(0).toUpperCase();
    let grp = groups[groups.length - 1];
    if (!grp || grp.l !== l) { grp = { l, items: [] }; groups.push(grp); }
    grp.items.push(g);
  });
  wrap.innerHTML = groups.map(gr => `${gr.l ? `<div class="gloss-letra">${esc(gr.l)}</div>` : ""}<div class="gloss-card">${gr.items.map(g =>
    `<div class="gloss-item"><dt>${esc(T(g.t))}</dt><dd>${esc(T(g.d))}</dd></div>`).join("")}</div>`).join("");
}

function pageFaq() {
  return `
  ${crumb([crumbHome(), { label: u("n_faq") }])}
  ${pageHead(u("eyeSup"), u("faqTitle"), u("faqLead"))}
  ${D.faq.map((f, i) => `<div class="faq-item" data-faq="${i}">
    <div class="faq-q" role="button" tabindex="0" aria-expanded="false">${esc(T(f.q))}<span class="chev">${svg("chev")}</span></div>
    <div class="faq-a"><div class="faq-a-inner">${esc(T(f.a))}</div></div>
  </div>`).join("")}`;
}

function pageNotFound() {
  return `<div class="page-head"><h1 class="page-title">${esc(u("notFound"))}</h1><p class="page-lead">${esc(u("notFoundP"))} <a href="#/inicio">${esc(u("back"))}</a></p></div>`;
}

/* ----------------- ROUTER ----------------- */
function router() {
  fecharDev();
  const hash = location.hash.replace(/^#\/?/, "") || "inicio";
  const route = hash.split("/")[0];
  const content = document.getElementById("content");
  let html = "", active = route;

  if (EM_DESENVOLVIMENTO.includes(route)) {
    const item = NAV.find(n => n.route === route);
    if (location.hash !== "#/inicio") { location.hash = "#/inicio"; return; }
    abrirDev(item ? u(item.key) : route);
    return;
  }
  switch (route) {
    case "inicio": html = pageInicio(); break;
    case "comunicados": html = pageComunicados(); break;
    case "treinamentos": html = pageTreinamentos(); break;
    case "compliance": html = pageBiblioteca("compliance"); break;
    case "pldftp": html = pageBiblioteca("pldftp"); break;
    case "doc": { const dp = polById(hash.split("/")[1]); html = pageDoc(hash.split("/")[1]); active = dp ? dp.area : ""; break; }
    case "marco-regulatorio": html = pageMarco(); break;
    case "glossario": html = pageGlossario(); break;
    case "faq": html = pageFaq(); break;
    default: html = pageNotFound(); active = "";
  }
  applyChrome();
  content.innerHTML = html;
  renderNav(active);
  window.scrollTo(0, 0);
  content.focus({ preventScroll: true });
  closeSidebar();
  bindPageEvents(route);
}

function bindPageEvents(route) {
  if (route === "comunicados") {
    const s = document.getElementById("fStatus"), a = document.getElementById("fAno");
    s.addEventListener("change", renderComList); a.addEventListener("change", renderComList);
    renderComList();
  }
  if (route === "glossario") {
    const gf = document.getElementById("gFiltro");
    gf.addEventListener("input", renderGlossario);
    renderGlossario();
  }
  if (route === "faq") {
    document.querySelectorAll(".faq-item").forEach(item => {
      const q = item.querySelector(".faq-q");
      const toggle = () => { item.classList.toggle("open"); q.setAttribute("aria-expanded", item.classList.contains("open") ? "true" : "false"); };
      q.addEventListener("click", toggle);
      q.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    });
  }
}

/* ----------------- BUSCA GLOBAL ----------------- */
function buildIndex() {
  const idx = [];
  D.comunicados.forEach(c => idx.push({ tipo: u("typeCom"), titulo: T(c.tema), sub: mesLabel(c.m) + " . " + T(c.desc), text: [T(c.tema), T(c.desc), mesLabel(c.m), c.num, c.inv || ""].join(" "), href: "#/comunicados", icon: "comunicados" }));
  D.treinamentos.forEach(t => idx.push({ tipo: u("typeTrn"), titulo: t.id + ". " + T(t.titulo), sub: T(t.descricao), text: [t.id, T(t.titulo), T(t.descricao), T(t.itens).join(" "), t.nota ? T(t.nota) : "", mesLabel(t.m)].join(" "), href: "#/treinamentos", icon: "treinamentos" }));
  D.glossario.forEach(g => idx.push({ tipo: u("typeGloss"), titulo: T(g.t), sub: T(g.d).slice(0, 90) + (T(g.d).length > 90 ? "..." : ""), text: T(g.t) + " " + T(g.d), href: "#/glossario", icon: "glossario" }));
  [...D.marco.legislacao, ...D.marco.bcb, ...D.marco.obrigacoes].forEach(r => idx.push({ tipo: u("typeMarco"), titulo: T(r.ref), sub: T(r.desc), text: T(r.ref) + " " + T(r.desc), href: "#/marco-regulatorio", icon: "marco" }));
  D.politicas.forEach(p => idx.push({ tipo: u("eyeLib"), titulo: T(p.titulo), sub: T(p.resumo), text: [T(p.titulo), T(p.resumo), u(p.area === "compliance" ? "n_compliance" : "n_pldftp")].join(" "), href: "#/doc/" + p.id, icon: p.area }));
  D.faq.forEach(f => idx.push({ tipo: u("typeFaq"), titulo: T(f.q), sub: T(f.a).slice(0, 90) + "...", text: T(f.q) + " " + T(f.a), href: "#/faq", icon: "faq" }));
  return idx;
}
let SEARCH_INDEX = [];
function runSearch(q) {
  const box = document.getElementById("searchResults");
  const query = norm((q || "").trim());
  if (!query) { box.innerHTML = `<div class="sr-empty">${esc(u("searchEmpty"))}</div>`; return; }
  const hits = SEARCH_INDEX.filter(i => norm(i.text).includes(query));
  if (!hits.length) { box.innerHTML = `<div class="sr-empty">${esc(u("searchNone"))} "${esc(q)}".</div>`; return; }
  box.innerHTML = hits.slice(0, 20).map((h, i) => `<a class="sr-item${i === 0 ? " sel" : ""}" href="${h.href}" data-sr>
    <span class="sr-ico">${svg(h.icon)}</span>
    <span><span class="sr-t">${esc(h.titulo)}</span><span class="sr-c">${esc(h.sub)}</span></span>
    <span class="sr-cat">${esc(h.tipo)}</span>
  </a>`).join("");
  box.querySelectorAll("[data-sr]").forEach(a => a.addEventListener("click", closeSearch));
}
function openSearch() { const o = document.getElementById("searchOverlay"); o.classList.add("open"); o.setAttribute("aria-hidden", "false"); const i = document.getElementById("overlaySearch"); i.focus(); if (!i.value) runSearch(""); }
function closeSearch() { const o = document.getElementById("searchOverlay"); o.classList.remove("open"); o.setAttribute("aria-hidden", "true"); }

/* ----------------- SIDEBAR MOBILE ----------------- */
function openSidebar() { document.getElementById("sidebar").classList.add("open"); }
function closeSidebar() { document.getElementById("sidebar").classList.remove("open"); }

/* ----------------- CHROME (textos fixos e idioma) ----------------- */
function applyChrome() {
  document.documentElement.lang = HTMLLANG[LANG];
  document.title = u("docTitle");
  document.getElementById("brandSub").textContent = u("sub");
  document.getElementById("brandLink").setAttribute("aria-label", u("docTitle"));
  document.getElementById("globalSearch").placeholder = u("searchPh");
  document.getElementById("globalSearch").setAttribute("aria-label", u("searchPh"));
  document.getElementById("overlaySearch").placeholder = u("searchPh2");
  document.getElementById("menuToggle").setAttribute("aria-label", u("menuOpen"));
  document.getElementById("mainNav").setAttribute("aria-label", u("mainNav"));
  document.getElementById("sideFootA").textContent = u("sideFootA");
  document.getElementById("sideFootB").textContent = u("sideFootB");
  document.querySelectorAll("#langBox button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  SEARCH_INDEX = buildIndex();
}

/* ----------------- INIT ----------------- */
function init() {
  window.addEventListener("hashchange", router);
  document.getElementById("devModal").addEventListener("click", (e) => { if (e.target.id === "devModal") fecharDev(); });
  document.getElementById("devOk").addEventListener("click", fecharDev);
  document.getElementById("devClose").addEventListener("click", fecharDev);

  document.getElementById("mainNav").addEventListener("click", (e) => {
    const a = e.target.closest("a"); if (!a) return;
    if (a.dataset.dev) { e.preventDefault(); closeSidebar(); abrirDev(a.dataset.dev); }
  });
  document.getElementById("langBox").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-lang]"); if (!b) return;
    LANG = b.dataset.lang;
    try { localStorage.setItem("velaro_hub_lang", LANG); } catch (x) {}
    fecharDev();
    const keep = window.scrollY;
    router();
    window.scrollTo(0, keep);
  });

  document.getElementById("globalSearch").addEventListener("focus", openSearch);
  document.getElementById("globalSearch").addEventListener("input", (e) => { openSearch(); document.getElementById("overlaySearch").value = e.target.value; runSearch(e.target.value); });
  document.getElementById("overlaySearch").addEventListener("input", (e) => runSearch(e.target.value));
  document.getElementById("searchClose").addEventListener("click", closeSearch);
  document.getElementById("searchOverlay").addEventListener("click", (e) => { if (e.target.id === "searchOverlay") closeSearch(); });

  document.getElementById("menuToggle").addEventListener("click", openSidebar);
  document.getElementById("sidebarBackdrop").addEventListener("click", closeSidebar);

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeSearch(); fecharDev(); }
    if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
  });

  router();
}
document.addEventListener("DOMContentLoaded", init);

  </script>
