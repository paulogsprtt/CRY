va, e situações de abuso ou desrespeito devem ser reportadas à Área de Compliance ou aos canais de denúncia, com garantia de confidencialidade."},{"p":"É permitida a contratação de pessoas com vínculo familiar ou afetivo, desde que a relação seja previamente declarada e não haja subordinação direta ou indireta, nem influência em processos de seleção, avaliação, promoção ou remuneração."},{"p":"Nosso compromisso é garantir igualdade de oportunidades, segurança psicológica e condições para que cada colaborador desenvolva seu potencial."}]},{"t":"6. Conflitos de Interesses","blocks":[{"p":"Conflitos de interesse ocorrem quando interesses pessoais, familiares, financeiros ou externos podem comprometer, ou aparentar comprometer, a imparcialidade de decisões em nome da Velaro."},{"p":"Todos devem identificar e declarar preventivamente potenciais conflitos, como:"},{"itens":["Relações familiares ou afetivas que possam influenciar decisões de negócios;","Participação em empresas que mantenham vínculo comercial com a Velaro;","Atividades paralelas que concorram com as funções exercidas;","Recebimento de benefícios que afetem a imparcialidade."]},{"p":"O Comitê de Compliance analisará as situações e poderá aplicar medidas mitigadoras, como substituição de responsabilidades ou restrição de acesso a informações. A omissão na comunicação de conflitos pode resultar em medidas disciplinares, que variam de advertência a desligamento."},{"p":"Em caso de dúvida, o colaborador deve contatar imediatamente a Área de Compliance."}]},{"t":"7. Relacionamento com Clientes, Parceiros e Fornecedores","blocks":[{"p":"As relações externas da Velaro devem ser pautadas pela honestidade, transparência e tratamento justo, sempre em conformidade com a legislação aplicável e com as melhores práticas internacionais."},{"st":"No relacionamento com clientes, a Velaro compromete-se a:"},{"itens":["Fornecer informações claras e verdadeiras sobre serviços, riscos e custos;","Garantir acesso às informações de ativos e transações, quando aplicável;","Manter padrões elevados de segurança em serviços de custódia e transferência;","Adotar planos de continuidade que assegurem acesso e propriedade de recursos em caso de interrupção das atividades;","Oferecer canais de reclamação justos, ágeis e devidamente registrados."]},{"st":"No relacionamento com parceiros e fornecedores, a Velaro:"},{"itens":["Seleciona terceiros com base em critérios objetivos, técnicos e éticos;","Realiza due diligence proporcional ao risco;","Exige cláusulas contratuais que assegurem conformidade legal, proteção de dados e integridade;","Monitora continuamente o alinhamento com seus princípios."]},{"p":"A Velaro aplica ainda procedimentos rigorosos de KYC (Know Your Customer), CDD (Customer Due Diligence), KYP ( Know Your Partner) e KYT (Know Your Transaction), fundamentais para prevenir lavagem de dinheiro, financiamento do terrorismo e outros crimes financeiros."}]},{"t":"8. Prevenção à Corrupção, Suborno e Crimes Financeiros","blocks":[{"p":"A Velaro conduz seus negócios de forma íntegra e em conformidade com as leis anticorrupção, de prevenção à lavagem de dinheiro e ao financiamento do terrorismo."},{"st":"São proibidas práticas como:"},{"itens":["Oferta, promessa, solicitação ou recebimento de qualquer vantagem para influenciar decisões de negócios ou autoridades;","Pagamentos de facilitação ou transferências destinadas a acelerar processos;","Uso de documentos falsos ou meios indevidos para dissimular operações."]},{"p":"Todos os pagamentos, contratos e registros contábeis devem refletir fielmente a realidade, sendo vedados caixa paralelo, registros fictícios ou omissão de informações."},{"p":"As interações com agentes públicos devem ser legítimas, transparentes e previamente autorizadas pela Área de Compliance. É vedado oferecer, prometer ou conceder vantagens de qualquer natureza a agentes públicos, partidos políticos ou candidatos, direta ou indiretamente."},{"p":"Qualquer suspeita de irregularidade deve ser comunicada de imediato à Área de Compliance ou ao canal de denúncias."}]},{"t":"9. Presentes, Patrocínios Hospitalidade, Brindes e","blocks":[{"p":"Presentes, brindes e hospitalidades só podem ser aceitos ou oferecidos quando tiverem valor modesto, forem ocasionais, compatíveis com padrões de mercado e não criarem expectativa de reciprocidade ou favorecimento."},{"p":"Para orientar sua aplicação prática, observam-se as seguintes diretrizes:"},{"itens":["Brindes institucionais (como agendas, canetas, itens promocionais de baixo valor) são permitidos, desde que distribuídos de forma generalizada e sem intuito de influenciar decisões de negócios.","Presentes e hospitalidades têm como referência os limites de: até R$ 500,00 por pessoa, por evento no Brasil, e até USD 150,00 no exterior. Valores superiores exigem autorização prévia da Área de Compliance."]},{"p":"Caso não seja possível recusar item acima do limite, este deve ser encaminhado à Área de Compliance para destinação institucional."},{"st":"É proibido, em qualquer circunstância:"},{"itens":["Oferecer ou receber presentes em dinheiro ou equivalentes (como cartões-presente ou criptoativos);","Aceitar benefícios que comprometam a imparcialidade;","Oferecer presentes ou hospitalidades a agentes públicos."]},{"p":"Patrocínios para eventos só poderão ser aceitos ou oferecidos se tiverem finalidade profissional legítima, com aprovação prévia e registro formal."}]},{"t":"10. Proteção de Confidencialidade Dados, Privacidade e","blocks":[{"p":"A Velaro assegura o tratamento de dados pessoais em conformidade com a Lei Geral de Proteção de Dados (LGPD) e demais legislações aplicáveis, bem como em alinhamento com padrões internacionais de privacidade."},{"p":"Dados de clientes, parceiros e colaboradores só podem ser coletados, acessados e utilizados para finalidades legítimas, específicas e previamente autorizadas, sendo vedado qualquer uso ou compartilhamento indevido."},{"p":"Informações estratégicas, comerciais, tecnológicas ou financeiras da empresa são consideradas confidenciais e somente podem ser acessadas ou divulgadas com autorização expressa e dentro dos limites das políticas internas."},{"p":"A proteção de dados e o sigilo das informações são responsabilidades individuais de todos que atuam em nome da Velaro e constituem pilares essenciais para a preservação da confiança de nossos clientes, parceiros e da sociedade."}]},{"t":"11. Segurança Tecnológicos da Informação e Ativos","blocks":[{"p":"A infraestrutura tecnológica da Velaro é fundamental para a proteção de dados e para a continuidade segura das operações. O uso de sistemas, redes e dispositivos corporativos deve estar sempre em conformidade com as políticas internas de segurança da informação, privacidade e uso aceitável."},{"st":"É expressamente proibido:"},{"itens":["Compartilhar credenciais, senhas ou tokens de autenticação;","Utilizar e-mails ou sistemas corporativos para fins ilícitos, pessoais ou incompatíveis com a atividade profissional;","Desrespeitar as normas de classificação e tratamento da informação, incluindo confidencialidade e sigilo de dados de clientes;","Utilizar os sistemas internos para veiculação de mensagens ofensivas, discriminatórias, obscenas, correntes ou qualquer conteúdo impróprio."]},{"p":"Cada colaborador deve adotar medidas de autoproteção no uso da tecnologia, incluindo:"},{"itens":["Evitar conexões em redes Wi-Fi públicas ou inseguras;","Não cadastrar ou utilizar o e-mail corporativo em sites, aplicativos ou serviços não relacionados ao trabalho;","Manter sistemas e aplicativos corporativos sempre atualizados;","Utilizar autenticação multifator em todos os acessos corporativos."]},{"p":"As senhas de acesso aos sistemas internos são pessoais e intransferíveis, devendo ser utilizadas exclusivamente para o exercício das atividades profissionais. O uso dos sistemas, redes e dispositivos da empresa pode ser monitorado em conformidade com a lei e com as políticas internas, não devendo o colaborador ter expectativa de privacidade nesse contexto."},{"p":"O patrimônio intelectual da Velaro, incluindo softwares, códigos, bases de dados, metodologias, modelos, marcas e informações estratégicas, possui valor estratégico e é de uso exclusivo da empresa, estando protegido pelas legislações aplicáveis no Brasil e no exterior."},{"p":"Incidentes de segurança, como perda ou roubo de dispositivos, acessos não autorizados, tentativas de phishing, ataques cibernéticos ou suspeitas de vazamento de dados, devem ser reportados imediatamente ao time responsável, por meio do canal oficial de cibersegurança: cybersecurity@bsos.co"}]},{"t":"12. Comunicação Externa e Mídias Sociais","blocks":[{"p":"A reputação da Velaro é um dos seus principais ativos. Por isso, a comunicação externa deve ser responsável, estratégica e alinhada à identidade institucional da empresa."},{"p":"Somente porta-vozes oficialmente designados podem se manifestar em nome da Velaro perante a imprensa, órgãos reguladores, investidores ou o público em geral. Declarações em entrevistas, eventos ou publicações exigem aprovação prévia da área de Comunicação ou da liderança responsável."},{"p":"Colaboradores não estão autorizados a falar em nome da empresa, salvo delegação formal. Nas redes sociais, cada pessoa é livre para opinar, mas deve deixar claro que se trata de manifestação pessoal, evitando:"},{"itens":["Divulgar informações internas ou confidenciais;","Usar logotipos ou marcas sem autorização;","Fazer comentários que prejudiquem a reputação da empresa, de colegas ou parceiros;","Associar perfis pessoais a temas sensíveis sem indicar que se trata de opinião individual."]},{"p":"Ao identificar dúvidas públicas sobre a Velaro, o colaborador deve encaminhá-las à área de Comunicação ou à Área de Compliance, sem responder por conta própria."}]},{"t":"13. Canal de Denúncias e Garantia de Não Retaliação","blocks":[{"p":"A Velaro mantém canais de denúncia independentes, seguros e confidenciais, por meio dos quais colaboradores, fornecedores, clientes, parceiros e quaisquer terceiros podem reportar violações reais ou potenciais deste Código, de políticas internas ou da legislação vigente."},{"st":"Os canais disponíveis são:"},{"itens":["E-mail dedicado: canaldedenuncias.br@bsos.co","Formulário anônimo online: https://forms.gle/WFYkNehAcxpkobba7","Contato direto com a Área de Compliance."]},{"p":"As denúncias podem ser feitas de forma anônima ou identificada, sempre com a garantia de confidencialidade. Todas as manifestações recebidas serão analisadas com independência, imparcialidade e o devido rigor, podendo envolver, quando necessário, áreas especializadas ou investigação externa."},{"p":"A empresa proíbe expressamente qualquer forma de retaliação contra pessoas que, de boa-fé, realizem uma denúncia ou cooperem com processos de investigação. Essa proteção se aplica independentemente de a denúncia vir a se confirmar."},{"p":"As informações obtidas por meio do canal de denúncias serão registradas, tratadas com rastreabilidade e utilizadas exclusivamente para a apuração dos fatos, adoção de medidas corretivas e fortalecimento contínuo da integridade da empresa."}]},{"t":"14. Investigação e Consequências de Violações","blocks":[{"p":"Todas as denúncias recebidas pela Velaro serão analisadas com seriedade e conduzidas de forma independente, justa e imparcial. A Área de Compliance será responsável por coordenar as investigações, podendo envolver outras áreas especializadas ou, quando necessário, consultorias externas independentes."},{"p":"Durante o processo investigativo, será assegurada a confidencialidade das informações, a proteção da identidade do denunciante (quando anônimo ou identificado sob sigilo) e o direito de defesa e contraditório à pessoa ou área envolvida."},{"p":"As violações comprovadas deste Código de Conduta, de políticas internas ou da legislação vigente poderão resultar em medidas disciplinares proporcionais à gravidade da conduta, incluindo:"},{"itens":["Orientação formal ou treinamento adicional;"]},{"p":"Advertência verbal ou escrita; Suspensão; Rescisão contratual ou desligamento; Adoção de medidas cíveis, administrativas ou criminais, incluindo comunicação imediata às autoridades competentes, quando aplicável."},{"itens":[]},{"p":"A decisão sobre as consequências caberá à liderança responsável em conjunto com o Comitê de Compliance, sempre considerando os fatos apurados, a gravidade da infração, a reincidência e o impacto causado."},{"p":"O objetivo da Velaro, ao conduzir investigações e aplicar medidas, não é apenas sancionar, mas também corrigir falhas, reforçar a cultura de integridade e prevenir a repetição de condutas inadequadas."}]},{"t":"15. Treinamento e Comunicação Interna","blocks":[{"p":"A Velaro mantém um programa estruturado de treinamentos em ética, integridade e compliance. Todos os colaboradores devem participar das capacitações obrigatórias, que incluem este Código e temas como AML/CTF, anticorrupção e segurança da informação."},{"p":"A empresa também promove ações de comunicação interna e conscientização contínua, como campanhas, materiais educativos e mensagens institucionais, reforçando a importância da integridade no dia a dia."},{"p":"A participação nos treinamentos será registrada para fins de auditoria e controle. Adicionalmente, todos devem reafirmar periodicamente sua adesão ao Código por meio de termo de aceite formal."}]},{"t":"16. Gestão do Documento e Revisões","blocks":[{"p":"A Área de Compliance é responsável por manter este Código atualizado e acessível. Ele será revisado a cada dois anos, ou antes, se houver mudanças regulatórias ou institucionais relevantes."},{"p":"Exceções somente poderão ser autorizadas pelo Comitê de Compliance, mediante decisão formal e registro documentado."}]}],"en":[{"t":"Message from Management","blocks":[{"p":"At Velaro, we believe that ethics and integrity are not just abstract principles, but essential foundations for building and sustaining our journey. We operate in a dynamic and constantly evolving sector, where technology, finance, and people connect in unprecedented ways. This context demands high standards of conduct, responsibility, and transparency."},{"p":"This Code of Conduct represents more than a set of rules: it embodies the values that guide our choices, shape our culture, and uphold the trust placed in us by clients, partners, investors, and society at large."},{"p":"We invite every employee, supplier, and partner to adopt this Code as a daily reference for behavior. By doing so, we not only protect Velaro’s reputation but also strengthen our credibility, expand the positive impact of our actions, and ensure sustainable, solid, and responsible growth."},{"st":"Senior Management"}]},{"t":"1. Introduction and Purpose","blocks":[{"p":"This Code of Conduct defines the principles and standards of behavior expected from all individuals acting on behalf of Velaro (“Company”), regardless of hierarchical level or function. Its purpose is to guide our activities, ensuring that every decision is aligned with ethics, integrity, and transparency."},{"p":"Velaro expects all employees and partners to:"},{"itens":["Act with honesty, diligence, and professionalism under all circumstances;","Comply with applicable laws, rules, and regulations - both national and international - as well as recognized market best practices;","Treat clients, suppliers, and other stakeholders fairly, responsibly, and respectfully."]},{"p":"This Code also reflects Velaro’s commitment to adopting international governance and compliance best practices, adapted to the specificities of the digital assets industry and blockchain technology."}]},{"t":"2. Principles and Values of Velaro","blocks":[{"p":"Velaro’s values define how we conduct our business, guide our strategic decisions, and shape the way we relate to employees, clients, partners, and society. These values are aligned with the principles set forth in Law No. 14,478/2022 and the applicable regulations for the virtual assets sector, ensuring that our growth remains responsible, sustainable, and consistent with the highest regulatory and governance standards."},{"p":"The following principles guide our activities:"},{"itens":["Regulatory compliance: adherence to applicable laws, effective internal controls, and periodic audits.","Governance and accountability: transparent decision-making, segregation of duties, clear roles, and leaders committed to ethical standards.","Client protection: clear information on services, risks, and costs, along with asset segregation and secure custody.","Risk management and security: continuous identification and monitoring of operational, technological, and legal risks, including fraud and financial crime prevention.","Transparency: accessible communication and accountability to clients, partners, authorities, and society.","Integrity in relationships: honest, fair, and respectful conduct in all internal and external interactions.","Responsible innovation: development and adoption of technologies that are secure, sustainable, and aligned with regulatory and social impacts."]}]},{"t":"3. Scope and Recipients","blocks":[{"p":"This Code of Conduct applies to all those who represent or act on behalf of Velaro: employees at all levels, officers, interns, service providers, suppliers, business partners, and any other third parties in any jurisdiction."},{"p":"Compliance with this Code is mandatory and a condition for maintaining employment or contractual relationships. Velaro expects each representative to:"},{"itens":["Demonstrate ethical, honest, and diligent conduct in all interactions;","Comply with applicable legal and regulatory requirements, particularly those related to virtual assets;","Treat clients, suppliers, and partners fairly, transparently, and responsibly, thereby strengthening mutual trust."]}]},{"t":"4. Governance and Responsibilities","blocks":[{"p":"Velaro’s integrity governance ensures that ethics, compliance, and transparency are present across all levels of the organization, with clearly defined roles:"},{"itens":["Compliance Committee - Approves this Code and its revisions, assesses exceptions, oversees the Compliance Program, and ensures compliance considerations are embedded in strategic decisions.","Compliance Department - Provides guidance to employees and partners, conducts training, monitors internal rules, investigates violations, and liaises with regulatory authorities, ensuring alignment with Law No. 14,478/2022 and Central Bank regulations.","Leadership - Must lead by example, ensure teams understand and comply with the Code, promote a respectful workplace, and respond promptly to irregularities, with accountability and clear assignment of responsibilities.","Employees, service providers, and third parties - Must know and comply with this Code, participate in mandatory training, and immediately report any suspected violations."]},{"p":"Integrity is a collective commitment: compliance is not only the duty of the Compliance Department, but of everyone who is part of Velaro."}]},{"t":"5. Conduct in the Workplace","blocks":[{"p":"Velaro maintains a healthy, safe, inclusive, and respectful work environment. There is no room for discrimination, harassment, intimidation, or retaliation. Differences must be addressed constructively, and situations of abuse or disrespect must be reported to the Compliance Department or whistleblowing channels, with guaranteed confidentiality."},{"p":"Hiring individuals with family or personal relationships is permitted, provided that such relationships are declared in advance and reviewed by the Compliance Committee. In such cases, mitigating measures must be adopted - including alternative reporting lines - to ensure independence and prevent influence in recruitment, evaluation, promotion, or compensation processes."},{"p":"Our commitment is to guarantee equal opportunities, psychological safety, and conditions for every employee to reach their full potential."}]},{"t":"6. Conflicts of Interest","blocks":[{"p":"Conflicts of interest arise when personal, family, financial, or external interests may compromise - or appear to compromise - the impartiality of decisions made on behalf of Velaro."},{"p":"All individuals must identify and proactively declare potential conflicts, such as:"},{"itens":["Family or personal relationships that may influence business decisions;","Financial interests in companies with a commercial relationship with Velaro;","Outside professional activities that may compete with or interfere with responsibilities at Velaro;","Receipt of benefits that could affect impartiality."]},{"p":"The Compliance Committee will review such situations and may implement mitigating measures, such as reassigning responsibilities or restricting access to information. Failure to disclose conflicts may result in disciplinary measures ranging from warnings to dismissal."},{"p":"In case of doubt, employees must immediately contact the Compliance Department."}]},{"t":"7. Relationship with Clients, Partners, and Suppliers","blocks":[{"p":"Velaro’s external relationships must be guided by honesty, transparency, and fairness, always in compliance with applicable laws and international best practices."},{"p":"In dealing with clients, Velaro is committed to:"},{"itens":["Providing clear and truthful information on services, risks, and costs;","Ensuring access to information regarding assets and transactions, where applicable;","Maintaining high security standards in custody and transfer services;","Adopting business continuity plans to ensure access and ownership of resources in the event of business interruption; Offering complaint channels that are fair, timely, and properly documented."]},{"p":"In dealing with business partners and suppliers, Velaro:"},{"itens":["Selects third parties based on objective, technical, and ethical criteria;","Conducts risk-based due diligence;","Requires contractual clauses ensuring legal compliance, data protection, and integrity standards;","Continuously monitors alignment with Velaro’s principles."]},{"p":"Velaro also applies rigorous KYC (Know Your Customer), CDD (Customer Due Diligence), KYP (Know Your Partner), and KYT (Know Your Transaction) procedures, which are essential to preventing money laundering, terrorist financing, and other financial crimes."}]},{"t":"8. Prevention of Corruption, Bribery, and Financial Crimes","blocks":[{"p":"Velaro conducts its business with integrity and in compliance with anti-corruption, anti-money laundering, and counter-terrorism financing laws."},{"p":"Prohibited practices include:"},{"itens":["Offering, promising, requesting, or receiving any advantage to influence business or official decisions;","Facilitation payments or transfers intended to accelerate processes;","Use of falsified documents or improper means to conceal transactions."]},{"p":"All payments, contracts, and accounting records must faithfully reflect the underlying transactions. Off-the-books accounts, fictitious entries, or omissions are strictly prohibited."},{"p":"Interactions with public officials must be legitimate, transparent, and previously authorized by the Compliance Department. Offering, promising, or granting any form of advantage to public officials, political parties, or candidates - directly or indirectly - is strictly prohibited."},{"p":"Any suspected irregularity must be immediately reported to the Compliance Department or through the whistleblowing channel."}]},{"t":"9. Gifts, Hospitality, Promotional Items, and Sponsorships","blocks":[{"p":"Gifts, promotional items, and hospitality may only be accepted or offered if they are modest in value, occasional, aligned with market practices, and do not create expectations of reciprocity or undue influence."},{"p":"For practical application, the following guidelines apply:"},{"itens":["Promotional items (such as notebooks, pens, or low-value branded merchandise) are acceptable if distributed broadly and not intended to influence business decisions.","Gifts and hospitality are subject to the following limits: up to BRL 500 per person, per event in Brazil, and up to USD 150 abroad. Higher values require prior authorization from the Compliance Department."]},{"p":"If it is not possible to decline an item above the limit, it must be forwarded to the Compliance Department for institutional allocation."},{"p":"It is strictly prohibited to:"},{"itens":["Offer or accept gifts in cash or equivalents (such as gift cards or crypto assets);","Accept benefits that compromise impartiality;","Offer gifts or hospitality to public officials without prior authorization."]},{"p":"Sponsorships for events may only be accepted or offered when linked to legitimate professional purposes, with prior approval and proper documentation."}]},{"t":"10. Data Protection, Privacy, and Confidentiality","blocks":[{"p":"Velaro processes personal data in compliance with the Brazilian General Data Protection Law (LGPD), other applicable legislation, and international privacy standards."},{"p":"Data relating to clients, partners, and employees may only be collected, accessed, or used for legitimate, specific, and authorized purposes, and any misuse or unauthorized sharing is strictly prohibited."},{"p":"Strategic, commercial, technological, or financial information of the company is considered confidential and may only be accessed or disclosed with express authorization and within the limits of internal policies."},{"p":"Data protection and information confidentiality are individual responsibilities of all those acting on behalf of Velaro and are essential to maintaining the trust of clients, partners, and society."}]},{"t":"11. Information Security and Technological Assets","blocks":[{"p":"Velaro’s technological infrastructure is essential for the secure continuity of operations and the protection of information.. The use of corporate systems, networks, and devices must always comply with internal policies on information security, privacy, and acceptable use. It is strictly prohibited to:"},{"itens":["Share credentials, passwords, or authentication tokens;","Use corporate emails or systems for illicit, personal, or non-professional purposes;","Disregard rules on information classification and handling, including confidentiality and client data protection;","Use internal systems to circulate offensive, discriminatory, obscene, chain messages, or otherwise inappropriate content."]},{"p":"Employees must adopt self-protection measures when using technology, including:"},{"itens":["Avoiding public or unsecured Wi-Fi connections;","Not registering or using corporate email on websites, applications, or services unrelated to work;","Keeping corporate systems and applications up to date;","Enabling multi-factor authentication for all corporate access."]},{"p":"System passwords are personal and non-transferable and must be used exclusively for professional purposes. The use of the company’s systems, networks, and devices may be monitored in accordance with the law and internal policies; therefore, employees should not expect privacy in this context."},{"p":"Velaro’s intellectual property - including software, code, databases, methodologies, models, trademarks, and strategic information - is a valuable strategic asset, reserved for the exclusive use of the company and protected under applicable laws in Brazil and abroad."},{"p":"Security incidents - such as loss or theft of devices, unauthorized access, phishing attempts, cyberattacks, or suspected data leaks - must be reported immediately to the responsible team via the official cybersecurity channel: cybersecurity.br@bsos.co."}]},{"t":"12. External Communication and Social Media","blocks":[{"p":"Velaro’s reputation is one of its most valuable assets. External communication must therefore be responsible, strategic, and aligned with the company’s institutional identity."},{"p":"External communications on behalf of Velaro - whether to the press, regulators, investors, or the general public - may only be made by senior leadership or by employees explicitly authorized for that purpose. Any public statements in interviews, events, or publications must receive prior approval from the relevant leader or the Compliance/Communications team."},{"p":"Employees are not authorized to speak on behalf of the company unless formally delegated. On social media, individuals are free to express personal opinions, but must make it clear that such views are their own and not those of Velaro, while avoiding:"},{"itens":["Sharing internal or confidential information;","Using Velaro’s logos, trademarks, or images without authorization;","Making comments that could harm the reputation of the company, colleagues, clients, or partners;","Associating personal profiles with sensitive sector topics without clarifying that it reflects a personal opinion."]},{"p":"If employees encounter public inquiries about Velaro, they must refer them to the Communications area or the Compliance Department and refrain from responding on their own."}]},{"t":"13. Whistleblowing Channel and Non-Retaliation Guarantee","blocks":[{"p":"Velaro maintains independent, secure, and confidential whistleblowing channels through which employees, suppliers, clients, partners, and any third parties may report actual or potential violations of this Code, internal policies, or applicable law."},{"p":"The available channels are:"},{"itens":["Dedicated email: canaldedenuncias.br@bsos.co","Anonymous online form: https://forms.gle/okSV1AhW5w4WJxA59","Direct contact with the Compliance Department."]},{"p":"Reports may be made anonymously or identified, always with confidentiality guaranteed. All submissions will be reviewed independently, impartially, and rigorously, and may involve specialized areas or external investigations if necessary."},{"p":"The company expressly prohibits any form of retaliation against individuals who, in good faith, submit a report or cooperate in investigations. This protection applies regardless of whether the report is ultimately substantiated."},{"p":"Information received through whistleblowing channels will be recorded, tracked, and used exclusively for fact-finding, corrective measures, and the continuous strengthening of the company’s integrity."}]},{"t":"14. Investigations and Consequences. of Violations","blocks":[{"p":"All reports received by Velaro will be taken seriously and investigated independently, fairly, and impartially. The Compliance Department is responsible for coordinating investigations, and may involve other specialized areas or independent external consultants when appropriate."},{"p":"During investigations, confidentiality of information will be ensured, the whistleblower’s identity will be protected (whether anonymous or disclosed under confidentiality), and the rights of defense and due process will be guaranteed to the individuals or areas involved."},{"p":"Confirmed violations of this Code of Conduct, internal policies, or applicable law may result in disciplinary measures proportionate to the severity of the conduct, including:"},{"itens":["Formal guidance or additional training;","Verbal or written warning;","Suspension;","Contract termination or dismissal;","Civil, administrative, or criminal actions, including immediate notification of the relevant authorities, where applicable."]},{"p":"Decisions on disciplinary measures will be made jointly by the responsible leadership and the Compliance Committee, considering the facts, severity, recurrence, and impact of the misconduct."},{"p":"Velaro’s goal in conducting investigations and applying measures is not only to sanction but also to correct failures, reinforce a culture of integrity, and prevent recurrence."}]},{"t":"15. Training and Internal Communication","blocks":[{"p":"Velaro maintains a structured program of training in ethics, integrity, and compliance. All employees must participate in mandatory training, which covers this Code as well as topics such as AML/CTF, anti-corruption, and information security."},{"p":"The company also promotes ongoing internal communication and awareness initiatives, such as campaigns, educational materials, and institutional messages, reinforcing the importance of integrity in daily work."},{"p":"Participation in training will be recorded for auditing and control purposes. Additionally, all employees must periodically reaffirm their commitment to this Code by signing a formal acceptance statement."}]},{"t":"16. Document Management and Reviews","blocks":[{"p":"The Compliance Department is responsible for maintaining this Code updated and accessible. It will be reviewed every two years, or earlier if regulatory or institutional changes so require. Exceptions may only be authorized by the Compliance Committee, through formal decision and proper documentation."}]}]},"fraude-e-corrupcao":{"pt":[{"t":"1. Objetivo","blocks":[{"p":"A presente Política de Prevenção e Combate à Fraude e à Corrupção tem por objetivo estabelecer os princípios, diretrizes e responsabilidades que orientam a Velaro Network (“Velaro” ou “Companhia”) na identificação, prevenção, detecção e resposta a práticas fraudulentas, corruptas ou relacionadas ao suborno, tanto no âmbito interno quanto nas interações com terceiros."},{"p":"A Velaro, enquanto Provedora de Serviços de Ativos Virtuais (VASP), reconhece os riscos inerentes ao seu modelo de negócio e reafirma o seu compromisso com a integridade, a transparência, a ética corporativa e o cumprimento integral das leis e regulamentos aplicáveis."},{"p":"A Companhia adota postura de tolerância zero em relação a práticas dolosas de fraude, suborno ou corrupção, reafirmando seu compromisso institucional com a ética, a governança e a conformidade regulatória."},{"p":"Todos os casos de indícios ou violações a esta Política serão tratados de forma rígida, proporcional e baseada em risco, assegurando-se o devido processo, a avaliação de gravidade e dolo, e a aplicação de sanções compatíveis com a natureza e a extensão da conduta."},{"st":"1.1 Base Legal e Regulatória"},{"p":"Esta Política tem como fundamento o marco legal e regulatório aplicável aos prestadores de serviços de ativos virtuais no Brasil, conforme estabelecido pela Lei nº 14.478/2022 (Marco Legal dos Criptoativos) e demais normas correlatas editadas sob a supervisão do Banco Central do Brasil."},{"p":"Entre os principais diplomas legais e regulatórios que orientam esta Política, destacam-se:"},{"itens":["Lei nº 9.613/1998 (Lei de Prevenção à Lavagem de Dinheiro), que estabelece princípios e obrigações para prevenção e combate à lavagem de dinheiro e ao financiamento do terrorismo, servindo de referência para os mecanismos de integridade e controles internos previstos nesta Política;","Lei nº 12.846/2013 (Lei Anticorrupção), que dispõe sobre a responsabilização administrativa e civil de pessoas jurídicas pela prática de atos lesivos contra a Administração Pública, nacional ou estrangeira, incluindo a oferta de vantagens indevidas, o financiamento de atos ilícitos e o uso de interpostas pessoas;","Lei nº 13.506/2017, que regula o Processo Administrativo Sancionador (PAS) no âmbito do Banco Central do Brasil e da Comissão de Valores Mobiliários, prevendo sanções por atos dolosos, omissões relevantes e práticas fraudulentas;","Código Penal Brasileiro, que tipifica crimes de fraude, corrupção e outros atos ilícitos relevantes à integridade corporativa."]},{"p":"Além dessas normas, esta Política também observa as Recomendações do Grupo de Ação Financeira Internacional (GAFI), as melhores práticas internacionais de ética e conformidade, bem como o Código de Conduta e as diretrizes da empresa."},{"p":"Dessa forma, a Velaro reafirma seu compromisso de conduzir todas as suas atividades em conformidade com a legislação vigente, de forma ética, integra e transparente, integrando esta Política ao seu Programa de Compliance e à Política de Prevenção à Lavagem de Dinheiro e ao Financiamento do Terrorismo (PLD/FT)."}]},{"t":"2. Abrangência","blocks":[{"p":"Esta Política aplica-se a todos os colaboradores, administradores, diretores, sócios, prestadores de serviço, consultores, fornecedores, intermediários, agentes, parceiros comerciais, representantes e quaisquer terceiros que atuem em nome ou benefício da Velaro,"},{"p":"Aplica-se igualmente às entidades do Grupo BSOS envolvidas em operações ou relações comerciais com a Velaro, bem como a todos os contratos, transações, atividades e relacionamentos institucionais da Companhia, inclusive aqueles que envolvam autoridades públicas nacionais ou estrangeiras."}]},{"t":"3. Governança e Revisão","blocks":[{"p":"A governança desta Política está a cargo do Comitê de Compliance, órgão colegiado responsável por aprovar, supervisionar e acompanhar sua implementação e eficácia. O Comitê assegura que as diretrizes aqui contidas estejam permanentemente alinhadas ao marco regulatório vigente e às melhores práticas de governança corporativa."},{"p":"A Área de Compliance é responsável por sua execução, monitoramento contínuo e disseminação da cultura ética e de integridade."},{"p":"Esta Política será revisada, no mínimo, a cada dois anos, ou sempre que houver alterações relevantes no ambiente regulatório, mudanças significativas nas operações da Companhia ou ocorrência de incidentes que indiquem a necessidade de aprimoramentos."}]},{"t":"4. Definições","blocks":[{"p":"Para os fins desta Política, considera-se:"},{"p":"Fraude: é qualquer ato intencional de engano, omissão ou manipulação com o objetivo de obter vantagem indevida ou causar dano, financeiro ou reputacional, à Velaro, a seus clientes ou parceiros. Abrange desde falsificação de registros contábeis até desvio de recursos, manipulação de dados, simulação de operações, abuso de posição ou omissão dolosa."},{"p":"Suborno: é o ato de oferecer, prometer, dar, solicitar ou receber vantagem indevida, financeira ou não, com o intuito de influenciar a decisão ou a conduta de alguém, em violação ao dever de honestidade e lealdade."},{"p":"Corrupção: é o abuso de poder, função ou influência para obtenção de benefício pessoal ou para terceiros, incluindo pagamento de propinas, vantagens indevidas, doações ilícitas, facilitação de processos ou favorecimentos em licitações ou contratações."},{"p":"Vantagem indevida: é qualquer benefício, financeiro ou não, tangível ou intangível, como dinheiro, ativos virtuais, brindes, hospitalidades, presentes, doações, descontos, oportunidades de negócios, empregos, convites ou favores pessoais."},{"p":"Agente público: é toda pessoa que exerça, ainda que temporariamente ou sem remuneração, cargo, emprego ou função pública, inclusive em empresas estatais, sociedades de economia mista, organismos internacionais e partidos políticos, bem como candidatos a cargos eletivos."},{"p":"Terceiro: é qualquer pessoa física ou jurídica que atue em nome da Velaro ou mantenha relacionamento contratual com a Companhia, representando um potencial vetor de risco de fraude ou corrupção."}]},{"t":"5. Responsabilidades","blocks":[{"p":"O Comitê de Compliance da companhia é responsável por assegurar que os princípios desta Política sejam observados em todas as áreas da empresa, garantindo a alocação de recursos adequados para o seu cumprimento e o fortalecimento da cultura de integridade."},{"p":"A Área de Compliance é responsável pela implementação, comunicação, acompanhamento, monitoramento e atualização da Política, bem como pela condução de investigações internas, recomendação de medidas disciplinares, reporte às autoridades competentes e de comunicações periódicas ao Comitê."},{"p":"Os colaboradores e executivos da Velaro devem atuar com probidade, transparência e lealdade, zelando pelo cumprimento desta Política e comunicando imediatamente quaisquer indícios ou suspeitas de fraude, suborno ou corrupção. É dever de todos cooperar integralmente com as investigações conduzidas e participar das capacitações obrigatórias."},{"p":"Os terceiros e parceiros comerciais são igualmente responsáveis por observar as disposições desta Política, estando sujeitos à realização de diligências prévias, à inserção de cláusulas anticorrupção nos contratos e à rescisão imediata em caso de violação."}]},{"t":"6. Prevenção e Combate à Fraude","blocks":[{"p":"A Velaro reconhece que a fraude pode ocorrer de diferentes formas, tanto no ambiente interno quanto no externo, exigindo vigilância contínua e controles eficazes."},{"p":"Fraudes internas podem envolver, entre outras condutas: manipulação de informações contábeis ou gerenciais, desvio ou apropriação de ativos, falsificação de documentos, simulação de transações, ocultação de conflito de interesses e abuso de autoridade."},{"p":"Fraudes externas, por sua vez, incluem golpes cibernéticos, ataques de phishing, utilização de documentos falsos por clientes ou fornecedores, simulação de pagamentos, fraudes contratuais e esquemas voltados à obtenção indevida de vantagens financeiras ou informações sensíveis."},{"p":"Considerando a natureza digital das operações com ativos virtuais, a Velaro implementa controles tecnológicos específicos para mitigar riscos de fraudes envolvendo criptoativos, tais como:"},{"itens":["Monitoramento on-chain (KYT) para detecção de comportamentos suspeitos;","Rastreamento e bloqueio preventivo de endereços vinculados a atividades ilícitas;","Identificação de dusting attacks, wallet spoofing e outras tentativas de manipulação de transações;","Segregação entre carteiras operacionais e de clientes."]},{"p":"Como parte da prevenção a fraudes e incidentes tecnológicos, a Velaro estabelece princípios para o uso adequado e seguro de sistemas e informações corporativas. Todos os colaboradores e prestadores de serviço devem:"},{"itens":["Utilizar os sistemas corporativos de forma responsável e exclusivamente para fins profissionais;","Proteger informações sensíveis, como dados de clientes e transações, preferencialmente com criptografia e controle de acesso;","Evitar o uso de contas pessoais (e.g., Gmail, Google Drive particular) para armazenamento ou envio de dados corporativos;","Adotar senhas fortes e únicas, não compartilhá-las e, sempre que possível, utilizar gerenciadores de senhas aprovados;","Manter softwares e antivírus atualizados e comunicar imediatamente qualquer ocorrência suspeita, como mensagens fraudulentas, tentativas de phishing ou vazamento de dados."]},{"p":"Essas diretrizes são detalhadas na Política de Segurança da Informação da empresa."},{"p":"Além das fraudes operacionais e tecnológicas, a Velaro reconhece o risco específico de fraude contábil e financeira, caracterizado pela manipulação intencional de registros ou demonstrações para distorcer a situação patrimonial, de resultados ou de fluxo de caixa da (Companhia. Essa prática compromete a transparência, a confiabilidade das informações financeiras e a tomada de decisão de investidores, reguladores e parceiros."},{"p":"Por essa razão, todos os registros contábeis e financeiros devem refletir, de forma precisa, íntegra e tempestiva, as transações e operações realizadas. Por isso, é expressamente vedado:"},{"itens":["Criar contas não registradas ou paralelas;","Utilizar fundos não contabilizados;","Inserir lançamentos falsos, incompletos ou enganosos; ou"]},{"itens":["Usar ou apresentar quaisquer faturas, recibos ou documentos falsos ou fraudulentos."]},{"p":"Qualquer indício, suspeita ou evidência de fraude deve ser comunicado imediatamente à Área de Compliance, que avaliará o caso de forma independente e confidencial."},{"p":"Transações suspeitas devem ser suspensas até autorização expressa para prosseguimento."},{"p":"O descumprimento dessas obrigações constitui falta grave, sujeita à aplicação de medidas disciplinares e, quando cabível, à responsabilização civil, administrativa e criminal."}]},{"t":"7. Suborno e Corrupção","blocks":[{"p":"A Velaro proíbe, de forma absoluta, qualquer ato de suborno ou corrupção, direta ou indireta, ativa ou passiva, nacional ou estrangeira. Tal vedação abrange, inclusive, pagamentos de facilitação, definidos como pequenos valores oferecidos a agentes públicos para acelerar atos de rotina."},{"p":"A concessão, oferta, solicitação ou aceitação de vantagem indevida, sob qualquer forma, é ilegal e contrária aos princípios éticos da Companhia. Não é permitido que colaboradores ou terceiros atuando em nome da Velaro prometam, ofertem, autorizem ou aceitem benefícios que possam influenciar decisões de negócios, processos regulatórios ou contratações."},{"p":"Doações, patrocínios, contribuições políticas ou institucionais somente poderão ser realizadas mediante autorização prévia e por escrito da Área de Compliance, devendo possuir finalidade legítima, documentação comprobatória e registro contábil regular."},{"st":"7.1. Presentes, Brindes e Hospitalidades"},{"p":"A Velaro conduz seus negócios com base em integridade, transparência e independência, não admitindo qualquer prática que possa gerar conflito de interesses, influenciar decisões de negócios ou comprometer a imparcialidade de seus colaboradores, parceiros ou prestadores de serviço."},{"p":"Presentes, brindes e hospitalidades só podem ser aceitos ou oferecidos quando tiverem valor razoável, forem ocasionais, compatíveis com padrões de mercado e não criarem expectativa de reciprocidade, vantagem indevida ou favorecimento."},{"p":"Mesmo quando não há intenção ilícita, presentes ou hospitalidades podem ser interpretados por autoridades, auditores ou terceiros como tentativa de suborno ou ato de corrupção. Por isso, é essencial que toda oferta ou recebimento de benefícios siga rigorosamente as diretrizes desta Política e seja avaliado sob a ótica da conformidade e da conduta responsável."},{"st":"Brindes institucionais"},{"p":"São permitidos brindes de caráter institucional, como agendas, canetas, ecobags, garrafas e outros itens promocionais de baixo valor, desde que distribuídos de forma generalizada, sem intenção de influenciar decisões comerciais e com a marca do ofertante visível."},{"st":"Presentes e hospitalidades"},{"p":"Podem ser oferecidos ou aceitos presentes e hospitalidades de valor razoável, desde que relacionados a fins legítimos de relacionamento profissional e não configurem vantagem indevida. Como referência, aplicam-se os seguintes limites de valor:"},{"itens":["Até R$ 500,00 por pessoa, por evento, quando no Brasil;","Até USD 150,00 por pessoa, por evento, quando no exterior."]},{"p":"Itens acima desses limites exigem aprovação prévia da Área de Compliance, mediante justificativa. Quando não for possível recusar um presente acima do valor permitido, o item deverá ser encaminhado à Área de Compliance, que decidirá sobre sua destinação institucional (por exemplo, sorteio interno ou doação)."},{"p":"Os limites aplicam-se por ocasião. Presentes ou hospitalidades acumuladas de um mesmo fornecedor/cliente não podem ultrapassar R$ 1.500 no período de 12 meses."},{"st":"Proibições expressas"},{"p":"É proibido, em qualquer circunstância:"},{"itens":["Oferecer ou receber dinheiro, cartões-presente, criptoativos ou equivalentes;","Aceitar benefícios, convites, viagens ou hospedagens que comprometam a independência profissional;","Oferecer presentes ou hospitalidades a agentes públicos, direta ou indiretamente;"]},{"st":"Patrocínios e doações"},{"p":"Patrocínios e apoios institucionais poderão ser realizados apenas quando tiverem finalidade profissional legítima, forem compatíveis com os valores e estratégia da Velaro e não estiverem associados a fins políticos ou pessoais."},{"p":"Toda solicitação de patrocínio deve conter justificativa formal e ser aprovada previamente pela Alta Administração e pela Área de Compliance."},{"p":"Registro e reporte Colaboradores devem notificar a Área de Compliance sempre que:"},{"itens":["Receberem ou oferecerem presentes/hospitalidades acima dos limites estabelecidos;","Forem convidados para eventos ou viagens custeadas por terceiros; ou","Identificarem situações que possam gerar conflito de interesses."]},{"st":"7.2. Relacionamento com Agentes Públicos"},{"p":"Todas as interações com agentes públicos devem ser guiadas pela legalidade, ética e transparência. Sempre que possível, devem ocorrer com a participação de pelo menos dois representantes da Velaro, seguir uma agenda pré-definida, realizar-se durante o horário comercial e acontecer em um ambiente apropriado, seja presencialmente ou por meio de plataformas virtuais aprovadas (por exemplo, Zoom, Google Meet)."},{"p":"Qualquer oferta, solicitação ou indício de vantagem indevida deverá ser imediatamente comunicado à Área de Compliance. A omissão no reporte constitui infração grave a esta Política."},{"p":"Somente colaboradores devidamente autorizados e capacitados poderão representar a Companhia em reuniões, tratativas ou negociações com autoridades públicas ou reguladores."}]},{"t":"8. Due Diligence e Gestão de Terceiros","blocks":[{"p":"Antes de estabelecer qualquer relação contratual com terceiros, a Velaro realiza um processo de due diligence baseado em risco, com o objetivo de identificar possíveis exposições a fraude, suborno ou corrupção. Tal processo inclui verificação em listas de sanções, pesquisas de mídia negativa, identificação de pessoas politicamente expostas (PEPs) e análise de histórico reputacional."},{"p":"Os contratos firmados deverão conter cláusulas anticorrupção e de conformidade, prevendo sanções, rescisão imediata e obrigação de cooperação em caso de investigação."},{"p":"O monitoramento é contínuo e poderá ser reavaliado periodicamente ou sempre que houver alteração relevante na relação comercial."},{"p":"Para mais detalhes sobre este processo, consulte o Manual de Due Diligence de Clientes, Terceiros e Colaboradores."}]},{"t":"9. Treinamento e Conscientização","blocks":[{"p":"A Velaro promove programas regulares de capacitação sobre prevenção à fraude, suborno e corrupção, com conteúdo atualizado, estudos de caso, exemplos práticos e orientações sobre como reconhecer sinais de alerta."},{"p":"Esses treinamentos são oferecidos no mínimo a cada dois anos, conforme avaliação de risco e atualização regulatória. A participação é obrigatória para todos os colaboradores, executivos e prestadores de serviço, devendo ser concluída e registrada formalmente."},{"p":"Treinamentos específicos e complementares serão aplicados a áreas consideradas de maior risco, como Operações, Vendas, Finanças e Atendimento ao Cliente."}]},{"t":"10. Comunicação e Canal de Denúncias","blocks":[{"p":"Todos os colaboradores, terceiros e parceiros da Velaro têm o dever e o direito de reportar, de boa-fé, quaisquer indícios ou suspeitas de práticas fraudulentas, suborno, corrupção, conflito de interesses, descumprimento desta Política ou violação das leis e regulamentos aplicáveis."},{"p":"As comunicações poderão ser realizadas diretamente à Área de Compliance, por mensagem, ligação ou pelo e-mail canaldedenuncias.brDbsos.co, ou, de forma anônima, por meio do Canal de Denúncias disponível em https://forms .gleAWFYkNehAcxpk 7."},{"p":"A confidencialdade e o anonimato dos denunciantes serão integralmente preservados, sendo expressamente proibida qualquer forma de retaliação contra aqueles que realizem comunicações de boa-fé ou colaborem com investigações conduzidas pela Companhia."},{"p":"Todas as denúncias recebidas serão registradas, analisadas e tratadas de forma diligente e imparcial pela Área de Compliance, observando-se critérios de seriedade, tempestividade e integridade das informações. Os registros correspondentes serão mantidos pelo prazo mínimo de dez anos, em ambiente seguro e de acesso restrito, garantindo a rastreabilidade, a proteção de dados pessoais e o cumprimento das exigências legais e regulatórias aplicáveis."}]},{"t":"11. Investigações Internas e Medidas Disciplinares","blocks":[{"p":"A Área de Compliance é responsável pela condução independente de todas as investigações relacionadas a indícios de fraude, suborno ou corrupção, com autonomia técnica, imparcialidade e respeito à presunção de inocência."},{"p":"As apurações envolvem coleta e análise de documentos, registros, entrevistas e cruzamento de informações, podendo contar com apoio de especialistas externos quando necessário."},{"p":"Os resultados serão submetidos ao Comitê de Compliance e à Alta Administração, que deliberarão sobre as medidas corretivas, disciplinares ou legais cabíveis, nos casos em que forem identificados indícios relevantes de irregularidade ou violação normativa, bem como, quando aplicável, sobre a comunicação às autoridades competentes"},{"p":"Todos os documentos, comunicações e registros obtidos durante as investigações serão preservados como evidência, observadas as normas de proteção de dados e sigilo aplicáveis."},{"p":"A violação das disposições desta Política constitui infração grave e poderá resultar em advertência, suspensão, desligamento, responsabilização civil, administrativa e penal, bem como rescisão contratual no caso de terceiros."},{"p":"As medidas serão aplicadas de forma proporcional à gravidade do fato, documentadas e comunicadas às instâncias competentes, preservando-se o devido processo e o direito de defesa."},{"p":"Esta Política reflete o compromisso permanente da Velaro com a integridade, a transparência e a conformidade regulatória. Seu cumprimento é responsabilidade de todos, como parte essencial da reputação e sustentabilidade da Companhia."}]}],"en":[{"t":"1. Objective","blocks":[{"p":"This Fraud and Corruption Prevention and Combat Policy aims to establish the principles, guidelines, and responsibilities that guide Velaro Network (\"Velaro” or \"Company\") in the identification, prevention, detection, and response to fraudulent, corrupt, or bribery-related practices, both internally and in interactions with third parties."},{"p":"Velaro, as a Virtual Asset Service Provider (VASP), recognizes the inherent risks of its business model and reaffirms its commitment to integrity, transparency, corporate ethics, and full compliance with applicable laws and regulations."},{"p":"The Company adopts a zero-tolerance stance toward intentional fraudulent practices, bribery, or corruption, reaffirming its institutional commitment to ethics, governance, and regulatory compliance."},{"p":"All cases of indications or violations of this Policy will be handled rigorously, proportionally, and based on risk, ensuring due process, assessment of severity and intent, and application of sanctions compatible with the nature and extent of the conduct."},{"st":"1.1 Legal and Regulatory Basis"},{"p":"This Policy is grounded in the legal and regulatory framework applicable to virtual asset service providers (VASPs) in Brazil, as established by Law No. 14,478/2022 (Legal Framework for Cryptoassets) and related regulations issued under the supervision of the Central Bank of Brazil."},{"p":"The main legal and regulatory instruments guiding this Policy include:"},{"itens":["Law No. 9,613/1998 (Anti-Money Laundering Law), which establishes principles and obligations for the prevention and combat of money laundering and terrorist financing, serving as a reference for the integrity mechanisms and internal controls set forth in this Policy;","Law No. 12,846/2013 (Anti-Corruption Law), which provides for the administrative and civil liability of legal entities for acts harmful to the Public Administration, whether domestic or foreign, including the offering of undue advantages, the financing of illicit acts, and the use of intermediaries;","Law No. 13,506/2017, which regulates the Administrative Sanctioning Process (PAS) within the scope of the Central Bank of Brazil and the Brazilian Securities Commission (CVM), establishing sanctions for willful misconduct, material omissions, and fraudulent practices;","Brazilian Criminal Code, which typifies crimes of fraud, corruption, and other unlawful acts relevant to corporate integrity."]},{"p":"In addition to these regulations, this Policy also observes the Recommendations of the Financial Action Task Force (FATF), international best practices in ethics and compliance, as well as the company’s Code of Conduct and internal guidelines."},{"p":"Accordingly, Velaro reaffirms its commitment to conducting all activities in compliance with applicable law, and in an ethical, transparent, and responsible manner, integrating this Policy with its Compliance Program and its Anti-Money Laundering and Counter-Terrorist Financing Policy."}]},{"t":"2. Scope","blocks":[{"p":"This Policy applies to all employees, administrators, directors, partners, service providers, consultants, suppliers, intermediaries, agents, business partners, representatives, and any third parties acting on behalf of or for the benefit of Velaro."},{"p":"It also applies to entities of the BSOS Group involved in operations or business relationships with Velaro, as well as to all contracts, transactions, activities, and institutional relationships of the Company, including those involving national or foreign public authorities."}]},{"t":"3. Governance and Review","blocks":[{"p":"The governance of this Policy is the responsibility of the Compliance Committee, a collegiate body responsible for approving, supervising, and monitoring its implementation and effectiveness. The Committee ensures that the guidelines contained herein are permanently aligned with the current regulatory framework and best practices in corporate governance."},{"p":"The Compliance Area is responsible for its execution, continuous monitoring, and dissemination of ethical culture and integrity."},{"p":"This Policy will be reviewed at least every two years, or whenever there are relevant changes in the regulatory environment, significant changes in the Company's operations, or incidents that indicate the need for improvements."}]},{"t":"4. Definitions","blocks":[{"p":"For the purposes of this Policy, the following are considered:"},{"p":"Fraud: any intentional act of deception, omission, or manipulation with the objective of obtaining undue advantage or causing financial or reputational damage to Velaro, its customers, or partners. It ranges from falsification of accounting records to misappropriation of resources, data manipulation, simulation of operations, abuse of position, or intentional omission."},{"p":"Bribery: the act of offering, promising, giving, soliciting, or receiving undue advantage, financial or otherwise, with the intent to influence someone's decision or conduct, in violation of the duty of honesty and loyalty."},{"p":"Corruption: the abuse of power, function, or influence to obtain personal benefit or for third parties, including payment of bribes, undue advantages, illicit donations, facilitation of processes, or favoritism in bids or contracts."},{"p":"Undue advantage: any benefit, financial or otherwise, tangible or intangible, such as money, virtual assets, gifts, hospitalities, presents, donations, discounts, business opportunities, jobs, invitations, or personal favors."},{"p":"Public agent: any person who exercises, even temporarily or without remuneration, a position, employment, or public function, including in state-owned companies, mixed-capital companies, international organizations, and political parties, as well as candidates for elective positions."},{"p":"Third party: any individual or legal entity acting on behalf of Velaro or maintaining a contractual relationship with the Company, representing a potential vector of fraud or corruption risk."}]},{"t":"5. Responsibilities","blocks":[{"p":"The company’s Compliance Committee is responsible for ensuring that the principles of this Policy are observed across all areas of the organization, guaranteeing the allocation of adequate resources for its implementation and the strengthening of a culture of integrity."},{"p":"The Compliance Area is responsible for the implementation, communication, monitoring, and updating of the Policy, as well as conducting internal investigations, recommending disciplinary measures, reporting to competent authorities, and periodic communications to the Committee."},{"p":"Velaro's employees and executives must act with probity, transparency, and loyalty, ensuring compliance with this Policy and immediately communicating any indications or suspicions of fraud, bribery, or corruption. It is everyone's duty to fully cooperate with investigations conducted and participate in mandatory training."},{"p":"Third parties and business partners are equally responsible for observing the provisions of this Policy, being subject to prior due diligence, inclusion of anti-corruption clauses in contracts, and immediate termination in case of violation."}]},{"t":"6. Fraud Prevention and Combat","blocks":[{"p":"Velaro recognizes that fraud can occur in different forms, both internally and externally, requiring continuous vigilance and effective controls."},{"p":"Internal fraud may involve, among other conducts: manipulation of accounting or managerial information, misappropriation of assets, document falsification, transaction simulation, concealment of conflicts of interest, and abuse of authority."},{"p":"External fraud, in turn, includes cyber scams, phishing attacks, use of false documents by customers or suppliers, payment simulation, contractual fraud, and schemes aimed at improperly obtaining financial advantages or sensitive information."},{"p":"Considering the digital nature of virtual asset operations, Velaro implements specific technological controls to mitigate fraud risks involving crypto assets, such as:"},{"itens":["On-chain monitoring (KYT) for detecting suspicious behavior;","Tracking and preventive blocking of addresses linked to illicit activities;","Identification of dusting attacks, wallet spoofing, and other transaction manipulation attempts; and","Segregation between operational and customer wallets."]},{"p":"As part of fraud prevention and technological incidents, Velaro establishes principles for the proper and secure use of corporate systems and information. All employees and service providers must:"},{"itens":["Use corporate systems responsibly and exclusively for professional purposes;","Protect sensitive information, such as customer data and _ transactions, preferably with encryption and access control;","Avoid using personal accounts (e.g., Gmail, personal Google Drive) for storing or sending corporate data;","Adopt strong and unique passwords, not share them, and whenever possible, use approved password managers;","Keep software and antivirus updated and immediately report any suspicious occurrence, such as fraudulent messages, phishing attempts, or data leaks."]},{"p":"These guidelines are detailed in the Company's Information Security Policy."},{"p":"In addition to operational and technological fraud, Velaro recognizes the specific risk of accounting and financial fraud, characterized by intentional manipulation of records or statements to distort the Company's financial position, results, or cash flow. This practice compromises transparency, reliability of financial information, and decision-making by investors, regulators, and partners."},{"p":"For this reason, all accounting and financial records must accurately, fully, and timely reflect the transactions and operations performed. Therefore, it is expressly prohibited to:"},{"itens":["Create unregistered or parallel accounts;","Use unaccounted funds;","Insert false, incomplete, or misleading entries; or","Use or submit any false or fraudulent invoices, receipts, or documents.."]},{"p":"Any indication, suspicion, or evidence of fraud must be immediately reported to the Compliance Area, which will evaluate the case independently and confidentially."},{"p":"Suspicious transactions must be suspended until express authorization to proceed."},{"p":"Failure to comply with these obligations constitutes a serious offense, subject to disciplinary measures and, when applicable, civil, administrative, and criminal liability."}]},{"t":"7. Bribery and Corruption","blocks":[{"p":"Velaro absolutely prohibits any act of bribery or corruption, direct or indirect, active or passive, domestic or foreign. This prohibition includes facilitation payments, defined as small amounts offered to public agents to expedite routine acts."},{"p":"The granting, offering, solicitation, or acceptance of undue advantage, in any form, is illegal and contrary to the Company's ethical principles. Employees or third parties acting on behalf of Velaro are not permitted to promise, offer, authorize, or accept benefits that may influence business decisions, regulatory processes, or contracts."},{"p":"Donations, sponsorships, political or institutional contributions may only be made by the company with prior written authorization from the Compliance Area, and must have a legitimate purpose, supporting documentation, and regular accounting record."},{"st":"7.1. Gifts, Promotional Items, and Hospitality"},{"p":"Velaro conducts its business based on integrity, transparency, and independence, not admitting any practice that may create conflicts of interest, influence business decisions, or compromise the impartiality of its employees, partners, or service providers."},{"p":"Gifts, giveaways, and hospitality may only be accepted or offered when they are of reasonable value, occasional, consistent with market standards, and do not create any expectation of reciprocity, undue advantage, or favoritism."},{"p":"Even when there is no illicit intent, gifts or hospitalities may be interpreted by authorities, auditors, or third parties as attempted bribery or acts of corruption. Therefore, it is essential that every offer or receipt of benefits strictly follows the guidelines of this Policy and is evaluated from the perspective of compliance and responsible conduct."},{"st":"Institutional promotional items"},{"p":"Institutional promotional items such as planners, pens, eco-bags, bottles, and other low-value promotional materials are permitted, provided they are distributed broadly, without intent to influence business decisions, and with the offeror’s brand clearly visible."},{"st":"Gifts and hospitality"},{"p":"Gifts and hospitality of reasonable value may be offered or accepted, provided they are related to legitimate professional relationship purposes and do not constitute undue advantage. As a reference, the following value limits apply:"},{"itens":["Up to BRL 500.00 per person, per event, when in Brazil;","Up to USD 150.00 per person, per event, when abroad."]},{"p":"Items above these limits require prior approval from the Compliance Area, with justification."},{"p":"When it is not possible to refuse a gift above the permitted value, the item must be forwarded to the Compliance Area, which will decide on its institutional destination (for example, internal raffle or donation)."},{"p":"Express prohibitions It is prohibited, under any circumstances:"},{"itens":["To offer or receive money, gift cards, crypto assets, or equivalents;","To accept benefits, invitations, trips, or accommodations that compromise professional independence;","To offer gifts or hospitality to public agents, directly or indirectly;"]},{"st":"Sponsorships and donations"},{"p":"Sponsorships and institutional support may only be made when they have a legitimate professional purpose, are compatible with Velaro's values and strategy, and are not associated with political or personal purposes."},{"p":"Every sponsorship request must contain formal justification and be approved in advance by Senior Management and the Compliance Area."},{"p":"Record and reporting Employees must notify the Compliance Area whenever they:"},{"itens":["Receive or offer gifts/hospitality above established limits;","Are invited to events or trips paid for by third parties; or","Identify situations that may create conflicts of interest."]},{"st":"7.2. Relationship with Public Agents"},{"p":"All interactions with public officials must be guided by legality, ethics, and transparency. Whenever possible, they should take place with the participation of at least two Velaro representatives, follow a predefined agenda, occur during business hours, and be held in an appropriate setting, whether in person or through approved virtual platforms (e.g., Zoom, Google Meet)."},{"p":"Any offer, solicitation, or indication of undue advantage must be immediately reported to the Compliance Area. Failure to report constitutes a serious violation of this Policy."},{"p":"Only duly authorized and trained employees may represent the Company in meetings, negotiations, or dealings with public authorities or regulators."}]},{"t":"8. Due Diligence and Third-Party Management","blocks":[{"p":"Before establishing any contractual relationship with third parties, Velaro conducts a risk-based due diligence process with the objective of identifying possible exposures to fraud, bribery, or corruption. This process includes verification in sanctions lists, negative media research, identification of politically exposed persons (PEPs), and reputational history analysis."},{"p":"Contracts entered into must contain anti-corruption and compliance clauses, providing for sanctions, immediate termination, and obligation to cooperate in case of investigation."},{"p":"Monitoring is continuous and may be reassessed periodically or whenever there is a relevant change in the business relationship."},{"p":"For more details about this process, consult the Due Diligence Manual for Customers, Third Parties, and Employees."}]},{"t":"9. Training and Awareness","blocks":[{"p":"Velaro promotes regular training programs on fraud, bribery, and corruption prevention, with updated content, case studies, practical examples, and guidance on how to recognize warning signs."},{"p":"These training sessions are offered at least every two years, according to risk assessment and regulatory updates. Participation is mandatory for all employees, executives, and service providers and must be completed and formally recorded."},{"p":"Specific and complementary training will be provided to higher-risk areas, such as Operations, Sales, Finance, and Customer Service."}]},{"t":"10. Communication and Whistleblower Channel","blocks":[{"p":"All employees, third parties, and partners of Velaro have the duty and right to report, in good faith, any indications or suspicions of fraudulent practices, bribery, corruption, conflicts of interest, non-compliance with this Policy, or violation of applicable laws and regulations."},{"p":"Communications may be made directly to the Compliance Area, by message, call, or email at canaldedenuncias.br@bsos.co, or anonymously through the Whistleblower Channel available at https://forms.gle/iiMjsazp6MAQ44wz7."},{"p":"The confidentiality and anonymity of whistleblowers will be fully preserved, and any form of retaliation against those who make good faith communications or cooperate with investigations conducted by the Company is expressly prohibited."},{"p":"All reports received will be recorded, analyzed, and handled diligently and impartially by the Compliance Area, observing criteria of seriousness, timeliness, and integrity of information. Corresponding records will be maintained for a minimum period of ten years in a secure and restricted-access environment, ensuring traceability, personal data protection, and compliance with applicable legal and regulatory requirements."}]},{"t":"11. Internal Investigations and Disciplinary Measures","blocks":[{"p":"The Compliance Area is responsible for independently conducting all investigations related to indications of fraud, bribery, or corruption, with technical autonomy, impartiality, and respect for the presumption of innocence."},{"p":"Investigations involve collection and analysis of documents, records, interviews, and cross-referencing of information, and may rely on support from external specialists when necessary."},{"p":"The results will be submitted to the Compliance Committee and Senior Management, which shall deliberate on the appropriate corrective, disciplinary, or legal measures in cases where relevant indications of irregularities or regulatory violations are identified, as well as, when applicable, on the communication to the competent authorities."},{"p":"All documents, communications, and records obtained during investigations will be preserved as evidence, observing applicable data protection and confidentiality norms."},{"p":"Violation of the provisions of this Policy constitutes a serious infraction and may result in warning, suspension, dismissal, civil, administrative, and criminal liability, as well as contract termination in the case of third parties."},{"p":"Measures will be applied proportionally to the severity of the fact, documented and communicated to competent instances, preserving due process and the right to defense."},{"p":"This Policy reflects Velaro's permanent commitment to integrity, transparency, and regulatory compliance. Its compliance is everyone's responsibility, as an essential part of the Company's reputation and sustainability."}]}]},"privacidade-e-protecao-de-dados":{"pt":[{"t":"1. Objetivo","blocks":[{"p":"Esta Política de Privacidade e Proteção de Dados Pessoais tem como objetivo estabelecer diretrizes claras, transparentes e seguras sobre o tratamento de dados pessoais realizado por Velaro Network Sociedade Prestadora de Serviços de Ativos Virtuais Ltda, CNPJ 63.964.774/0001-52 (“Velaro” ou “Companhia”), em conformidade com a Lei Geral de Proteção de Dados Pessoais (LGPD - Lei nº 13.709/2018), normas regulatórias aplicáveis e boas práticas de governança, tendo como referência o modelo adotado pela Velaro."},{"p":"A Velaro, enquanto Provedora de Serviços de Ativos Virtuais (“VASP”), reconhece os riscos inerentes ao seu modelo de negócio e reafirma o seu compromisso com a integridade, a transparência, a ética corporativa e o cumprimento integral das leis e regulamentos aplicáveis."},{"p":"No contexto de sua atividade principal como VASP, a Velaro atua predominantemente como controladora dos dados pessoais de seus clientes e colaboradores, tomando as decisões relativas às finalidades e aos meios de tratamento."}]},{"t":"2. Base Legal e Regulatória","blocks":[{"st":"Esta Política está fundamentada, especialmente, nas seguintes normas:"},{"itens":["Lei nº 13.709/2018 - Lei Geral de Proteção de Dados (LGPD);","Marco Civil da Internet (Lei nº 12.965/2014);","Código Civil Brasileiro;","Normas regulatórias aplicáveis ao setor de atuação da empresa;","Boas práticas de mercado e governança corporativa, incluindo aquelas observadas no Aviso de Privacidade e Proteção de Dados Pessoais - Velaro Network;","Política de Segurança da Informação - Velaro ;","Política de Cookies."]}]},{"t":"3. Abrangência","blocks":[{"p":"Esta Política aplica-se a todos os colaboradores, administradores, diretores, sócios, prestadores de serviço, consultores, fornecedores, intermediários, agentes, parceiros comerciais, representantes e quaisquer terceiros que atuem em nome ou benefício da Velaro."},{"p":"Aplica-se igualmente às entidades do Grupo BSOS envolvidas em operações ou relações comerciais com a Velaro, bem como a todos os contratos, transações, atividades e relacionamentos institucionais da Companhia, inclusive aqueles que envolvam autoridades públicas nacionais ou estrangeiras."}]},{"t":"4. Definições","blocks":[{"p":"Para os fins desta Política de Privacidade e Proteção de Dados Pessoais, aplicam-se as seguintes definições:"},{"p":"Agentes de tratamento: controlador e operador a Velaro pode atuar como controladora, co-controladora ou operadora."},{"p":"Anonimização: utilização de meios técnicos razoáveis e disponíveis no momento do tratamento, por meio dos quais um dado perde a possibilidade de associação, direta ou indireta, a um indivíduo."},{"p":"Autoridade Nacional de Proteção de Dados (ANPD): órgão da administração pública responsável por zelar, implementar e fiscalizar o cumprimento da LGPD no território nacional."},{"p":"Banco de dados: conjunto organizado de dados pessoais em meio físico ou digital."},{"p":"Bloqueio: suspensão temporária do tratamento, mantendo os dados armazenados."},{"p":"Consentimento: manifestação livre, informada e inequívoca pela qual o titular concorda com o tratamento de seus dados pessoais para uma finalidade determinada."},{"p":"Controlador: pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao tratamento de dados pessoais."},{"p":"Dado Pessoal: qualquer informação relacionada a pessoa natural identificada ou identificável, direta ou indiretamente."},{"p":"Dado Pessoal Sensível: dado pessoal sobre origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou a organização de caráter religioso, filosófico ou político, dado referente à saúde ou à vida sexual, dado genético ou biométrico, quando vinculado a uma pessoa natural."},{"p":"Eliminação: exclusão de dados armazenados."},{"p":"Encarregado (DPO): pessoa indicada pelo controlador e operador para atuar como canal de comunicação entre o controlador, os titulares dos dados pessoais e a Autoridade Nacional de Proteção de Dados (ANPD)."},{"p":"Incidente de Segurança: qualquer evento adverso confirmado ou sob suspeita que comprometa a confidencialidade, integridade ou disponibilidade de dados pessoais."},{"p":"Operador: pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais em nome do controlador."},{"p":"Segurança da informação: práticas e controles que garantem sigilo, integridade e disponibilidade das informações."},{"p":"Titular: pessoa natural a quem se referem os dados pessoais que são objeto de tratamento."},{"p":"Transferência internacional de dados: envio de dados pessoais para outro país ou organismo internacional."},{"p":"Tratamento: toda e qualquer operação realizada com dados pessoais, tais como coleta, produção, recepção, classificação, utilização, acesso, reprodução, transmissão, distribuição, processamento, arquivamento, armazenamento, eliminação, avaliação ou controle da informação, modificação, comunicação, transferência, difusão ou extração."}]},{"t":"5. Princípios de Tratamento de Dados Pessoais","blocks":[{"p":"A Velaro realiza o tratamento de dados pessoais seguindo os princípios estabelecidos pela Lei Geral de Proteção de Dados Pessoais (LGPD), garantindo licitude, lealdade e boa-fé em todas as suas operações. O tratamento é realizado com finalidade legítima, específica e informada ao titular, sendo compatível com o contexto e limitado ao mínimo necessário para alcançar seus objetivos."},{"p":"A Velaro garante aos titulares o acesso às suas informações por meio de canais de contato apropriados, bem como transparência quanto aos processos de tratamento e aos agentes envolvidos. Adotamos medidas técnicas e administrativas robustas para proteger os dados pessoais, prevenir danos e coibir qualquer uso discriminatório ou ilícito. Reafirmamos, ainda, nosso compromisso com a responsabilidade e a prestação de contas, demonstrando continuamente a efetividade das práticas implementadas em conformidade com a LGPD."}]},{"t":"6. Responsabilidades","blocks":[{"p":"O Comitê de Compliance da Velaro é responsável por assegurar a observância dos princípios, diretrizes e obrigações previstos nesta Política, bem como daqueles decorrentes da Lei Geral de Proteção de Dados Pessoais (Lei nº 13.709/2018) e do Aviso de Privacidade e Proteção de Dados Pessoais da Velaro, garantindo que o tratamento de dados pessoais seja realizado de forma lícita, ética, segura e transparente em todas as áreas da Companhia. Compete ao Comitê promover a adequada alocação de recursos huma
