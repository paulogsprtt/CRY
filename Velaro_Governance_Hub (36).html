os, entendidos como fornecedores críticos ou entidades com as quais a Velaro mantém uma relação contratual contínua e mutuamente benéfica, distinta da de clientes ou colaboradores."},{"p":"2.9 VASP (Virtual Asset Service Provider - Provedor de Serviços de Ativos Virtuais): considera-se VASP a pessoa jurídica que, em nome de terceiros, oferece serviços relacionados a ativos virtuais. Estão incluídas atividades como a troca entre ativos virtuais e moeda fiduciária ou entre diferentes ativos virtuais; a transferência de ativos virtuais; a custódia ou administração de ativos virtuais ou de instrumentos que permitam controlá-los; e a participação ou intermediação em serviços financeiros associados à emissão ou à venda de ativos virtuais."}]},{"t":"3. Mecanismos de Controle","blocks":[{"p":"O Programa de PLD/FT da Velaro é composto por mecanismos integrados que visam prevenir, detectar e reportar atividades suspeitas de forma tempestiva. Entre eles, destacam-se:"},{"itens":["Políticas e Procedimentos;","Avaliação Interna de Riscos;","Processos de due diligence de clientes, terceiros e colaboradores;","Monitoramento transacional com ferramentas tecnológicas de mercado e calibragem contínua;","Canal de denúncias, seguro e anônimo, com proteção ao denunciante de boa-fé;","Treinamentos obrigatórios (onboarding, anuais e reciclagens) e comunicações internas;","Investigações internas com medidas disciplinares proporcionais e comunicação às autoridades quando cabível;","Avaliação periódica de efetividade, com relatório anual à Alta Administração."]}]},{"t":"4. Governança e Responsabilidades","blocks":[{"p":"A governança do Programa de Prevenção à Lavagem de Dinheiro e ao Financiamento do Terrorismo da Velaro é estruturada de modo a garantir clareza de papéis, efetividade dos controles e responsabilização em todos os níveis da organização. A prevenção de ilícitos financeiros é uma prioridade institucional e deve permear todas as áreas da empresa. A Alta Administração assegura o patrocínio e a supervisão do programa, enquanto o Diretor Responsável e a Área de Compliance conduzem sua implementação no dia a dia, em colaboração com as demais áreas de negócio. Cada colaborador, independentemente de sua posição hierárquica, tem o dever de agir em conformidade com esta Política, com os valores de integridade e com as normas legais e regulatórias aplicáveis."},{"st":"4.1 Alta Administração"},{"p":"A Alta Administração é responsável por patrocinar e supervisionar a implementação desta Política, assegurando que sua execução seja eficaz e que a empresa esteja permanentemente alinhada às melhores práticas regulatórias e de mercado. Compete a esse nível estabelecer a estrutura de governança necessária e garantir que a Área de Compliance disponha de independência, autonomia e recursos humanos, financeiros e tecnológicos adequados."},{"p":"Cabe ainda à Alta Administração promover a cultura de integridade em toda a organização, bem como deliberar, mediante parecer do Diretor Responsável e da Área de Compliance, sobre a entrada, manutenção ou encerramento de relacionamentos com clientes classificados como de alto risco."},{"st":"4.2 Comitê de Compliance"},{"p":"Para assegurar a adequada governança e supervisão das questões de compliance, a Velaro instituiu um Comitê de Compliance no âmbito de seu Programa de PLD/FT."},{"p":"O Comitê é composto por um membro da alta administração da Velaro e dois membros da alta administração da BSOS Holdings INC., empresa controladora."},{"p":"O Comitê é responsável por revisar e aprovar políticas, procedimentos e demais documentos-chave relacionados à função de compliance, bem como deliberar sobre outros assuntos que possam ter impacto significativo no arcabouço de PLD/FT, incluindo a aprovação da Avaliação Interna de Riscos e a análise do relatório anual de efetividade do programa. As aprovações poderão ser formalizadas em reuniões ou por meio de resoluções escritas, de modo a assegurar eficiência e flexibilidade nos processos decisórios."},{"p":"O Comitê reunir-se-á ordinariamente a cada 3 (três) meses e, extraordinariamente, sempre que necessário, mediante convocação de seu Presidente ou por solicitação de seus membros."},{"st":"A composição do Comitê será a seguinte:"},{"itens":["Presidente: Maria Zelner - Head de Compliance;","Secretária: Alana Vilaça - Analista de Compliance Pleno."]},{"p":"Compete à Secretária apoiar a organização das reuniões, elaboração de atas, controle de pautas e acompanhamento das deliberações do Comitê."},{"st":"4.3 Diretor Responsável por PLD/FT"},{"p":"O Diretor Responsável por PLD/FT é a autoridade formalmente designada para supervisionar a implementação desta Política. Cabe a ele assegurar a conformidade da Velaro com as exigências regulatórias e melhores práticas de mercado. Compete-lhe garantir que os procedimentos e controles internos de prevenção sejam efetivamente aplicados, bem como zelar pela aderência da organização às diretrizes definidas pela Alta Administração."},{"p":"Cabe ao Diretor Responsável supervisionar os processos de identificação e diligência de clientes, beneficiários finais, terceiros e colaboradores, aprovar medidas de diligência reforçada em situações de risco elevado. O Diretor Responsável deve ter acesso irrestrito às informações necessárias para o desempenho de suas funções, incluindo dados de identificação, registros de transações e relatórios de monitoramento, podendo solicitar informações adicionais a qualquer área da companhia."},{"p":"Além disso, compete-lhe assegurar que eventuais operações suspeitas sejam analisadas de forma tempestiva e, quando aplicável, comunicadas às autoridades competentes. O Diretor Responsável também atua como interlocutor da Velaro junto a reguladores e órgãos de supervisão em matérias relacionadas a PLD/FT, devendo reportar periodicamente à Alta Administração sobre o estado do programa, suas deficiências e as medidas de aprimoramento adotadas."},{"st":"4.4 Área de Compliance"},{"p":"A Área de Compliance é a segunda linha de defesa da Velaro e tem como atribuições garantir que as políticas e procedimentos internos estejam em conformidade com a legislação e regulamentação aplicáveis. Compete-lhe monitorar transações (KYT), supervisionar alertas, realizar investigações internas, aplicar ou recomendar medidas disciplinares e efetuar comunicações ao COAF, quando necessário. A área também é responsável por organizar os treinamentos obrigatórios de compliance, apoiar o Diretor Responsável na elaboração de relatórios e pareceres, revisar políticas e manuais, e avaliar riscos de novos produtos, serviços ou tecnologias sob a ótica de PLD/FT."},{"p":"Adicionalmente, cabe à Área de Compliance conduzir os processos de identificação, qualificação e classificação de clientes e terceiros, assegurando que todos os relacionamentos estejam alinhados ao apetite de risco da Velaro. Para cada pessoa física ou júrídica que venha a contratar os produtos e serviços da companhia, é elaborado um parecer de diligência de clientes (Customer Due Diligence - CDD), no qual são avaliados os riscos de integridade, reputacionais e de lavagem de dinheiro. Esse parecer é construído a partir de verificações de antecedentes em bases públicas e privadas, consultas a listas restritivas e análise de eventuais ocorrências em mídias negativas, entre outros."},{"p":"Os procedimentos aplicáveis estão detalhados no Manual de Due Diligence de Clientes, Terceiros e Colaboradores, que disciplina as etapas de coleta, verificação, análise e classificação de risco. Com base nessas informações, a Área de Compliance emite uma opinião técnica sobre a viabilidade de contratação e sobre o nível de risco associado ao relacionamento."},{"st":"4.5 Área de Produtos"},{"p":"A Área de Produtos deve adotar o princípio de compliance by design, garantindo que qualquer novo produto, serviço, tecnologia ou funcionalidade seja avaliado sob a perspectiva de riscos de LD/FT antes de sua implementação. Isso inclui a análise conjunta com a Área de Compliance, de modo que potenciais vulnerabilidades sejam antecipadas e mitigadas desde a fase de concepção."},{"p":"Cabe ainda à Área de Produtos assegurar que sistemas e ferramentas tecnológicas desenvolvidas ou contratadas por terceiros incorporem requisitos mínimos de segurança, rastreabilidade e conformidade, evitando que a inovação traga fragilidades que possam ser exploradas para fins ilícitos. Nenhum produto, serviço ou tecnologia poderá ser lançado sem validação da Área de Compliance quanto aos riscos de PLD/FT."},{"st":"4.6 Área de Operações"},{"p":"A Área de Operações atua como a primeira linha de defesa no Programa de PLD/FT. Compete-lhe executar, de forma tempestiva e consistente, os controles definidos em processos operacionais relacionados ao fluxo de transações, liquidação de operações, gestão de contas e reconciliação de registros. É responsabilidade da área manter a rastreabilidade e a integridade de todas as informações operacionais, assegurando que cada transação possa ser devidamente identificada, monitorada e auditada."},{"p":"Além disso, a Área de Operações deve observar e reportar à Área de Compliance qualquer inconsistência, divergência ou indício suspeito identificado durante o processamento das operações. Isso inclui situações como transações não previstas no perfil do cliente, movimentações fora do padrão esperado, tentativas de burlar limites operacionais ou falhas nos sistemas de registro que possam comprometer a integridade dos dados."},{"p":"O papel da Área de Operações é, portanto, fundamental para a detecção precoce de anomalias no fluxo de transações, fornecendo insumos práticos e imediatos para as análises de Compliance e contribuindo para a efetividade do monitoramento contínuo previsto no Programa de PLD/FT."},{"st":"4.7 Recursos Humanos (RH)"},{"p":"A Área de Recursos Humanos desempenha papel fundamental na disseminação da cultura de integridade e conformidade dentro da Velaro. Cabe-lhe apoiar a Alta Administração e a Área de Compliance na promoção de valores éticos e no reforço do compromisso institucional de prevenção à lavagem de dinheiro e ao financiamento do terrorismo em todas as relações de trabalho."},{"p":"No âmbito operacional, o RH é responsável por apoiar a Área de Compliance na execução do processo de KYE - Know Your Employee (Conheça Seu Colaborador), que consiste na checagem de antecedentes, avaliação de integridade e verificação de informações relevantes de colaboradores e prestadores de serviços essenciais, tanto no momento da contratação quanto periodicamente. Esses procedimentos asseguram que apenas profissionais idôneos e alinhados aos valores da companhia façam parte do seu quadro funcional."},{"p":"O RH deve ainda apoiar a Área de Compliance na organização e controle de treinamentos obrigatórios em PLD/FT, garantindo que todos os colaboradores participem das capacitações, registrando a adesão e comunicando eventuais descumprimentos. Também é incumbência do RH apoiar a aplicação de medidas disciplinares decorrentes de violações desta Política, assegurando que tais medidas sejam proporcionais, tempestivas e coerentes com a gravidade da infração identificada."},{"st":"4.8 Colaboradores"},{"p":"Os colaboradores da Velaro são parte essencial do Programa de PLD/FT e têm a responsabilidade de zelar pela cultura de integridade e conformidade em todas as suas atividades. Espera-se que atuem de forma ética, transparente e em conformidade com esta Política, servindo como multiplicadores dos valores institucionais."},{"p":"Cada colaborador deve cumprir rigorosamente os procedimentos internos e participar obrigatoriamente dos treinamentos de prevenção à lavagem de dinheiro e ao financiamento do terrorismo, aplicando o conhecimento adquirido em sua rotina de trabalho. Também é dever de todos preservar a integridade e rastreabilidade dos registros, documentos e evidências sob sua responsabilidade, garantindo que estejam completos, corretos e disponíveis para auditoria ou investigações."},{"p":"É obrigação de cada colaborador comunicar imediatamente qualquer indício ou suspeita de irregularidade à Área de Compliance ou, alternativamente, ao seu superior imediato, utilizando os canais formais da empresa, incluindo o canal de denúncias. O relato de boa-fé é protegido contra retaliações, e qualquer indício de represália será investigado com seriedade e poderá ensejar medidas disciplinares."},{"p":"É expressamente proibido praticar tipping-off, ou seja, repassar a clientes ou terceiros informações relacionadas a investigações internas ou suspeitas de lavagem de dinheiro e financiamento do terrorismo. Essas informações devem ser tratadas de forma confidencial e só podem ser compartilhadas dentro do princípio do need-to-know."},{"p":"O descumprimento dessas responsabilidades poderá resultar em medidas disciplinares proporcionais, que podem incluir o desligamento, além de responsabilização civil, administrativa ou penal, conforme a gravidade da conduta."}]},{"t":"5. Avaliação Interna de Riscos","blocks":[{"p":"A Velaro adota a abordagem baseada em risco (risk-based approach), conforme a Circular Bacen nº 3.978/2020 e as Recomendações do GAFI. Os controles de PLD/FT não são uniformes, mas proporcionais ao risco avaliado para cada relacionamento ou operação, de forma a otimizar recursos e maximizar a efetividade preventiva."},{"p":"A Avaliação Interna de Riscos identifica, avalia e mitiga riscos de LD/FT e FPADM, orientando a calibragem dos controles internos. Está alinhada à abordagem baseada em risco e às expectativas regulatórias aplicáveis."},{"p":"Essa avaliação considera fatores como perfil dos clientes, produtos e serviços, canais de distribuição, jurisdições, tipos de transação, colaboradores e terceiros relevantes, bem como o ambiente regulatório. Avaliam-se riscos inerentes e a efetividade dos controles existentes para estimar o risco residual e definir planos de ação."},{"p":"O processo é conduzido a cada dois anos pela Área de Compliance e pode ser refeito sempre que houver mudanças relevantes (alterações regulatórias, novos produtos, novas jurisdições, mudanças significativas na carteira de clientes ou falhas de controle). Os resultados são consolidados em relatório formal apresentado à Alta Administração e ao Comitê de Compliance, que deliberam sobre a implementação dos planos de melhoria."},{"p":"Além da avaliação interna de riscos de compliance, a Velaro adota procedimentos específicos de Due Diligence de clientes, terceiros e colaboradores, destinados a identificar e classificar o risco individual de cada relacionamento."},{"p":"Para determinar o nível de risco de cliente, a Velaro analisa, entre outros fatores: (i) para pessoas físicas: ocupação ou profissão, fonte de renda declarada, patrimônio, finalidade e compatibilidade das operações com o perfil econômico-financeiro; (ii) para pessoas jurídicas: natureza e complexidade da estrutura societária, setor de atuação, porte e faturamento; (iii) para ambos: identificação e transparência dos beneficiários finais (quando aplicável); presença de Pessoas Expostas Politicamente (PEPs); origem dos recursos (Source of Funds) e formação do patrimônio (Source of Wealth); jurisdições envolvidas, com atenção especial a países listados pelo GAFI como de risco elevado ou sujeitos a sanções da ONU ou do OFAC; e volume, frequência e padrão das transações. Com base nesses critérios, classificam-se relacionamentos como de baixo, médio ou alto risco."},{"p":"Os processos de KYC, KYP e KYE que sustentam essa classificação estão descritos no Manual de Due Diligence de Clientes, Terceiros e Colaboradores, cuja observância é obrigatória para todas as áreas envolvidas."}]},{"t":"6. Controle e Monitoramento de Transações (KYT)","blocks":[{"p":"O monitoramento de transações na Velaro segue o princípio do Know Your Transaction (KYT), estruturado para acompanhar todo o fluxo de pagamentos transfronteiriços (cross-border payments) oferecido pela companhia."},{"p":"O processo inicia-se na entrada dos recursos em moeda fiduciária, que só pode ocorrer por meio de transferência originada em conta bancária mantida em instituição regulada em nome do cliente. A realização de qualquer operação está condicionada à aprovação prévia no processo de devida diligência (KYC), que inclui a identificação, qualificação e classificação do cliente e a verificação da legitimidade da origem dos fundos."},{"p":"Após a entrada, os valores são convertidos em ativos virtuais estáveis (stablecoins) por meio de operações com OTCs parceiras, sendo custodiados em carteiras da Velaro na Fireblocks. A partir desse ponto, todo o monitoramento transacional em criptoativos é realizado por meio da ferramenta Chainalysis, integrada via API aos sistemas da companhia, permitindo supervisão contínua das transações de entrada e saída das carteiras sob gestão. Além disso, a Velaro dispõe de capacidade para análises manuais adicionais, possibilitando investigar endereços específicos e examinar com maior detalhe transações sinalizadas pelo sistema."},{"p":"O monitoramento contempla tanto o ponto de origem (sender) quanto o ponto de destino (receiver) da operação. Nas operações com destino em moeda fiduciária, a diligência inclui a validação da titularidade da conta bancária receptora. Já nas transferências para carteiras digitais, a Velaro somente efetua operações com VASPs devidamente regulados, assegurando que o beneficiário final esteja sujeito a controles de identificação e prevenção equivalentes. A análise do receiver é considerada no processo de classificação de risco da operação, em linha com a abordagem baseada em risco adotada pela companhia."},{"p":"As regras e parâmetros utilizados são definidos pela Velaro e são revistos periodicamente pela Área de Compliance, de forma a garantir atualização frente a novos riscos e reduzir a incidência de falsos positivos sem comprometer a sensibilidade do monitoramento. Todos os alertas tratados - sejam descartados, confirmados como atípicos ou escalonados para investigação - são devidamente documentados e arquivados por prazo mínimo de dez anos, de modo a assegurar rastreabilidade e transparência."},{"p":"O detalhamento dos critérios de alerta, indicadores de risco e procedimentos aplicáveis encontra-se descrito na Política de Monitoramento de Transações e no Procedimento para Transações Suspeitas, que complementam esta Política."}]},{"t":"7. Canal de Denúncias","blocks":[{"p":"A Velaro mantém canal de denúncias seguro e acessível a colaboradores, administradores, clientes, parceiros e terceiros. O canal recebe relatos sobre violações desta Política e de normas internas ou legais, permitindo comunicação direta sem barreiras hierárquicas."},{"p":"O canal garante anonimato e confidencialidade, bem como proteção contra qualquer forma de retaliação a denunciantes de boa-fé. As denúncias são triadas pela Área de Compliance e investigadas conforme a gravidade. O canal integra a cultura de speak-up da Velaro, estimulando manifestação responsável e fortalecendo a integridade institucional."},{"p":"As comunicações sobre potenciais violações podem ser realizadas por meio do endereço de e-mail canaldedenuncias.br@bsos.co ou, de forma anônima, através do formulário eletrônico de denúncias disponível em https://forms.gle/5HyMeqWjqNds4TV17."},{"p":"A Velaro incentiva todos os colaboradores a utilizarem o canal oficial, assegurando proteção contra qualquer forma de retaliação. Alternativamente, caso se sintam mais confortáveis, os colaboradores também podem reportar diretamente a seus gestores imediatos ou à Área de Compliance, que garantirão o devido encaminhamento e tratamento da informação recebida."}]},{"t":"8. Investigações Internas e Medidas Disciplinares","blocks":[{"p":"As investigações internas apuram, de forma imparcial, sigilosa e documentada, indícios de descumprimento desta Política, do Código de Conduta ou de envolvimento em práticas que possam configurar LD/FT, corrupção, fraude ou outras irregularidades. O procedimento está alinhado à Lei nº 9.613/1998, à Circular Bacen nº 3.978/2020 e às recomendações do GAFI."},{"p":"O fluxo padrão envolve triagem inicial pela Área de Compliance, definição de escopo, coleta de evidências (documentos, registros de sistema, entrevistas, dados técnicos), análise e relatório conclusivo com recomendações. Em casos complexos, pode-se recorrer a consultoria externa para garantir profundidade técnica e independência."},{"p":"Confirmadas irregularidades, aplicam-se medidas disciplinares proporcionais (advertência, suspensão, desligamento; e, para terceiros, rescisão contratual), sem prejuízo de comunicações ao COAF (Unidade de Inteligência Financeira do Brasil) e cooperação com autoridades. Investigações são também instrumento de aprendizado, alimentando melhorias de controles e processos."}]},{"t":"9. Treinamento e Conscientização","blocks":[{"p":"A Velaro mantém um programa estruturado de treinamento contínuo e comunicações internas voltado à prevenção da lavagem de dinheiro, do financiamento do terrorismo e do financiamento da proliferação de armas de destruição em massa. O objetivo é assegurar que todos os colaboradores compreendam suas responsabilidades, saibam identificar situações de risco no desempenho de suas funções e estejam preparados para adotar as medidas preventivas adequadas."},{"p":"Os treinamentos são obrigatórios e ocorrem no momento do onboarding, de forma anual e em reciclagens extraordinárias sempre que houver mudanças relevantes no ambiente regulatório, na carteira de clientes ou nos produtos e serviços oferecidos. O conteúdo abrange a legislação aplicável (Leis 9.613/1998 e 14.478/2022, Circular 3.978/2020), as Recomendações do GAFI, políticas e procedimentos internos, sinais de alerta, uso do canal de denúncias e estudos de caso práticos. As comunicações internas periódicas reforçam esse processo, divulgando alertas, boas práticas e atualizações relevantes."},{"p":"A responsabilidade pela elaboração, execução e acompanhamento dos treinamentos é da Área de Compliance, que mantém registros formais de participação, adapta os conteúdos ao cenário regulatório e de risco e garante que todos os colaboradores sejam devidamente capacitados. Esse processo contribui para fortalecer a cultura de integridade da Velaro e para consolidar a prevenção de práticas ilícitas em todas as áreas da companhia."}]},{"t":"10. Avaliação de Efetividade do Programa","blocks":[{"p":"A Velaro realiza periodicamente a avaliação de efetividade do seu Programa de PLD/FT, com o objetivo de assegurar que os controles adotados funcionem na prática de maneira adequada, eficaz e proporcional ao risco. Essa avaliação busca verificar a correta aplicação dos procedimentos de identificação, diligência, monitoramento, investigações e treinamentos, bem como identificar eventuais lacunas ou fragilidades que demandem correção."},{"p":"A avaliação é realizada pelo menos uma vez ao ano, podendo ser complementada por revisões extraordinárias sempre que houver mudanças relevantes no perfil de risco da companhia, tais como alterações regulatórias, lançamento de novos produtos, ingresso em novas jurisdições ou falhas de controle identificadas."},{"p":"Os resultados são consolidados em um relatório anual apresentado à Alta Administração e ao Comitê de Compliance, que deliberam sobre as recomendações de melhoria e acompanham os prazos de implementação definidos. Esse processo reforça a governança da companhia e promove a melhoria contínua do Programa de PLD/FT."}]},{"t":"11. Revisão da Política","blocks":[{"p":"Esta Política será revisada, no mínimo, a cada dois anos, de forma a garantir sua atualização frente à evolução regulatória. Revisões extraordinárias poderão ser realizadas sempre que houver mudanças relevantes no ambiente de risco ou no modelo de negócios."},{"p":"O processo de revisão é conduzido pela Área de Compliance, e a versão atualizada é submetida à Alta Administração para deliberação e aprovação formal."},{"st":"Anexo I - Exemplos de situações suspeitas"},{"p":"A lista abaixo é exemplificativa e deve ser interpretada sempre em conformidade com o perfil de risco do cliente e da operação. A identificação de um red flag não implica automaticamente em atividade ilícita, mas exige análise pela Área de Compliance:"},{"itens":["A lista abaixo é exemplificativa e deve ser interpretada sempre em conformidade com o perfil de risco do cliente e da operação. A identificação de um red flag não implica automaticamente em atividade ilícita, mas exige análise pela Área de Compliance:","Resistência em fornecer documentação ou fornecimento de dados inconsistentes;","Divergência entre patrimônio declarado e volume/frequência de operações;","Indícios de uso de interpostas pessoas para ocultar o beneficiário final;","Citações negativas em mídia confiável relacionadas a ilícitos financeiros, corrupção ou fraude;","Operações fracionadas (smurfing) para burlar controles;","Transações de valor expressivo realizadas em curto intervalo de tempo, sobretudo por contas recém-abertas ou que estavam inativas;","Operações com jurisdições de alto risco ou sujeitas a sanções (GAFI, ONU, OFAC);","Movimentações com carteiras associadas a ilícitos;","Uso de mixers, tumblers ou outras ferramentas de ofuscação;","Operações por meio de exchanges não reguladas ou sediadas em jurisdições de baixa transparência;","Depósitos em exchanges seguidos de movimentações sucessivas e saque imediato, sem justificativa econômica aparente;","Operações originadas em exchanges ou corretoras de jurisdição sem relação com o local de residência ou atuação do cliente;","Tentativas de burlar procedimentos de identificação (KYC, KYB, KYP, KYE);","Conexões ou IPs originados de países sancionados ou classificados como de alto risco;","Saques frequentes em caixas eletrônicos de criptomoedas (quando aplicável ao escopo da operação)."]}]}],"en":[{"t":"1. Introduction","blocks":[{"p":"The phenomenon of money laundering and terrorist financing represents one of the greatest challenges to the integrity and stability of the global financial system. Its consequences transcend borders, undermine the credibility of financial institutions before regulators and society, fuel criminal activities such as drug trafficking, corruption, and tax evasion, and create systemic risks capable of destabilizing markets. The growth and sophistication of these practices, especially in a context of technological innovation and globalization of financial flows, demand increasingly stringent standards of prevention and control."},{"p":"In this context, Velaro Network (“Company” or “Velaro”) adopts the institutional commitment to prevent and combat money laundering (ML), terrorist financing (TF), and the financing of the proliferation of weapons of mass destruction (FPWMD). This responsibility is assumed in accordance with Law No. 9,613/1998, Law No. 14,478/2022, the Central Bank of Brazil Circular No. 3,978/2020 and Resolution No. 520/2025, and the Recommendations of the Financial Action Task Force (FATF), reflecting the company’s determination to align with global best practices."},{"p":"The purpose of this Policy is to ensure that Velaro conducts its operations in compliance with applicable legislation and with the highest ethical standards, preventing its use for illicit purposes and strengthening the integrity of the financial system."},{"p":"The scope of this Policy is broad and mandatory, applying to Senior Management, the Director Responsible for AML, the Compliance Area, all employees and officers (including consultants and service providers), business partners and critical suppliers, as well as clients that use Velaro’s services. Compliance with its provisions is an essential condition for maintaining contractual or employment relationships with the company and will be considered in performance evaluation and third-party management."},{"p":"This Policy forms part of Velaro’s Anti-Money Laundering and Counter-Terrorism Financing Program and serves as a guide for risk management, implementation of internal controls, delivery of training, and application of corrective and disciplinary measures. Its purpose is not only to ensure the company’s alignment with regulatory expectations but also to safeguard the reputation, soundness, and integrity of Velaro, its clients, and the financial system as a whole."}]},{"t":"2. Definitions","blocks":[{"p":"2.1 Money Laundering (ML): Money laundering is understood as the act of concealing or disguising the nature, origin, location, disposition, movement, or ownership of assets, rights, or values derived, directly or indirectly, from a criminal offense. Money laundering generally occurs in three stages: placement (insertion of illicit funds into the financial system), layering (movements and multiple transactions intended to make it difficult to trace the origin), and integration (reintroduction of the capital into the formal market as if it were legitimate). Each of these stages may involve the use of traditional financial instruments, shell companies, international transactions, or virtual assets."},{"p":"2.2 Terrorist Financing (TF): Terrorist financing consists of providing, raising, making available, or using resources, assets, or values of any kind, by any means, directly or indirectly, for the purpose of supporting, planning, facilitating, or committing terrorist acts. Unlike money laundering, which seeks to give the appearance of legitimacy to illicit funds, terrorist financing may involve both funds from illicit sources and resources derived from lawful activities."},{"p":"2.3 Virtual Asset: Pursuant to Article 3, item I, of Law No. 14,478/2022, a virtual asset is a digital representation of value that can be traded or transferred electronically and used for payments or investment purposes. It is not considered legal tender, electronic money, a payment instrument already regulated, or a security."},{"p":"2.4 Client: For the purposes of this Policy, a client is an individual or a legal entity that contracts Velaro’s services and/or products."},{"p":"2.5 Ultimate Beneficial Owner (UBO): The beneficial owner is the natural person who ultimately owns, controls, or exercises significant influence over a legal entity, or on whose behalf a transaction is conducted, and may also be identified as the individual who directly or indirectly holds 25% or more of the share capital or voting rights of an entity."},{"p":"2.6 Politically Exposed Person (PEP): For the purposes of this Policy, a Politically Exposed Person (PEP) is any individual who holds or has held relevant public positions or functions, in accordance with the applicable legal and regulatory definition. The classification as a PEP covers both those currently in office and those who have exercised such functions within the last five years, including their representatives, family members, and close associates. Pursuant to COAF Resolution No. 40/2021, PEPs are considered to be the holders of the following positions: holders of elective mandates in the Executive and Legislative branches of the Federal Government; those holding positions in the Federal Executive Branch as: (a) Minister of State or equivalent; (b) Special Nature or equivalent positions; (c) President, Vice-President, and Director, or equivalents, of entities of the indirect public administration; and (d)"},{"p":"Senior Management and Advisory positions - DAS level 6 or equivalent; members of the National Council of Justice, the Federal Supreme Court, the Superior Courts, the Federal Regional Courts, the Regional Labor Courts, the Regional Electoral Courts, the Superior Council of Labor Justice, and the Council of Federal Justice; members of the National Council of the Public Prosecutor’s Office, the Attorney General of the Republic, the Deputy Attorney General of the Republic, the Attorney General for Labor, the Attorney General for Military Justice, the Deputy Prosecutors General of the Republic, and the State and Federal District Attorneys General; members of the Federal Court of Accounts, the Prosecutor General and Deputy Prosecutors General of the Public Prosecutor’s Office at the Federal Court of Accounts; National Presidents and Treasurers, or equivalents, of political parties; State Governors and Secretaries of State and of the Federal District, State and District Deputies, Presidents, or equivalents, of state and district indirect public administration entities, and Presidents of State and Federal District Courts of Justice, Military Courts, Courts of Accounts or equivalents; Mayors, City Council Members, Municipal Secretaries, Presidents, or equivalents, of municipal indirect public administration entities, and Presidents of Municipal Courts of Accounts or equivalents. Also considered politically exposed persons abroad are: heads of state or government; senior-level politicians; senior government officials; general officers and senior members of the judiciary; senior executives of state-owned companies; and leaders of political parties. Additionally, senior executives of international public or private organizations are considered politically exposed persons."},{"p":"2.7 Employees: employees include staff members, managers, directors, and outsourced service providers directly contracted by Velaro to perform essential services or services directly related to the company’s core activities."},{"p":"2.8 Third Parties: third parties are natural or legal persons who are not employees, staff members, or directors of Velaro but maintain a contractual or business relationship with the company. This definition includes support service providers contracted to assist the company in non-essential activities (such as intermediaries, external lawyers, auditors, collection agencies, among others); and strategic partners, understood as critical suppliers or entities with which Velaro maintains a continuous and mutually beneficial contractual relationship, distinct from clients or employees."},{"p":"2.9 VASP (Virtual Asset Service Provider): a VASP is a legal entity that, on behalf of third parties, offers services related to virtual assets. Such activities include the exchange between virtual assets and fiat currency or between different virtual assets; the transfer of virtual assets; the custody or administration of virtual assets or instruments that allow control over them; and the participation or intermediation in financial services associated with the issuance or sale of virtual assets."}]},{"t":"3. Control Mechanisms","blocks":[{"p":"Velaro’s AML/CFT Program is composed of integrated mechanisms designed to prevent, detect, and report suspicious activities in a timely manner. Among them, the following stand out:"},{"itens":["Policies and Procedures;","Internal Risk Assessment;","Due diligence processes for clients, third parties, and employees;","Transaction monitoring with market-leading technological tools and continuous calibration;","Whistleblowing channel, secure and anonymous, with protection for good-faith whistleblowers;","Mandatory training sessions (onboarding, annual, and refresher) and internal communications;","Internal investigations with proportional disciplinary measures and communication to authorities when applicable;","Periodic effectiveness assessment, with an annual report to Senior Management."]}]},{"t":"4. Governance and Responsibilities","blocks":[{"p":"The governance of Velaro’s AML/CFT Program is structured to ensure clarity of roles, effectiveness of controls, and accountability at all levels of the organization. The prevention of financial crimes is an institutional priority and must permeate all areas of the company. Senior Management ensures sponsorship and oversight of the program, while the Director Responsible for AML and the Compliance Department lead its day-to-day implementation in collaboration with the business areas. Every employee, regardless of hierarchical level, has the duty to act in accordance with this Policy, with the values of integrity, and with applicable legal and regulatory requirements."},{"st":"4.1 Senior Management"},{"p":"Senior Management is responsible for sponsoring and supervising the implementation of this Policy, ensuring that its execution is effective and that the company remains permanently aligned with regulatory requirements and market best practices. At this level, responsibilities include establishing the necessary governance framework and ensuring that the Compliance Department has independence, autonomy, and adequate human, financial, and technological resources."},{"p":"Senior Management is also responsible for promoting a culture of integrity throughout the organization and deliberating, based on the opinion of the Director Responsible for AML and the Compliance Department, on the initiation, continuation, or termination of relationships with clients classified as high risk."},{"st":"4.2 Compliance Committee"},{"p":"To ensure proper governance and oversight of compliance matters, Velaro has established a Compliance Committee within its AML/CFT Program."},{"p":"The Committee is composed of one member of the senior management of Velaro and two members of the senior management of BSOS Holdings INC., the parent company."},{"p":"The Committee is responsible for reviewing and approving policies, procedures, and other key compliance-related documents, as well as deliberating on matters that may have a significant impact on the AML/CFT framework, including the approval of the Internal Risk Assessment and the review of the annual report on the program’s effectiveness. Approvals may be formalized through meetings or written resolutions, in order to ensure efficiency and flexibility in the decision-making process."},{"p":"The Committee shall meet ordinarily every 3 (three) months and extraordinarily whenever necessary, upon call by its Chairperson or at the request of its members."},{"st":"The Committee shall be composed as follows:"},{"itens":["Chairperson: Maria Zelner - Head of Compliance;","Secretary: Alana Vilaça - Compliance Analyst."]},{"p":"The Secretary is responsible for supporting meeting organization, preparing minutes, managing agendas, and monitoring the implementation of the Committee’s decisions."},{"st":"4.3 Director Responsible for AML"},{"p":"The Director Responsible for AML is the appointed authority responsible for supervising the implementation of this Policy and ensuring Velaro’s compliance with regulatory requirements and market best practices. The Officer must ensure that internal prevention procedures and controls are effectively applied and that the organization adheres to the guidelines established by Senior Management."},{"p":"The Director Responsible for AML is responsible for overseeing the processes of identification and due diligence of clients, ultimate beneficial owners, third parties, and employees, and for approving enhanced due diligence measures in high-risk situations. The Officer must have unrestricted access to the information necessary for the performance of their duties, including identification data, transaction records, and monitoring reports, and may request additional information from any area of the company."},{"p":"In addition, the Officer must ensure that any suspicious transactions are analyzed promptly and, when applicable, reported to the competent authorities. The Director Responsible for AML also serves as Velaro’s liaison with regulators and supervisory bodies on AML/CFT matters and must report periodically to Senior Management on the status of the program, its deficiencies, and the improvement measures adopted."},{"st":"4.4 Compliance Department"},{"p":"The Compliance Department constitutes Velaro’s second line of defense and is responsible for ensuring that internal policies and procedures are in line with applicable laws and regulations. Its duties include transaction monitoring (KYT), supervision of alerts, conducting internal investigations, applying or recommending disciplinary measures, and making reports to COAF (Financial Intelligence Unit of Brazil) when necessary. The department is also responsible for organizing mandatory compliance training, supporting the Director Responsible for AML in the preparation of reports and opinions, reviewing policies and manuals, and assessing risks related to new products, services, or technologies from an AML/CFT perspective."},{"p":"Additionally, the Compliance Department is responsible for conducting the processes of identification, qualification, and risk classification of clients and third parties, ensuring that all relationships align with Velaro’s risk appetite. For each individual or entity contracting the company’s products and services, a Customer Due Diligence (CDD) opinion is prepared, in which integrity, reputational, and money laundering risks are assessed. This opinion is based on background checks in public and private databases, consultations of restrictive lists, and analysis of potential adverse media findings, among others."},{"p":"The applicable procedures are detailed in the Due Diligence Manual for Clients, Third Parties, and Employees, which sets forth the stages of data collection, verification, analysis, and risk classification. Based on this information, the Compliance Department issues a technical opinion on the viability of the relationship and the associated risk level."},{"st":"4.5 Products Department"},{"p":"The Products Department must adopt the principle of compliance by design, ensuring that any new product, service, technology, or feature is assessed for ML/TF risks prior to its implementation. This includes joint analysis with the Compliance Department so that potential vulnerabilities are anticipated and mitigated from the design stage. The Products Department is also responsible for ensuring that systems and technological tools developed or contracted from third parties incorporate minimum requirements of security, traceability, and compliance, avoiding vulnerabilities that could be exploited for illicit purposes. No product, service, or technology may be launched without validation from the Compliance Department regarding ML/TF risks."},{"st":"4.6 Operations Department"},{"p":"The Operations Department acts as the first line of defense in Velaro’s AML/CFT Program. Its role is to promptly and consistently execute the controls defined in operational processes related to transaction flows, settlement of operations, account management, and record reconciliation. The department is responsible for maintaining the traceability and integrity of all operational information, ensuring that each transaction can be properly identified, monitored, and audited."},{"p":"Furthermore, the Operations Department must observe and report to the Compliance Department any inconsistency, discrepancy, or suspicious indicator identified during transaction processing. This includes cases such as transactions not aligned with the client’s profile, atypical movements, attempts to circumvent operational limits, or system failures that may compromise data integrity."},{"p":"The role of the Operations Department is therefore essential for the early detection of anomalies in transaction flows, providing practical and immediate inputs for Compliance analyses and contributing to the effectiveness of ongoing monitoring under the AML/CFT Program."},{"st":"4.7 Human Resources (HR)"},{"p":"The Human Resources Department plays a key role in disseminating a culture of integrity and compliance within Velaro. It supports Senior Management and the Compliance Department in promoting ethical values and reinforcing the institutional commitment to preventing money laundering and terrorist financing across all employment relationships."},{"p":"Operationally, HR is responsible for supporting the Compliance Department in carrying out the Know Your Employee (KYE) process, which consists of background checks, integrity assessments, and verification of relevant information about employees and essential service providers, both at the time of hiring and periodically. These procedures ensure that only trustworthy professionals aligned with the company’s values are part of its workforce."},{"p":"HR must also support the Compliance Department in organizing and controlling mandatory AML/CFT training, ensuring that all employees participate in the sessions, recording attendance, and reporting any non-compliance. HR is further responsible for supporting the application of disciplinary measures resulting from violations of this Policy, ensuring that such measures are proportional, timely, and consistent with the severity of the infraction."},{"st":"4.8 Employees"},{"p":"Velaro’s employees are an essential part of the AML/CFT Program and share responsibility for upholding the culture of integrity and compliance in all their activities. They are expected to act ethically, transparently, and in accordance with this Policy, serving as promoters of institutional values."},{"p":"Each employee must strictly follow internal procedures and participate in mandatory AML/CFT training, applying the knowledge acquired in their daily work. Employees are also responsible for preserving the integrity and traceability of records, documents, and evidence under their care, ensuring they are complete, accurate, and available for audit or investigation."},{"p":"It is each employee’s duty to immediately report any indication or suspicion of irregularities to the Compliance Department or, alternatively, to their direct supervisor, using the company’s formal channels, including the whistleblowing channel. Good-faith reports are protected against retaliation, and any sign of reprisal will be investigated seriously and may result in disciplinary measures."},{"p":"Employees are expressly prohibited from engaging in tipping-off, i.e., disclosing to clients or third parties any information related to internal investigations or suspicions of money laundering or terrorist financing. Such information must be treated as confidential and may only be shared under the principle of need-to-know."},{"p":"Failure to comply with these responsibilities may result in proportional disciplinary measures, which may include termination, in addition to civil, administrative, or criminal liability, depending on the severity of the misconduct."}]},{"t":"5. Internal Risk Assessment","blocks":[{"p":"Velaro adopts a risk-based approach, in accordance with Central Bank of Brazil Circular No. 3,978/2020 and the Recommendations of the Financial Action Task Force (FATF). AML/CFT controls are not uniform but rather proportional to the level of risk assessed for each relationship or transaction, in order to optimize resources and maximize preventive effectiveness."},{"p":"The Internal Risk Assessment identifies, evaluates, and mitigates ML/TF and FPWMD risks, guiding the calibration of internal controls. It is aligned with the risk-based approach and with applicable regulatory expectations."},{"p":"This assessment considers factors such as the profile of clients, products and services, distribution channels, jurisdictions, types of transactions, employees and third parties, as well as the regulatory environment. Inherent risks and the effectiveness of existing controls are evaluated to estimate residual risk and define action plans."},{"p":"The process is conducted every two years by the Compliance Department and may be repeated whenever there are significant changes (regulatory amendments, new products, new jurisdictions, material changes in the client portfolio, or control failures). The results are consolidated in a formal report presented to Senior Management, which deliberates on the implementation of improvement plans."},{"p":"In addition to the internal compliance risk assessment, Velaro adopts specific Due Diligence procedures for clients, third parties, and employees, aimed at identifying and classifying the individual risk of each relationship."},{"p":"To determine the customer risk level, Velaro analyzes, among other factors: (i) for individuals: occupation or profession, declared income source, assets, purpose and compatibility of operations with the economic-financial profile; (ii) for legal entities: nature and complexity of corporate structure, sector of activity, size and revenue; (iii) for both: identification and transparency of beneficial owners (when applicable); presence of Politically Exposed Persons (PEPs); source of funds and source of wealth; jurisdictions involved, with special attention to countries listed by the FATF as high-risk or subject to UN or OFAC sanctions; and volume, frequency and pattern of transactions. Based on these criteria, relationships are classified as low, medium or high risk."},{"p":"The specific criteria and methodologies applied in the Internal Risk Assessment - including risk matrices, weighting of factors, and approval flows - are detailed in the Due Diligence Manual for Clients, Third Parties and Employees, which must be observed by all areas involved."}]},{"t":"6. Transaction Control and Monitoring (KYT)","blocks":[{"p":"Transaction monitoring at Velaro follows the principle of Know Your Transaction (KYT), structured to oversee the entire flow of cross-border payments offered by the company."},{"p":"The process begins with the inflow of fiat currency, which can only occur through transfers originating from bank accounts held in regulated financial institutions under the name of the client. The execution of any transaction is subject to prior approval under the due diligence process (KYC), which includes the identification, qualification, and risk classification of the client, as well as the verification of the legitimacy of the source of funds."},{"p":"Once received, the funds are converted into stablecoins through operations with partner OTCs and are then held in Velaro’s wallets within Fireblocks. From this stage onward, all cryptoasset transaction monitoring is carried out through the Chainalysis tool, integrated via API with the company’s systems, enabling continuous supervision of both incoming and outgoing transactions from the managed wallets. In addition, Velaro maintains the capability to perform manual enhanced due diligence reviews, allowing the investigation of specific addresses and a deeper examination of transactions flagged by the system."},{"p":"Monitoring covers both the origin (sender) and the destination (receiver) of the transaction. For transactions with fiat currency as the final output, due diligence includes validating the ownership of the recipient’s bank account. For transfers to digital wallets, Velaro only conducts operations with duly regulated VASPs, ensuring that the ultimate beneficiary is subject to equivalent identification and prevention controls. The receiver’s analysis is factored into the risk classification of the transaction, in line with the company’s risk-based approach."},{"p":"The rules and parameters applied are defined by Velaro and periodically reviewed by the Compliance Department to ensure alignment with emerging risks and to reduce the incidence of false positives without compromising monitoring sensitivity. All handled alerts - whether discarded, confirmed as atypical, or escalated for investigation - are properly documented and stored for a minimum period of ten years to guarantee traceability and transparency."},{"p":"Details of alert criteria, risk indicators, and applicable procedures are set out in the Transaction Monitoring Policy, which complement this Policy."}]},{"t":"7. Whistleblowing Channel","blocks":[{"p":"Velaro maintains a secure and accessible whistleblowing channel available to employees, clients, partners, and third parties. The channel receives reports of violations of this Policy and of internal or legal rules, enabling direct communication without hierarchical barriers."},{"p":"The channel guarantees anonymity and confidentiality, as well as protection against any form of retaliation toward good-faith whistleblowers. Reports are screened by the Compliance Department and investigated according to their severity. The channel is part of Velaro’s speak-up culture, encouraging responsible reporting and strengthening institutional integrity."},{"p":"Reports of potential violations can be submitted via the email address canaldedenuncias.br@bsos.co or, anonymously, through the electronic whistleblowing form available at https://forms.gle/AgUAXjFtUhsLcZ2c6."},{"p":"Velaro encourages all employees to use the official channel, ensuring protection against any form of retaliation. Alternatively, if they feel more comfortable, employees may also report directly to their immediate managers or to the Compliance Department, which will ensure the proper handling and processing of the information received."}]},{"t":"8. Internal Investigations and Disciplinary Measures","blocks":[{"p":"Internal investigations are conducted in an impartial, confidential, and documented manner to examine indications of non-compliance with this Policy, the Code of Conduct, or involvement in practices that may constitute ML/TF, corruption, fraud, or other irregularities. The procedure is aligned with Law No. 9,613/1998, Central Bank of Brazil Circular No. 3,978/2020, and FATF recommendations."},{"p":"The standard process involves an initial screening by the Compliance Department, definition of scope, evidence collection (documents, system records, interviews, technical data), analysis, and a conclusive report with recommendations. In complex cases, external consultants may be engaged to ensure technical depth and independence."},{"p":"When irregularities are confirmed, proportional disciplinary measures are applied (warning, suspension, termination of employment; and for third parties, contract termination), without prejudice to mandatory reporting to COAF and cooperation with authorities. Investigations also serve as a learning tool, feeding into improvements of controls and processes."}]},{"t":"9. Training and Awareness","blocks":[{"p":"Velaro maintains a structured program of continuous training and internal communications aimed at preventing money laundering, terrorist financing, and the financing of the proliferation of weapons of mass destruction. The purpose is to ensure that all employees understand their responsibilities, are able to identify risk situations in the performance of their duties, and are prepared to adopt the appropriate preventive measures."},{"p":"Training sessions are mandatory and take place at onboarding, on an annual basis, and through extraordinary refreshers whenever there are significant changes in the regulatory environment, client portfolio, or products and services offered. The content covers applicable legislation (Laws 9,613/1998 and 14,478/2022, Central Bank Circular 3,978/2020), FATF Recommendations, internal policies and procedures, red flags, use of the whistleblowing channel, and practical case studies. Periodic internal communications reinforce this process by disseminating alerts, best practices, and relevant updates."},{"p":"The Compliance Department is responsible for designing, executing, and monitoring the training program, maintaining formal records of participation, adapting content to the regulatory and risk environment, and ensuring that all employees are properly trained. This process contributes to strengthening Velaro’s culture of integrity and to consolidating the prevention of illicit practices across all areas of the company."}]},{"t":"10. Program Effectiveness Assessment","blocks":[{"p":"Velaro periodically conducts an effectiveness assessment of its AML/CFT Program in order to ensure that the adopted controls operate in practice in an adequate, effective, and risk-proportionate manner. This assessment seeks to verify the correct application of identification, due diligence, monitoring, investigation, and training procedures, as well as to identify any gaps or weaknesses that require remediation."},{"p":"The assessment is carried out at least once a year and may be supplemented by extraordinary reviews whenever there are significant changes in the company’s risk profile, such as regulatory amendments, the launch of new products, entry into new jurisdictions, or the identification of control failures."},{"p":"The results are consolidated into an annual report presented to the Compliance Committee and Senior Management, which deliberate on the improvement recommendations and monitor the defined implementation timelines. This process strengthens the company’s governance framework and promotes the continuous improvement of the AML/CFT Program."}]},{"t":"11. Policy Review","blocks":[{"p":"This Policy shall be reviewed at least every two years to ensure its alignment with regulatory developments. Extraordinary reviews may be conducted whenever there are significant changes in the risk environment or in the business model."},{"p":"The review process is led by the Compliance Department, and the updated version is submitted to Senior Management for deliberation and formal approval."},{"st":"Annex I - Examples of Suspicious Situations"},{"p":"The list below is illustrative and must always be interpreted in accordance with the client’s and the transaction’s risk profile. The identification of a red flag does not automatically imply illicit activity but requires analysis by the Compliance Department:"},{"itens":["Resistance to providing documentation or provision of inconsistent data;","Discrepancy between declared assets and the volume/frequency of transactions;","Indications of the use of intermediaries to conceal the ultimate beneficial owner;","Negative media references from reliable sources related to financial crimes, corruption, or fraud;","Structured transactions (smurfing) aimed at circumventing controls;","High-value transactions carried out within a short period of time, especially by newly opened or previously inactive accounts;","Operations with high-risk or sanctioned jurisdictions (FATF, UN, OFAC);","Movements involving wallets linked to illicit activities;","Use of mixers, tumblers, or other obfuscation tools;","Transactions through unregulated exchanges or those located in low-transparency jurisdictions;","Deposits into exchanges followed by successive movements and immediate withdrawal without apparent economic justification;","Operations originating from exchanges or brokers located in jurisdictions with no connection to the client’s residence or business activities;","Attempts to circumvent identification procedures (KYC, KYB, KYP, KYE);","Connections or IP addresses originating from sanctioned or high-risk countries;","Frequent withdrawals from cryptocurrency ATMs (when applicable to the scope of the operation)."]}]}]},"due-diligence":{"pt":[{"t":"1. Introdução e Objetivo","blocks":[{"p":"O presente Manual tem como objetivo estabelecer diretrizes e procedimentos de due diligence aplicáveis a clientes (KYC - Know Your Customer), parceiros e terceiros relevantes (KYP - Know Your Partner) e colaboradores (KYE - Know Your Employee)."},{"p":"Ele detalha os processos de identificação, qualificação, classificação de risco, monitoramento contínuo e escalonamento, em conformidade com a Lei nº 9.613/1998, a Lei nº 14.478/2022, a Circular Bacen nº 3.978/2020, a Resolução BCB nº 520/2025 e as Recomendações do GAFI/FATF."},{"p":"Sua finalidade é assegurar que a Velaro Network (“Velaro” ou “Empresa”) estabeleça e mantenha relações exclusivamente com contrapartes legítimas, prevenindo sua utilização para fins ilícitos, preservando sua reputação e contribuindo para a integridade do sistema financeiro. Este Manual deve ser aplicado em conjunto com as demais políticas internas de compliance da companhia, de forma a garantir consistência e robustez no programa de prevenção à lavagem de dinheiro e financiamento do terrorismo."}]},{"t":"2. Definições","blocks":[{"p":"2.1 Lavagem de Dinheiro: Entende-se por lavagem de dinheiro o ato de ocultar ou dissimular a natureza, origem, localização, disposição, movimentação ou propriedade de bens, direitos ou valores provenientes, direta ou indiretamente, de infração penal."},{"p":"A lavagem de dinheiro ocorre geralmente em três etapas: colocação (inserção do dinheiro ilícito no sistema financeiro), ocultação (movimentações e camadas de transações para dificultar o rastreio da origem) e integração (reintrodução do capital no mercado formal como se fosse legítimo). Cada uma dessas fases pode ser realizada por meio de instrumentos financeiros tradicionais, empresas de fachada, operações internacionais ou ativos virtuais."},{"p":"2.2 Financiamento do Terrorismo: o financiamento do terrorismo consiste em prover, arrecadar, disponibilizar ou utilizar recursos, ativos ou valores de qualquer natureza, por qualquer meio, direta ou indiretamente, com a finalidade de apoiar, planejar, facilitar ou praticar atos terroristas. Ao contrário da lavagem de dinheiro, que busca dar aparência de licitude a recursos ilícitos, o financiamento do terrorismo pode envolver tanto recursos de origem ilícita quanto fundos provenientes de atividades lícitas."},{"p":"2.3 Cliente: Para fins desta Política, cliente é a pessoa física ou jurídica que contrata os serviços e/ou produtos da Velaro."},{"p":"2.4 Beneficiário Final (UBO): considera-se beneficiário final a pessoa natural que, em última instância, possui, controla ou influencia significativamente pessoa jurídica, ou em nome da qual uma transação é conduzida, podendo ser identificado também como quem detém, direta ou indiretamente, 25% ou mais do capital social ou dos direitos de voto de uma entidade."},{"p":"2.5 Pessoa Exposta Politicamente (PEP): Para fins desta Política, considera-se Pessoa Exposta Politicamente (PEP) todo indivíduo que ocupe ou tenha ocupado cargos ou funções públicas relevantes, conforme definição legal e regulamentar aplicável. A classificação como PEP abrange tanto aqueles que estejam atualmente no exercício de tais funções quanto aqueles que as tenham exercido nos últimos cinco anos, incluindo seus representantes, familiares e pessoas de relacionamento próximo. Nos termos da Resolução COAF nº 40/2021, consideram-se PEPs os ocupantes dos seguintes cargos: a) Ministro de Estado ou equiparado; b) Natureza Especial ou equivalente; c) Presidente, Vice-Presidente e Diretor, ou equivalentes, de entidades da administração pública indireta; e d) Direção e Assessoramento Superior - DAS de nível 6 ou equivalente; os membros do Conselho Nacional de Justiça, do Supremo Tribunal Federal, dos Tribunais Superiores, dos Tribunais Regionais Federais, dos Tribunais Regionais do Trabalho, dos Tribunais Regionais Eleitorais, do Conselho Superior da Justiça do Trabalho e do Conselho da Justiça Federal; os membros do Conselho Nacional do Ministério Público, o Procurador-Geral da República, o Vice-Procurador-Geral da República, o Procurador-Geral do Trabalho, o Procurador-Geral da Justiça Militar, os Subprocuradores-Gerais da República e os Procuradores-Gerais de Justiça dos Estados e do Distrito Federal; os membros do Tribunal de Contas da União, o Procurador-Geral e os Subprocuradores-Gerais do Ministério Público junto ao Tribunal de Contas da União; os Presidentes e Tesoureiros nacionais, ou equivalentes, de partidos políticos; os Governadores e Secretários de Estado e do Distrito Federal, os Deputados Estaduais e Distritais, os Presidentes, ou equivalentes, de entidades da administração pública indireta estadual e distrital e os Presidentes de Tribunais de Justiça, Militares, de Contas ou equivalentes de Estado e do Distrito Federal; os Prefeitos, os Vereadores, os Secretários Municipais, os Presidentes, ou equivalentes, de entidades da administração pública indireta municipal e os Presidentes de Tribunais de Contas de Municípios ou equivalentes. Também são consideradas pessoas expostas politicamente aquelas que, no exterior, sejam: chefes de estado ou de governo; políticos de escalões superiores; ocupantes de cargos governamentais de escalões superiores; oficiais generais e membros de escalões superiores do poder judiciário; executivos de escalões superiores de empresas públicas; dirigentes de partidos políticos. São consideradas ainda pessoas expostas politicamente os dirigentes de escalões superiores de entidades de direito internacional público ou privado."},{"p":"2.6 Colaboradores: Para fins desta Política, colaboradores compreendem empregados, administradores, diretores e prestadores de serviços terceirizados contratados pela Velaro para a realização de serviços essenciais ou diretamente relacionados às atividades principais da companhia."},{"p":"2.7 Terceiros: consideram-se terceiros as pessoas físicas ou jurídicas que não são empregados, colaboradores ou administradores da Velaro, mas que mantêm vínculo contratual ou de negócio com a empresa. Incluem-se nessa definição: prestadores de serviços de apoio, contratados para auxiliar a companhia em atividades não essenciais (como agentes intermediários, advogados externos, auditores, empresas de cobrança, entre outros); e parceiros estratégicos, entendidos como fornecedores críticos ou entidades com as quais a Velaro mantém uma relação contratual contínua e mutuamente benéfica, distinta da de clientes ou colaboradores."},{"p":"2.8 Background Check: é o processo de verificação de informações antecedentes e reputacionais de clientes, parceiros, terceiros e colaboradores, realizado por meio da análise de listas restritivas nacionais e internacionais, consultas a registros públicos e privados, checagem de processos judiciais, identificação de Pessoas Politicamente Expostas (PEPs) e pesquisas de mídia negativa. Seu objetivo é avaliar a idoneidade da contraparte, identificar potenciais riscos legais, regulatórios, financeiros ou reputacionais e subsidiar a tomada de decisão quanto ao estabelecimento, manutenção ou restrição da relação com a Velaro."}]},{"t":"3. Princípios Gerais","blocks":[{"p":"O processo de cadastro de clientes, terceiros e colaboradores tem por objetivo coletar as informações e documentos necessários para que a Velaro realize as verificações de integridade, conduza a avaliação de risco do relacionamento e defina se é necessário aprofundar a análise por meio de Enhanced Due Diligence (EDD). Somente após a conclusão integral desse processo será possível aprovar ou não o relacionamento."},{"st":"Esse processo compreende as seguintes etapas:"},{"itens":["Cadastro: realizado por meio do Formulário de Onboarding e, de forma complementar, com o suporte de ferramentas de Big Data Analytics e Inteligência Artificial;","Background Check: conduzido com apoio de bases públicas e privadas, listas restritivas e soluções tecnológicas avançadas, visando identificar eventuais riscos reputacionais, legais ou regulatórios."]},{"p":"Todos os procedimentos seguem a abordagem baseada em risco (risk-based approach), o que significa que os controles aplicados não são uniformes, mas proporcionais ao nível de risco atribuído a cada cliente, terceiro ou colaborador. As informações e documentos coletados são de uso restrito e confidencial, armazenados de forma segura e mantidos pelo prazo mínimo de cinco anos após o término da relação, em conformidade com a legislação aplicável."},{"p":"É expressamente vedado o início de qualquer operação ou relacionamento antes da conclusão e aprovação formal do processo de due diligence."}]},{"t":"4. Processo de KYC - Clientes","blocks":[{"p":"A Velaro realiza o processo de Know Your Customer (KYC) de seus clientes, sejam pessoas físicas ou jurídicas. Para clientes pessoa jurídica que atuem como intermediários na prestação de serviços a clientes finais, a responsabilidade primária pela realização do KYC desses clientes finais recai sobre os próprios intermediários, que devem possuir controles compatíveis com os padrões regulatórios e de mercado. A Velaro, entretanto, mantém o dever de supervisionar, revisar e validar os procedimentos adotados por tais intermediários, em conformidade com a abordagem baseada em risco do GAFI, a fim de assegurar que esses controles sejam adequados e proporcionais ao risco do relacionamento."},{"st":"4.1 Identificação"},{"st":"4.1.1 Para Pessoas Físicas"},{"p":"A identificação do cliente pessoa física compreende a coleta e validação de dados pessoais, profissionais e financeiros, conforme formulário de onboarding da Velaro. Devem ser informados, no mínimo:"},{"itens":[]},{"p":"Nome completo; Data de nascimento e nacionalidade; CPF (ou documento equivalente para estrangeiros); Endereço residencial completo; Ocupação ou profissão; Remuneração Mensal; Origem do Patrimônio; Finalidade das operações com ativos virtuais; Instituições financeiras com as quais mantém relacionamento; Informação sobre condição de Pessoa Exposta Politicamente (PEP), quando aplicável."},{"p":"Devem ser apresentados documentos comprobatórios, tais como: documento oficial de identificação com foto (RG, CNH ou passaporte), comprovante de residência atualizado, comprovante de renda (holerite, declaração de imposto de renda, extratos bancários ou outros documentos que evidenciem a capacidade financeira), entre outros."},{"st":"4.1.2 Para Pessoas Jurídicas"},{"p":"A identificação do cliente pessoa jurídica compreende a coleta e validação de dados cadastrais, financeiros e operacionais, conforme formulário de onboarding da Velaro. Devem ser informados, no mínimo:"},{"p":"Nome completo da entidade e nome fantasia; Endereço da sede e país de domicílio fiscal; CNPJ e data de constituição; Website, número de funcionários e faturamento anual; Fonte de capital inicial; Modelo de negócios, produtos e serviços oferecidos; Tipos de clientes atendidos e jurisdições envolvidas; Informações sobre os beneficiários finais; Instituições financeiras com as quais mantém relacionamento."},{"itens":[]},{"p":"Além das informações acima, devem ser entregues documentos comprobatórios, tais como: contrato social ou estatuto, organograma societário até o nível de pessoa física (quando aplicável), balanço patrimonial ou demonstrações auditadas, comprovante de endereço empresarial e políticas internas de PLD/FT."},{"st":"4.2 Qualificação"},{"p":"A qualificação do cliente consiste em verificar sua legitimidade, integridade e idoneidade. Esse processo envolve:"},{"itens":["Consulta a registros públicos e bases oficiais;","Confirmação de status regulatório e do órgão regulador, quando aplicável;","Análise de sócios, acionistas e administradores (pessoas físicas e jurídicas), incluindo coleta de dados pessoais e origem do patrimônio;"]},{"itens":["Verificação de beneficiários finais (Ultimate Beneficial Owners - UBOs), identificando quem detém, direta ou indiretamente, 25% ou mais do capital social ou exerce controle significativo, bem como a origem do patrimônio;","Identificação de Pessoas Politicamente Expostas (PEPs), seus familiares e estreitos colaboradores;","Checagem em listas de sanções (ONU, OFAC, União Europeia, listas nacionais, entre outras);","Pesquisas em mídia negativa e processos administrativos e judiciais relevantes."]},{"p":"A Área de Compliance conduz a qualificação por meio de devida diligência, elaborando dossiês individuais dos clientes. No caso de pessoas jurídicas, o dossiê abrange também seus administradores/diretores, sócios/acionistas e beneficiários finais, utilizando ferramenta específica para registro e análise. No caso de pessoas físicas, o dossiê consolida as informações pessoais, profissionais e patrimoniais do próprio cliente. Nos casos em que o cliente pessoa física seja classificado como PEP, ou em que cliente pessoa jurídica possua administradores ou beneficiários finais classificados como PEPs, a relação será automaticamente enquadrada como de alto risco, demandando coleta adicional de informações (nome completo, CPF ou passaporte, endereço residencial, país de origem, remuneração, origem do patrimônio e, quando aplicável, cargo, descrição das responsabilidades e contexto do mandato)."},{"st":"4.3 Classificação de Risco"},{"p":"Concluídas as etapas de identificação e qualificação, o cliente será classificado em categorias de baixo, médio ou alto risco, considerando, entre outros:"},{"p":"(i) para pessoas físicas: ocupação ou profissão, origem do patrimônio, finalidade e compatibilidade das operações com o perfil econômico-financeiro;"},{"p":"(ii) para pessoas jurídicas: natureza e complexidade da estrutura societária, setor de atuação, porte e faturamento; identificação e transparência dos beneficiários finais; e riscos associados a produtos, serviços, transações ou canais de distribuição;"},{"p":"(iii) para ambos: presença de Pessoas Expostas Politicamente (PEPs); origem dos recursos (Source of Funds) e formação do patrimônio (Source of Wealth); risco geográfico ou de jurisdição, com atenção especial a países listados pelo GAFI como de risco elevado ou sujeitos a sanções da ONU ou do OFAC; volume, frequência e padrão das transações; e reputação, histórico e natureza da relação de negócio."},{"p":"O processo de análise é formalizado em parecer de Customer Due Diligence (CDD), elaborado pela Área de Compliance. Esse parecer consolida o background check realizado, as informações e documentos fornecidos e a avaliação de risco atribuída ao cliente, registrando ainda a opinião técnica da Área de Compliance sobre a conveniência ou não de iniciar ou manter o relacionamento."},{"p":"A Velaro adota uma visão holística, utilizando múltiplas fontes de informação - públicas, privadas e ferramentas comerciais de análise - de modo a assegurar a robustez da classificação de risco e a conformidade com a legislação e regulamentações aplicáveis."},{"st":"4.4 Enhanced Due Diligence (EDD)"},{"p":"Nos casos em que o cliente seja classificado como de alto risco ou apresente red flags relevantes durante o processo de due diligence, a Velaro aplicará Enhanced Due Diligence (EDD), que consiste em procedimentos reforçados e aprofundados de análise. O objetivo é obter compreensão ampliada sobre a legitimidade do cliente, sua estrutura e a origem de seus recursos, permitindo à companhia adotar decisão fundamentada quanto à conveniência de iniciar ou manter o relacionamento."},{"st":"A EDD poderá compreender as seguintes etapas:"},{"itens":["Entrevista estruturada com representantes do cliente, conduzida pela Área de Compliance, para esclarecer pontos sensíveis identificados no KYC e obter informações adicionais sobre governança, modelo de negócios e controles internos de PLD/FT;","Solicitação de documentação adicional sobre origem do patrimônio (Source of Wealth) e origem dos fundos (Source of Funds), tais como declarações fiscais, registros contábeis, extratos bancários, contratos de financiamento ou documentos comprobatórios de operações societárias e patrimoniais;","Comprovação documental de transações recentes, de modo a validar a coerência entre o perfil econômico-financeiro do cliente e suas operações efetivas;","Revisão aprofundada da estrutura societária, incluindo análise de cadeias de propriedade indiretas, veículos em jurisdições sensíveis e eventual presença de shell companies ou sociedades com ações ao portador;","Consulta a fontes de inteligência adicionais, como bases internacionais de due diligence, provedores de risco reputacional, informações regulatórias e relatórios de mercado, complementando o background check;","Solicitação de políticas e evidências do programa de compliance do cliente, quando aplicável, incluindo controles de KYC, monitoramento de transações e triagem contra listas de sanções e PEPs;","Análise reforçada de PEPs, com exigência de informações detalhadas sobre cargo, remuneração, origem patrimonial, histórico profissional e eventual exposição a riscos de corrupção;","Relatório formal de EDD, elaborado pela Área de Compliance, consolidando avaliação detalhada dos riscos identificados, evidências coletadas e recomendação quanto à aceitação ou rejeição do cliente;","Aprovação final pelo Comitê de Compliance, obrigatória em qualquer caso de cliente classificado como de alto risco, assegurando patrocínio e responsabilidade no mais elevado nível da organização."]},{"p":"Além da etapa inicial de onboarding, clientes submetidos a EDD serão objeto de monitoramento contínuo reforçado, com revisões anuais obrigatórias e acompanhamento em tempo real de transações, conforme parâmetros definidos na Política de Monitoramento de Transações."},{"st":"4.5 Limites de Capacidade Financeira e Controles Transacionais"},{"p":"Como parte integrante do processo de Know Your Customer (KYC) e em linha com a abordagem baseada em risco adotada pela Velaro, são definidos limites operacionais de movimentação para cada cliente, de acordo com sua capacidade financeira comprovada."},{"st":"Esses limites têm por objetivo:"},{"itens":["Assegurar a compatibilidade entre o perfil econômico-financeiro do cliente e o volume de suas operações;","Prevenir a utilização da plataforma para movimentações incompatíveis com a atividade declarada;","Reduzir riscos de lavagem de dinheiro e financiamento do terrorismo (LD/FT);","Permitir a identificação tempestiva de operações atípicas que demandem análise reforçada."]},{"p":"A concessão, renovação e eventual ajuste desses limites seguem metodologia estruturada, que considera para pessoa jurídica:"},{"itens":["O porte e o faturamento anual da empresa;","O setor de atuação e o grau de exposição a criptoativos;","O histórico transacional do cliente na plataforma;","O nível de risco atribuído no processo de due diligence;","A transparência da estrutura societária e a clareza na origem dos recursos."]},{"p":"Para clientes pessoa física, os limites são definidos com base na renda mensal comprovada, no patrimônio declarado e na finalidade das operações, aplicando-se critérios proporcionais e documentação compatível com o perfil do cliente. A metodologia detalhada encontra-se no Anexo I."},{"p":"Os procedimentos operacionais, critérios de cálculo, faixas de limite, fatores de ajuste, documentação exigida e mecanismos de controle automatizado estão detalhados no Anexo I - Metodologia de Limites de Capacidade Financeira, que integra este Manual e deve ser observado pela Área de Compliance e pelas áreas de negócio envolvidas na gestão de relacionamento com clientes."}]},{"t":"5. Clientes e Relacionamentos Proibidos","blocks":[{"p":"A Velaro adota postura de tolerância zero em relação a clientes ou contrapartes que representem riscos inaceitáveis de lavagem de dinheiro, financiamento do terrorismo ou outras práticas ilícitas. Nesses casos, é vedado o início ou a manutenção de qualquer relação comercial, independentemente de potenciais benefícios econômicos."},{"st":"São proibidos os relacionamentos com:"},{"itens":["Pessoas físicas ou jurídicas listadas em sanções internacionais, incluindo - mas não se limitando a - listas da ONU, OFAC (EUA), União Europeia e listas nacionais aplicáveis;","Shell banks (bancos sem presença física em qualquer jurisdição ou sem supervisão regulatória efetiva);","Sociedades constituídas com ações ao portador (bearer shares), devido à dificuldade de identificação de seus beneficiários finais;","Empresas de fachada ou entidades sem atividade econômica legítima comprovada, cuja estrutura societária ou operações indiquem finalidade de ocultação ou dissimulação de recursos;","Pessoas Expostas Politicamente (PEPs) de países classificados como de alto risco pelo GAFI/FATF ou situados em jurisdições sujeitas a sanções internacionais;","Pessoas físicas ou jurídicas condenadas judicialmente por crimes financeiros, corrupção, terrorismo, tráfico ou outros delitos graves relacionados;","Clientes que se recusem a fornecer informações, apresentem dados inconsistentes não justificados ou impossibilitem a verificação de sua identidade e origem
