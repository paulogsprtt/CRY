de recursos;","Estruturas societárias cujo beneficiário final não possa ser identificado de forma satisfatória, inclusive quando ocultado por veículos em jurisdições opacas ou em paraísos fiscais de alto risco."]},{"p":"A Área de Compliance é responsável por assegurar o cumprimento dessa regra, devendo bloquear preventivamente qualquer relacionamento que se enquadre nas hipóteses acima e reportar a situação ao Comitê de Compliance para ciência e deliberação, quando aplicável."}]},{"t":"6. Processo de KYP - Terceiros","blocks":[{"p":"O processo de Know Your Partner (KYP) segue os mesmos princípios aplicados aos clientes, porém adaptado à natureza da relação comercial e proporcional ao risco envolvido. O objetivo é assegurar que a Velaro mantenha relacionamento apenas com terceiros idôneos, cujas práticas estejam alinhadas à legislação aplicável e às boas práticas de prevenção à lavagem de dinheiro e ao financiamento do terrorismo (PLD/FT)."},{"st":"6.1 Identificação"},{"p":"A etapa de identificação consiste na coleta de informações básicas da entidade ou indivíduo parceiro, incluindo:"},{"p":"Razão social; CNPJ ou equivalente; Endereço; Atividade principal; Dados de administradores e representantes legais; Website da empresa; Descrição do modelo de negócios."},{"itens":[]},{"st":"6.2 Qualificação"},{"p":"A qualificação envolve a verificação da integridade e legitimidade do parceiro, por meio de:"},{"itens":["Consulta a listas de sanções nacionais e internacionais;","Identificação de Pessoas Expostas Politicamente (PEPs), quando aplicável;","Pesquisa em mídias negativas e bases públicas relevantes;","Checagem de integridade e histórico reputacional."]},{"p":"Adicionalmente, parceiros estratégicos ou fornecedores críticos devem comprovar a existência de programa próprio de PLD/FT (AML/CTF), proporcional ao risco do setor e ao porte da entidade."},{"st":"6.3 Classificação de Risco"},{"p":"Com base nas informações coletadas, os terceiros são classificados como de baixo, médio ou alto risco, considerando fatores como setor de atuação, jurisdição, reputação, volume de negócios com a Velaro e criticidade da relação comercial."},{"p":"Parceiros classificados como de alto risco estarão sujeitos à aplicação de Enhanced Due Diligence (EDD), seguindo os mesmos princípios estabelecidos para clientes, incluindo verificações adicionais e aprovação final pelo Comitê de Compliance."},{"p":"Para fornecedores críticos como provedores de wallet e custódia ou outras infraestruturas essenciais às operações da Velaro, serão aplicados requisitos de enhanced due diligence, considerando seu impacto direto na continuidade dos negócios e na resiliência operacional. Além dos controles padrão de onboarding, a Velaro poderá solicitar evidências do arcabouço de segurança da informação do fornecedor (por exemplo, políticas internas ou certificações relevantes como ISO 27001, SOC 2), procedimentos de notificação de incidentes e indisponibilidades, acordos de nível de serviço (SLAs) e políticas de backup e retenção de dados. Essas medidas têm como objetivo assegurar que fornecedores críticos mantenham salvaguardas e planos de contingência robustos, alinhados aos padrões de gestão de risco da Velaro."}]},{"t":"7. Processo de KYE - Colaboradores","blocks":[{"p":"O processo de Know Your Employee (KYE) aplica-se a todos os colaboradores, administradores, diretores e prestadores de serviços essenciais contratados diretamente pela Velaro. O objetivo é assegurar que a companhia mantenha em seu quadro apenas profissionais idôneos, alinhados aos valores de integridade e às políticas de prevenção à lavagem de dinheiro e financiamento do terrorismo (PLD/FT)."},{"st":"7.1 Identificação e Qualificação"},{"p":"Na fase de identificação, são coletadas informações pessoais básicas, tais como:"},{"p":"Nome completo; Data de nascimento; Nacionalidade; Documento de identificação;"},{"itens":["Endereço residencial;","Dados profissionais relevantes."]},{"p":"A etapa de qualificação compreende a realização de verificações de integridade (background check) em bases públicas e privadas, incluindo:"},{"itens":["Consultas a listas de sanções nacionais e internacionais;","Identificação de eventual condição de Pessoa Exposta Politicamente (PEP);","Pesquisa em mídias negativas e registros disponíveis sobre histórico profissional ou reputacional;","Verificação de processos judiciais ou administrativos relevantes."]},{"st":"7.2 Classificação de Risco e Aprovação"},{"p":"Com base nos resultados do background check, os colaboradores e prestadores de serviços essenciais são classificados em níveis de risco (baixo, médio ou alto)."},{"p":"A Área de Compliance recomenda que não sejam admitidos profissionais classificados como de alto risco, sobretudo para cargos sensíveis ou de maior responsabilidade."},{"p":"Excepcionalmente, caso uma área identifique a necessidade de contratar um profissional classificado como de alto risco, a decisão deverá ser formalmente justificada pela área solicitante e revisada pela Área de Compliance e pelo Time de RH. O caso deverá então ser escalado ao Comitê de Compliance, que deterá a autoridade para emitir a decisão final, assegurando rastreabilidade e responsabilidade no nível de governança adequado."}]},{"t":"8. Monitoramento Contínuo e Atualização Cadastral","blocks":[{"p":"O processo de due diligence não se encerra na fase inicial de identificação e qualificação. Todos os relacionamentos da Velaro - clientes, parceiros, terceiros e colaboradores - estão sujeitos a monitoramento contínuo, com revisões periódicas determinadas de acordo com o nível de risco atribuído:"},{"itens":["Baixo risco: a cada 3 anos;","Médio risco: a cada 2 anos;","Alto risco: revisão anual, com aplicação de Enhanced Due Diligence (EDD) e monitoramento contínuo reforçado;"]},{"p":"Além da periodicidade regular, eventos relevantes podem antecipar a revisão cadastral e a reavaliação de risco, tais como: alterações na estrutura societária, mudança de beneficiários finais, lançamento de novos produtos ou serviços, entrada em novas jurisdições, ou qualquer indício de atividade suspeita."},{"p":"Esse monitoramento contínuo permite à Velaro identificar tempestivamente mudanças de perfil que possam impactar o nível de risco, assegurando que os controles aplicados permaneçam adequados e proporcionais."},{"p":"Esse acompanhamento contínuo garante que a Velaro mantenha controle efetivo sobre os riscos associados ao seu quadro funcional, possibilitando a adoção de medidas preventivas ou corretivas sempre que necessário."},{"p":"Além das revisões periódicas previstas conforme o nível de risco, a Velaro realiza triagem contínua de clientes, parceiros, terceiros e colaboradores em bases de PEPs e fontes de mídia negativa, por meio de ferramenta tecnológica especializada. Esse monitoramento automatizado permite a identificação tempestiva de alertas e a análise de red flags, assegurando que eventuais riscos sejam tratados de forma imediata e documentada."}]},{"t":"9. Escalonamento e Aprovações","blocks":[{"p":"A Área de Compliance possui autonomia para emitir seu parecer em relação a relacionamentos que não atendam aos critérios mínimos de conformidade, independentemente de decisões de natureza comercial. Nesses casos, o assunto deverá ser escalado ao Comitê de Compliance, que deterá a autoridade para aprovar ou vetar o relacionamento."},{"p":"Casos classificados como de alto risco, a identificação de PEPs relevantes, bem como situações em que existam inconsistências cadastrais ou documentais não sanadas, deverão ser escalados ao Comitê de Compliance, para deliberação com base em parecer técnico elaborado pela Área de Compliance."}]},{"t":"10. Retenção e Registro","blocks":[{"p":"Toda a documentação de due diligence - incluindo formulários, documentos comprobatórios, registros de verificações, pareceres de Customer Due Diligence (CDD) e evidências de monitoramento - deve ser armazenada de forma segura e confidencial pelo prazo mínimo de cinco anos após o encerramento do relacionamento comercial, contratual ou empregatício, em conformidade com a legislação aplicável."},{"p":"Os registros devem ser organizados de modo a permitir pronta recuperação em caso de auditorias internas, revisões independentes, investigações internas ou externas, ou solicitações de autoridades competentes."}]},{"t":"11. Revisão do Manual","blocks":[{"p":"Este Manual será revisado, no mínimo, a cada dois anos, de forma a garantir sua atualização diante da evolução regulatória, tecnológica e das práticas de mercado."},{"p":"Revisões extraordinárias poderão ocorrer sempre que houver mudanças relevantes no ambiente de risco, no modelo de negócios ou em decorrência de recomendações de auditorias, investigações ou feedbacks de reguladores."},{"p":"O processo de revisão é conduzido pela Área de Compliance, e a versão atualizada deve ser submetida ao Comitê de Compliance para deliberação e aprovação formal."}]}],"en":[{"t":"","blocks":[{"p":"Due Diligence Manual for Clients, Third Parties, and Employees"}]},{"t":"1. Introduction and Purpose","blocks":[{"p":"This Manual aims to establish guidelines and due diligence procedures applicable to clients (KYC - Know Your Customer), partners and relevant third parties (KYP - Know Your Partner), and employees (KYE - Know Your Employee)."},{"p":"It details the processes of identification, qualification, risk classification, ongoing monitoring, and escalation, in accordance with Law No. 9,613/1998, Law No. 14,478/2022, Central Bank of Brazil Circular No. 3,978/2020 and Resolution No. 520/2025, and the FATF Recommendations."},{"p":"Its purpose is to ensure that Velaro Network (“Company” or “Velaro”) establishes and maintains relationships exclusively with legitimate counterparties, preventing their use for illicit purposes, safeguarding its reputation, and contributing to the integrity of the financial system. This Manual must be applied in conjunction with the company’s other internal compliance policies, in order to ensure consistency and robustness of the anti-money laundering and counter-terrorist financing (AML/CFT) program."}]},{"t":"2. Definitions","blocks":[{"p":"2.1 Money Laundering (ML): Money laundering is understood as the act of concealing or disguising the nature, origin, location, disposition, movement, or ownership of assets, rights, or values derived, directly or indirectly, from a criminal offense. Money laundering generally occurs in three stages: placement (insertion of illicit funds into the financial system), layering (movements and multiple transactions intended to make it difficult to trace the origin), and integration (reintroduction of the capital into the formal market as if it were legitimate). Each of these stages may involve the use of traditional financial instruments, shell companies, international transactions, or virtual assets."},{"p":"2.2 Terrorist Financing (TF): Terrorist financing consists of providing, raising, making available, or using resources, assets, or values of any kind, by any means, directly or indirectly, for the purpose of supporting, planning, facilitating, or committing terrorist acts. Unlike money laundering, which seeks to give the appearance of legitimacy to illicit funds, terrorist financing may involve both funds from illicit sources and resources derived from lawful activities."},{"p":"2.3 Client: For the purposes of this Policy, a client is an individual or a legal entity that contracts Velaro’s services and/or products."},{"p":"2.4 Ultimate Beneficial Owner (UBO): The beneficial owner is the natural person who ultimately owns, controls, or exercises significant influence over a legal entity, or on whose behalf a transaction is conducted, and may also be identified as the individual who directly or indirectly holds 25% or more of the share capital or voting rights of an entity."},{"p":"2.5 Politically Exposed Person (PEP): For the purposes of this Policy, a Politically Exposed Person (PEP) is any individual who holds or has held relevant public positions or functions, in accordance with the applicable legal and regulatory definition. The classification as a PEP covers both those currently in office and those who have exercised such functions within the last five years, including their representatives, family members, and close associates. Pursuant to COAF Resolution No. 40/2021, PEPs are considered to be the holders of the following positions: holders of elective mandates in the Executive and Legislative branches of the Federal Government; those holding positions in the Federal Executive Branch as: (a) Minister of State or equivalent; (b) Special Nature or equivalent positions; (c) President, Vice-President, and Director, or equivalents, of entities of the indirect public administration; and (d) Senior Management and Advisory positions - DAS level 6 or equivalent; members of the National Council of Justice, the Federal Supreme Court, the Superior Courts, the Federal Regional Courts, the Regional Labor Courts, the Regional Electoral Courts, the Superior Council of Labor Justice, and the Council of Federal Justice; members of the National Council of the Public Prosecutor’s Office, the Attorney General of the Republic, the Deputy Attorney General of the Republic, the Attorney General for Labor, the Attorney General for Military Justice, the Deputy Prosecutors General of the Republic, and the State and Federal District Attorneys General; members of the Federal Court of Accounts, the Prosecutor General and Deputy Prosecutors General of the Public Prosecutor’s Office at the Federal Court of Accounts; National Presidents and Treasurers, or equivalents, of political parties; State Governors and Secretaries of State and of the Federal District, State and District Deputies, Presidents, or equivalents, of state and district indirect public administration entities, and Presidents of State and Federal District Courts of Justice, Military Courts, Courts of Accounts or equivalents; Mayors, City Council Members, Municipal Secretaries, Presidents, or equivalents, of municipal indirect public administration entities, and Presidents of Municipal Courts of Accounts or equivalents. Also considered politically exposed persons abroad are: heads of state or government; senior-level politicians; senior government officials; general officers and senior members of the judiciary; senior executives of state-owned companies; and leaders of political parties. Additionally, senior executives of international public or private organizations are considered politically exposed persons."},{"p":"2.6 Employees: Employees include staff members, managers, directors, and outsourced service providers directly contracted by Velaro to perform essential services or services directly related to the company’s core activities."},{"p":"2.7 Third Parties: Third parties are natural or legal persons who are not employees, staff members, or directors of Velaro but maintain a contractual or business relationship with the company. This definition includes support service providers contracted to assist the company in non-essential activities (such as intermediaries, external lawyers, auditors, collection agencies, among others); and strategic partners, understood as critical suppliers or entities with which Velaro maintains a continuous and mutually beneficial contractual relationship, distinct from clients or employees."},{"p":"2.8 Background Check: The background check is the process of verifying the background and reputation of clients, partners, third parties, and employees, carried out through the analysis of national and international restrictive lists, consultation of public and private records, verification of legal proceedings, identification of Politically Exposed Persons (PEPs), and adverse media searches. Its purpose is to assess the counterparty’s integrity, identify potential legal, regulatory, financial, or reputational risks, and support the decision-making process regarding the establishment, maintenance, or restriction of the relationship with Velaro."}]},{"t":"3. General Principles","blocks":[{"p":"The registration process for clients, third parties, and employees aims to collect the information and documents necessary for Velaro to carry out integrity checks, conduct the risk assessment of the relationship, and determine whether further analysis through Enhanced Due Diligence (EDD) is required. Only after the full completion of this process will it be possible to approve or reject the relationship."},{"st":"This process comprises the following stages:"},{"itens":["Registration: carried out through the Onboarding Form and, additionally, with the support of Big Data Analytics and Artificial Intelligence tools;","Background Check: conducted with the support of public and private databases, restrictive lists, and advanced technological solutions, in order to identify potential reputational, legal, or regulatory risks."]},{"p":"All procedures follow the risk-based approach, which means that the controls applied are not uniform but proportional to the level of risk assigned to each client, third party, or employee. The information and documents collected are for restricted and confidential use, securely stored, and retained for a minimum period of five years after the termination of the relationship, in compliance with applicable legislation."},{"p":"It is expressly forbidden to initiate any operation or relationship before the conclusion and formal approval of the due diligence process."}]},{"t":"4. KYC Process - Clients","blocks":[{"p":"Velaro performs the Know Your Customer (KYC) process for its clients, whether individuals or legal entities. For corporate clients that act as intermediaries providing services to end clients, the primary responsibility for conducting KYC on those end clients lies with the intermediaries themselves, who must have controls consistent with regulatory and market standards. Velaro, however, retains the duty to supervise, review, and validate the procedures adopted by these intermediaries, in line with the FATF risk-based approach, to ensure that such controls are adequate and proportionate to the risk of the relationship."},{"st":"4.1 Identification"},{"st":"4.1.1 For Individuals"},{"p":"The identification of individual clients includes the collection and validation of personal, professional, and financial information, according to Velaro’s onboarding form. At a minimum, clients must provide:"},{"itens":["Full name;","Date of birth and nationality;","CPF (or an equivalent document for foreign clients);","Full residential address;","Occupation or profession;","Monthly Income;","Source of Wealth;","Purpose of transactions involving virtual assets;","Financial institutions with which they maintain a relationship;","Information regarding Politically Exposed Person (PEP) status, when applicable."]},{"p":"Supporting documents must be submitted, such as: an official identification document with a photo (RG, driver’s license, or passport), a recent proof of address, proof of income (pay stubs, income tax return, bank statements, or other documents demonstrating financial capacity), among others."},{"st":"4.1.2 For Legal Entities"},{"p":"Corporate client identification consists of collecting and validating corporate, financial, and operational data, in accordance with Velaro’s onboarding form. At a minimum, the following information must be provided:"},{"itens":["Full legal name and trade name of the entity;","Headquarters address and country of tax residence;","Corporate Taxpayer Registry and date of incorporation;","Website, number of employees, and annual revenue;","Source of initial capital;","Business model, products, and services offered;","Types of clients served and jurisdictions involved;","Information on ultimate beneficial owners;","Financial institutions with which the company maintains relationships."]},{"p":"In addition to the above information, supporting documents must be submitted, such as: articles of incorporation or bylaws, corporate structure chart down to the natural person level (when applicable), balance sheet or audited financial statements, proof of business address, and internal AML/CFT policies."},{"st":"4.2 Qualification"},{"p":"Client qualification consists of verifying its legitimacy, integrity, and suitability. This process involves:"},{"itens":["Consultation of public records and official databases;","Confirmation of regulatory status and supervisory authority, when applicable;","Analysis of partners, shareholders, and managers (both individuals and legal entities), including the collection of personal data and source of wealth;","Verification of ultimate beneficial owners (UBOs), identifying those who directly or indirectly hold 25% or more of the share capital or exercise significant control, as well as the source of their wealth;","Identification of Politically Exposed Persons (PEPs), their family members, and close associates;","Screening against sanctions lists (UN, OFAC, European Union, national lists, among others);","Searches in adverse media and relevant legal proceedings."]},{"p":"The Compliance Area conducts qualification through due diligence, preparing individual dossiers for each customer. In the case of legal entities, the dossier also covers their officers/directors, partners/shareholders, and beneficial owners, using a specific tool for recording and analysis. In the case of individuals, the dossier consolidates the personal, professional, and financial information of the customer themselves. In cases where the individual customer is classified as a PEP, or where a legal entity customer has officers or beneficial owners classified as PEPs, the relationship will be automatically classified as high risk, requiring collection of additional information (full name, tax identification number (CPF) or passport, residential address, country of origin, compensation, source of wealth and, when applicable, position, description of responsibilities, and context of the mandate)."},{"st":"4.3 Risk Classification"},{"p":"Once the identification and qualification stages are completed, the client will be classified into low, medium, or high-risk categories, considering, among others:"},{"p":"(i) for individuals: occupation or profession, source of wealth, purpose and compatibility of transactions with their economic-financial profile;"},{"p":"(ii) for legal entities: nature and complexity of the corporate structure, industry sector, size and revenue; identification and transparency of ultimate beneficial owners; and risks associated with products, services, transactions, or distribution channels;"},{"p":"(iii) for both: presence of Politically Exposed Persons (PEPs); Source of Funds and Source of Wealth; geographic or jurisdictional risk, with special attention to countries listed by the FATF as high-risk or subject to UN or OFAC sanctions; transaction volume, frequency, and patterns; and reputation, background, and nature of the business relationship."},{"p":"The analysis process is formalized in a Customer Due Diligence (CDD) report prepared by the Compliance Department. This report consolidates the background check performed, the information and documents provided, and the risk assessment assigned to the client, also recording the Compliance Department’s technical opinion on whether or not to initiate or maintain the relationship."},{"p":"Velaro adopts a holistic view, using multiple sources of information - public, private, and commercial analysis tools - to ensure the robustness of risk classification and compliance with applicable laws and regulations."},{"st":"4.4 Enhanced Due Diligence (EDD)"},{"p":"In cases where the client is classified as high risk or presents relevant red flags during the due diligence process, Velaro will apply Enhanced Due Diligence (EDD), which consists of reinforced and in-depth analysis procedures. The objective is to obtain a broader understanding of the client’s legitimacy, structure, and source of funds, enabling the company to make a well-founded decision on whether to initiate or maintain the relationship."},{"itens":["The EDD may include the following steps:","Structured interview with client representatives, conducted by the Compliance Department, to clarify sensitive points identified in KYC and obtain additional information on governance, business model, and internal AML/CFT controls;","Request for additional documentation on the source of wealth and source of funds, such as tax returns, accounting records, bank statements, financing agreements, or supporting documents for corporate and asset transactions;","Documentary evidence of recent transactions, to validate the consistency between the client’s economic-financial profile and its actual operations;","In-depth review of the corporate structure, including analysis of indirect ownership chains, vehicles in sensitive jurisdictions, and the possible presence of shell companies or entities with bearer shares;","Consultation of additional intelligence sources, such as international due diligence databases, reputational risk providers, regulatory information, and market reports, to complement the background check;","Request for compliance policies and evidence of the client’s AML/CFT program, when applicable, including KYC controls, transaction monitoring, and screening against sanctions and PEP lists;","Enhanced analysis of PEPs, requiring detailed information on the position held, remuneration, source of wealth, professional background, and any exposure to corruption risks;","Formal EDD report, prepared by the Compliance Department, consolidating a detailed assessment of identified risks, collected evidence, and recommendations regarding the acceptance or rejection of the client;","Final approval by the Compliance Committee, mandatory in any case of a high-risk client, ensuring sponsorship and accountability at the highest level of the organization."]},{"p":"In addition to the initial onboarding stage, clients subject to EDD will be subject to reinforced ongoing monitoring, with mandatory annual reviews and real-time transaction monitoring, in accordance with the parameters defined in the Transaction Monitoring Policy."},{"st":"4.5 Financial Capacity Limits and Transactional Controls"},{"p":"As an integral part of the Know Your Customer (KYC) process and in line with the risk-based approach adopted by Velaro, operational transaction limits are established for each client based on their verified financial capacity."},{"st":"These limits aim to:"},{"itens":["Ensure compatibility between the client’s economic and financial profile and the volume of their transactions;","Prevent the use of the platform for movements inconsistent with the declared business activity;","Reduce the risks of money laundering and terrorist financing (ML/TF);","Enable the timely identification of atypical transactions requiring enhanced analysis."]},{"p":"The granting, renewal, and adjustment of these limits follow a structured methodology that takes into account for corporate clients:"},{"itens":["The company’s size and annual revenue;","The sector of activity and degree of exposure to crypto assets;","The client’s transactional history on the platform;","The level of risk assigned during the due diligence process;","The transparency of the ownership structure and the clarity of the source of funds."]},{"p":"For individual clients, limits are defined based on verified monthly income, declared net worth, and the stated purpose of the transactions, applying proportional criteria and documentation compatible with the client’s profile. The detailed methodology is provided in Annex I."},{"p":"The operational procedures, calculation criteria, limit ranges, adjustment factors, required documentation, and automated control mechanisms are detailed in Annex I - Methodology for Financial Capacity Limits, which forms part of this Manual and must be observed by the Compliance Department and the business areas involved in client relationship management ."}]},{"t":"5. Prohibited Clients and Relationships","blocks":[{"p":"Velaro adopts a zero-tolerance policy towards clients or counterparties that pose unacceptable risks of money laundering, terrorist financing, or other illicit practices. In such cases, the initiation or continuation of any business relationship is strictly prohibited, regardless of potential economic benefits."},{"st":"Relationships are prohibited with:"},{"itens":["Natural or legal persons listed in international sanctions, including, but not limited to, lists issued by the United Nations, OFAC (U.S.), the European Union, and applicable national lists;","Shell banks (banks without physical presence in any jurisdiction or without effective regulatory supervision);","Companies incorporated with bearer shares, due to the difficulty in identifying their ultimate beneficial owners;","Front companies or entities without proven legitimate economic activity, whose corporate structure or operations indicate a purpose of concealing or disguising resources;","Politically Exposed Persons (PEPs) from countries classified as high risk by the FATF, or located in jurisdictions subject to international sanctions;","Natural or legal persons judicially convicted of financial crimes, corruption, terrorism, trafficking, or other serious related offenses;","Clients who refuse to provide information, present unjustified inconsistent data, or prevent the verification of their identity and source of funds;","Corporate structures whose beneficial owner cannot be satisfactorily identified, including when hidden by vehicles in opaque jurisdictions or high-risk tax havens."]},{"p":"The Compliance Department is responsible for ensuring adherence to this rule and must preventively block any relationship falling under the above scenarios, reporting the situation to the Compliance Committee for awareness and deliberation, when applicable."}]},{"t":"6. KYP Process - Third Parties","blocks":[{"p":"The Know Your Partner (KYP) process follows the same principles applied to clients but is adapted to the nature of the commercial relationship and proportional to the risk involved. The objective is to ensure that Velaro maintains relationships only with reputable third parties whose practices are aligned with applicable legislation and best practices in anti-money laundering and counter-terrorist financing (AML/CFT)."},{"p":"6.1 Identification The identification stage consists of collecting basic information on the partner entity or individual, including:"},{"itens":["Legal name;","CNPJ (Corporate Taxpayer Registry) or equivalent;","Address;","Main activity;","Information on administrators and legal representatives;","Company website;","Description of the business model."]},{"st":"6.2 Qualification"},{"p":"Qualification involves verifying the integrity and legitimacy of the partner, through:"},{"itens":["Screening against national and international sanctions lists;","Identification of Politically Exposed Persons (PEPs), when applicable;","Research in adverse media and relevant public databases;","Integrity checks and reputational background verification."]},{"p":"In addition, strategic partners or critical suppliers must demonstrate the existence of their own AML/CFT program, proportionate to the sector’s risk level and the size of the entity."},{"st":"6.3 Risk Classification"},{"p":"Based on the information collected, third parties are classified as low, medium, or high risk, considering factors such as sector of activity, jurisdiction, reputation, business volume with Velaro, and criticality of the commercial relationship."},{"p":"Partners classified as high risk will be subject to Enhanced Due Diligence (EDD), following the same principles established for clients, including additional checks and final approval by the Compliance Committee."},{"p":"For critical vendors, such as wallet and custody providers or other infrastructure essential to Velaro’s operations, Velaro will apply enhanced due diligence requirements given their direct impact on business continuity and operational resilience. In addition to standard onboarding checks, Velaro may request evidence of the vendor’s information security framework (e.g., internal policies or relevant certifications such as ISO 27001, SOC 2), incident and outage notification procedures, service-level agreements (SLAs), and data backup and retention policies. These measures are intended to ensure that critical vendors maintain robust safeguards and contingency plans aligned with Velaro’s risk management standards."}]},{"t":"7. KYE Process - Employees","blocks":[{"p":"The Know Your Employee (KYE) process applies to all employees, officers, directors, and essential service providers directly contracted by Velaro. The objective is to ensure that the company maintains only reputable professionals, aligned with integrity values and anti-money laundering and counter-terrorist financing (AML/CFT) policies."},{"st":"7.1 Identification and Qualification"},{"p":"In the identification stage, basic personal information is collected, such as:"},{"itens":["Full name;","Date of birth; Nationality;","Identification document;","Residential address;","Relevant professional data."]},{"p":"The qualification stage consists of conducting integrity checks (background checks) in public and private databases, including:"},{"itens":["Screening against national and international sanctions lists;","Identification of possible Politically Exposed Person (PEP) status;","Research in adverse media and available records on professional or reputational background;","Verification of relevant judicial or administrative proceedings."]},{"st":"7.2 Risk Classification and Approval"},{"p":"Based on the results of the background check, employees and essential service providers are classified into risk levels (low, medium, or high)."},{"p":"The Compliance Department recommends that professionals classified as high risk should not be admitted, especially for sensitive or higher-responsibility positions."},{"p":"Exceptionally, if a business unit identifies the need to hire a professional classified as high risk, the decision must be formally justified by the requesting department and reviewed by the Compliance Department and the HR Team. The case shall then be escalated to the Compliance Committee, which holds the authority to issue the final decision, ensuring traceability and accountability at the appropriate governance level."}]},{"t":"8. Ongoing Monitoring and Record Updates","blocks":[{"p":"The due diligence process does not end with the initial identification and qualification stage. All of Velaro’s relationships (clients, partners, third parties, and employees) are subject to ongoing monitoring, with periodic reviews determined according to the level of risk assigned:"},{"itens":["Low risk: every 3 years;","Medium risk: every 2 years;","High risk: annually, with the application of Enhanced Due Diligence (EDD) and reinforced ongoing monitoring."]},{"p":"In addition to the regular periodicity, relevant events may trigger an early review of records and risk reassessment, such as: changes in corporate structure, modification of ultimate beneficial owners, launch of new products or services, entry into new jurisdictions, or any indication of suspicious activity."},{"p":"This ongoing monitoring allows Velaro to promptly identify profile changes that may impact the risk level, ensuring that applied controls remain adequate and proportionate."},{"p":"This ongoing monitoring ensures that Velaro maintains effective control over the risks associated with its workforce, enabling preventive or corrective measures to be taken whenever necessary."},{"p":"In addition to the periodic reviews based on risk level, Velaro also conducts continuous screening of clients, partners, third parties, and employees against PEP databases and adverse media sources through specialized technological tools. This automated monitoring enables the timely identification of alerts and the analysis of red flags, ensuring that potential risks are addressed immediately and documented."}]},{"t":"9. Escalation and Approvals","blocks":[{"p":"The Compliance Department has full autonomy to issue its opinion on relationships that do not meet minimum compliance standards, regardless of commercial considerations. In such cases, the matter shall be escalated to the Compliance Committee, which holds the authority to approve or veto the relationship."},{"p":"Cases classified as high risk, the identification of relevant PEPs, as well as situations where unresolved inconsistencies in records or documentation exist, must be escalated to the Compliance Committee for deliberation, based on a technical opinion prepared by the Compliance Department."}]},{"t":"10. Retention and Recordkeeping","blocks":[{"p":"All due diligence documentation, including forms, supporting documents, verification records, Customer Due Diligence (CDD) reports, and monitoring evidence, must be stored securely and confidentially for a minimum period of five years after the termination of the commercial, contractual, or employment relationship, in compliance with applicable legislation."},{"p":"Records must be organized to allow prompt retrieval in the event of internal audits, independent reviews, internal or external investigations, or requests from competent authorities."}]},{"t":"11. Manual Review","blocks":[{"p":"This Manual will be reviewed at least every two years to ensure its alignment with regulatory, technological, and market practice developments."},{"p":"Extraordinary reviews may take place whenever there are significant changes in the risk environment, in the business model, or as a result of recommendations from audits, investigations, or regulator feedback."},{"p":"The review process is conducted by the Compliance Department, and the updated version must be submitted to the Compliance Committee for deliberation and formal approval."}]}]},"monitoramento-de-transacoes":{"pt":[{"t":"1. Introdução","blocks":[{"p":"A Velaro Network (“Empresa” ou “Velaro”) reconhece que a integridade das transações financeiras é elemento essencial para a proteção de clientes, parceiros, autoridades reguladoras e da própria companhia. A exposição a riscos de lavagem de dinheiro (PLD), financiamento do terrorismo (FT) e financiamento da proliferação de armas de destruição em massa (PF) exige a adoção de mecanismos de controle contínuos, consistentes e alinhados a padrões internacionais."},{"p":"Com esse propósito, a Velaro instituiu um programa de monitoramento de transações robusto, estruturado segundo a abordagem baseada em risco (risk-based approach) e em conformidade com as recomendações do GAFI. Esse programa combina tecnologia especializada, procedimentos internos bem definidos e uma governança de compliance independente, assegurando que todas as transações sob sua responsabilidade sejam analisadas quanto à legitimidade, à origem e ao destino dos recursos envolvidos."},{"p":"Mais do que cumprir requisitos legais, a presente Política reflete o compromisso institucional da Velaro em promover confiança e resiliência em seus serviços, fortalecendo a relação com clientes, parceiros de liquidez, autoridades reguladoras e demais stakeholders. Ao estabelecer critérios objetivos para o monitoramento e tratamento de transações, a companhia assegura não apenas a conformidade normativa, mas também a sustentabilidade de longo prazo de suas operações no mercado de serviços financeiros e de ativos virtuais."}]},{"t":"2. Escopo","blocks":[{"p":"Esta Política aplica-se a todas as transações realizadas sob a gestão da Velaro, abrangendo operações em moeda fiduciária e em ativos virtuais, em todas as modalidades de produtos e serviços disponibilizados pela companhia. Estão compreendidas, entre outras, as operações de pagamentos internacionais, transferências em contas multimoeda e movimentações em carteiras digitais custodiadas, sejam elas de titularidade de clientes ou da própria companhia."},{"p":"Todas as transações, independentemente da natureza da conta ou da modalidade operacional, estão sujeitas a monitoramento contínuo, avaliação de risco e, quando aplicável, reporte tempestivo às autoridades competentes."}]},{"t":"3. Estrutura de Monitoramento","blocks":[{"p":"Na Velaro, o monitoramento de transações tem início antes mesmo de qualquer movimentação de recursos. Somente após concluir o processo de onboarding (KYC), o cliente é autorizado a realizar depósitos em moeda fiduciária ou transacionar ativos digitais nos sistemas da empresa."},{"p":"Esta etapa inclui a verificação da identidade e da documentação do cliente, bem como a avaliação de sua qualificação e do perfil transacional esperado. Também envolve a identificação e triagem dos beneficiários finais (UBOs), a checagem de listas de sanções e de pessoas politicamente expostas (PEPs), além da realização de pesquisas em fontes de integridade e mídias adversas, incluindo a verificação de inquéritos ou processos judiciais em andamento ou passados."},{"p":"Além disso, são avaliadas a origem dos recursos e a finalidade declarada das operações, com a documentação de suporte revisada quando necessário. Somente após a aprovação formal deste processo o cliente é autorizado a iniciar transações."},{"p":"Sempre que aplicável, também é conduzida due diligence em relação ao beneficiário da transação, de modo a assegurar que tanto o remetente quanto o destinatário estejam alinhados às exigências legais e regulatórias. Essa abordagem dupla fortalece a transparência e a segurança em todo o processo."},{"p":"Outro elemento essencial da estrutura de monitoramento é a avaliação de contrapartes de liquidez. Parceiros estratégicos, como exchanges e OTCs, são submetidos a processos de Know Your Provider (KYP), que envolvem due diligence inicial e periódica. Essa análise contempla a avaliação das políticas internas de PLD/FT da contraparte, consultas a listas de sanções, verificação de histórico reputacional e, quando necessário, a inclusão de cláusulas contratuais que assegurem cooperação em caso de detecção de irregularidades. Esses procedimentos, assim como os de KYC, estão detalhados no Manual de Due Diligence de Clientes, Terceiros e Colaboradores, e têm como objetivo mitigar o risco de exposição da Velaro a ativos com indícios de origem ilícita ou provenientes de atividades ilícitas."},{"p":"No contexto das transações em ativos virtuais, os depósitos e retiradas realizados nas carteiras da Velaro custodiadas na Fireblocks são monitorados por meio da integração entre a tecnologia de custódia da Fireblocks e a solução de KYT da Chainalysis, que juntas permitem o acompanhamento contínuo e automatizado das operações on-chain. Essa ferramenta de blockchain analytics da Chainalysis possibilita identificar a origem e o destino dos fundos transacionados em blockchain, avaliar exposições diretas e indiretas a endereços de risco e classificar entidades de acordo com categorias como exchanges, mixers, mercados darknet ou carteiras vinculadas a sanções. A integração permite que as transações on-chain realizadas nas carteiras sob custódia da Velaro sejam registradas automaticamente em seu sistema de monitoramento. Isso viabiliza a emissão de alertas em tempo real quando parâmetros de risco são acionados, o acompanhamento retroativo quando novos endereços passam a integrar bases de risco e a aplicação de classificações de risco conforme regras predefinidas. O sistema também disponibiliza relatórios exportáveis em formato"},{"p":"CSV, que subsidiam investigações internas e a elaboração de Relatórios de Operações Suspeitas (ROS) a serem submetidos ao COAF."},{"p":"Complementarmente ao monitoramento automatizado, a Velaro dispõe de recursos para investigações aprofundadas por meio do processo de Know Your Wallet (KYW). Esse procedimento permite examinar em detalhe o histórico de transações de uma carteira específica, identificar origens e destinos dos fundos movimentados e avaliar padrões de comportamento que possam indicar risco."},{"p":"Por fim, a companhia adota o princípio do continuous monitoring (monitoramento contínuo). Isso significa que as transações, carteiras e contrapartes não são avaliadas apenas no momento inicial de cadastro ou no instante da transferência, mas são continuamente reavaliadas à medida que novas informações e atualizações de inteligência de risco se tornam disponíveis. Dessa forma, mesmo operações já liquidadas podem ser objeto de alerta retroativo caso endereços anteriormente considerados legítimos passem a ser associados a atividades ilícitas. Esse acompanhamento permanente fortalece a capacidade de compliance da Velaro e reduz a probabilidade de exposição inadvertida a ilícitos financeiros."}]},{"t":"4. Processo de KYT","blocks":[{"p":"O monitoramento das transações de ativos digitais (KYT) realizadas pela Velaro, por meio da integração com a plataforma Chainalysis, permite identificar e avaliar riscos de lavagem de dinheiro, financiamento do terrorismo e outros ilícitos financeiros associados às transações. Para isso, a análise considera múltiplas dimensões, que são detalhadas a seguir."},{"st":"4.1 Categoria da entidade envolvida"},{"p":"Isso se refere à classificação geral do endereço monitorado. Os endereços podem estar associados, por exemplo, a corretoras (exchanges), mixers, mercados da dark web, serviços de apostas, esquemas de fraude ou entidades sujeitas a sanções internacionais.Essa categorização fornece uma indicação inicial do grau de gravidade. Por exemplo, transações que envolvem uma corretora regulamentada em uma jurisdição robusta geralmente apresentam um risco significativamente menor do que aquelas que envolvem uma entidade sancionada. A lista detalhada de categorias utilizadas pela ferramenta é apresentada no Anexo A desta Política, garantindo transparência e padronização na análise."},{"st":"4.2 Serviço específico vinculado"},{"p":"A ferramenta permite avaliar também o serviço específico associado ao endereço. Dentro de uma mesma categoria, podem existir diferenças substanciais: uma exchange licenciada e supervisionada por autoridade financeira tende a adotar práticas consistentes de PLD/FT, enquanto uma exchange não regulada ou um serviço que opera de forma anônima representa risco mais elevado. Essa diferenciação é fundamental, pois a exposição não é apenas à categoria geral, mas também à robustez regulatória e operacional do serviço envolvido."},{"st":"4.3 Grau de exposição e hops/clustering"},{"p":"O sistema indica o grau de exposição da transação a endereços classificados como de risco, distinguindo entre exposição direta e exposição indireta. A exposição direta ocorre quando a transação é feita sem intermediários, ou seja, o ativo sai ou chega diretamente a um endereço associado a uma entidade de risco (por exemplo, uma carteira vinculada a sanções, fraudes ou atividades ilícitas)."},{"p":"A exposição indireta ocorre quando existem uma ou mais intermediações, chamadas de hops, entre a transação analisada e o endereço de risco."},{"p":"Hops são as camadas de intermediação entre a transação monitorada e o endereço de risco. Cada hop representa um novo nível de movimentação de ativos entre diferentes endereços na blockchain. Assim, quanto maior o número de hops, maior a distância e a complexidade para rastrear a origem efetiva dos recursos. Geralmente, exposições com poucos hops são consideradas mais relevantes do ponto de vista de risco de contaminação."},{"p":"Para reduzir a fragmentação e aprimorar a rastreabilidade, a ferramenta aplica o processo de clustering. Esse processo consiste em agrupar endereços que pertencem a uma mesma entidade, como uma exchange, mixer ou outro serviço identificado. Isso permite reconhecer que diversos endereços aparentemente distintos são, na realidade, controlados por uma única instituição. Com isso, é possível distinguir entre endereços isolados e carteiras institucionais, revelar vínculos ocultos com entidades de risco e obter uma estimativa mais precisa da real porcentagem de exposição das carteiras a endereços vinculados a atividades ilícitas."},{"p":"A combinação dessas análises - grau de exposição, número de hops e clustering - possibilita uma avaliação mais precisa do risco associado à transação e orienta as decisões de monitoramento, alerta e eventual reporte de operações suspeitas."},{"st":"4.4 Direção da transferência"},{"p":"A direção da transferência é outro elemento considerado na avaliação de risco, pois define a posição da companhia em cada etapa do fluxo financeiro."},{"p":"Nas operações de depósito, o foco recai sobre a origem dos recursos, incluindo a identificação das contrapartes envolvidas e a verificação da compatibilidade entre a transação e o perfil econômico-financeiro do cliente. Quando a companhia recebe ativos com indícios de origem ilícita, o risco predominante é o de lavagem de dinheiro (LD)."},{"p":"Nas operações de retirada, o foco recai sobre o destino final dos recursos. Quando a companhia envia fundos a uma entidade classificada como de risco, há risco de financiamento do terrorismo (FT) ou de facilitação de atividades ilícitas, uma vez que a operação pode ser interpretada como apoio financeiro a atores irregulares."},{"p":"Esse raciocínio aplica-se tanto às operações de aquisição de ativos digitais por meio de contrapartes de liquidez (como OTCs e exchanges) quanto às movimentações iniciadas diretamente por clientes a partir de suas carteiras sob custódia."},{"st":"4.5 Montante movimentado"},{"p":"O valor movimentado é um fator determinante na avaliação de risco. A análise considera não apenas o montante absoluto da transação, mas também sua proporcionalidade em relação ao histórico operacional e ao perfil econômico-financeiro do cliente."},{"p":"Transações de baixo valor podem indicar tentativas de fracionamento (structuring), estratégia utilizada para evitar detecção automatizada ou permanecer abaixo de limites de reporte regulatório. Já as operações de alto valor representam maior risco operacional, regulatório e reputacional, especialmente quando envolvem exposição indireta ou contrapartes localizadas em jurisdições de risco."},{"p":"Além do valor isolado, a avaliação também considera a frequência, o volume agregado e eventuais variações abruptas em relação ao comportamento transacional típico do cliente, que podem indicar mudanças no padrão de risco ou na finalidade econômica das operações."},{"st":"4.6 Classificação de risco"},{"p":"Todos esses fatores são consolidados pela ferramenta de monitoramento, que aplica as regras de risco configuradas pela Velaro e atribui à transação uma classificação em uma das quatro categorias previstas na matriz de risco da companhia:"},{"itens":["Baixo: transações de baixo impacto, sem indícios relevantes de risco ou exposição significativa.","Médio: exposições moderadas, como interações com jurisdições de menor robustez regulatória ou serviços não regulados, que demandam análise adicional.","Alto: endereços vinculados a atividades suspeitas ou padrões incompatíveis com o perfil esperado do cliente.","Severo: situações críticas que exigem resposta imediata, como exposição a entidades sancionadas, indícios de financiamento do terrorismo ou vínculo com material de abuso infantil."]},{"st":"4.7 Resposta a riscos Severos e Lei nº 13.810/2019"},{"p":"As transações classificadas como Severo representam risco máximo e exigem resposta imediata. Qualquer operação enquadrada neste nível é automaticamente interrompida, os ativos envolvidos são bloqueados preventivamente e a Área de Compliance é acionada para adoção das medidas cabíveis, incluindo, se for o caso, a comunicação às autoridades competentes."},{"p":"Em especial, quando a classificação decorre de exposição a pessoas físicas, jurídicas ou jurisdições incluídas nas listas de sanções impostas pelo Conselho de Segurança das Nações Unidas, aplica-se automaticamente a Lei nº 13.810/2019. Essa norma impõe o bloqueio imediato de bens, valores e direitos desses indivíduos ou entidades, sem necessidade de decisão judicial ou administrativa adicional, constituindo obrigação legal direta da companhia."},{"st":"4.8 Monitoramento contínuo"},{"p":"Todas as carteiras sob custódia da Velaro - sejam operacionais ou de clientes - estão sujeitas ao princípio do continuous monitoring. Isso significa que permanecem em avaliação permanente, inclusive de forma retroativa: transações já registradas podem gerar novos alertas caso endereços anteriormente considerados legítimos passem a ser associados a atividades ilícitas na base de inteligência da Chainalysis."},{"st":"4.9 Tipos de alertas automáticos"},{"p":"O sistema de monitoramento também é capaz de emitir diferentes tipos de alertas automáticos, cada qual direcionado a uma dimensão específica de risco:"},{"itens":["Transfer Alerts (alertas de transferência): disparados em transações individuais que acionam regras de risco previamente configuradas.","Withdrawal Attempt Alerts (alertas de tentativa de saque): atuam de forma preventiva, bloqueando movimentações que estejam em desacordo com os parâmetros estabelecidos, reduzindo o risco de saída de recursos ilícitos.","Behavioral Alerts (alertas comportamentais): resultam da análise de padrões agregados, como frequência incomum de operações, movimentações em horários atípicos ou volumes acumulados acima do histórico do cliente."]},{"p":"A combinação desses diferentes alertas garante uma visão integrada e dinâmica do risco, permitindo que a Área de Compliance adote respostas proporcionais, tempestivas e alinhadas ao apetite de risco da companhia."},{"st":"4.10 Whitelisting de Endereço de Carteira"},{"p":"A Velaro adota o processo de whitelisting de endereço de carteiras como medida adicional de segurança e controle para depósitos e retiradas de ativos virtuais. Antes de realizar a primeira transação a partir de um novo endereço, o cliente deve submetê-lo a um processo de verificação e aprovação, que inclui a análise de risco via Know Your Wallet (KYW) e a avaliação de histórico on-chain através da Chainalysis. Somente após a aprovação pela Área de Compliance, o endereço é incluído na lista de endereços autorizados (whitelist) do cliente, permitindo movimentações futuras."},{"p":"O cliente pode solicitar a inclusão de novos endereços a qualquer momento, devendo cada endereço passar pelo mesmo processo de verificação e aprovação. A Área de Compliance reserva-se o direito de remover endereços da whitelist ou solicitar reverificação sempre que identificar alterações no padrão de uso, exposição a endereços de risco ou incompatibilidade com o perfil declarado pelo cliente. Este processo visa mitigar riscos de financiamento de terceiros, lavagem de dinheiro e outras atividades ilícitas, reforçando a proteção tanto dos clientes quanto da integridade operacional da companhia."}]},{"t":"5. Processo de KYW (Know Your Wallet)","blocks":[{"p":"Além do monitoramento transacional contínuo (KYT), a Velaro adota procedimentos de Know Your Wallet (KYW) com o objetivo de avaliar o risco associado a endereços, carteiras e serviços on-chain específicos. O KYW complementa o KYT ao permitir que a companhia investigue de forma direcionada entidades com as quais mantém ou pode vir a manter relacionamento, reforçando a prevenção contra exposição a entidades envolvidas em atividades ilícitas."},{"p":"Por meio da solução da Chainalysis, a Velaro pode realizar screening de endereços individuais, pools de liquidez e serviços inteiros (como exchanges ou VASPs), de modo programático ou manual. Cada endereço ou entidade avaliada recebe uma classificação de risco (Low, Medium, High ou Severe), alinhada ao apetite de risco da organização. Esse resultado orienta decisões de compliance como a manutenção de relacionamento com contrapartes, a autorização de operações específicas ou a aplicação de bloqueios preventivos."},{"p":"O processo de KYW permite identificar riscos como:"},{"itens":["Exposição a endereços envolvidos em atividades ilícitas;","Interações com serviços sem políticas robustas de PLD/FT ou sem supervisão regulatória;","Padrões de movimentação atípicos em carteiras específicas (por exemplo, alta frequência de pequenas transações indicativas de structuring)."]},{"p":"De forma integrada ao conceito de monitoramento contínuo, endereços anteriormente avaliados podem ser reclassificados caso novas informações de risco sejam identificadas pela base de inteligência da ferramenta. Isso garante que a diligência sobre carteiras e entidades não seja um evento único, mas um processo contínuo de atualização e reavaliação."},{"p":"O KYW, portanto, oferece uma camada adicional de proteção, assegurando que a Velaro consiga não apenas monitorar fluxos de transações, mas também compreender e mitigar os riscos associados aos endereços e serviços com os quais interage diretamente."}]},{"t":"6. Procedimentos para Transações Suspeitas","blocks":[{"p":"O sistema de monitoramento da Velaro realiza o screening de cada transação em secundos, atribuindo-lhe uma classificação de risco conforme os parâmetros explicados no item anterior desta Política. Essa classificação determina o tratamento inicial da operação e a necessidade de medidas adicionais de compliance."},{"p":"As transações classificadas como Severe são automaticamente tratadas como suspeitas. Nessas situações, o sistema gera alerta imediato à Área de Compliance e ao Diretor Responsável pelo Programa de PLD/FT, e as carteiras envolvidas permanecem bloqueadas preventivamente até a conclusão da investigação. Já as operações classificadas como de Alto ou Médio Risco não são bloqueadas de imediato, mas passam por revisão obrigatória conduzida pela Área de Compliance, que valida a classificação atribuída pela ferramenta e avalia sua consistência em relação ao perfil e ao histórico do cliente. As transações de Baixo Risco permanecem em monitoramento contínuo, sem necessidade de medidas adicionais no momento, mas sujeitas a reavaliação retroativa caso novos elementos de risco sejam identificados."},{"p":"Quando uma transação suspeita é identificada, a Área de Compliance conduz uma investigação interna aprofundada. Esse processo pode incluir a revisão detalhada da transação no sistema KYT, a análise do histórico de relacionamento do cliente e, quando aplicável, do beneficiário da operação, a solicitação de informações ou documentos adicionais - inclusive junto à contraparte envolvida - e a exportação de relatórios técnicos para composição de um dossiê investigativo."},{"p":"Complementarmente, a investigação pode envolver:"},{"itens":["Consultas a bases externas de inteligência (listas de sanções, PEP, registros corporativos e mídias negativas);","Requisições formais de esclarecimentos ao cliente;","Escalonamento ao Comitê de Compliance;","Comparação dos achados com tipologias reconhecidas de PLD/FT."]},{"p":"Todas as transações classificadas como suspeitas devem ser formalmente registradas em parecer elaborado pela Área de Compliance, contendo a descrição detalhada da operação, os critérios de risco que motivaram a suspeita, as diligências realizadas, as conclusões da análise e a decisão final."},{"p":"O Compliance é a única área com competência para autorizar o desbloqueio de endereços ou operações previamente bloqueadas. Todo o processo deve ser integralmente documentado em sistema próprio, garantindo rastreabilidade, consistência e suporte às decisões tomadas."},{"p":"Se, ao final da análise, a transação for considerada legítima, o desbloqueio é autorizado formalmente pela Área de Compliance e comunicado ao time operacional para execução. Caso contrário, se confirmada a suspeita, a companhia elabora um Relatório de Operação Suspeita (ROS), que deve ser submetido ao COAF no prazo máximo de 24 (vinte e quatro) horas a contar da decisão formal."},{"st":"6.1 Uso de Ferramentas Avançadas (Reactor)"},{"p":"Quando necessário, a Velaro pode recorrer ao módulo Reactor da Chainalysis para aprofundar a investigação. Esse recurso é particularmente útil em casos complexos, envolvendo múltiplas contrapartes, grandes volumes ou tipologias sofisticadas. O Reactor permite visualizar fluxos completos de ativos, identificar conexões entre endereços, gerar gráficos de relacionamento e exportar relatórios detalhados em formato CSV, que podem subsidiar tanto a decisão interna quanto o reporte regulatório."},{"st":"6.2 Comunicação ao COAF"},{"p":"A Velaro comunica ao Conselho de Controle de Atividades Financeiras (COAF) todas as operações que, após investigação interna, sejam classificadas como suspeitas de lavagem de dinheiro ou financiamento do terrorismo, entre outros. O reporte é obrigatório mesmo quando não há comprovação definitiva do ilícito, bastando a existência de fundada suspeita."},{"p":"O relatório encaminhado contém informações completas sobre a operação, incluindo o ativo digital envolvido, o volume negociado, a categoria de risco identificada, a data e hora da operação, as contrapartes envolvidas e os fundamentos da decisão."},{"p":"O envio ao COAF deve ocorrer em até 24 horas da decisão formal de classificação como suspeita. Já o prazo para a conclusão integral da análise interna não deve exceder 45 dias a partir da geração do alerta."},{"p":"Todas as informações relacionadas às investigações e aos reportes devem ser tratadas com o mais alto grau de confidencialidade. É vedada a divulgação a qualquer colaborador não envolvido no processo ou a terceiros, inclusive ao cliente investigado, em observância à proibição de tipping-off prevista na legislação. O sigilo é requisito essencial para a integridade do processo e para a preservação da confiança da companhia junto às autoridades competentes."}]},{"t":"7. Governança","blocks":[{"p":"A governança do processo de monitoramento de transações na Velaro está organizada em diferentes níveis de responsabilidade e supervisão. A Área de Compliance é responsável pela configuração das regras de monitoramento, pela análise e investigação de alertas, bem como pela elaboração dos reportes regulatórios às autoridades competentes."},{"p":"O Diretor Responsável pelo Programa de PLD/FT supervisiona a implementação desta Política, aprova medidas estratégicas e garante o alinhamento com a legislação vigente e com o apetite de risco da companhia."},{"p":"O Comitê de Compliance delibera sobre casos críticos, acompanha a aplicação das medidas adotadas e revisa periodicamente a efetividade do sistema de monitoramento."},{"p":"À Alta Administração cabe assegurar que a Velaro disponha de recursos humanos, financeiros e tecnológicos adequados para a plena execução e evolução desta Política."}]},{"t":"8. Registros e Retenção","blocks":[{"p":"Todos os alertas, investigações e reportes devem ser documentados de forma completa e armazenados por um período mínimo de cinco anos, em conformidade com a legislação aplicável. Esses registros devem ser mantidos em ambiente seguro, com controle de acesso, e devem estar prontamente disponíveis em caso de auditorias internas, revisões independentes ou solicitações de autoridades competentes."}]},{"t":"9. Revisão da Política","blocks":[{"p":"Esta Política será revisada, no mínimo, a cada dois anos pela Área de Compliance, a fim de assegurar sua atualização e aderência às melhores práticas. Revisões extraordinárias poderão ser realizadas em prazo inferior sempre que houver mudanças regulatórias relevantes, evolução tecnológica dos sistemas utilizados ou alteração no apetite de risco da companhia. Todas as atualizações devem ser submetidas à apreciação e aprovação do Comitê de Compliance."},{"st":"Anexo A - Categorias de Risco no KYT (Chainalysis)"},{"p":"As transações monitoradas pela Velaro por meio da integração Fireblocks-Chainalysis podem envolver entidades classificadas em diferentes categorias. Cada categoria possui características próprias e uma avaliação de risco inerente. Abaixo, estão descritas algumas das categorias atualmente monitoradas pelo sistema:"},{"p":"ATM: ATMs facilitam a conversão de moeda fiduciária em criptomoeda, ou vice-versa."},{"p":"Bridge: Protocolos que permitem a interoperabilidade entre diferentes blockchains."},{"p":"Child abuse material (CSAM): Fóruns e sites, em geral no dark web, que promovem ou comercializam material de abuso sexual infantil."},{"p":"Darknet market: Mercados ilícitos no dark web que vendem drogas, armas, documentos falsificados, materiais de fraude e outros bens e serviços ilegais."},{"p":"Decentralized exchange (DEX): Serviços que permitem trocas peer-to-peer de criptoativos via smart contracts, sem intermediários centralizados."},{"p":"Drug vendor: Entidades que comercializam drogas ilícitas ou fora de canais regulados."},{"p":"Escort service: Serviços ou plataformas que facilitam o uso de criptoativos em atividades relacionadas a trabalho sexual, incluindo sites de anúncios ou fóruns pagos."},{"p":"Exchange: Plataformas que permitem compra, venda e negociação de criptoativos."},{"p":"Fraud shop: Lojas virtuais especializadas na venda de dados roubados, credenciais ou informações pessoais."},{"p":"Gambling: Sites de apostas online que aceitam criptomoedas."},{"p":"Hosted wallet: Carteiras custodiadas por terceiros, que controlam as chaves privadas dos clientes."},{"p":"ICO: Processos de emissão de tokens para captação de recursos."},{"p":"Ilicit actor-org: Indivíduos ou organizações diretamente envolvidos em atividades ilícitas, incluindo fraude, hacking, terrorismo, ou comércio ilegal."},{"p":"Infrastructure as a service (laaS): Serviços de infraestrutura digital (VPN, VPS, hospedagem, domínios)."},{"p":"Instant Exchange: Plataformas que oferecem conversões rápidas entre criptoativos sem processo formal de onboarding, geralmente sem coleta de KYC."},{"p":"Institutional platform: Plataformas direcionadas a clientes institucionais ou de alto patrimônio, como OTCs e serviços de custódia."},{"p":"Lending: Protocolos ou plataformas que oferecem empréstimos em criptoativos, de forma centralizada ou descentralizada."},{"p":"Malware: Softwares maliciosos, incluindo ransomware, spyware e trojans, desenhados para roubo de dados ou extorsão financeira."},{"p":"Merchant services: Serviços de pagamento que permitem que empresas aceitem criptoativos."},{"p":"Mining e Mining pool: Processo de mineração de criptoativos, individual ou em pools."},{"p":"Mixing / Protocol privacy: Serviços e protocolos que promovem anonimização de transações, como mixers, coinjoin, stealth addresses ou shielded pools."},{"p":"NFT platform / NFT collection: Plataformas e coleções de tokens não fungíveis."},{"p":"No KYC exchange / P2P Exchange: Exchanges centralizadas ou peer-to-peer que não coletam informações suficientes de seus clientes."},{"p":"Ransomware: Ataques cibernéticos que sequestram dados e exigem pagamento em criptoativos para resgate."},{"p":"Sanctioned entity / Sanctioned jurisdiction: Pessoas, entidades ou jurisdições sujeitas a sanções internacionais, incluindo OFAC, União Europeia, HMT e ONU."},{"p":"Scam: Esquemas fraudulentos, geralmente baseados em falsas promessas de investimento."},{"p":"Seized funds: Fundos apreendidos por autoridades públicas, posteriormente mantidos em endereços divulgados."},{"p":"Smart contract / Token smart contract: Contratos autoexecutáveis em blockchain, que podem ser usados de forma legítima ou fraudulenta."},{"p":"Special measures: Endereços ou entidades designados por autoridades como “preocupação primária de lavagem de dinheiro”, exigindo medidas especiais de monitoramento."},{"p":"Stolen funds: Endereços associados a fundos roubados, em especial provenientes de ataques a exchanges."},{"p":"Terrorist financing: Entidades, organizações ou indivíduos associados ao financiamento de terrorismo."}]}],"en":[{"t":"1. Introduction","blocks":[{"p":"Velaro Network (“Velaro” or “Company”) recognizes that the integrity of financial transactions is an essential element for protecting clients, partners, regulatory authorities, and the company itself. Exposure to risks of money laundering (ML), terrorist financing (TF), and proliferation financing (PF) requires the adoption of continuous, consistent, and internationally aligned control mechanisms."},{"p":"With this purpose, Velaro has established a robust transaction monitoring program, structured according to a risk-based approach and in compliance with FATF recommendations. This program combines specialized technology, well-defined internal procedures, and independent compliance governance, ensuring that all transactions under its responsibility are analyzed for legitimacy, as well as the origin and destination of the funds involved."},{"p":"More than fulfilling legal requirements, this Policy reflects Velaro’s institutional commitment to fostering trust and resilience in its services, strengthening relationships with clients, liquidity partners, regulatory authorities, and other stakeholders. By establishing objective criteria for monitoring and handling transactions, the company ensures not only regulatory compliance but also the long-term sustainability of its operations in the financial and virtual asset services market."}]},{"t":"2. Scope","blocks":[{"p":"This Policy applies to all transactions managed by Velaro, covering operations in fiat currency and virtual assets across all product and service modalities offered by the company. This includes, among others, international payment operations, transfers within multi-currency accounts, and movements in custodial digital wallets, whether held by clients or by the company itself."},{"p":"All transactions, regardless of account type or operational modality, are subject to continuous monitoring, risk assessment based on predefined criteria, and, when applicable, timely reporting to competent authorities."}]},{"t":"3. Monitoring Framework","blocks":[{"p":"At Velaro, transaction monitoring begins even before any movement of funds takes place. Only after completing the onboarding (KYC) process is a client authorized to make deposits in fiat currency or transact digital assets within the company’s systems."},{"p":"This stage includes verifying the client’s identity and documentation, assessing their qualification and expected transactional profile, identifying and screening ultimate 2 beneficial owners (UBOs), checking sanctions and politically exposed person (PEP) lists, as well as conducting searches in integrity and adverse media sources, including the verification of ongoing or past judicial proceedings. Additionally, the origin of funds and the declared purpose of the operations are evaluated, with supporting documentation reviewed when necessary. Only after the formal approval of this process is the client authorized to initiate transactions."},{"p":"Whenever applicable, due diligence is also conducted on the transaction beneficiary to ensure that both the sender and the recipient comply with legal and regulatory requirements. This dual-layered approach strengthens transparency and security throughout the entire process."},{"p":"Another essential element of the monitoring framework is the evaluation of liquidity counterparties. Strategic partners such as exchanges and OTC desks are subject to Know Your Provider (KYP) procedures, which include both initial and periodic due diligence. This analysis covers the assessment of the counterparty’s internal AML/CFT policies, sanctions screening, reputational background checks, and, when necessary, the inclusion of contractual clauses ensuring cooperation in case of detected irregularities. These procedures, along with KYC processes, are detailed in the Due Diligence Manual for Clients, Third Parties, and Employees, and aim to mitigate the risk of Velaro’s exposure to assets with signs of illicit origin or linked to unlawful activities."},{"p":"In the context of virtual asset transactions, deposits and withdrawals made through Velaro’s wallets custodied in Fireblocks are monitored through the integration between Fireblocks’ custody technology and Chainalysis’ KYT solution. Together, these systems enable continuous and automated monitoring of on-chain operations. The Chainalysis blockchain analytics tool allows the identification of the origin and destination of funds transacted on blockchain, the assessment of direct and indirect exposures to risky addresses, and the classification of entities into categories such as exchanges, mixers, darknet markets, or wallets linked to sanctions."},{"p":"This integration ensures that all on-chain transactions carried out through Velaro’s wallets are automatically recorded in its monitoring system. It enables real-time alert generation when risk parameters are triggered, retrospective reviews when new addresses are added to risk databases, and the application of predefined risk classifications. The system also provides exportable reports in CSV format, supporting internal investigations and the preparation of Suspicious Transaction Reports (STRs) to be submitted to COAF."},{"p":"In addition to automated monitoring, Velaro also has the capability to conduct enhanced investigations through the Know Your Wallet (KYW) process. This procedure allows for a detailed examination of a specific wallet’s transaction history, identifying the sources and destinations of funds and assessing behavioral patterns that may indicate risk."},{"p":"Finally, the company adopts the principle of continuous monitoring. This means that transactions, wallets, and counterparties are not evaluated solely at onboarding or at the moment of transfer but are continuously reassessed as new information and risk intelligence updates become available. Thus, even settled operations may generate retroactive alerts if addresses previously considered legitimate become associated with illicit activities. This ongoing monitoring approach strengthens Velaro’s compliance capability and reduces the likelihood of inadvertent exposure to financial crime."}]},{"t":"4. KYT Process","blocks":[{"p":"The monitoring of digital asset transactions (KYT) conducted by Velaro through integration with the Chainalysis platform enables the identification and assessment of money laundering, terrorist financing, and other financial crime risks associated with transactions. The analysis considers multiple dimensions, detailed below:"},{"st":"4.1 Entity Category"},{"p":"This refers to the broad classification of the monitored address. Addresses may be associated, for example, with exchanges, mixers, darknet markets, gambling services, fraud schemes, or entities under international sanctions. This categorization provides an initial indication of severity. For example, transactions involving a regulated exchange in a robust jurisdiction generally present significantly lower risk than transactions involving a sanctioned entity. The detailed list of categories used by the tool is provided in Annex A to this Policy, ensuring transparency and standardization in analysis."},{"st":"4.2 Specific Linked Service"},{"p":"The tool also allows assessment of the specific service associated with the address. Within a single category, substantial differences may exist: a licensed and supervised exchange typically applies consistent AML/CFT practices, whereas an unregulated exchange or anonymous service poses higher risk. This differentiation is fundamental since exposure depends not only on the general category but also on the regulatory and operational robustness of the service involved."},{"st":"4.3 Exposure Degree and Hops/Clustering"},{"p":"The system indicates the degree of exposure of a transaction to addresses classified as risky, distinguishing between direct exposure and indirect exposure."},{"itens":["Direct exposure occurs when the transaction is made without intermediaries, meaning the asset is sent to or received directly from an address associated with a risky entity (for example, a wallet linked to sanctions, fraud, or illicit activities).","Indirect exposure occurs when there are one or more intermediations, called hops, between the analyzed transaction and the risky address."]},{"p":"Hops represent the intermediary layers between the monitored transaction and the risky address. Each hop corresponds to a new level of asset movement between different blockchain addresses. Therefore, the greater the number of hops, the longer and more complex the tracing of the true origin of funds becomes. In general, exposures with fewer hops are considered more relevant in terms of contamination risk."},{"p":"To reduce fragmentation and enhance traceability, the tool applies a clustering process. This process groups addresses that belong to the same entity, such as an exchange, mixer, or other identified service. It allows recognizing that multiple seemingly distinct addresses are, in fact, controlled by a single institution. As a result, it becomes possible to distinguish between isolated addresses and _ institutional wallets, uncover hidden links with risky entities, and obtain a more accurate estimate of the actual percentage of exposure of the wallets to addresses involved in illicit activities."},{"p":"The combination of these analyses - exposure level, number of hops, and clustering - enables a more precise assessment of the risk associated with each transaction and guides decisions regarding monitoring, alert generation, and the possible reporting of suspicious activities."},{"st":"4.4 Transfer Direction"},{"p":"The direction of the transfer is another element considered in the risk assessment, as it defines the company’s position in each stage of the financial flow."},{"p":"For deposit operations, the focus lies on the source of funds, including the identification of counterparties involved and the verification of consistency between the transaction and the client's economic and financial profile. When the company receives assets with indications of illicit origin, the predominant risk is money laundering (ML)."},{"p":"For withdrawal operations, the focus lies on the final destination of the funds. When the company sends funds to an entity classified as high-risk, there is a risk of terrorist financing (TF) or facilitation of illicit activities, since the transaction may be interpreted as financial support to irregular actors."},{"p":"This reasoning applies both to digital asset acquisition operations carried out through liquidity counterparties (such as OTCs and exchanges) and to transactions initiated directly by clients from their custodial wallets."},{"st":"4.5 Transaction Amount"},{"p":"The transaction amount is a determining factor in risk assessment. The analysis considers not only the absolute value of the transaction but also its proportionality in relation to the client's operational history and economic-financial profile."},{"p":"Low-value transactions may indicate structuring attempts, a strategy used to avoid automated detection or remain below regulatory reporting thresholds. Conversely, high-value transactions represent greater operational, regulatory, and reputational risk, especially when they involve indirect exposure or counterparties located in high-risk jurisdictions."},{"p":"In addition to the isolated amount, the assessment also considers frequency, aggregated volume, and any abrupt variations from the client’s typical transactional behavior, which may indicate changes in the risk pattern or in the economic purpose of the operations."},{"st":"4.6 Risk Rating"},{"p":"All these factors are consolidated by the monitoring tool, which applies Velaro’s configured risk rules and assigns a classification into one of four categories in the company’s risk matrix:"},{"itens":["Low: Low-impact transactions, with no significant indicators of risk or exposure.","Medium: Mo
